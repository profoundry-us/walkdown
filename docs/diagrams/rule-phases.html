<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The five phases of a rule</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">State machine · walkdown</p>
    <h1>The five phases of a rule</h1>

    <svg viewBox="0 0 1000 576" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ transitions (drawn before the states) ============ -->

      <!-- start -> Idea -->
      <line x1="64" y1="196" x2="92" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

      <!-- Idea -> Shaping -->
      <line x1="256" y1="196" x2="332" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="268" y="176" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="296" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ARTIFACT</text>

      <!-- Shaping self-loop: refinement iterates -->
      <path d="M 396 232 C 396 288, 436 288, 436 236" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="392" y="292" width="48" height="12" rx="2" fill="#f5f5f5"/>
      <text x="416" y="301" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REFINE</text>

      <!-- Shaping -> Aligned -->
      <line x1="496" y1="196" x2="572" y2="196" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="504" y="176" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="185" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">BUILT · PASS</text>

      <!-- Aligned -> Diverged (down, own attach point) -->
      <line x1="640" y1="232" x2="640" y2="376" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="596" y="294" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="614" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FAIL</text>

      <!-- Diverged -> Aligned (up, 32px clear of the down arrow) -->
      <line x1="672" y1="380" x2="672" y2="236" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="680" y="294" width="72" height="12" rx="2" fill="#f5f5f5"/>
      <text x="716" y="303" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">FIX · RE-RUN</text>

      <!-- Diverged -> Build wins : the decision -->
      <line x1="736" y1="416" x2="812" y2="416" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
      <rect x="744" y="396" width="60" height="12" rx="2" fill="#f5f5f5"/>
      <text x="774" y="405" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DECISION</text>

      <!-- Aligned -> Shaping : a reword sends everything stale -->
      <path d="M 656 160 V 120 Q 656 112 648 112 H 424 Q 416 112 416 120 V 156"
            fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="504" y="92" width="64" height="12" rx="2" fill="#f5f5f5"/>
      <text x="536" y="101" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">REWORD</text>

      <!-- ============ states ============ -->

      <!-- start -->
      <circle cx="56" cy="196" r="6" fill="#2d3142"/>

      <!-- 01 Idea -->
      <rect x="96" y="160" width="160" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="96" y="160" width="160" height="72" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="104" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="116" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="176" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Idea</text>
      <text x="176" y="216" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">no prd · no design · no build</text>

      <!-- 02 Shaping -->
      <rect x="336" y="160" width="160" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="336" y="160" width="160" height="72" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
      <rect x="344" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.30)" stroke-width="0.8"/>
      <text x="356" y="177" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="416" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Shaping</text>
      <text x="416" y="216" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">artifact · awaiting sign-off</text>

      <!-- 03 Aligned -->
      <rect x="576" y="160" width="160" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="576" y="160" width="160" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="584" y="168" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="596" y="177" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="656" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Aligned</text>
      <text x="656" y="216" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">verdict: pass</text>

      <!-- 04 Diverged -->
      <rect x="576" y="380" width="160" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="576" y="380" width="160" height="72" rx="8" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="584" y="388" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="596" y="397" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">04</text>
      <text x="656" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Diverged</text>
      <text x="656" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">verdict: fail · needs a why</text>

      <!-- 05 Build wins — focal -->
      <rect x="816" y="380" width="160" height="72" rx="8" fill="#f5f5f5"/>
      <rect x="816" y="380" width="160" height="72" rx="8" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="824" y="388" width="24" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="836" y="397" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="896" y="420" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build Wins</text>
      <text x="896" y="436" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">pass · sources knowingly stale</text>

      <!-- ============ editorial callout ============ -->
      <text x="976" y="72" fill="#eb6c36" font-size="14" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="end">the ledger has no word for this one</text>
      <path d="M 900 84 Q 916 220 896 372" fill="none" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
      <circle cx="896" cy="376" r="2" fill="#eb6c36"/>

      <!-- ============ legend ============ -->
      <line x1="32" y1="520" x2="968" y2="520" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="32" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

      <rect x="120" y="530" width="24" height="12" rx="2" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.20)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="152" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NO BUILD EVIDENCE YET</text>

      <rect x="400" y="530" width="24" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="0.8"/>
      <text x="432" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">A VERDICT IS IN THE LEDGER</text>

      <rect x="704" y="530" width="24" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/>
      <text x="736" y="540" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">NOTHING CAN RECORD THIS TODAY</text>
    </svg>
  </div>
</body>
</html>
