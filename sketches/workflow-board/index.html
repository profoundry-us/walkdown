<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Journey Board Sketch</title>
<!--
  A sketch, not a design: what the boards mode of walkdown might look like
  (ADR 0018). One board is one process. Its data is written in the ADR's own
  fields (storyboard personas, users, systems and groups; stories with as: or
  by:; a board of cards with after, after_all, when, takes and returns_to), and
  everything else is derived as the ADR says: lanes from the cards' stories,
  columns from the hand-offs, a card's mark from its rules, and its pictures
  from its rules' screens. Cards that derive to one cell stack as alternatives.
  An outside step and a hole are drawn differently. Moving across a card scrubs
  its pictures; opening it walks its rules in a drawer. All data is made up.
  Kept in its own folder so the Tailwind scan of sketches/*.html never sees it.
-->
<style>
  :root {
    --b100: oklch(30% 0.048 245);
    --b200: oklch(26% 0.050 245);
    --b300: oklch(41% 0.055 242);
    --deep: oklch(23% 0.048 245);
    --ink: oklch(93% 0.020 230);
    --dim: oklch(93% 0.020 230 / .55);
    --primary: oklch(78% 0.125 215);
    --ok: oklch(78% 0.140 160);
    --warn: oklch(84% 0.150 85);
    --err: oklch(72% 0.170 22);
    --col: 184px;
    --lanew: 196px;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    display: flex; flex-direction: column; overflow: hidden;
    background: var(--deep); color: var(--ink);
    font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }

  /* ── top bar ─────────────────────────────── */
  header {
    display: flex; align-items: center; gap: 10px 14px; flex: 0 0 auto; flex-wrap: wrap;
    padding: 8px 14px; background: var(--b100); border-bottom: 1px solid var(--b300);
  }
  .mark { font-weight: 700; letter-spacing: .02em; }
  .mark i { font-style: normal; color: var(--primary); }
  .modes, .seg { display: flex; border: 1px solid var(--b300); border-radius: 4px; overflow: hidden; }
  .modes button, .seg button { padding: 3px 10px; font-size: 12px; opacity: .6; }
  .modes button:hover, .seg button:hover { opacity: 1; }
  .modes button.on, .seg button.on { background: var(--primary); color: var(--deep); opacity: 1; font-weight: 600; }
  .flow { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); }
  body[data-mode="personas"] .flow { display: none; }
  .picker { padding: 3px 10px; border: 1px solid var(--b300); border-radius: 4px; font-size: 12px; }
  .picker b { font-weight: 600; }
  .tally { display: flex; gap: 12px; font-size: 12px; margin-left: auto; }
  .tally span::before { content: attr(data-g); margin-right: 4px; }
  .sketch-tag { font-size: 11px; color: var(--dim); border: 1px dashed var(--b300); border-radius: 4px; padding: 2px 7px; }
  .pass { color: var(--ok); } .fail { color: var(--err); } .unbuilt { color: var(--dim); }


  /* ── who: an avatar for a person, a square for a system ─── */
  .av {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: .02em; color: var(--deep); font-style: normal;
  }
  .av.sys { border-radius: 6px; background: transparent; border: 1.5px dashed; font-size: 13px; }
  .av.sm { width: 18px; height: 18px; font-size: 8px; }
  .av.sm.sys { font-size: 9.5px; border-width: 1px; border-radius: 4px; }
  .av.lg { width: 44px; height: 44px; font-size: 15px; }

  /* Follow floats over the canvas's top-left, where the board's empty corner sits at rest. */
  .followbox {
    position: absolute; left: 12px; top: 9px; z-index: 8; display: flex; align-items: center; gap: 8px;
    padding: 4px 5px 4px 10px; background: var(--b100); border: 1px solid var(--b300); border-radius: 6px;
    box-shadow: 0 2px 10px oklch(15% 0.04 245 / .5);
  }
  .followbox label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  .followbox select {
    font: inherit; font-size: 12.5px; font-weight: 600; color: var(--ink); max-width: 170px;
    background: var(--b200); border: 1px solid var(--b300); border-radius: 4px; padding: 3px 5px;
  }
  .followbox select:hover, .followbox select:focus { border-color: var(--primary); outline: none; }

  /* ── following someone: one line saying who, and how much is theirs ─── */
  #lens {
    flex: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px;
    padding: 6px 14px; background: var(--b200); border-bottom: 1px solid var(--b300); font-size: 12.5px;
  }
  #lens[hidden] { display: none; }
  #lens b { font-weight: 650; }
  #lens .dimmed { color: var(--dim); }
  #lens .to { color: var(--primary); }
  #lens .to:hover { text-decoration: underline; }
  #lens .x { margin-left: auto; font-size: 17px; line-height: 1; opacity: .6; padding: 0 6px; }
  #lens .x:hover { opacity: 1; }

  /* ── personas: everyone who uses the system ─── */
  #people { display: none; flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 22px 24px 40px; }
  body[data-mode="personas"] #people { display: block; }
  body[data-mode="personas"] main, body[data-mode="personas"] #lens,
  body[data-mode="personas"] .picker, body[data-mode="personas"] .tally { display: none; }
  #people .wrap { max-width: 1120px; margin: 0 auto; }
  #people h1 { font-size: 20px; font-weight: 650; }
  #people .lede { margin: 4px 0 0; max-width: 62ch; color: var(--dim); font-size: 13px; }
  #people h2 { margin: 26px 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
  #people h2 span { font-weight: 400; letter-spacing: 0; text-transform: none; margin-left: 6px; }
  #people .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
  .pcard { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--b100); border: 1px solid var(--b300); border-radius: 6px; }
  .pcard:target, .pcard.lit { border-color: var(--primary); }
  .pcard .top { display: flex; align-items: center; gap: 11px; }
  .pcard .top b { display: block; font-size: 15px; font-weight: 650; line-height: 1.2; }
  .pcard .top small { font-size: 11.5px; color: var(--dim); }
  .pcard .blurb { font-size: 13.5px; line-height: 1.45; }
  .pcard dl { display: grid; grid-template-columns: 82px 1fr; gap: 7px 10px; margin: 0; padding-top: 10px; border-top: 1px dashed var(--b300); font-size: 12.5px; }
  .pcard dt { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim); padding-top: 2px; }
  .pcard dd { margin: 0; min-width: 0; }
  .pcard code { color: var(--primary); font-size: 11.5px; }
  .pcard .tg { display: flex; gap: 8px; font-size: 12px; }
  .pcard .tg span:first-child { width: 52px; flex: 0 0 auto; color: var(--dim); }
  .pcard .tg.none { color: var(--warn); }
  .pcard .bd { display: flex; flex-wrap: wrap; gap: 5px; }
  .pcard .bd button, .pcard .bd span { padding: 1px 9px; border: 1px solid var(--b300); border-radius: 999px; font-size: 11.5px; }
  .pcard .bd button { color: var(--primary); border-color: color-mix(in oklab, var(--primary) 50%, transparent); }
  .pcard .bd button:hover { background: color-mix(in oklab, var(--primary) 16%, transparent); }
  .pcard .bd span { color: var(--dim); border-style: dashed; }
  #people .foot { margin-top: 22px; font-size: 12px; color: var(--dim); max-width: 70ch; }

  main { position: relative; display: flex; flex: 1 1 auto; min-height: 0; }

  /* ── zoom: smooth, and a card sheds detail once that detail is too small to read ─── */
  .card { zoom: var(--cz, 1); }
  #board:not([data-zoom="near"]) .card .shot { display: none; }
  #board[data-zoom="mid"] .card { margin: 10px 0; }
  #board[data-zoom="far"] .card { margin: calc(26px * var(--z)) 0; height: clamp(7px, calc(70px * var(--z)), 26px); border-radius: 4px; }
  #board[data-zoom="far"] .card.headless { height: clamp(5px, calc(40px * var(--z)), 15px); }
  #board[data-zoom="far"] .card > * { display: none; }
  #board[data-zoom="far"] .card.is-pass { background: color-mix(in oklab, var(--ok) 55%, var(--b100)); border-color: var(--ok); }
  #board[data-zoom="far"] .card.is-you { background: color-mix(in oklab, var(--warn) 60%, var(--b100)); border-color: var(--warn); }
  #board[data-zoom="far"] .card.is-fail { background: color-mix(in oklab, var(--err) 70%, var(--b100)); border-color: var(--err); }
  #board[data-zoom="far"] .card.is-unbuilt { background: transparent; border-color: var(--dim); }
  .gap.tight span { display: none; }
  /* The first phase starts at the lane names' edge, so the heading's divider and the column's are one line. */
  .phase.first { margin-left: calc(var(--hg, 9px) * -2); padding-left: calc(9px + var(--hg, 9px)); border-left: 0; }

  /* ── time running down: lanes are columns, phases are bands down the left ─── */
  #board[data-flow="down"] { padding: 0 0 24px 0; }
  #board[data-flow="down"] .corner { min-height: 0; margin-right: calc(var(--g) / -2); }
  #board[data-flow="down"] .stripe { margin: 0 calc(var(--g) / -2); }
  #board[data-flow="down"] .stripe.line { border-top: 0; border-left: 1.5px dashed var(--b300); }
  #board[data-flow="down"] .stripe.line.solid { border-left: 1.5px solid var(--dim); }
  #board[data-flow="down"] .lane {
    text-align: center; padding: 16px 8px 12px;
    margin: 0 calc(var(--g) / -2 / var(--lz, 1)); border-right: 0; border-bottom: 1px solid var(--b300);
  }
  #board[data-flow="down"][data-lane="av"] .lane { padding: 5px 0; }
  #board[data-flow="down"] .lane .in { flex-direction: column; align-items: center; justify-content: center; }
  #board[data-flow="down"] .lane .av { margin: 0 auto; }
  #board[data-flow="down"] .lane .who { align-items: center; width: 100%; }
  #board[data-flow="down"] .lane .cut { top: 2px; left: 4px; font-size: 8px; background: transparent; }
  #board[data-flow="down"] .phase {
    display: flex; justify-content: center; align-items: flex-start;
    margin: 0 calc(var(--g) / -2 / var(--pz, 1)) 0 0; padding: 10px 0 0;
    border-left: 0; border-bottom: 0; border-right: 1px solid var(--b300); border-top: 1px solid var(--b300);
  }
  #board[data-flow="down"] .phase.first { border-top: 0; }
  /* The name reads up the band, starting at its top. */
  #board[data-flow="down"] .phase span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  #board[data-flow="down"] .gap { height: auto; align-self: stretch; margin: 4px 0; border-top: 0; align-items: center; }
  #board[data-flow="down"] .gap::before { content: ''; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1.5px dotted var(--warn); }
  #board[data-flow="down"] .gap span { top: 0; z-index: 1; max-width: 88%; white-space: normal; text-align: center; border-radius: 8px; }

  /* ── who the lanes belong to: a heading outside the board, over each group of lanes ─── */
  .grp {
    position: absolute; z-index: 5; display: flex; align-items: flex-end; justify-content: center; overflow: hidden;
    font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--dim); white-space: nowrap;
  }
  .grp span { padding: 0 6px 4px; overflow: hidden; text-overflow: ellipsis; }
  .grp::after { content: ''; position: absolute; left: 5px; right: 5px; bottom: 0; height: 5px; border: 1.5px solid var(--b300); border-bottom: 0; border-radius: 3px 3px 0 0; }
  #board[data-flow="across"] .grp { align-items: center; justify-content: flex-end; }
  #board[data-flow="across"] .grp span { writing-mode: vertical-rl; transform: rotate(180deg); padding: 6px 4px 6px 0; }
  #board[data-flow="across"] .grp::after { left: auto; right: 0; top: 5px; bottom: 5px; width: 5px; height: auto; border: 1.5px solid var(--b300); border-right: 0; border-radius: 3px 0 0 3px; }
  .lane .cut { display: none; }

  /* ── a card's pictures, scrubbed by moving the pointer across it (a hover gallery) ─── */
  .gal .sl { display: none; }
  .gal .sl.on { display: block; }
  .bars { position: absolute; left: 6px; right: 6px; bottom: 5px; display: flex; gap: 3px; opacity: 0; transition: opacity .12s; pointer-events: none; }
  .bars i { flex: 1 1 0; height: 3px; border-radius: 2px; background: oklch(23% 0.048 245 / .28); }
  .bars i.on { background: var(--primary); }
  .card:hover .bars, #tip .bars { opacity: 1; }
  .card .gal .count { bottom: 12px; }
  #tip .pic { position: relative; background: #f6f7f9; border-bottom: 1px solid var(--b300); }
  #tip .pic svg { border-bottom: 0; }
  #tip .pic.trace { background: var(--b200); padding: 12px 12px 16px; }
  #tip .pic.trace code { display: block; font-size: 11px; white-space: pre-wrap; color: var(--primary); }
  #tip .pic.trace .bars i { background: oklch(93% 0.02 230 / .22); }
  #tip .pic.trace .bars i.on { background: var(--primary); }
  #tip .n { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ── hovering a card that has shed its detail brings the detail back ─── */
  #tip {
    position: fixed; z-index: 30; width: 250px; pointer-events: none; overflow: hidden;
    background: var(--b100); border: 1px solid var(--primary); border-radius: 6px;
    box-shadow: 0 6px 22px oklch(12% 0.04 245 / .7);
  }
  #tip[hidden] { display: none; }
  #tip svg { display: block; width: 100%; height: auto; border-bottom: 1px solid var(--b300); }
  #tip .in { padding: 9px 11px 10px; display: flex; flex-direction: column; gap: 4px; }
  #tip .who { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--dim); }
  #tip b { font-size: 13.5px; font-weight: 650; line-height: 1.3; }
  #tip .meta { display: flex; flex-wrap: wrap; gap: 3px 9px; font-size: 11.5px; color: var(--dim); }
  #tip .say { font-size: 12px; line-height: 1.4; color: var(--dim); }
  /* a lane's name does the same: more about the persona when large, only the avatar when small */
  .lane .more { display: none; font-size: 10.5px; line-height: 1.35; color: var(--dim); margin-top: 3px; }
  #board[data-lane="more"] .lane .in { align-items: flex-start; }
  #board[data-lane="more"] .lane .more { display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
  #board[data-lane="more"] .lane .more.seed { display: block; color: var(--ink); opacity: .8; }
  #board[data-lane="name"] .lane small, #board[data-lane="name"] .lane .cut { display: none; }
  #board[data-lane="av"] .lane { padding: 0; }
  #board[data-lane="av"] .lane .in { justify-content: center; }
  #board[data-lane="av"] .lane .av { margin: 0 auto; }
  #board[data-lane="av"] .lane .who, #board[data-lane="av"] .lane .cut { display: none; }
  #board[data-lane="av"] .lane .av { width: 28px; height: 28px; }
  .phase { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .zoom {
    position: absolute; right: 14px; bottom: 14px; z-index: 8; display: flex; align-items: center;
    background: var(--b100); border: 1px solid var(--b300); border-radius: 6px; overflow: hidden;
    box-shadow: 0 2px 10px oklch(15% 0.04 245 / .5); font-size: 12px;
  }
  body.open .zoom { right: 454px; }
  .zoom button { padding: 5px 10px; min-width: 30px; }
  .zoom button:hover:not(:disabled) { background: color-mix(in oklab, var(--primary) 18%, transparent); color: var(--primary); }
  .zoom button:disabled { opacity: .3; cursor: default; }
  .zoom .lvl { padding: 5px 4px; min-width: 46px; text-align: center; color: var(--dim); font-variant-numeric: tabular-nums; }
  .zoom .fit { border-left: 1px solid var(--b300); }

  /* ── board ───────────────────────────────── */
  #scroll {
    position: relative; flex: 1 1 auto; min-width: 0; overflow: hidden;
    cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
    background-image: radial-gradient(oklch(41% 0.055 242 / .55) 1px, transparent 1px);
    background-size: 22px 22px;
  }
  #scroll.panning, #scroll.panning * { cursor: grabbing; }
  #board {
    position: absolute; top: 0; left: 0; display: grid; width: max-content;
    background: var(--deep); border: 1px solid var(--b300);
    will-change: transform; --z: 1;
    grid-template-columns: max(calc(var(--lanew) * var(--z)), 24px) repeat(16, calc(184px * var(--z)));
    column-gap: var(--g, 18px); padding: 0 24px 28px 0;
  }
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
  #wires path { fill: none; stroke: var(--b300); stroke-width: 1.5; stroke-linejoin: round; }
  #wires path.on { stroke: var(--primary); stroke-width: 2; }

  .phase {
    grid-row: 1; position: relative; z-index: 4; zoom: var(--pz, 1);
    margin: 0 calc(var(--hg, 9px) * -1); padding: 9px 9px 7px; background: var(--deep);
    font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
    border-bottom: 1px solid var(--b300); border-left: 1px solid var(--b300);
  }
  .corner { grid-row: 1; grid-column: 1; position: relative; z-index: 4; min-height: calc(46px * var(--z)); background: var(--deep); border-bottom: 1px solid var(--b300); border-right: 1px solid var(--b300); }

  .stripe { grid-column: 1 / -1; margin-right: -24px; }
  .stripe.back { background: color-mix(in oklab, var(--b200) 55%, transparent); }
  .stripe.line { border-top: 1.5px dashed var(--b300); }
  .stripe.line.solid { border-top: 1.5px solid var(--dim); }

  .lane {
    grid-column: 1; position: relative; z-index: 3; zoom: var(--lz, 1);
    padding: 14px 10px 14px 14px; text-align: left;
    background: var(--deep); border-right: 1px solid var(--b300);
  }
  /* The layout is on a span inside the button: a button is not a dependable flex container in every browser. */
  .lane .in { display: flex; align-items: center; gap: 10px; width: 100%; }
  .lane .who { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .lane .uses { font-size: 10.5px; color: var(--primary); opacity: .85; }
  .lane.on { box-shadow: inset 3px 0 0 var(--primary); }
  .lane.on b { color: var(--primary); }
  .lane.back { background: color-mix(in oklab, var(--b200) 55%, var(--deep)); }
  .lane b { font-size: 12.5px; font-weight: 600; }
  .lane small { font-size: 11px; color: var(--dim); }
  .lane .cut {
    position: absolute; top: -8px; left: 14px; padding: 0 5px; background: var(--deep);
    font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--dim);
    white-space: nowrap;
  }
  .lane:hover b { color: var(--primary); }

  .card {
    position: relative; z-index: 2; align-self: center; margin: 14px 0; text-align: left;
    background: var(--b100); border: 1px solid var(--b300); border-radius: 6px; overflow: hidden;
    display: flex; flex-direction: column; transition: opacity .15s;
  }
  .card:hover { border-color: var(--primary); }
  .card.sel { outline: 2px solid var(--primary); outline-offset: 1px; border-color: var(--primary); }
  .card .shot { display: block; background: #f6f7f9; border-bottom: 1px solid var(--b300); position: relative; }
  .card .shot svg { display: block; width: 100%; height: auto; }
  .card .count {
    position: absolute; right: 5px; bottom: 5px; padding: 1px 6px; border-radius: 3px;
    background: oklch(23% 0.048 245 / .82); color: var(--ink); font-size: 10.5px;
  }
  .card .txt { padding: 7px 9px 8px; display: flex; flex-direction: column; gap: 3px; }
  .card .ttl { font-size: 12.5px; font-weight: 600; line-height: 1.3; }
  .card .meta { display: flex; gap: 6px; font-size: 11px; color: var(--dim); }
  .card .meta .st { font-weight: 700; }
  .card.is-unbuilt { border-style: dashed; }
  .card.is-unbuilt .shot svg { opacity: .55; }
  .card.is-fail { border-color: var(--err); }
  .card.headless { background: transparent; border-style: dashed; }
  .card.headless .kind { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: var(--primary); }
  .card .takes { color: var(--warn); }
  /* following one persona: theirs stay lit, the cards they hand to and from stay readable */
  body[data-focus] .card:not(.in-focus) { opacity: .16; }
  body[data-focus] .card.near:not(.in-focus) { opacity: .62; }
  body[data-focus] #wires path:not(.on) { opacity: .25; }
  .gap {
    position: relative; z-index: 1; align-self: center; height: 0; margin: 0 4px;
    border-top: 1.5px dotted var(--warn); display: flex; justify-content: center;
  }
  .gap span {
    position: relative; top: -10px; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    background: var(--deep); border: 1px solid color-mix(in oklab, var(--warn) 55%, transparent);
    font-size: 10.5px; color: var(--warn);
  }

  /* ── drawer ──────────────────────────────── */
  #drawer {
    flex: 0 0 440px; display: none; flex-direction: column; min-height: 0;
    background: var(--b100); border-left: 1px solid var(--b300);
  }
  body.open #drawer { display: flex; }
  .dhead { padding: 12px 14px 10px; border-bottom: 1px solid var(--b300); display: flex; gap: 10px; align-items: flex-start; }
  .dhead .who { font-size: 11px; color: var(--dim); display: flex; align-items: center; gap: 6px; text-align: left; }
  .dhead .who:hover { color: var(--primary); }
  .dhead h2 { font-size: 16px; font-weight: 650; margin: 2px 0; line-height: 1.25; }
  .dhead .id { font-size: 11px; color: var(--dim); }

  .trace .none { font-size: 11px; color: var(--dim); margin-bottom: 8px; }

  .walk .n { font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
  .walk button { border: 1px solid var(--b300); border-radius: 4px; padding: 2px 9px; }
  .walk button:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .walk button:disabled { opacity: .3; cursor: default; }
  .walk .sp { flex: 1; }
  .say { font-size: 14px; line-height: 1.45; }
  .film { display: flex; gap: 6px; margin-top: 10px; }
  .film button { flex: 1 1 0; max-width: 96px; border: 1px solid var(--b300); border-radius: 4px; overflow: hidden; background: #f6f7f9; opacity: .6; }
  .film button.on { opacity: 1; outline: 2px solid var(--primary); outline-offset: 1px; }
  .film button svg { display: block; width: 100%; height: auto; }
  .film button.t { background: var(--b200); color: var(--primary); font-size: 11px; padding: 10px 0; }

  .rule { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px dashed var(--b300); font-size: 13px; }
  .rule:last-child { border-bottom: 0; }
  .rule .g { width: 14px; flex: 0 0 auto; text-align: center; font-weight: 700; }
  .rule small { display: block; font-size: 11px; color: var(--dim); }
  .hop { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; margin-top: 4px; border: 1px solid var(--b300); border-radius: 4px; font-size: 12.5px; }
  .hop:hover { border-color: var(--primary); }
  .hop .dir { font-size: 11px; color: var(--dim); width: 78px; flex: 0 0 auto; white-space: nowrap; }

  .hint { margin-top: 14px; font-size: 11px; color: var(--dim); }
  kbd { border: 1px solid var(--b300); border-radius: 3px; padding: 0 4px; font: inherit; }
  @media (max-width: 760px) {
    :root { --lanew: 132px; }
    .lane { padding-left: 10px; }
    .lane .in { flex-direction: column; align-items: flex-start; gap: 4px; }
    #drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); z-index: 20; }
    body.open .zoom { right: 14px; }
    .tally { margin-left: 0; }
  }

  /* ── five marks (§5), and the two cards that have none ─── */
  :root { --agent: oklch(78% 0.10 290); }
  .you { color: var(--warn); } .agent { color: var(--agent); } .nostory { color: var(--warn); } .outside { color: var(--dim); }
  .target { font-size: 12px; color: var(--dim); }
  .target b { color: var(--ink); font-weight: 600; }
  .share { padding: 3px 10px; border: 1px dashed var(--b300); border-radius: 4px; font-size: 12px; opacity: .55; cursor: not-allowed; }

  /* wider, shorter cards: a real title reads in at most three lines, and a card is wider than it is tall */
  #board { --colw: 320px; }
  .card .shot { height: 144px; background: #e3e7ed; }
  .card .shot .sl.on { height: 100%; }
  .card .shot svg { width: 100%; height: 100%; }
  .card .txt { padding: 6px 10px 7px; gap: 2px; }
  .card .ttl { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .card .meta { flex-wrap: nowrap; gap: 8px; align-items: baseline; min-width: 0; white-space: nowrap; }
  .card .meta > * { flex: 0 0 auto; }
  .card .meta .user, .card .meta .takes { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; }
  .card .meta .user { margin-left: auto; color: var(--dim); }
  .card .takes { font-size: 10.5px; }
  .card .count { bottom: 5px; }
  .card.is-agent { border-color: color-mix(in oklab, var(--agent) 60%, var(--b300)); }

  /* a when: on the hand-off into this card, written across its top */
  .card .when {
    display: block; padding: 3px 9px; font-size: 10.5px; line-height: 1.3; color: var(--primary);
    background: color-mix(in oklab, var(--primary) 12%, var(--b100)); border-bottom: 1px solid var(--b300);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .card .when i { font-style: normal; opacity: .6; margin-right: 4px; }
  .card .end { color: var(--dim); border: 1px solid var(--b300); border-radius: 3px; padding: 0 4px; font-size: 10px; }

  /* a hole (no story, ours to write) and an outside step (another company's) look different */
  .card.hole { background: color-mix(in oklab, var(--warn) 6%, transparent); border: 1.5px dashed color-mix(in oklab, var(--warn) 70%, transparent); }
  .card.hole .kind { color: var(--warn); }
  .card.outside { background: color-mix(in oklab, var(--b200) 70%, transparent); border: 1px solid var(--b300); }
  .card.outside .ttl { font-weight: 500; color: color-mix(in oklab, var(--ink) 80%, transparent); }
  .card.outside .kind { color: var(--dim); }

  /* alternatives at one step: cards that derive to one cell, each reached by a when: */
  .stack {
    position: relative; z-index: 2; align-self: center; display: flex; flex-direction: column; gap: 8px;
    margin: 10px -6px; padding: 16px 5px 6px; border: 1.5px dashed oklch(80% 0.11 300 / .6); border-radius: 9px;
  }
  .stack.all { border-style: solid; border-color: var(--b300); }
  .stack > .card { align-self: stretch; margin: 0; }
  .stack > .alt {
    position: absolute; top: -9px; left: 8px; padding: 0 6px; background: var(--deep); white-space: nowrap;
    font-size: 9.5px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: oklch(80% 0.11 300);
  }
  #board[data-zoom="far"] .stack { gap: 4px; padding: 6px 3px; }
  #board[data-zoom="far"] .stack > .alt { display: none; }
  #board[data-zoom="far"] .stack > .card { margin: 0; }
  #board[data-zoom="far"] .card.is-you { background: color-mix(in oklab, var(--warn) 60%, var(--b100)); border-color: var(--warn); }
  #board[data-zoom="far"] .card.is-agent { background: color-mix(in oklab, var(--agent) 55%, var(--b100)); border-color: var(--agent); }
  #board[data-zoom="far"] .card.hole { background: transparent; border-color: var(--warn); }
  #board[data-zoom="far"] .card.outside { background: var(--b200); border-color: var(--b300); }
  #wires path.back { stroke-dasharray: 5 4; stroke: oklch(80% 0.11 300 / .8); }

  /* drawer extras */
  .rule.off { opacity: .45; }
  .rule .why { color: var(--dim); }
  .asw { font-size: 11.5px; color: var(--dim); margin-top: 6px; }
  .asw b { color: var(--ink); font-weight: 600; }
  .pics-seg { display: inline-flex; margin-left: 8px; vertical-align: middle; text-transform: none; letter-spacing: 0; font-weight: 400; }
  .pics-seg button:disabled { opacity: .3; cursor: default; }
  .stage + .stage { margin-top: 6px; }
  .holebox { border: 1.5px dashed var(--warn); border-radius: 6px; padding: 12px; font-size: 13px; line-height: 1.45; }
  .holebox.outside { border: 1px solid var(--b300); color: var(--ink); }
  @media (max-width: 760px) { .sketch-tag { order: 9; } }
</style>
</head>

}
const picOfKey = k => {
  const [kind, rest] = [k.slice(0, k.indexOf(':')), k.slice(k.indexOf(':') + 1).split('@')[0]];
  return kind === 'app' || kind === 'design' ? screenSvg(rest, kind) : kind === 'frame' ? frameSvg(rest) : textSvg(rest);
};

/* ══ The board ═══════════════════════════════════════════════════════════════ */
const $ = (q, el = document) => el.querySelector(q);
const board = $('#board'), drawer = $('#drawer');
const laneOf = c => LANES.find(l => l.id === c.lane);
const lanesOf = ids => [...new Set(ids.map(id => byId[id].lane))].map(id => LANES.find(l => l.id === id));
const av = (l, size = '') => l.person
  ? `<i class="av ${size}" style="background:${l.color}">${l.ini}</i>`
  : `<i class="av sys ${size}" style="border-color:${l.color};color:${l.color}">${l.ini}</i>`;
const bars = (n, on) => n > 1 ? `<span class="bars">${Array.from({ length: n }, (_, i) => `<i class="${i === on ? 'on' : ''}"></i>`).join('')}</span>` : '';
const whens = c => EDGES.filter(([, t, w]) => t === c.id && w).map(([f, , w]) => [f, w]);
let sel = null, at = 0, focus = null, flow = 'across', surface = 'app';
try { if (localStorage.getItem('board-flow') === 'down') flow = 'down'; } catch {}

function cardHtml(c) {
  const n = c.pics.length, w = whens(c), all = c.after_all;
  const label = `${esc(c.title)}, ${WORD[c.status]}`;
  const when = all
    ? `<span class="when" title="${esc(`After all of: ${all.map(id => byId[id].title).join('; ')}`)}"><i>after all of</i>${esc(all.map(id => byId[id].title).join(' + '))}</span>`
    : w.length ? `<span class="when" title="${esc(w.map(([f, x]) => `when ${x} (from ${byId[f].title})`).join('\n'))}"><i>when</i>${esc([...new Set(w.map(x => x[1]))].join(' · '))}</span>` : '';
  const ends = !outOf(c.id).length && !c.returns_to ? '<span class="end" title="Nothing follows this card">ends here</span>' : '';
  const tk = c.takes ? `<span class="meta"><span class="takes" title="takes: ${esc(c.takes)}">⏱ ${esc(c.takes)}</span></span>` : '';
  const user = c.user ? `<span class="user" title="${esc(`Signed in as ${c.user.user.title}`)}">${esc(c.user.user.title)}</span>` : '';
  if (c.kind !== 'story') {
    const by = ACTOR[c.lane].title;
    return `<button class="card headless ${c.kind}" data-id="${c.id}" aria-label="${label}">${when}
      <span class="txt"><span class="kind mono">${c.kind === 'hole' ? `no story · ${esc(by)}` : `outside · ${esc(by)}`}</span><span class="ttl" title="${esc(c.title)}">${esc(c.title)}</span>
      <span class="meta">${c.kind === 'hole' ? `<span class="nostory">${GLYPH.hole} no story</span>` : ''}${ends}</span>${tk}</span></button>`;
  }
  const st = `<span class="st ${c.status}" title="${WORD[c.status]}">${GLYPH[c.status]}</span><span>${c.rules.length} ${c.rules.length === 1 ? 'rule' : 'rules'}</span>`;
  return `<button class="card is-${c.status}" data-id="${c.id}" aria-label="${label}">${when}
      <span class="shot gal">${c.pics.map((p, i) => `<span class="sl ${i ? '' : 'on'}">${picOfKey(p.key)}</span>`).join('')}${bars(n, 0)}<span class="count">${n} ${n === 1 ? 'picture' : 'pictures'}</span></span>
      <span class="txt"><span class="ttl" title="${esc(c.title)}">${esc(c.title)}</span><span class="meta">${st}${ends}${user}</span>${tk}</span></button>`;
}

function build() {
  const down = flow === 'down';
  const cell = (lane, a, b = a) => down
    ? `grid-column:${lane === null ? `2 / ${LANES.length + 2}` : lane + 2};grid-row:${a === null ? `1 / ${STEPS + 2}` : a === 0 ? 1 : `${a + 1} / ${b + 2}`}`
    : `grid-row:${lane === null ? `2 / ${LANES.length + 2}` : lane + 2};grid-column:${a === null ? '1 / -1' : a === 0 ? 1 : `${a + 1} / ${b + 2}`}`;
  [...board.children].forEach(c => c.id !== 'wires' && c.remove());
  board.dataset.flow = flow;
  board.style.gridTemplateColumns = down ? `calc(34px * var(--pz)) repeat(${LANES.length}, calc(var(--colw) * var(--z)))`
    : `max(calc(var(--lanew) * var(--z)), 24px) repeat(${STEPS}, calc(var(--colw) * var(--z)))`;
  document.querySelectorAll('[data-flow]').forEach(b => b.tagName === 'BUTTON' && b.classList.toggle('on', b.dataset.flow === flow));
  let h = '<div class="corner"></div>';
  $('#who').innerHTML = `<option value="">Everyone</option>${LANES.filter(l => l.person).map(l => `<option value="${l.id}">${l.title}</option>`).join('')}`;
  PHASES.forEach(([n, a, b], i) => { h += `<div class="phase ${i ? '' : 'first'}" title="${n}" style="${down ? `grid-column:1;grid-row:${a + 1} / ${b + 2}` : `grid-row:1;grid-column:${a + 1} / ${b + 2}`}"><span>${n}</span></div>`; });
  LANES.forEach((l, i) => {
    h += `<div class="stripe ${l.back ? 'back' : ''} ${l.cut ? 'line' : ''} ${l.solid ? 'solid' : ''}" style="${cell(i, null)}"></div>`;
    h += `<button class="lane ${l.back ? 'back' : ''}" data-lane="${l.id}" style="${cell(i, 0)}" title="Follow only this lane">
      ${l.cut ? `<span class="cut">${l.cut}</span>` : ''}<span class="in">${av(l)}<span class="who"><b>${l.title}</b><small>${l.of}</small>${l.person ? `<small class="uses">${l.uses}</small>` : ''}${l.blurb ? `<small class="more">${esc(l.blurb)}</small>` : ''}${l.person ? `<small class="more seed">Signed in as ${esc(l.users[0].title)}</small>` : ''}</span></span></button>`;
  });
  CELLS.forEach(ids => {
    const c0 = byId[ids[0]], where = cell(LANES.findIndex(l => l.id === c0.lane), c0.col);
    const alts = ids.length > 1 && ids.every(id => whens(byId[id]).length);
    h += ids.length === 1
      ? cardHtml(c0).replace('<button class="card', `<button style="${where}" class="card`)
      : `<div class="stack ${alts ? '' : 'all'}" style="${where}"><span class="alt">${alts ? `One of these · ${ids.length} alternatives` : `${ids.length} cards at this step`}</span>${ids.map(id => cardHtml(byId[id])).join('')}</div>`;
  });
  // A group's heading sits outside the board. Neither it nor the line has a hover tooltip.
  LANES.forEach((l, i) => { if (GROUP(l) !== (LANES[i - 1] && GROUP(LANES[i - 1]))) h += `<div class="grp" data-from="${l.id}"><span>${GROUP(l)}</span></div>`; });
  board.insertAdjacentHTML('beforeend', h);
  const c = Object.fromEntries([...ORDER5, 'hole'].map(k => [k, 0]));
  CARDS.forEach(x => { if (x.status in c) c[x.status]++; });
  $('#tally').innerHTML = [...ORDER5, 'hole'].map(k => `<span class="${k === 'hole' ? 'nostory' : k}" data-g="${GLYPH[k]}">${c[k]} ${WORD[k]}</span>`).join('');
}

/* ── following one persona: the dimming, the waits, and one line saying who ── */
function follow(id) {
  focus = id || null;
  const lane = LANES.find(l => l.id === focus);
  if (lane) document.body.dataset.focus = focus; else delete document.body.dataset.focus;
  const mine = CARDS.filter(c => c.lane === focus).sort((a, b) => a.col - b.col);
  const from = EDGES.filter(([a, b]) => byId[b].lane === focus && byId[a].lane !== focus).map(e => e[0]);
  const to = EDGES.filter(([a, b]) => byId[a].lane === focus && byId[b].lane !== focus).map(e => e[1]);
  document.querySelectorAll('.card').forEach(c => {
    c.classList.toggle('in-focus', byId[c.dataset.id].lane === focus);
    c.classList.toggle('near', from.includes(c.dataset.id) || to.includes(c.dataset.id));
  });
  document.querySelectorAll('.lane').forEach(b => b.classList.toggle('on', b.dataset.lane === focus));
  $('#who').value = lane && lane.person ? focus : '';
  document.querySelectorAll('.gap').forEach(g => g.remove());
  const row = LANES.indexOf(lane) + 2;
  let gaps = '';
  mine.forEach((a, i) => {
    const b = mine[i + 1];
    if (!b || b.col - a.col < 2) return;
    const between = CARDS.filter(s => s.col > a.col && s.col < b.col && s.lane !== focus);
    const takes = between.map(s => s.takes).filter(Boolean)[0];
    const says = `waits on ${lanesOf(between.map(s => s.id)).map(l => l.title).join(', ')}${takes ? ` · ${takes}` : ''}`;
    gaps += `<div class="gap" title="${esc(says)}" style="${flow === 'down' ? `grid-column:${row};grid-row:${a.col + 2} / ${b.col + 1}` : `grid-row:${row};grid-column:${a.col + 2} / ${b.col + 1}`}"><span>${esc(says)}</span></div>`;
  });
  board.insertAdjacentHTML('beforeend', gaps);
  const lens = $('#lens');
  lens.hidden = !lane;
  if (lane) {
    const c = {};
    mine.forEach(s => { c[s.status] = (c[s.status] ?? 0) + 1; });
    const marks = Object.keys(c).map(k => `<span class="${k === 'hole' ? 'nostory' : k}">${GLYPH[k]} ${c[k]} ${WORD[k]}</span>`).join(' · ');
    lens.innerHTML = `${av(lane, 'sm')}<span>Following <b>${lane.title}</b></span>
      <span class="dimmed">${mine.length} of ${CARDS.length} cards</span><span>${marks}</span>
      ${lane.person ? `<button class="to" data-persona="${lane.id}">Who is this? →</button>` : '<span class="dimmed">Not a persona: nobody signs in as this.</span>'}
      <button class="x" data-lane="" title="Back to everyone">×</button>`;
  }
  tighten();
  wires();
}

/* Puts each group's heading outside the board, centred on the lanes it covers: above them, or beside them. */
function heads() {
  const o = board.getBoundingClientRect(), down = flow === 'down', all = [...document.querySelectorAll('.grp')];
  all.forEach((g, i) => {
    const from = LANES.findIndex(l => l.id === g.dataset.from), to = all[i + 1] ? LANES.findIndex(l => l.id === all[i + 1].dataset.from) - 1 : LANES.length - 1;
    const a = $(`.lane[data-lane="${LANES[from].id}"]`).getBoundingClientRect(), b = $(`.lane[data-lane="${LANES[to].id}"]`).getBoundingClientRect();
    g.style.cssText = down
      ? `left:${a.left - o.left}px;width:${b.right - a.left}px;top:-24px;height:22px`
      : `top:${a.top - o.top}px;height:${b.bottom - a.top}px;left:-26px;width:24px`;
  });
}
function wires() {
  heads();
  const o = board.getBoundingClientRect(), half = parseFloat(getComputedStyle(board).columnGap) / 2;
  const any = $('.card'), rise = Math.max(3, parseFloat(getComputedStyle(any).marginTop) * (parseFloat(getComputedStyle(any).zoom) || 1));
  const box = id => { const r = $(`.card[data-id="${id}"]`).getBoundingClientRect(); return { l: r.left - o.left, r: r.right - o.left, t: r.top - o.top, b: r.bottom - o.top, cx: r.left - o.left + r.width / 2, cy: r.top - o.top + r.height / 2 }; };
  const lit = (a, b) => sel ? (a === sel.id || b === sel.id) : focus ? (byId[a].lane === focus || byId[b].lane === focus) : false;
  const fwd = EDGES.map(([a, b]) => {
    const s = box(a), t = box(b), on = lit(a, b);
    const same = byId[a].col === byId[b].col;
    const d = flow === 'down'
      ? (same ? (t.l > s.r ? `M${s.r},${s.cy} H${t.l - 2}` : `M${s.l},${s.cy} H${t.r + 2}`)
        : `M${s.cx},${s.b} V${t.t - Math.max(rise, 8)} H${t.cx} V${t.t - 2}`)
      : (same ? (t.t > s.b ? `M${s.cx},${s.b} V${t.t - 2}` : `M${s.cx},${s.t} V${t.b + 2}`)
        : `M${s.r},${s.cy} H${t.l - half} V${t.cy} H${t.l - 2}`);
    return `<path d="${d}" class="${on ? 'on' : ''}" marker-end="url(#${on ? 'ah-on' : 'ah'})"/>`;
  });
  // returns_to: dashed, back to an earlier card, round the right of both, ignored by layout
  const back = RETURNS.map(([a, b]) => {
    const s = box(a), t = box(b), x = Math.max(s.r, t.r) + Math.max(8, half);
    return `<path d="M${s.r},${s.cy + 6} H${x} V${t.cy + 6} H${t.r + 2}" class="back" marker-end="url(#ah-back)"><title>returns_to: ${b}</title></path>`;
  });
  $('#paths').innerHTML = fwd.join('') + back.join('');
}

/* ── the drawer: one card, walked rule by rule (§7) ── */
function open(id, step) {
  sel = byId[id];
  at = step ?? 0;
  document.body.classList.add('open');
  document.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', c.dataset.id === id));
  draw(); wires();
  reveal($(`.card[data-id="${id}"]`));
}
function shut() {
  sel = null; document.body.classList.remove('open');
  document.querySelectorAll('.card.sel').forEach(c => c.classList.remove('sel'));
  wires();
}
const hopsOf = c => {
  const h = EDGES.filter(([a, b]) => a === c.id || b === c.id).map(([a, b, w, all]) => {
    const o = byId[a === c.id ? b : a], ol = laneOf(o);
    return `<button class="hop" data-go="${o.id}"><span class="dir">${a === c.id ? 'hands off to' : all ? 'waits for' : 'comes from'}</span>${av(ol, 'sm')}<span>${ol.title}: ${esc(o.title)}${w ? ` <span class="takes">· when ${esc(w)}</span>` : ''}</span></button>`;
  });
  RETURNS.filter(([a, b]) => a === c.id || b === c.id).forEach(([a, b]) => {
    const o = byId[a === c.id ? b : a];
    h.push(`<button class="hop" data-go="${o.id}"><span class="dir">${a === c.id ? 'returns to' : 'returned to by'}</span>${av(laneOf(o), 'sm')}<span>${esc(o.title)} <span class="outside">(dashed)</span></span></button>`);
  });
  if (!outOf(c.id).length && !c.returns_to) h.push('<div class="hint" style="margin-top:6px">Nothing follows this card: its branch ends here.</div>');
  return h.join('');
};

function draw() {
  const c = sel, l = laneOf(c);
  const who = c.user ? c.user.user.title : l.person ? l.users[0].title : '';
  const head = `<div class="dhead"><div>
      <button class="who" data-lane="${l.id}" title="Follow ${esc(l.title)}">${av(l, 'sm')}${l.title} · ${l.of}${who ? ` · signed in as ${esc(who)}` : ''}</button>
      <h2>${esc(c.title)}</h2>
      <div class="id mono">${c.st ? `${c.st.id}${c.id !== c.st.id ? ` · card ${c.id}` : ''}` : `card ${c.id}`} · <span class="${c.status === 'hole' ? 'nostory' : c.status}">${GLYPH[c.status]} ${WORD[c.status]}</span></div>
    </div><button class="x" data-shut title="Close (Esc)">×</button></div>`;
  if (!c.st) {
    drawer.innerHTML = `${head}<div class="dbody">
      <div class="holebox ${c.kind}">${c.kind === 'hole'
        ? `<b>A hole in the process.</b> The process needs this step, and nobody has written its story yet. It is <code>by: ${c.by ?? c.as}</code>, one of our own, so it is ours to write.`
        : `<b>An outside step.</b> ${esc(ACTOR[c.lane].title)} does this, and it is nobody's here to verify: the system is marked <code>outside: true</code>. It has no rules and no mark, and is here so the hand-offs around it read truthfully.`}</div>
      ${c.takes ? `<div class="sect">Takes</div><p class="say">${esc(c.takes)}</p>` : ''}
      <div class="sect">Before and after</div>${hopsOf(c)}</div>`;
    return;
  }
  const r = c.rules[at], n = c.rules.length, keys = ruleKeys(r, surface);
  const u = r.screens.length ? userOf(SC[r.screens[0]].as) : null;
  const others = c.st.rules.filter(x => !c.rules.includes(x));
  const anyApp = c.rules.some(x => x.app);
  drawer.innerHTML = `${head}<div class="dbody">
    <div class="sect">Walk the card <span class="seg pics-seg"><button data-surface="app" class="${surface === 'app' ? 'on' : ''}" ${anyApp ? '' : 'disabled title="No agent has judged these rules on local, so there is no picture of the app"'}>App on local</button><button data-surface="design" class="${surface === 'design' ? 'on' : ''}">Design</button></span></div>
    ${keys.map(k => `<div class="stage">${picOfKey(k)}</div>`).join('')}
    <div class="walk"><span class="n">Rule ${at + 1} of ${n}</span><span class="sp"></span>
      <button data-step="-1" ${at === 0 ? 'disabled' : ''}>← Back</button><button data-step="1" ${at === n - 1 ? 'disabled' : ''}>Next →</button></div>
    <p class="say">${esc(r.statement)}</p>
    <div class="asw"><span class="${r.v}">${GLYPH[r.v]} ${WORD[r.v]}</span>${r.why ? ` <span class="why">· ${esc(r.why)}</span>` : ''}</div>
    ${u && !u.isDefault ? `<div class="asw">Signed in as <b>${esc(u.user.title)}</b>, not ${esc(u.persona.title)}'s default user</div>` : ''}
    <div class="film">${c.rules.map((x, i) => `<button class="${i === at ? 'on' : ''} ${x.screens.length ? '' : 't mono'}" data-at="${i}" title="${esc(x.statement)}">${x.screens.length ? picOfKey(ruleKeys(x, surface)[0]) : i + 1}</button>`).join('')}</div>
    <div class="sect">Rules on this card</div>
    ${c.rules.map(x => `<div class="rule"><span class="g ${x.v}">${GLYPH[x.v]}</span><span>${esc(x.statement)}<small class="mono">${x.id}</small></span></div>`).join('')}
    ${others.length ? `<div class="sect">The story's rules on its other card</div>${others.map(x => `<div class="rule off"><span class="g ${x.v}">${GLYPH[x.v]}</span><span>${esc(x.statement)}<small class="mono">${x.id}</small></span></div>`).join('')}` : ''}
    <div class="sect">Before and after</div>${hopsOf(c)}
    <p class="hint"><kbd>←</kbd> <kbd>→</kbd> step through rules · <kbd>Esc</kbd> close · <kbd>−</kbd> <kbd>+</kbd> <kbd>0</kbd> zoom · drag to pan · the amber ring marks what the person acts on</p>
  </div>`;
}

document.addEventListener('click', e => {
  const t = e.target.closest('button[data-flow],[data-zoom],[data-id],[data-go],[data-step],[data-at],[data-shut],[data-lane],[data-mode],[data-persona],[data-journey],[data-surface]');
  if (!t) return;
  if (t.dataset.flow && t.tagName === 'BUTTON') { if (t.dataset.flow !== flow) turn(t.dataset.flow); }
  else if (t.dataset.zoom && t.tagName === 'BUTTON') t.dataset.zoom === 'fit' ? fit() : glide({ in: z * 1.3, out: z / 1.3, one: 1 }[t.dataset.zoom]);
  else if (t.dataset.id) open(t.dataset.id);
  else if (t.dataset.go) open(t.dataset.go);
  else if (t.dataset.step) { at += +t.dataset.step; draw(); }
  else if (t.dataset.at) { at = +t.dataset.at; draw(); }
  else if (t.dataset.surface) { surface = t.dataset.surface; draw(); }
  else if ('shut' in t.dataset) shut();
  else if ('lane' in t.dataset) follow(t.dataset.lane === focus ? '' : t.dataset.lane);
  else if (t.dataset.mode) mode(t.dataset.mode);
  else if (t.dataset.persona) mode('personas', t.dataset.persona);
  else if (t.dataset.journey) { mode('boards'); shut(); follow(t.dataset.journey); }
});
document.addEventListener('keydown', e => {
  if (document.body.dataset.mode === 'boards' && !e.metaKey && !e.ctrlKey && e.target.tagName !== 'SELECT') {
    if (e.key === '-' || e.key === '_') glide(z / 1.3);
    if (e.key === '+' || e.key === '=') glide(z * 1.3);
    if (e.key === '0') fit();
  }
  if (!sel && document.body.dataset.mode === 'boards' && e.key.startsWith('Arrow') && e.target.tagName !== 'SELECT') {
    e.preventDefault();
    pan({ ArrowLeft: 90, ArrowRight: -90 }[e.key] || 0, { ArrowUp: 90, ArrowDown: -90 }[e.key] || 0);
  }
  if (!sel) return;
  if (e.key === 'Escape') shut();
  if (!sel || !sel.st) return;
  if (e.key === 'ArrowRight' && at < sel.rules.length - 1) { at++; draw(); }
  if (e.key === 'ArrowLeft' && at > 0) { at--; draw(); }
});
document.addEventListener('change', e => { if (e.target.id === 'who') follow(e.target.value); });

/* ── personas: everyone in the blueprint, on this board or not (§7) ── */
function people() {
  const card = p => {
    const own = STORIES.filter(s => s.as === p.id), c = {};
    own.forEach(s => { const m = cardMark({ kind: 'story', rules: s.rules }); c[m] = (c[m] ?? 0) + 1; });
    const marks = Object.keys(c).map(k => `<span class="${k}">${GLYPH[k]} ${c[k]}</span>`).join(' ');
    const onBoard = CARDS.some(x => x.lane === p.id), others = OTHER_BOARDS[p.id] ?? [];
    return `<article class="pcard" id="p-${p.id}">
      <div class="top">${av(p, 'lg')}<div><b>${p.title}</b><small>${p.of}</small></div></div>
      <p class="blurb">${esc(p.blurb)}</p>
      <dl>
        <dt>Uses</dt><dd>${p.uses}</dd>
        <dt>Users</dt><dd>${p.users.map((u, i) => `<div style="margin-bottom:5px"><b style="font-weight:600">${esc(u.title)}</b>${i ? '' : ' <span class="outside">· default</span>'}<br><code>{fixtures.${u.fixture}}</code>${TARGETS.map(t => FIXTURES[t].has(u.fixture)
          ? `<div class="tg"><span>${t}</span><span>has a value</span></div>`
          : `<div class="tg none"><span>${t}</span><span>no value, so nothing signed in as this user can be walked or pictured there</span></div>`).join('')}</div>`).join('')}</dd>
        <dt>Stories</dt><dd>${own.length ? `${own.length} ${own.length === 1 ? 'story' : 'stories'} &nbsp;${marks}` : 'none drawn in this sketch'}</dd>
        <dt>On boards</dt><dd class="bd">${onBoard ? `<button data-journey="${p.id}" title="Open the board, following ${esc(p.title)}">${BOARD.title} →</button>` : ''}${others.map(b => `<span title="Not drawn in this sketch">${b}</span>`).join('')}${onBoard || others.length ? '' : '<span>none yet</span>'}</dd>
      </dl></article>`;
  };
  const group = g => { const ps = ACTORS.filter(p => p.person && p.group === g.id); return ps.length ? `<h2>${g.title}</h2><div class="grid">${ps.map(card).join('')}</div>` : ''; };
  const sys = SB.systems.map(x => x.title + (x.outside ? ' (outside)' : '')).join(', ').replace(/, ([^,]*)$/, ' and $1');
  const laneless = SB.systems.filter(x => !used.has(x.id)).map(x => x.title);
  $('#people').innerHTML = `<div class="wrap">
    <h1>Personas</h1>
    <p class="lede">Everyone who uses the system. A story is one persona's, a screen is signed in as one of its users, and a board's lanes are the personas of its stories.</p>
    ${SB.groups.map(group).join('')}
    <p class="foot">${sys} have lanes on a board and are not personas: nobody signs in as them. ${laneless.length ? `${laneless.join(' and ')} has no card on this board, so no lane. ` : ''}Every name and heading here is this blueprint's own.</p></div>`;
}
function mode(m, lit) {
  document.body.dataset.mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  document.querySelectorAll('.pcard').forEach(c => c.classList.toggle('lit', c.id === `p-${lit}`));
  if (lit) $(`#p-${lit}`).scrollIntoView({ block: 'center' });
  if (m === 'boards') wires();
}

/* ── the canvas: pan anywhere, zoom anywhere ─────────────────────────
 * The whole board, lane names and phase headings included, is one object
 * on a canvas. tx/ty move it; z scales it smoothly. What a card or a lane
 * name DRAWS changes at a few sizes, because past them the detail cannot
 * be read anyway. Each kind is drawn on a base width of its own and scaled
 * to its column, so a card that has just lost its picture comes back at a
 * readable size and shrinks from there.
 */
const MINZ = 0.1, MAXZ = 2, COLW = 320, LANEW = 196, KEY = 'board-view:contractor-onboarding:2';
const DETAIL = [['near', 0.6, 320], ['mid', 0.4, 200], ['far', 0, 0]];                    // cards: name, drawn from this z up, base width
const LANE = [['more', 1.25, 196], ['full', 0.7, 196], ['name', 0.4, 128], ['av', 0, 0]];  // lane names, the same way
const scroller = $('#scroll');
let z = 1, tx = 0, ty = 0, gliding = 0;
const bound = v => Math.min(MAXZ, Math.max(MINZ, v));
const view = () => ({ vw: scroller.clientWidth, vh: scroller.clientHeight, W: board.offsetWidth, H: board.offsetHeight });

/* The board may leave the window almost entirely, in any direction; a corner of it always stays. */
function place() {
  const { vw, vh, W, H } = view(), keep = 120;
  tx = Math.min(vw - keep, Math.max(keep - W, tx));
  ty = Math.min(vh - keep, Math.max(keep - H, ty));
  board.style.transform = `translate3d(${Math.round(tx)}px, ${Math.round(ty)}px, 0)`;
  try { localStorage.setItem(KEY, JSON.stringify([z, tx, ty])); } catch {}
}
function pan(dx, dy) { cancelAnimationFrame(gliding); hush(); tx += dx; ty += dy; place(); }
/* A waits label that no longer fits its stretch is dropped; the dotted line and its tooltip stay. */
function tighten() {
  document.querySelectorAll('.gap').forEach(g => {
    g.classList.remove('tight');
    g.classList.toggle('tight', board.dataset.zoom === 'far' || (flow === 'across' && g.firstElementChild.offsetWidth > g.offsetWidth));
  });
}
/* Sets z, keeping whatever was under the point (x, y) under it: the pointer, or the middle of the window. */
function zoom(to, x = scroller.clientWidth / 2, y = scroller.clientHeight / 2) {
  to = bound(to);
  const a = view(), fx = (x - tx) / a.W, fy = (y - ty) / a.H;
  const [card, , cardBase] = DETAIL.find(d => to >= d[1]), [lane, , laneBase] = LANE.find(d => to >= d[1]);
  z = to;
  board.dataset.zoom = card; board.dataset.lane = lane;
  board.style.setProperty('--z', z);
  board.style.setProperty('--cz', cardBase ? COLW * z / cardBase : 1);
  const pz = Math.min(1.5, Math.max(0.6, z)), g = Math.max(18 * z, 10);   // the gap never closes: a card keeps clear of the lane names
  board.style.setProperty('--lz', laneBase ? LANEW * z / laneBase : Math.max(0.45, Math.min(1, z / 0.4)));
  board.style.setProperty('--pz', pz);
  board.style.setProperty('--g', `${g}px`);
  board.style.setProperty('--hg', `${g / 2 / pz}px`);
  hush();
  const b = view();
  tx = x - fx * b.W; ty = y - fy * b.H;
  $('#lvl').textContent = `${Math.round(z * 100)}%`;
  $('[data-zoom="out"]').disabled = z <= MINZ;
  $('[data-zoom="in"]').disabled = z >= MAXZ;
  place(); tighten(); wires();
}
/* A button or a key glides there; the wheel, a pinch and a drag set things directly, so they are already smooth. */
function glide(to, each, done) {
  to = bound(to);
  cancelAnimationFrame(gliding);
  const from = z, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 220), e = 1 - (1 - k) ** 3;
    zoom(from * (to / from) ** e);
    each?.();
    if (k < 1) gliding = requestAnimationFrame(step); else done?.();
  };
  gliding = requestAnimationFrame(step);
}
/* Fit: across, the largest zoom at which the whole board is in the window. Down, as wide as the window allows,
   from the top: it is meant to be scrolled. Found by measuring, since a card's height changes with the detail it
   shows and a stack of alternatives makes that change large. */
function fit() {
  const top = 52, down = flow === 'down', z0 = z, tx0 = tx, ty0 = ty;
  const fits = v => { zoom(v); const { vw, vh, W, H } = view(); return W <= vw - 40 && (down || H <= vh - top - 12); };
  let lo = MINZ, hi = down ? 1.15 : 1;
  if (fits(hi)) lo = hi; else for (let i = 0; i < 12; i++) { const m = (lo + hi) / 2; if (fits(m)) lo = m; else hi = m; }
  zoom(z0); tx = tx0; ty = ty0; place();
  const centre = () => { const { vw, vh, W, H } = view(); tx = (vw - W) / 2; ty = down ? top : Math.max(top, (vh + top - 12 - H) / 2); place(); };
  glide(lo, centre, centre);
}
/* Which way time runs. The board is redrawn; who is followed and what is open stay as they were. */
function turn(to) {
  flow = to;
  try { localStorage.setItem('board-flow', to); } catch {}
  build();
  const f = focus; focus = null; follow(f);
  if (sel) $(`.card[data-id="${sel.id}"]`).classList.add('sel');
  zoom(z); fit();
}
/* The hover card: what a card would say if it were big enough to say it. */
const tip = $('#tip');
let tipFor = null, tipAt = -1, galFor = null;
function hush() { tip.hidden = true; tipFor = null; tipAt = -1; scrub(null); }
/* Which of n pictures the pointer is over, when a width is split into n equal parts. */
const part = (e, el, n) => { const r = el.getBoundingClientRect(); return Math.min(n - 1, Math.max(0, Math.floor((e.clientX - r.left) / r.width * n))); };
/* The gallery on a full-size card: shows picture i; a card the pointer has left goes back to its first. */
function scrub(card, i = 0) {
  if (galFor && galFor !== card) show(galFor, 0);
  galFor = card;
  if (card) show(card, i);
}
function show(card, i) {
  const n = byId[card.dataset.id].pics.length;
  card.querySelectorAll('.sl').forEach((x, k) => x.classList.toggle('on', k === i));
  card.querySelectorAll('.bars i').forEach((x, k) => x.classList.toggle('on', k === i));
  const c = card.querySelector('.count');
  if (c) c.textContent = card.matches(':hover') && n > 1 ? `${i + 1} / ${n}` : `${n} ${n === 1 ? 'picture' : 'pictures'}`;
}
/* Under each picture, the statement of the rule it is evidence for. A card with no story says which kind it is. */
function tell(card, i = 0) {
  if (card === tipFor && i === tipAt) return;
  const moved = card !== tipFor;
  tipFor = card; tipAt = i;
  const c = byId[card.dataset.id], l = laneOf(c), n = c.pics.length, p = c.pics[i], r = card.getBoundingClientRect();
  tip.innerHTML = `${p ? `<div class="pic">${picOfKey(p.key)}${bars(n, i)}</div>` : ''}<div class="in">
    <div class="who">${av(l, 'sm')}${l.title}${c.user ? ` · ${esc(c.user.user.title)}` : ''}${n > 1 ? `<span class="n">${i + 1} / ${n}</span>` : ''}</div>
    <b>${esc(c.title)}</b>
    <div class="meta"><span class="${c.status === 'hole' ? 'nostory' : c.status}">${GLYPH[c.status]} ${WORD[c.status]}</span>${c.st ? `<span>${c.rules.length} rules</span>` : ''}${c.takes ? `<span class="takes">${esc(c.takes)}</span>` : ''}</div>
    ${p ? `<div class="say">${esc(p.rules[0].statement)}</div>` : ''}</div>`;
  tip.hidden = false;
  if (!moved) return;                     // scrubbing: the card stays where it is while its picture changes
  const h = Math.max(tip.offsetHeight, 300), below = r.bottom + 8 + h < innerHeight;
  tip.style.left = `${Math.min(innerWidth - 258, Math.max(8, r.left + r.width / 2 - 125))}px`;
  tip.style.top = below ? `${r.bottom + 8}px` : '';
  tip.style.bottom = below ? '' : `${Math.max(8, innerHeight - r.top + 8)}px`;
}
/* Brings a card into the window if any of it is outside. */
function reveal(el) {
  const r = el.getBoundingClientRect(), v = scroller.getBoundingClientRect(), m = 40;
  let dx = 0, dy = 0;
  if (r.left < v.left + m) dx = v.left + m - r.left; else if (r.right > v.right - m) dx = v.right - m - r.right;
  if (r.top < v.top + m) dy = v.top + m - r.top; else if (r.bottom > v.bottom - m) dy = v.bottom - m - r.bottom;
  if (!dx && !dy) return;
  cancelAnimationFrame(gliding);
  const x0 = tx, y0 = ty, t0 = performance.now();
  const step = now => {
    const k = Math.min(1, (now - t0) / 240), e = 1 - (1 - k) ** 3;
    tx = x0 + dx * e; ty = y0 + dy * e; place();
    if (k < 1) gliding = requestAnimationFrame(step);
  };
  gliding = requestAnimationFrame(step);
}

/* Wheel: two fingers pan; with Ctrl or Cmd, or as a pinch, it zooms about the pointer. */
scroller.addEventListener('wheel', e => {
  e.preventDefault();
  cancelAnimationFrame(gliding);
  const r = scroller.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoom(z * Math.exp(-e.deltaY * 0.01), e.clientX - r.left, e.clientY - r.top);
  else pan(-e.deltaX, -e.deltaY);
}, { passive: false });

/* Drag anywhere, cards included, to pan; two touches pinch. A drag that moved is not a click. */
const ptrs = new Map();
let drag = null, pinch = null, moved = false;
const spread = () => { const [a, b] = [...ptrs.values()]; return { d: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY), x: (a.clientX + b.clientX) / 2, y: (a.clientY + b.clientY) / 2 }; };
scroller.addEventListener('pointerdown', e => {
  if (e.button) return;
  ptrs.set(e.pointerId, e);
  cancelAnimationFrame(gliding); hush();
  if (ptrs.size === 1) { drag = { x: e.clientX, y: e.clientY, tx, ty }; moved = false; }
  if (ptrs.size === 2) { pinch = { d: spread().d, z }; drag = null; }
});
scroller.addEventListener('pointermove', e => {
  const card = e.target.closest?.('.card');
  if (!card || ptrs.size) return hush();
  const n = byId[card.dataset.id].pics.length;
  if (board.dataset.zoom === 'near') {
    // Full size: the picture on the card is the gallery. Only the picture scrubs; the words below it do not.
    tip.hidden = true; tipFor = null;
    const g = card.querySelector('.gal');
    scrub(g ? card : null, g && e.target.closest('.gal') ? part(e, g, n) : 0);
  } else { scrub(null); tell(card, n ? part(e, card, n) : 0); }  // smaller: the card is the scrubber, the pictures show beside it
});
scroller.addEventListener('pointerleave', hush);
addEventListener('pointermove', e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, e);
  if (pinch && ptrs.size === 2) {
    const s = spread(), r = scroller.getBoundingClientRect();
    moved = true; zoom(pinch.z * s.d / pinch.d, s.x - r.left, s.y - r.top);
  } else if (drag) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!moved && Math.hypot(dx, dy) < 5) return;
    moved = true; scroller.classList.add('panning');
    tx = drag.tx + dx; ty = drag.ty + dy; place();
  }
});
const lift = e => {
  if (!ptrs.delete(e.pointerId)) return;
  pinch = null;
  const left = [...ptrs.values()][0];
  drag = left ? { x: left.clientX, y: left.clientY, tx, ty } : null;
  if (!left) scroller.classList.remove('panning');
};
addEventListener('pointerup', lift); addEventListener('pointercancel', lift);
scroller.addEventListener('click', e => { if (moved) { e.stopPropagation(); e.preventDefault(); moved = false; } }, true);

build(); people();
let kept = null;
try { const k = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(k) && k.every(Number.isFinite)) kept = k; } catch {}
if (kept) { zoom(kept[0]); tx = kept[1]; ty = kept[2]; place(); } else { zoom(0.72); tx = 40; ty = 56; place(); }   // first visit: readable, from the start; Fit shows the whole board
new ResizeObserver(() => { tighten(); wires(); }).observe(board);
new ResizeObserver(() => wires()).observe(scroller);
</script>
</body>
</html>
