<!doctype html>
<!-- walkdown chrome wears walkdown's own skin, same as the panel. -->
<html lang="en" data-theme="blueprint">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>walkdown</title>
<link rel="stylesheet" href="walkdown.css">
<style>
  /* Page mechanics only — everything with an opinion about how walkdown LOOKS
     lives in the Tailwind + daisyUI stylesheet. What is left here is the
     handful of rules driven by state classes on <body>, plus the iframe
     scaling, which is arithmetic rather than design. */
  body.rail-closed #rules { flex-basis: 34px; overflow: hidden; }
  body.rail-closed #rules .story-h,
  body.rail-closed #rules .rule .name,
  body.rail-closed #rules .rule .thrs,
  body.rail-closed .railtop .lbl { display: none; }
  body.drawer-closed #dresize,
  body.drawer-closed #detail { display: none; }
  /* Stage modes: one surface takes the whole stage, or both share it. */
  body[data-mode="prototype"] .frame.f-app { display: none; }
  body[data-mode="prototype"] .frame.f-proto { flex-basis: 100%; }
  body[data-mode="app"] .frame.f-proto { display: none; }
  body[data-mode="app"] .frame.f-app { flex-basis: 100%; }
  /* Each surface lays out at the chosen viewport width, then the whole thing is
     scaled down to fit its pane — so a desktop app is judged as a desktop app.
     The iframe keeps its own CSS-pixel space, which is what pins record. */
  .frame iframe { border: 0; position: absolute; top: 0; left: 0;
                  transform-origin: top left; background: #fff; }
  #dresize::after { content: ''; width: 44px; height: 3px; border-radius: 2px;
                    background: var(--color-base-300); }
  #dresize:hover::after { filter: brightness(.85); }
</style>
</head>
<body data-mode="split" class="flex h-screen flex-col bg-base-200 text-sm">
<header class="navbar min-h-0 gap-3.5 border-b border-base-300 bg-base-100 px-4 py-2">
  <h1 class="shrink-0 font-semibold">walkdown</h1>
  <select id="bpsel" data-testid="board.project-switcher" class="select select-sm max-w-55" style="display:none"></select>
  <span class="shrink-0 whitespace-nowrap text-[13px] opacity-70" id="counts"></span>
  <span class="flex-1"></span>
  <span class="join" id="modeseg" data-testid="board.mode-switcher">
    <button class="btn btn-sm join-item" data-m="prototype">Prototype</button>
    <button class="btn btn-sm join-item" data-m="split">Split</button>
    <button class="btn btn-sm join-item" data-m="app">App</button>
  </span>
  <button class="btn btn-sm" id="pinbtn" title="Click anywhere in either surface to pin feedback">📌 Pin mode</button>
  <input type="text" id="actor" data-testid="board.actor" class="input input-sm w-30" placeholder="your name"
         title="Recorded as the author of your walkdowns and verifications">
  <button class="btn btn-sm btn-primary" id="wdbtn">Start walkdown</button>
</header>
<main class="flex min-h-0 flex-1">
  <nav id="rules" data-testid="board.rules"
       class="w-58 shrink-0 overflow-y-auto border-r border-base-300 bg-base-100 py-2 transition-[flex-basis] duration-100"></nav>
  <!-- flex: 1 1 0 (not auto) — otherwise the iframes' intrinsic 300px width,
       not the window, decides how much room the surfaces get. -->
  <section id="surfaces" data-testid="board.surfaces" class="flex min-w-0 flex-[1_1_0] flex-col">
    <div id="screenbar" class="flex flex-wrap items-center gap-1.5 border-b border-base-300 bg-base-100 px-3 py-2"></div>
    <div id="frames" class="flex min-h-0 flex-1 gap-px bg-base-300">
      <div class="frame f-proto flex min-w-0 flex-[1_1_50%] flex-col bg-base-100">
        <div class="fh border-b border-base-300 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider opacity-50">Prototype</div>
        <div class="vp relative flex-1 overflow-hidden bg-base-200"><iframe id="proto"></iframe></div></div>
      <div class="frame f-app flex min-w-0 flex-[1_1_50%] flex-col bg-base-100">
        <div class="fh border-b border-base-300 px-2.5 py-1 text-[11px] font-bold uppercase tracking-wider opacity-50">App</div>
        <div class="vp relative flex-1 overflow-hidden bg-base-200"><iframe id="app"></iframe></div></div>
    </div>
  </section>
</main>
<!-- The drawer: a title line always, columns when open. -->
<section id="drawer" data-testid="board.drawer" class="flex shrink-0 flex-col border-t border-base-300 bg-base-100">
  <!-- Drag the top edge to resize; the height sticks. -->
  <div id="dresize" data-testid="detail.resize-handle" title="Drag to resize"
       class="flex h-[7px] cursor-ns-resize items-center justify-center border-b border-base-300"></div>
  <div class="dtitle flex cursor-pointer items-center gap-2.5 px-3.5 py-1.5 text-[12.5px]" id="dtitle"></div>
  <div id="detail" class="flex min-h-0 gap-4.5 overflow-hidden px-3.5 pb-3"></div>
</section>
<div id="threadpanel"
     class="fixed left-62 top-13 z-50 hidden max-h-[calc(100vh-80px)] w-95 overflow-y-auto rounded-box border border-base-300 bg-base-100 p-3.5 shadow-2xl"></div>
<script>
  // walkdown's own app surface is this viewer. Load the embed when we are the
  // app being reviewed (framed), so the app pane is pinnable like the prototype.
  if (window.parent !== window) {
    const s = document.createElement('script');
    s.src = 'embed.js';
    s.setAttribute('data-walkdown', '');
    document.head.appendChild(s);
  }
</script>
<script>
const $ = (id) => document.getElementById(id);
const BP = new URLSearchParams(location.search).get('bp');
const withBp = (path) => (BP ? path + (path.includes('?') ? '&' : '?') + 'bp=' + encodeURIComponent(BP) : path);
let data = null, selected = null, screen = null, pinMode = false, session = null;
let attnByThread = {};

const threadAttn = (id) => attnByThread[id] ?? null;
const attnCounts = (rule) => {
  const items = (data.attention ?? []).filter(i => i.thread && i.rule === rule);
  return {
    human: items.filter(i => i.who === 'human').length,
    agent: items.filter(i => i.who === 'agent').length,
  };
};
/* A rule needs YOUR verdict when a human action is queued against it that is
   not thread-backed — a walkdown. These outnumber thread flags, so the rail
   must show them or the header count cannot be reconciled. */
const needsYourVerdict = (rule) =>
  (data.attention ?? []).some(i => i.who === 'human' && !i.thread && i.rule === rule);
let onlyMine = false;

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const GLYPH = { pass: ['✓', 'v-pass'], fail: ['✗', 'v-fail'], pending: ['○', 'v-pending'] };
const CELL = { pass: '✓ pass', fail: '✗ fail', stale: '~ stale', skipped: '– skipped', blocked: '⊘ blocked',
               never: 'never', na: '·' };
const CELLCLASS = { pass: 'v-pass', fail: 'v-fail', stale: 'st-open', never: 'v-pending', na: 'v-pending', skipped: 'v-pending' };

async function load() {
  data = await (await fetch(withBp('/api/blueprint'))).json();
  const sel = $('bpsel');
  if ((data.projects ?? []).length > 1) {
    sel.style.display = '';
    sel.innerHTML = data.projects.map(p =>
      `<option value="${p.id}" ${p.current ? 'selected' : ''}>${p.name}</option>`).join('');
    sel.onchange = () => { location.href = '?bp=' + encodeURIComponent(sel.value); };
  }
  attnByThread = Object.fromEntries(
    (data.attention ?? []).filter(i => i.thread).map(i => [i.thread, i.who]));
  // Every number names its unit: rules are rules, queue items are actions.
  const needsYou = (data.attention ?? []).filter(i => i.who === 'human').length;
  const total = data.rows.length;
  const verified = data.rows.filter(r => r.verdict === 'pass').length;
  const failing = data.rows.filter(r => r.verdict === 'fail').length;
  // Break the queue into the two things it actually contains, so the number
  // can be reconciled against the rail rather than taken on faith.
  const walkdowns = (data.attention ?? []).filter(i => i.who === 'human' && !i.thread).length;
  const threadsWaiting = needsYou - walkdowns;
  const parts = [walkdowns && `${walkdowns} to walk down`, threadsWaiting && `${threadsWaiting} thread${
    threadsWaiting === 1 ? '' : 's'} to verify`].filter(Boolean).join(' · ');
  $('counts').innerHTML = `<span data-testid="board.counts" title="${verified} of ${total} rules have every required verification recorded">` +
    `<b>${verified} of ${total} rules</b> verified` +
    (failing ? ` · <span class="v-fail">${failing} failing</span>` : '') +
    (needsYou ? ` · <button id="minebtn" class="btn btn-xs btn-warning${
      onlyMine ? '' : ' btn-outline'}" title="Show only what needs you">${parts}</button>` : '') + '</span>';
  $('minebtn')?.addEventListener('click', () => {
    onlyMine = !onlyMine;
    renderRules();
    load.lastCounts?.();
    $('minebtn').classList.toggle('btn-outline', !onlyMine);
  });
  renderRules();
  renderScreenbar();
  if (selected) selected = data.rows.find(r => r.rule === selected.rule) ?? null;
  renderDetail();
  pushContext();
}

function activeThreadsFor(rule) {
  return data.threads.filter(t => t.anchor?.rule === rule &&
    !['incorporated', 'verified', 'waived'].includes(t.status));
}

function renderRules() {
  const nav = $('rules');
  nav.innerHTML = `<div class="railtop flex items-center justify-between px-2.5 pb-1.5 pt-0.5">
    <span class="lbl text-[11px] font-bold uppercase tracking-wider opacity-50">Rules</span>
    <button id="railtoggle" data-testid="board.rail-toggle" class="btn btn-xs btn-ghost"
      title="Collapse the rail — the surfaces take the width">⇤</button></div>`;
  nav.querySelector('#railtoggle').onclick = () => {
    const closed = document.body.classList.toggle('rail-closed');
    nav.querySelector('#railtoggle').textContent = closed ? '⇥' : '⇤';
    localStorage.setItem('walkdown-rail-closed', closed ? '1' : '');
  };
  if (document.body.classList.contains('rail-closed')) nav.querySelector('#railtoggle').textContent = '⇥';
  const stories = [...new Set(data.rows.map(r => r.story))];
  for (const story of stories) {
    const h = document.createElement('div'); h.className = 'story-h px-3.5 pb-1 pt-2 text-[11px] font-bold uppercase tracking-wider opacity-50'; h.textContent = story; nav.appendChild(h);
    const before = nav.childElementCount;
    for (const row of data.rows.filter(r => r.story === story)) {
      if (onlyMine && !needsYourVerdict(row.rule) && !attnCounts(row.rule).human) continue;
      const el = document.createElement('div');
      el.className = 'rule' + (selected?.rule === row.rule ? ' sel' : '');
      const [g, cls] = GLYPH[row.verdict];
      const short = row.rule.startsWith(story + '.') ? row.rule.slice(story.length + 1) : row.rule;
      const { human, agent } = attnCounts(row.rule);
      const mine = needsYourVerdict(row.rule);
      el.innerHTML = `<span class="glyph ${mine ? 'v-mine' : cls}">${session?.verdicts[row.rule]
        ? (session.verdicts[row.rule] === 'pass' ? '✓' : '✗') : mine ? '◆' : g}</span><span class="name">${short}</span>` +
        (mine || human || agent ? `<span class="thrs">` +
          (mine ? `<span class="thr thr-h" title="needs your walkdown verdict">walk</span>` : '') +
          (human ? `<span class="thr thr-h" title="${human} thread(s) waiting on you">${human} ⚑</span>` : '') +
          (agent ? `<span class="thr thr-a" title="waiting on the agent">${agent} ⚑</span>` : '') +
          `</span>` : '');
      el.title = row.rule;
      el.onclick = () => { selected = row;
        document.body.classList.remove('drawer-closed');
        gotoScreen(row.flow?.at(-1) ?? row.screens[0] ?? screen); renderRules(); renderDetail(); };
      nav.appendChild(el);
    }
    if (nav.childElementCount === before) h.remove();   // filtered to nothing
  }
  if (onlyMine && !nav.querySelector('.rule'))
    nav.insertAdjacentHTML('beforeend', '<p class="empty px-3.5 py-2.5">Nothing waiting on you.</p>');
}

const BADGE = { pass: ['verified', 'badge-success'], fail: ['failing', 'badge-error'],
                pending: ['pending', 'badge-ghost'] };

function renderDetail() {
  const d = $('detail'), title = $('dtitle');
  if (!selected) {
    document.body.classList.add('drawer-closed');
    title.innerHTML = '<span class="opacity-50">Select a rule — its detail opens here as a drawer</span>';
    title.onclick = null;
    d.innerHTML = '';
    return;
  }
  const r = selected;
  const ev = [];
  for (const t of data.targets) if (r.cells[t].state !== 'na') ev.push([`checks/${t}`, r.cells[t]]);
  if (r.agent.state !== 'na') ev.push(['agent', r.agent]);
  if (r.human.state !== 'na') ev.push(['human', r.human]);
  const threads = data.threads.filter(t => t.anchor?.rule === r.rule)
    .sort((a, b) => String(b.created ?? '').localeCompare(String(a.created ?? '')));
  const [badge, badgeCls] = BADGE[r.verdict] ?? ['', ''];
  const flowLine = (() => {
    const chip = (s) => `<button class="rsc btn btn-xs${screen === s ? ' btn-primary' : ''}" data-s="${s}">${s}</button>`;
    const flow = r.flow?.length ? r.flow : r.screens;
    const extras = r.screens.filter((s) => !flow.includes(s));
    const label = r.flow?.length ? 'flow' : 'screens';
    if (!flow.length && !extras.length) return '';
    return `${label}: ${flow.map(chip).join(' <span class="opacity-50">→</span> ') || '—'}` +
      (extras.length ? ` <span class="opacity-50">·</span> ${extras.map(chip).join(' ')}` : '');
  })();
  title.innerHTML = `<span class="break-all font-semibold" data-testid="detail.rule-id">${r.rule}</span>
    <span class="badge badge-sm ${badgeCls}">${badge}</span>
    <span class="text-[11.5px] opacity-50">verify: ${r.verify.join(', ')}</span>
    ${session ? `<span class="wd-verdict join" data-testid="detail.verdict">
        <button id="wd-pass" class="btn btn-xs join-item${
          session.verdicts[r.rule] === 'pass' ? ' btn-success' : ''}">✓ Pass</button>
        <button id="wd-fail" class="btn btn-xs join-item${
          session.verdicts[r.rule] === 'fail' ? ' btn-error' : ''}">✗ Fail</button>
        <span class="join-item flex items-center px-2 text-[11.5px] opacity-50">${
          Object.keys(session.verdicts).length} of ${
          data.rows.filter(x => needsYourVerdict(x.rule)).length} judged</span>
      </span>` : ''}
    <button class="grip btn btn-xs btn-ghost ml-auto" data-testid="detail.drawer-toggle">${
      document.body.classList.contains('drawer-closed') ? 'expand ▴' : 'collapse ▾'}</button>`;
  title.onclick = (e) => {
    if (e.target.closest('.wd-verdict')) return;   // verdicts are not a collapse
    document.body.classList.toggle('drawer-closed');
    title.querySelector('.grip').textContent =
      document.body.classList.contains('drawer-closed') ? 'expand ▴' : 'collapse ▾';
  };
  // Reading order (n-0007): statement, then evidence, then flow, then steps.
  d.innerHTML = `
    <div class="dcol min-w-0 flex-[1.7_1_0] overflow-y-auto">
      <p class="mb-2" data-testid="detail.statement">${r.statement ?? ''}</p>
      <div class="sect">Evidence</div>
      <div data-testid="detail.evidence">
      ${ev.map(([src, c]) => `<div class="evrow"><span class="src">${src}</span>
        <span class="${CELLCLASS[c.state] ?? ''}">${CELL[c.state] ?? c.state}${src === 'human' && c.actor ? ' (' + c.actor + ')' : ''}</span></div>`).join('') || '<p class="empty">none required</p>'}
      </div>
      ${session?.verdicts[r.rule] === 'fail' ? `<div class="alert alert-warning my-2 py-2 text-xs">📌 Pin mode is on — click the
        broken element (or any spot) in either surface to attach a note to this fail.</div>` : ''}
    </div>
    <div class="dcol min-w-0 flex-[1_1_0] overflow-y-auto">
      ${flowLine ? `<div class="sect mt-0">Flow</div>
        <div class="text-xs opacity-70" data-testid="detail.flow">${flowLine}</div>` : ''}
      ${(() => {
        const hasChecks = r.verify.includes('checks');
        const refs = hasChecks ? [...new Set(data.targets.flatMap(t => r.cells[t]?.checks ?? []))] : [];
        // Steps are the rule, not an appendix — they render open. Only the
        // recorded check source stays behind a disclosure.
        const stepsHtml = r.steps ? `<div class="sect">Steps</div>
          <div class="steps" data-testid="detail.steps">${
          Object.entries(r.steps).map(([ph, items]) =>
            `<div class="ph">${ph}</div><ul>${items.map(s =>
              `<li>${esc(s).replace(/\`([^\`]+)\`/g, '<code>$1</code>')}</li>`).join('')}</ul>`).join('')}</div>` : '';
        const checksBox = hasChecks ? `<details class="my-1 mb-2.5" id="checksbox" data-refs="${refs.length}"
          data-testid="detail.technical-disclosure"><summary class="cursor-pointer text-xs opacity-50">${
            refs.length ? refs.map(esc).join(' · ') : 'checks: none recorded yet'}</summary>
          <div id="checksrc">${refs.length ? '<p class="empty">loading…</p>'
            : '<p class="empty">No recorded checks — run \`walkdown run\` to link tests to this rule.</p>'}</div>
          </details>` : '';
        return stepsHtml + checksBox;
      })()}
    </div>
    <div class="dcol min-w-0 flex-[1_1_0] overflow-y-auto" data-testid="detail.threads">
      <div class="sect mt-0">Threads</div>
      ${threads.map(t => `<div class="thread ${threadAttn(t.id) === 'human' ? 'needs-you'
          : threadAttn(t.id) === 'agent' ? 'needs-agent' : ''}" data-t="${t.id}">
          <div class="th-h">${t.id} · ${t.kind} ·
          <span class="st-${t.status}">${t.status}</span></div>${t.body ?? ''}</div>`).join('') || '<p class="empty">none</p>'}
    </div>`;
  if (session) {
    // A pass moves you on; a fail keeps you here, because a fail wants a pin.
    $('wd-pass').onclick = () => {
      session.verdicts[r.rule] = 'pass';
      renderRules();
      if (!advanceToNextUnjudged()) renderDetail();
    };
    $('wd-fail').onclick = () => {
      session.verdicts[r.rule] = 'fail';
      if (!pinMode) { pinMode = true; $('pinbtn').classList.add('btn-warning'); pushContext(); }
      renderRules(); renderDetail();
    };
  }
  d.querySelectorAll('.rsc').forEach((b) => {
    b.onclick = () => { gotoScreen(b.dataset.s); renderDetail(); };
  });
  d.querySelectorAll('.thread').forEach((el) => {
    el.onclick = () => openThread(el.dataset.t);
  });
  const box = d.querySelector('#checksbox');
  if (box) box.addEventListener('toggle', async () => {
    if (!box.open || box.dataset.loaded || !Number(box.dataset.refs)) return;
    box.dataset.loaded = '1';
    const res = await (await fetch(withBp(`/api/checks?rule=${encodeURIComponent(r.rule)}`))).json();
    d.querySelector('#checksrc').innerHTML = (res.checks ?? []).map(c =>
      c.missing ? `<div class="mb-1 mt-2 text-[11px] opacity-50">${esc(c.ref)} <span class="v-fail">(file not found)</span></div>`
        : `<div class="mb-1 mt-2 text-[11px] opacity-50">${esc(c.ref)}</div>` +
          `<pre class="max-h-65 overflow-auto rounded-box bg-base-200 p-2.5 text-[11.5px] leading-relaxed whitespace-pre">${esc(c.source)}</pre>`
    ).join('') || '<p class="empty">none</p>';
  });
}

// --- thread panel: reply and lifecycle actions --------------------------------
let panelThread = null;

// Short verbs. The third element marks the quiet (set-aside) action.
function threadActions(t) {
  if (t.kind === 'note') {
    if (t.status === 'open') return [['Addressed', 'addressed'], ['Waive', 'waived', true]];
    if (t.status === 'addressed') return [['✓ Verify', 'verified'], ['Reopen', 'open'], ['Waive', 'waived', true]];
  } else {
    if (t.status === 'open') return [['Answer', '__answer'], ['Waive', 'waived', true]];
    if (t.status === 'answered') return [['Incorporated', 'incorporated'], ['Reopen', 'open'], ['Waive', 'waived', true]];
  }
  return [];
}

/** "3h ago" — provenance should cost a glance, not a date parse. */
function ago(iso) {
  const then = Date.parse(iso ?? '');
  if (!Number.isFinite(then)) return '';
  const mins = Math.max(0, Math.round((Date.now() - then) / 60000));
  if (mins < 60) return `${mins}m ago`;
  if (mins < 1440) return `${Math.round(mins / 60)}h ago`;
  return `${Math.round(mins / 1440)}d ago`;
}

function openThread(id) {
  const t = data.threads.find(x => x.id === id);
  if (!t) return;
  panelThread = id;
  const p = $('threadpanel');
  p.classList.remove('hidden');
  const replies = t.replies ?? [];
  const shown = replies.slice(-2), hidden = replies.length - shown.length;
  // Provenance condensed to two quiet lines; the note itself leads.
  const where = [t.anchor?.rule?.split('.').at(-1), t.anchor?.screen, t.anchor?.element,
    t.anchor?.surface, t.anchor?.viewport && `${t.anchor.viewport.name} ${t.anchor.viewport.width}`,
    t.author, ago(t.created)].filter(Boolean).join(' · ');
  const reply = (r) => `<div class="py-0.5 text-[12.5px]">
    <div class="text-[11px] opacity-50">${r.author} · ${ago(r.created)}</div>${r.body}</div>`;
  p.innerHTML = `
    <div class="flex items-center gap-1.5 text-[11px] opacity-60" data-testid="thread.provenance">
      <span class="font-bold opacity-100">${t.id}</span> · ${t.kind} · <span class="st-${t.status}">${t.status}</span>
      ${t.waived_by ? `<span class="empty">by ${t.waived_by}</span>` : ''}
      <button class="tp-close btn btn-xs btn-ghost ml-auto" data-testid="thread.close" title="Close">×</button>
    </div>
    <div class="truncate text-[11px] opacity-50" title="${esc(where)}">${where}</div>
    <p class="my-2.5 text-sm leading-relaxed" data-testid="thread.body">${t.body ?? ''}</p>
    ${replies.length ? `<div class="replies mb-2 border-l-2 border-base-300 pl-2" data-testid="thread.replies">
      ${hidden ? `<div class="link link-primary text-[11.5px]" id="tp-more">${hidden} earlier ${
        hidden === 1 ? 'reply' : 'replies'} ▾</div>` : ''}
      ${shown.map(reply).join('')}
    </div>` : ''}
    <textarea id="tp-text" data-testid="thread.reply" class="textarea my-1.5 h-14 w-full" placeholder="Reply…"></textarea>
    <div class="flex items-center gap-1.5" data-testid="thread.actions">
      <input type="text" id="tp-actor" class="input input-xs w-23" placeholder="your name">
      <button id="tp-reply" class="btn btn-xs">Reply</button>
      ${threadActions(t).map(([label, s, quiet]) =>
        `<button class="tp-act btn btn-xs${quiet ? ' btn-ghost ml-auto opacity-60' : ''}" data-s="${s}">${label}</button>`).join('')}
    </div>
    <div class="mt-1 text-[11.5px] text-warning" id="tp-reason" style="display:none"></div>`;
  const tpActor = p.querySelector('#tp-actor');
  tpActor.value = $('actor').value;
  tpActor.addEventListener('input', () => {
    $('actor').value = tpActor.value;
    localStorage.setItem('walkdown-actor', tpActor.value);
    tpActor.classList.remove('input-error');
  });
  p.querySelector('.tp-close').onclick = closeThread;
  p.querySelector('#tp-reply').onclick = () => threadReply(id);
  p.querySelectorAll('.tp-act').forEach(b => b.onclick = () => threadAct(id, b.dataset.s));
  p.querySelector('#tp-more')?.addEventListener('click', () => {
    p.querySelector('.replies').innerHTML = replies.map(reply).join('');
  });
}

/** Ask for a reason only when the chosen action needs one. */
function askReason(status) {
  const box = $('tp-text'), hint = $('tp-reason');
  if (box.value.trim()) return box.value.trim();
  hint.style.display = '';
  hint.textContent = `${status === 'waived' ? 'Waiving' : 'Reopening'} is recorded with a reason — write it above, then press again.`;
  box.classList.add('textarea-warning');
  box.focus();
  return null;
}

function requireActor() {
  const tpActor = $('threadpanel').querySelector('#tp-actor');
  const actor = tpActor?.value.trim();
  if (actor && actor !== 'agent') return actor;
  if (tpActor) {
    tpActor.classList.add('input-error');
    tpActor.focus();
  }
  alert('This action is recorded under your name — enter it first.');
  return null;
}

function closeThread() { panelThread = null; $('threadpanel').classList.add('hidden'); }

async function threadPost(path, body) {
  const res = await fetch(withBp(path), { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(body) });
  const out = await res.json();
  if (!res.ok) { alert(out.error ?? 'request failed'); return false; }
  return true;
}

async function threadReply(id) {
  const body = $('tp-text').value.trim();
  if (!body) return alert('Write the reply first.');
  const author = $('threadpanel').querySelector('#tp-actor')?.value.trim();
  if (await threadPost(`/api/threads/${id}/replies`, { author: author || undefined, body })) {
    await load(); openThread(id);
  }
}

async function threadAct(id, status) {
  const humanOnly = status === 'verified' || status === 'waived';
  const actor = humanOnly
    ? requireActor()
    : $('threadpanel').querySelector('#tp-actor')?.value.trim();
  if (humanOnly && !actor) return;
  const text = $('tp-text').value.trim();
  if (status === '__answer') {
    if (!text) return alert('Write the answer in the text box first.');
    if (await threadPost(`/api/threads/${id}/replies`, { author: actor || undefined, body: text }) &&
        await threadPost(`/api/threads/${id}/status`, { status: 'answered', actor })) {
      await load(); openThread(id);
    }
    return;
  }
  const needsReason = status === 'waived' || status === 'open';
  if (needsReason && !text && !askReason(status)) return;
  if (await threadPost(`/api/threads/${id}/status`, { status, actor, reason: needsReason ? text : undefined })) {
    await load();
    ['verified', 'waived', 'incorporated'].includes(status) ? closeThread() : openThread(id);
  }
}

function renderScreenbar() {
  const bar = $('screenbar'); bar.innerHTML = '';
  if (!data.storyboard.length) {
    bar.innerHTML = `<span class="empty">No screens in this blueprint — headless rules only${
      (data.projects ?? []).length > 1 ? '; pick another project from the dropdown to see surfaces' : ''}.</span>`;
    return;
  }
  for (const s of data.storyboard) {
    const b = document.createElement('button');
    b.className = 'sb btn btn-xs' + (screen === s.id ? ' btn-primary' : '');
    b.textContent = s.id;
    b.onclick = () => gotoScreen(s.id);
    bar.appendChild(b);
  }
  // Viewport + zoom live at the right of the screen bar: both surfaces always
  // share one viewport, so the comparison stays honest.
  const right = document.createElement('span');
  right.className = 'ml-auto flex items-center gap-2';
  right.innerHTML = `<span class="join" id="vpseg" data-testid="board.viewport-toggle">${
    VIEWPORTS.map(v => `<button class="btn btn-xs join-item" data-v="${v.name}" title="${v.width}px wide">${v.label}</button>`).join('')
  }</span><span class="empty" id="zoomlbl" data-testid="board.zoom"></span>`;
  bar.appendChild(right);
  for (const b of right.querySelectorAll('#vpseg button'))
    b.onclick = () => setViewport(b.dataset.v);
  syncViewportUI();
  applyZoom();   // the label is new; refill it
}

// --- viewport + zoom ----------------------------------------------------------
const VIEWPORTS = [
  { name: 'desktop', label: '🖥 Desktop', width: 1440 },
  { name: 'mobile', label: '📱 Mobile', width: 390 },
];
let viewport = VIEWPORTS[0];

function setViewport(name) {
  viewport = VIEWPORTS.find(v => v.name === name) ?? VIEWPORTS[0];
  localStorage.setItem('walkdown-viewport', viewport.name);
  syncViewportUI();
  applyZoom();
  pushContext();
}

function syncViewportUI() {
  for (const b of document.querySelectorAll('#vpseg button'))
    b.classList.toggle('btn-active', b.dataset.v === viewport.name);
}

/** Lay each surface out at the viewport width, then scale it to fit its pane. */
function applyZoom() {
  let scale = 1;
  for (const id of ['proto', 'app']) {
    const frame = $(id), pane = frame.parentElement;
    const avail = pane.clientWidth;
    if (!avail) continue;
    scale = Math.min(1, avail / viewport.width);
    frame.style.width = `${viewport.width}px`;
    frame.style.height = `${Math.ceil(pane.clientHeight / scale)}px`;
    frame.style.transform = scale < 1 ? `scale(${scale})` : 'none';
  }
  const lbl = $('zoomlbl');
  if (lbl) lbl.textContent = `${viewport.width}px · fit ${Math.round(scale * 100)}%`;
}
addEventListener('resize', applyZoom);

function gotoScreen(id) {
  const s = data.storyboard.find(x => x.id === id);
  if (!s) return;
  screen = id;
  renderScreenbar();
  const proto = $('proto');
  const header = document.querySelector('#frames .frame .fh');
  proto.removeAttribute('srcdoc');
  if (s.prototype && data.hasPrototype) {
    header.textContent = 'Prototype';
    header.classList.remove('text-warning');
    proto.src = withBp('/prototype' + s.prototype);
  } else if (s.proposal) {
    header.textContent = '⚠ Proposed — not from design';
    header.classList.add('text-warning');
    proto.src = withBp('/proposals' + s.proposal);
  } else {
    header.textContent = 'Prototype — none yet';
    header.classList.add('text-warning');
    proto.srcdoc = '<body style="display:grid;place-items:center;height:95vh;margin:0;' +
      'font:14px -apple-system,sans-serif;color:#6b7280;text-align:center">' +
      '<div>No design yet.<br>This screen was born in the spec — see its design-request thread.</div></body>';
  }
  $('app').src = s.app?.path && data.appBase ? data.appBase + s.app.path : 'about:blank';
}

function pinsForScreen(id) {
  return data.threads.filter(t => t.anchor?.screen === id &&
      !['incorporated', 'verified', 'waived'].includes(t.status))
    .map(t => ({ id: t.id, kind: t.kind, status: t.status, element: t.anchor?.element,
      position: t.anchor?.position, surface: t.anchor?.surface, viewport: t.anchor?.viewport,
      body: t.body, replies: t.replies ?? [] }));
}

function pushContext() {
  for (const [fid, surface] of [['proto', 'prototype'], ['app', 'app']]) {
    $(fid).contentWindow?.postMessage(
      { type: 'walkdown:context', screen, surface, pinMode, viewport,
        pins: screen ? pinsForScreen(screen) : [] }, '*');
  }
}
$('proto').addEventListener('load', pushContext);
$('app').addEventListener('load', pushContext);

window.addEventListener('message', async (e) => {
  const msg = e.data;
  if (!msg || typeof msg !== 'object') return;
  if (msg.type === 'walkdown:ready') pushContext();
  // A surface can leave pin mode too (Escape). The viewer owns the flag, so it
  // updates the button and re-broadcasts — otherwise the other surface would
  // still think pinning is on.
  if (msg.type === 'walkdown:pin-mode' && msg.on === false && pinMode) {
    pinMode = false;
    $('pinbtn').classList.remove('btn-warning');
    pushContext();
  }
  if (msg.type === 'walkdown:open-thread') {
    const t = data.threads.find(x => x.id === msg.id);
    if (t?.anchor?.rule) {
      const row = data.rows.find(r => r.rule === t.anchor.rule);
      if (row) { selected = row; renderRules(); renderDetail(); }
    }
    openThread(msg.id);
  }
  if (msg.type === 'walkdown:new-pin') {
    const res = await fetch(withBp('/api/threads'), { method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ kind: msg.kind, body: msg.body, author: $('actor').value || undefined,
        anchor: { ...(msg.element && { element: msg.element }), ...(msg.position && { position: msg.position }),
          ...(msg.surface && { surface: msg.surface }), ...(msg.viewport && { viewport: msg.viewport }),
          screen, ...(selected && { rule: selected.rule }) } }) });
    const out = await res.json();
    if (session && selected && session.verdicts[selected.rule] === 'fail' && out.id)
      (session.pinned[selected.rule] ??= []).push(out.id);
    await load();
  }
});

$('pinbtn').onclick = () => { pinMode = !pinMode; $('pinbtn').classList.toggle('btn-warning', pinMode); pushContext(); };

// --- stage modes: prototype | split | app -------------------------------------
function setMode(m) {
  document.body.dataset.mode = m;
  localStorage.setItem('walkdown-mode', m);
  for (const b of $('modeseg').querySelectorAll('button')) b.classList.toggle('btn-active', b.dataset.m === m);
  applyZoom();   // the panes changed size; the surfaces must refit
}
$('modeseg').querySelectorAll('button').forEach(b => { b.onclick = () => setMode(b.dataset.m); });
setMode(localStorage.getItem('walkdown-mode') ?? 'split');
if (localStorage.getItem('walkdown-rail-closed')) document.body.classList.add('rail-closed');

/** Jump to the next rule that still owes a verdict this session. */
function advanceToNextUnjudged() {
  const next = data.rows.find(x => needsYourVerdict(x.rule) && !session?.verdicts[x.rule]);
  if (!next) return false;
  selected = next;
  document.body.classList.remove('drawer-closed');
  gotoScreen(next.flow?.at(-1) ?? next.screens[0] ?? screen);
  renderRules(); renderDetail();
  return true;
}

$('wdbtn').onclick = async () => {
  if (!session) {
    const actor = $('actor').value.trim();
    if (!actor) return alert('Enter your name first — walkdowns are attributed.');
    session = { actor, verdicts: {}, pinned: {} };
    $('wdbtn').textContent = 'Finish walkdown';
    // Land on the first rule that needs judging, drawer open, so the session
    // visibly starts instead of only relabelling a button.
    renderRules();
    if (!advanceToNextUnjudged()) { renderDetail(); alert('Nothing is waiting on your verdict.'); }
    return;
  }
  const results = Object.entries(session.verdicts).map(([rule, status]) =>
    ({ rule, status, ...(session.pinned[rule]?.length && { threads: session.pinned[rule] }) }));
  if (!results.length) { session = null; $('wdbtn').textContent = 'Start walkdown'; renderRules(); renderDetail(); return; }
  const res = await (await fetch(withBp('/api/walkdowns'), { method: 'POST',
    headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ actor: session.actor, target: 'local', results }) })).json();
  alert(res.run_id ? `Recorded ${results.length} verdict(s) as ${res.run_id}` : `Error: ${res.error}`);
  session = null; $('wdbtn').textContent = 'Start walkdown';
  await load();
};

$('actor').value = localStorage.getItem('walkdown-actor') ?? '';
$('actor').addEventListener('change', () => localStorage.setItem('walkdown-actor', $('actor').value));

// --- drawer resize ------------------------------------------------------------
const DRAWER_MIN = 90, DRAWER_MAX_FRAC = 0.75;
let drawerH = Number(localStorage.getItem('walkdown-drawer-h')) || 190;
function setDrawerHeight(px) {
  drawerH = Math.max(DRAWER_MIN, Math.min(px, window.innerHeight * DRAWER_MAX_FRAC));
  $('detail').style.height = `${drawerH}px`;
  localStorage.setItem('walkdown-drawer-h', String(Math.round(drawerH)));
  applyZoom();   // the surfaces just gained or lost height
}
setDrawerHeight(drawerH);
$('dresize').addEventListener('pointerdown', (e) => {
  e.preventDefault();
  const startY = e.clientY, startH = drawerH;
  const onMove = (ev) => setDrawerHeight(startH + (startY - ev.clientY));
  const onUp = () => { removeEventListener('pointermove', onMove); removeEventListener('pointerup', onUp); };
  addEventListener('pointermove', onMove);
  addEventListener('pointerup', onUp);
});

setViewport(localStorage.getItem('walkdown-viewport') ?? 'desktop');

load().then(() => {
  // The machine already knows who you are (git, then the OS); an edit wins.
  if (!$('actor').value && data.identity?.actor) $('actor').value = data.identity.actor;
  if (data.storyboard[0]) gotoScreen(data.storyboard[0].id);
  applyZoom();
});
</script>
</body>
</html>
