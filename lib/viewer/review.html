<!doctype html>
<!--
  walkdown's own page, served by `walkdown serve` at /.

  The application under review lives in a frame inside it, which is the whole
  point: a frame is a viewport of its own, so the app's modals, overlays and
  sticky chrome lay out against the sheet rather than against the whole window,
  and nothing it draws can paint over the tool or make it inert.

  It is the same page the extension opens (extension/review.html) with the same
  panel inside it - the difference is only who supplies the answers. There the
  bootstrap has chrome.* to hand; here the server has already baked in which
  page to open, and everything else comes off the origin this page was served
  from. Neither is a fork: both load the one panel.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>walkdown</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Painted before the stylesheet lands so the page never flashes white - on
     <html>, because that is where the panel draws the drafting grid once the
     tokens resolve, and a background on <body> would cover it. */
  html { background: #10161f; }
  body { background: transparent; }
  .say { margin: 0; padding: 2rem; color: #9aa7b8;
         font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<script>
  /*
   * Which page to review. The fragment wins when it names one - that is how
   * you point walkdown at something the storyboard has never heard of, the
   * same gesture the extension uses - and otherwise the blueprint's front
   * door, which the server resolved on the way out.
   */
  const baked = (v) => (v.startsWith('__') ? '' : v);
  const asked = decodeURIComponent(location.hash.slice(1));
  const target = asked || baked('__FRONT_DOOR__');
  /*
   * Which blueprint. A server started on a folder is already an answer, so the
   * page it serves does not ask again - that gate is for the extension, which
   * arrives at a page knowing nothing. `?bp=` still overrides, and the panel's
   * Blueprints tab still switches.
   */
  const bp = new URLSearchParams(location.search).get('bp') ?? baked('__BLUEPRINT__');

  if (!target) {
    document.body.innerHTML = '<p class="say">walkdown: no page to review. This blueprint’s ' +
      'storyboard names no screen with an address — give one in the fragment ' +
      '(<code>/#http://localhost:3000/</code>) to review a page anyway.</p>';
  } else {
    const url = new URL(target, location.href).href;
    window.__walkdownConfig = {
      server: location.origin,
      ...(bp ? { bp } : {}),
      // What makes this the framed delivery rather than the docked one.
      frame: { url },
    };
    document.title = `walkdown — ${new URL(url).host}`;
    const s = document.createElement('script');
    s.src = '/panel.js';
    document.body.appendChild(s);
  }
</script>
</body>
</html>
