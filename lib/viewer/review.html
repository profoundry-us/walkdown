<!doctype html>
<!--
  walkdown's own page, served by `walkdown serve` at /.

  The application under review lives in a frame inside it, which is the whole
  point: a frame is a viewport of its own, so the app's modals, overlays and
  sticky chrome lay out against the sheet rather than against the whole window,
  and nothing it draws can paint over the tool or make it inert.

  It is the same page the extension opens (extension/review.html) with the same
  panel inside it - the difference is only who supplies the answers. There the
  bootstrap has chrome.* to hand; here the server has already baked in which
  page to open, and everything else comes off the origin this page was served
  from. Neither is a fork: both load the one panel.js.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>walkdown</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  /* Painted before the stylesheet lands so the page never flashes white - on
     <html>, because that is where the panel draws the drafting grid once the
     tokens resolve, and a background on <body> would cover it. */
  html { background: #10161f; }
  body { background: transparent; }
  .say { margin: 0; padding: 2rem; color: #9aa7b8;
         font: 14px/1.6 ui-sans-serif, system-ui, sans-serif; }
</style>
</head>
<body>
<script>
  /*
   * Which page to review: whatever the fragment names, and nothing else.
   *
   * This page used to be baked with the blueprint's front door and the key of
   * the blueprint the server started in, so opening the server's own root
   * framed one project's front page and opened its board over it - a server
   * that serves every project this machine has imported (ADR 0001 §3) cannot
   * have a front door of its own. With no fragment there is no page to route
   * from, which is the modal's own case: the panel asks which project.
   *
   * `?bp=` still overrides, because naming one is a decision already made.
   */
  const asked = decodeURIComponent(location.hash.slice(1));
  const bp = new URLSearchParams(location.search).get('bp') ?? '';

  window.__walkdownConfig = {
    server: location.origin,
    ...(bp ? { bp } : {}),
    // What makes this the framed delivery rather than the docked one. Without
    // a page to frame it is the docked one, over walkdown's own root.
    ...(asked ? { frame: { url: new URL(asked, location.href).href } } : {}),
  };
  document.title = asked ? `walkdown \u2014 ${new URL(asked, location.href).host}` : 'walkdown';
  const s = document.createElement('script');
  s.src = '/panel.js';
  document.body.appendChild(s);
</script>
</body>
</html>
