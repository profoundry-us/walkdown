# walkdown's blueprints, committed.
#
# This is the SHARED half: which blueprints this project has, and where they
# sit relative to the repository. It travels with the clone, so a checkout
# needs nothing else to be a working project — no adopt step, no registration.
#
# The personal half lives at ~/.walkdown/config.yml and wins wherever the two
# speak about the same thing: where evidence goes on this disk, which ports
# are yours, and who is sitting here. Identity is only ever read from there —
# a committed file naming a person would be wrong on every machine but one.
#
# Paths are relative to this repository, deliberately: this file is read on
# machines whose layouts have nothing in common. walkdown's own home is laid
# out like anybody's - blueprint/ threads/ runs/ evidence/ drafts/ under a
# numbered directory - and .walkdown/.gitignore says which of those git gets.
projects:
  - id: walkdown
    roots: [.]
    spec: .walkdown/blueprints/0001-walkdown/blueprint
    threads: .walkdown/blueprints/0001-walkdown/threads
    runs: .walkdown/blueprints/0001-walkdown/runs
    evidence: .walkdown/blueprints/0001-walkdown/evidence
    drafts: .walkdown/blueprints/0001-walkdown/drafts
    home: 0001-walkdown

  # The example project that ships in example/ is NOT listed here. It carries
  # a .walkdown of its own, so it is a project of its own - stand in example/
  # and it answers - and a declaration reaching into another .walkdown is the
  # crossing locations.answer.one-walkdown-answers forbids (n-0159). The
  # checks suite, which needs two projects on one server, declares both copies
  # in its own checkspace config.
