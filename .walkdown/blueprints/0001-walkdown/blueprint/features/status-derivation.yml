feature: status-derivation
title: Verification status is derived, never stored
source:
  prd: docs/05-runs-ledger.md
stories:
  - id: status.derived
    title: Status is a query over the append-only runs ledger
    statement: As a team, we read verification state that is always derived from run history, never a field someone forgot to update.
    rules:
      - id: status.derived.latest-wins
        origin: prd
        statement: A rule's status for a target is the result of its latest run against that target. A newer run replaces an older one, and a run against one target never changes the status of another.
        verify: [checks]
        steps:
          given:
            - A ledger holding two runs on one rule at one target, and a third on another target
          when:
            - Status is derived
          then:
            - The later run is the rule's status at that target; the earlier one is history, never a second opinion
            - Later is decided by the time the run recorded, not by file order or the order they were read
            - A verdict on one target says nothing about another - each target carries its own latest
            - A run carrying verdicts but no date fills no cell at all, because nothing can order it
          statement_hash: sha256:321c83ca466e
          reworded:
            - hash: sha256:fa42dccb0338
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:86b6383b8db6
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: status.derived.stale-never-passes
        origin: prd
        statement: A pass recorded against older wording of a rule reads as stale, unless a person declared the rewording as words only, with the meaning unchanged.
        verify: [checks]
        steps:
          given:
            - A pass recorded against a statement or steps that have since changed
          when:
            - Status is derived
          then:
            - The cell reads stale rather than passing - the words that were judged are not the words on the page
            - A step changing stales it the same as the statement changing - the steps are what was driven
            - Stale is never counted as verified anywhere the report adds up
            - A fresh verdict against the current wording clears it
            - "The old run is untouched: it still says what it said, about the wording it said it about"
            - A rewording declared as such (`walkdown hash --write --reword "<why>"`) keeps the old hash on the rule with when and why, and a pass against it stays a pass - better English is not a new rule
            - A hash from before the steps were part of it still matches while the statement holds, so the change itself stales nothing
          statement_hash: sha256:b686591f5ca6
          reworded:
            - hash: sha256:9b16ab78cd04
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:56103ee8cbd4
              at: 2026-09-14T02:50:03Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: status.derived.verdict-belongs-to-a-place
        origin: thread:q-0070
        statement: A verdict counts only at the address it was made against. Point a target somewhere new and its evidence empties; point it back and the evidence returns.
        because: Aiming a target at a new system should empty its evidence and ask for the walkdown again, rather than inherit a pass earned somewhere that no longer exists.
        verify: [checks]
        steps:
          given:
            - A ledger holding passes recorded against the address https://pr-1.review.app
          when:
            - The target is pointed at https://pr-2.review.app instead
          then:
            - Every rule verified only at the old address reads as never verified, not as passing
            - No run file is edited or deleted - the ledger stays append-only
            - Pointing the target back restores the earlier evidence unchanged
          statement_hash: sha256:0480062a68a2
          reworded:
            - hash: sha256:da085af63ed8
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:63d6c64e3b91
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:3583e19f4d9a
              at: 2026-09-14T02:50:03Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: status.derived.addressless-runs-count
        origin: thread:q-0070
        statement: A run that recorded no `base_url` still counts in the status as one of this system's runs.
        because: A run with no `base_url` cannot be shown to belong to any other system, so it is counted as this one's, just as a result with no `statement_hash` already is.
        verify: [checks]
        steps:
          given:
            - A run record carrying no address, such as a unit-test runner's
          when:
            - Status is derived for a target that has an address configured
          then:
            - That run still fills its cells rather than being discarded
          statement_hash: sha256:4a35f16299d7
          reworded:
            - hash: sha256:f14146c27ed9
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:14004462b9bd
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:1b70ce2039de
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:22d2d7ff7f6b
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"

      - id: status.derived.unbacked-pass-goes-stale
        origin: thread:q-0070
        statement: A pass earned by a check stands only while some check in the suite still claims the rule. Once no check references it, whether the check was deleted, renamed or untagged, status shows the rule as stale, not as passing.
        because: An append-only ledger otherwise keeps reporting green long after anything tests it - including for a check untagged because it never exercised the rule it claimed.
        verify: [checks]
        steps:
          given:
            - A ledger holding a checks pass for a rule
          when:
            - The check suite no longer references that rule id
          then:
            - The cell reads stale, not passing
            - Matching is by rule id, so a check moving down its file changes nothing
            - A caller that supplies no inventory of checks sees the older behaviour, since silence is not proof the suite is empty
          statement_hash: sha256:c3d9169bc7f4
          reworded:
            - hash: sha256:ed0482e00322
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:dc38db74790f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e515683d3948
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: status.derived.human-tier-distinct
        origin: prd
        statement: An agent's verdict is evidence, never acceptance. Only a person signing for a role can give that role's signature, and no number of passing checks or agent verdicts supplies it.
        verify: [checks]
        steps:
          given:
            - A rule whose checks and agent tiers both pass, with no signature from any role
          when:
            - Status is derived
          then:
            - The rule's verdict is still pending - evidence is not acceptance
            - Every role in the sign-off list reads as not yet signed, however green the tiers are
            - An agent's run never fills a role's signature, whoever it was recorded under
          statement_hash: sha256:511948134e22
          reworded:
            - hash: sha256:88708d3d86fa
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:06dfc2348400
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

  - id: status.evidence
    title: Every tier is assumed, and skipping one is a written decision
    statement: As a team, we get the cheapest honest evidence on every rule by default, and when a rule cannot have it we get a sentence saying why instead of a silence.
    rules:
      - id: status.evidence.agent-assumed
        origin: walkdown
        statement: The agent tier is assumed on every rule rather than declared - a rule is judged by the agent unless it carries an excuse saying why it cannot be.
        because: A tier that must be authored is opt-in; a tier that costs only a run is an obligation. Skipping it should be a decision written down, not a line forgotten.
        verify: [checks]
        steps:
          given:
            - A rule declaring nothing at all about verification
          when:
            - Its evidence tiers are derived
          then:
            - The agent tier is required of it
            - The checks tier is not, because a check must be authored
            - An excuse filed against the agent tier removes it, and nothing else does
          statement_hash: sha256:3d15d8bae388
          reworded:
            - hash: sha256:21038677e83f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:3e43f70d538d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
      - id: status.evidence.excuse-says-why
        origin: walkdown
        statement: An excused tier shows its reason where its verdict would have been, in every report. That cell is never empty.
        because: A tier nobody asked for and a tier somebody decided against look identical otherwise, and only one of them is a decision anyone can argue with.
        verify: [checks]
        steps:
          given:
            - A rule excusing a tier, with a reason
          when:
            - The rule is read from the CLI or opened in the panel
          then:
            - The reason stands in the row that tier's evidence would have filled
            - It is legible as a decision, not as an absence
          statement_hash: sha256:64dd303baabc
          reworded:
            - hash: sha256:6023a6db07cd
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:84676ca40c48
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:07a43a9f9cbc
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: status.evidence.excuse-must-argue
        origin: walkdown
        statement: Lint refuses an excuse that does not argue its case. It warns when the reason is shorter than a sentence, when the excuse is filed against something that is not a tier, and when one rule excuses both tiers at once.
        because: A one-word excuse tells nobody why a rule was set aside, and excusing both tiers at once is a real choice that should be argued, not an accident nobody noticed.
        verify: [checks]
        steps:
          given:
            - Three rules excusing a tier - one with a shrug for a reason, one filed against a word that is not a tier, one excusing both tiers
          when:
            - The blueprint is linted
          then:
            - "A reason shorter than a sentence is named as thin: an excuse nobody can argue with is not an excuse"
            - An excuse filed against something that is not a tier is an error - it removes nothing while reading as though it did
            - A rule excusing both tiers is flagged though it may be right, because then nothing verifies it but a signature and that must be a decision somebody made
          statement_hash: sha256:d7a9cd1761c3
          reworded:
            - hash: sha256:d4310da96c28
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:09d778ea6920
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:aa78063f8a54
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

  - id: status.acceptance
    title: Acceptance is a set of people, not a kind of evidence
    statement: As a team, we can see which roles have accepted a rule and which have not, so "somebody should look at this" becomes "product should look at this".
    rules:
      - id: status.acceptance.signoff-defaults-to-eng
        origin: walkdown
        statement: A rule's sign-off list defaults to engineering and always contains it; a list that omits eng is corrected in the report and flagged by lint.
        because: Somebody has to own that the implementation matches the rule; a rule nobody accepts is a rule nobody owns.
        verify: [checks]
        steps:
          given:
            - A rule with no signoff line, and a rule whose signoff names only product
          when:
            - Status is derived, and the blueprint is linted
          then:
            - Both rules require an engineering signature - the derived list always contains eng
            - "The file that omits eng is flagged: it describes a rule that does not exist"
            - An empty list is flagged too, because omitting the field already means [eng]
            - The report is never silently repaired and forgotten - the reader of the file is the one being misled
          statement_hash: sha256:8dd40d6249dc
          reworded:
            - hash: sha256:34a8a5bebfd8
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:1e52a4780f20
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
      - id: status.acceptance.role-comes-from-the-run
        origin: walkdown
        statement: A run counts toward acceptance for the roles it was recorded under, not for whatever roles its signer holds today. A run recorded before roles existed counts as engineering's.
        because: People change teams and a signature does not stop meaning what it meant.
        history: Before roles were recorded, the person signing a walkdown was the developer who built it.
        verify: [checks]
        steps:
          given:
            - A ledger holding a walkdown recorded under one role and another recorded before roles existed
          when:
            - Acceptance is derived
          then:
            - The first counts only for the role it named
            - The second counts for engineering
            - Changing the signer's roles today moves neither
          statement_hash: sha256:e64863cf2fd8
          reworded:
            - hash: sha256:4841808f1a8b
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:71c38cd6f904
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:09cfad7a68aa
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: status.acceptance.approval-covers-only-the-unbuilt
        origin: walkdown
        statement: While a rule is unbuilt, a role's approval of its wording clears the rule from that role's queue. Once the ledger holds a build to judge, that approval no longer clears it.
        because: Approving a spec is not judging a build.
        verify: [checks]
        steps:
          given:
            - A rule with no build verdict in the ledger, approved by a role
          when:
            - A build verdict is recorded, and status derived again
          then:
            - While it is unbuilt the approval discharges that role's queue - the wording is agreed and nobody is waiting
            - "The rule still reads as unbuilt: approving a spec is not evidence that anything was built"
            - The moment the ledger holds a build to judge, the approval stops covering it and the role is queued again
            - Rewording the statement makes an approval stale, like any other verdict
          statement_hash: sha256:7578ef132c6b
          reworded:
            - hash: sha256:178e50e23abc
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:917ace17580a
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:124da2946d36
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: status.acceptance.sent-back-is-a-fail
        origin: walkdown
        statement: When a signer sends a rule back, its verdict reads as a fail, not as pending. The rule returns to that signer's queue only once a fix is claimed and the agent tier has judged it.
        history: Two rules sent back on 2026-09-08 were fixed and re-judged the same day and then waited six days, because nothing asked the signer to look again (n-0239, n-0240).
        because: What the rule owes them is a fix, not another look.
        verify: [checks]
        steps:
          given:
            - A rule a signer looked at and sent back
          when:
            - Status is derived
          then:
            - The rule's verdict is fail rather than pending - somebody looked and said not yet
            - "It is not queued back to the signer while nothing has changed: what it owes them is a fix, not another look"
            - Once a thread on the rule is addressed after the send-back and the agent tier has passed the fix, the signer is asked to look again, and the item names the thread that claimed the fix
            - Their fresh verdict is what clears it
          statement_hash: sha256:1aef4eaeadde
          reworded:
            - hash: sha256:e4eefb4e58a4
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:5219b52da8b6
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:2796865a828b
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: status.acceptance.verdict-needs-every-role
        origin: walkdown
        statement: A rule passes only when every kind of evidence it asks for has a current pass and every role it names has signed. One role's signature never counts for another, and the human walkdown is those signatures, not a second kind of evidence on top.
        verify: [checks]
        steps:
          given:
            - A rule naming two roles, with every evidence tier passing
          when:
            - Only one of the two has signed
          then:
            - The verdict is pending, not pass
            - It turns pass when the second signs, and nothing else supplies that signature
          statement_hash: sha256:fb010aa75b4e
          reworded:
            - hash: sha256:1a9be6432a5b
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:8cc573479687
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:50cdccf6a1cd
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"
      - id: status.acceptance.roles-recorded-on-the-run
        origin: walkdown
        statement: A recorded walkdown carries the roles its signer was acting in. A role the project does not recognise is refused rather than recorded, and an empty list is recorded as no roles stated.
        because: A role the project does not recognise looks like a real signature but counts for nothing, and a signer who stated no roles must not be recorded as having stated some.
        verify: [checks]
        steps:
          given:
            - A walkdown being recorded by somebody signing in a role
          when:
            - The run is written
          then:
            - The run carries the roles, not the signer's current profile
            - A role the vocabulary does not know is refused
            - An empty list is recorded as stated, not dropped
          statement_hash: sha256:1d24bfe00266
          reworded:
            - hash: sha256:e0e862978414
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:03dad36cc0d8
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:fd42a02dc9d6
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: status.acceptance.signature-names-its-signer
        origin: thread:q-0225
        created_at: 2026-09-07
        statement: A recorded walkdown carries one signature per role, naming the person who accepted in that role. Who typed it is the run's actor, and the two can be different people.
        because: A signature whose signer is not the actor is itself the record that somebody accepted through somebody else; nothing further needs writing down.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - One person driving a walkdown who signs engineering for themselves and product for somebody sitting beside them
          when:
            - The run is recorded, and acceptance derived from it
          then:
            - The record carries a signature for each role, naming the person who accepted in it
            - Product's acceptance counts for the person who gave it, never for the person who typed it
            - The driver stays the run's actor, so who typed it is on the record without a field of its own
            - A run whose signers are all the actor is exactly the ordinary case, and reads as one
            - A record written before signatures existed is read as its actor signing each role it named
          statement_hash: sha256:8ceb93202dcc
          reworded:
            - hash: sha256:d1c11a7e70ed
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:8abea3348e9f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:1787bf174b1f
              at: 2026-09-14T02:53:55Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: status.sweep
    title: Asking for the whole thing to be judged again
    statement: >
      As a reviewer, after something large has changed I can ask for every verdict to be earned again, and see which rules I have not got to yet.
    rules:
      - id: status.sweep.declares-a-floor
        origin: walkdown
        statement: A sweep is a dated marker in the ledger saying that, from here, the tiers it names must earn their verdicts again. Every verdict recorded before it reads as stale, and the runs it supersedes are neither edited nor deleted.
        because: A rule nobody has got back to should be legible as unfinished rather than as passing.
        verify: [checks]
        steps:
          given:
            - A ledger where every rule's agent tier passes, from runs recorded last week
          when:
            - A sweep is declared over the agent tier
          then:
            - Every one of those passes now reads stale, not passing and not never
            - A rule judged again after the sweep reads pass once more
            - The superseded run files are untouched - the ledger stays append-only
            - Tiers the sweep does not name are unaffected
          statement_hash: sha256:09aee8e39b46
          reworded:
            - hash: sha256:b0073c10a38b
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:dcee39004281
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:73aa31336327
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: status.sweep.deliberate
        origin: walkdown
        statement: A sweep is never a side effect. It is written only when somebody asks for one outright and says why.
        because: It puts work back on the queue for every rule at once; that is a decision, not a consequence of running the suite.
        verify: [checks]
        steps:
          given:
            - A project with a sweep command available
          when:
            - Checks are run, a walkdown is recorded, or the blueprint is edited
          then:
            - No sweep is written by any of them
            - Declaring one requires the command, and the command requires a reason
            - The reason is kept with the marker, so a later reader knows what prompted it
          statement_hash: sha256:bd83ebeb2a0e
          reworded:
            - hash: sha256:5b9d65fba614
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:06bb801f2628
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:4c116babf3f5
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: status.sweep.says-what-is-left
        origin: walkdown
        statement: While a sweep is open, the status report says how much of it is done. For each tier the sweep names, it counts the rules judged since the sweep was declared and the rules not yet judged.
        because: The question "did we miss any?" should be answered by reading, never by remembering.
        verify: [checks]
        steps:
          given:
            - An open sweep over the agent tier, partly worked
          when:
            - Status is read
          then:
            - The report names the sweep, when it was declared and why
            - It gives the count judged since, and the count still owed
            - The owed rules are listed as work, not merely counted
          statement_hash: sha256:8f76421439bf
          reworded:
            - hash: sha256:108b3015acc9
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:b4f0bf714cb6
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:a1fbe9c81190
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

  - id: status.attention
    title: The board says who is blocking what
    statement: As a team, we each see the queue of items waiting on us specifically.
    rules:
      - id: status.attention.blocked-queues
        origin: prd
        statement: Every item in the status report's attention list is for an agent or a person. Agents are asked to address notes, incorporate answers, cover unchecked rules and re-judge claimed fixes; people to judge in an unsigned role, verify their own notes and answer questions.
        because: Cover - a rule that demands checks while no check claims it - is an agent's work to write and never a person's to judge.
        verify: [checks]
        steps:
          given:
            - A board holding rules owed signatures, open threads, and a rule demanding checks that no check claims
          when:
            - Attention is derived
          then:
            - "An agent is asked to address an open note, to incorporate an answered question into its rule, to cover a rule that demands checks while no check claims it, and to re-judge a rule whose fix was claimed after its last pass"
            - "A person is asked to judge a built rule once for each role that has not signed it, to verify the addressed notes on a rule the walk can reach - one item per rule, naming the threads, whatever their reason but observation - and to answer an open question, one item per rule where the question is on one the walk can reach"
            - An addressed observation on a walkable rule is the agent's to settle, never a person's to verify - it noticed it itself and closes it itself
            - A thread on no rule, or on a retired one, is its own item, and only a person's feedback or request makes a verify item there - a finding or an observation on a retired rule waits on nobody
            - "A cover item is a rule demanding checks while no check claims it: an agent writes the check, and it is never a person's to judge"
            - Every item names who is blocked, so nothing sits in both queues at once
            - A rule holding an answered question is the agent's to fold in and is queued to no person - not to judge, not to verify - until the question is incorporated
