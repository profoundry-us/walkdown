  - id: status.attribution
    title: A record says whose judgment it was, and keeps saying so
    statement: As a team, we can always tell whose judgment a verdict was - including verdicts recorded before we changed our minds about what a name is.
    rules:
      - id: status.attribution.username-is-the-record
        origin: thread:n-0104
        statement: Every record is written under the username of the person who made it, never under their display name. When one person has written under more than one username, all of those usernames are read as that one person.
        because: Records made before the username and the display name were separate things keep their attribution without being rewritten.
        verify: [checks]
        steps:
          given:
            - A machine whose personal config, or failing that git, knows a username and, perhaps, a full name
          when:
            - A verdict, a reply or a transition is recorded, and older records are read back beside it
          then:
            - What is written down is the username; the full name is shown and never stored
            - The identity offered names every handle that machine has signed with - the username, the operating system name, and the full name
            - A record already written under a full name is still attributed to that person, and is never edited to match the newer shape
