feature: locations
title: Where a project's pieces live, and why
source:
  prd: docs/08-locations.md
stories:
  - id: locations.default
    title: Adopting walkdown costs the repository nothing
    statement: As a person trying walkdown on a repository I did not start, I can run it without adding anything to the tree, and stop by deleting one directory nobody else can see.
    rules:
      - id: locations.default.nothing-in-the-tree
        origin: prd
        statement: With nothing configured, walkdown writes no `.walkdown/` directory into the repository, and no pointer to one either. The spec, threads, runs, evidence and drafts live in the person's own `~/.walkdown/blueprints/`.
        because: Trying the tool should commit a project to nothing, and abandoning it should mean deleting one directory.
        history: "A `.walkdown/` beside the code was tried and reversed: however well ignored, it was still a thing git had to be told about, and the pointer it needed carried a home-directory path into shared history."
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository that has never seen walkdown, and no personal config
          when:
            - walkdown is initialised and a run, a thread and a draft are recorded
          then:
            - The tree is byte for byte as it was - no `.walkdown/`, no pointer, nothing for git to see
            - Everything walkdown made sits in one numbered home under `~/.walkdown/blueprints/`
            - Deleting that one directory removes everything walkdown made
            - Asked what is tracked, walkdown answers nothing, and says why
          statement_hash: sha256:a2ac0f932c99
          reworded:
            - hash: sha256:7a82184b4b5d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:59933a1c240f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:7795aa37a650
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: locations.default.records-follow-the-spec
        origin: prd
        statement: A home holds the spec and its four kinds of record as siblings - `blueprint/`, `threads/`, `runs/`, `evidence/`, `drafts/` - in one layout wherever the home sits. Which siblings git sees is the commit standard's business, not the layout's.
        because: A home moves as one directory, and nothing inside it needs rewriting when it does.
        verify: [checks]
        steps:
          given:
            - A blueprint in its home, wherever the home sits
          when:
            - Its location is asked for
          then:
            - The spec and the four records resolve as siblings in one home
            - No kind of record sits inside another
            - Moving the home moves all five together and edits none of them
          statement_hash: sha256:bc12ec38993e
          reworded:
            - hash: sha256:3272ecc28575
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:e937f53b5102
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: locations.default.in-repo-on-request
        origin: prd
        statement: A project's walkdown files stay out of version control unless asked; asking is one flag for the spec and its threads, another for everything, and what was chosen is visible in the files themselves rather than recorded in a setting.
        because: The tree is the only place the answer cannot drift from the truth, and the command reports what git actually holds rather than what walkdown meant to arrange.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project, fresh or already set up
          when:
            - The person asks for the spec to be committed, for everything to be, or for nothing to be again
          then:
            - The home sits under the repository's `.walkdown/`, laid out as every home is, and the pointer names it by a relative path
            - With the spec committed, a `.gitignore` beside the home keeps runs, evidence and drafts out - and that file, and the config, are themselves committable
            - With everything committed there is no `.gitignore` there at all
            - Asked again with a different standard, the tree changes to say so - the file is written or removed, or the home moves whole with no record edited
            - The command reports what is tracked now, in words, and how to change its mind later
            - What is tracked is asked of git, not read off the ignore file walkdown wrote - a root .gitignore hiding .walkdown, a rule that does not reach a blueprint standing elsewhere, an ignore file somebody emptied, and a home that left with its files still in the index are each said outright, and lint errors wherever the tree's promise and git's answer disagree (n-0179, n-0180, n-0181)
          statement_hash: sha256:7310851da84e
          reworded:
            - hash: sha256:3be1e35e0956
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:eb28707b6f77
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:bca2161d6157
              at: 2026-09-14T02:20:43Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: locations.default.skills-are-yours-by-default
        origin: prd
        statement: The agent procedures walkdown ships install into your own skills directory and never into a repository unless a team asks for it.
        because: In the personal directory they work in every project on the machine; a committed skill is a copy of walkdown's own source that walkdown cannot keep right afterwards.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project being set up, and a machine with a personal skills directory
          when:
            - The skills are installed, either by init or on their own
          then:
            - They land in the person's own directory and the tree gains nothing, whether or not the spec is committed
            - Setting up does not put a copy in the repository, and leaving does not take one away - a copy there is one somebody asked for
            - Installing them on their own asks where they should go rather than picking, and writes nothing to a place nobody named
            - A skill that depends on a harness only walkdown's own repository has is not among them
            - A copy the person has edited is kept and reported rather than overwritten
          statement_hash: sha256:a1c19031d710
          reworded:
            - hash: sha256:66bff6c2346e
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:2be84df9d5f8
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:ac83e3dcb35a
              at: 2026-09-14T02:20:43Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: locations.default.one-home-per-blueprint
        origin: thread:n-0124
        statement: Every blueprint has a numbered home of its own, and no path walkdown resolves is keyed by a name two projects could share.
        because: A name two projects can both have is not an address; a number allocated once is.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - Two blueprints in one `.walkdown`, and two repositories whose directories share a name
          when:
            - Each is asked about, then written to for the first time
          then:
            - Asking reports where records would go and writes nothing, not even the claim on that home
            - Each blueprint ends up with a numbered home of its own, and no two ever coincide
            - Nothing resolves through a name two projects could share, whichever door does the resolving - not the config merge, not a server's list, not a move
            - Two checkouts that share a name, one listed personally, stay two projects with two ledgers
            - A home that already holds a blueprint's records keeps answering for it
            - A home nothing claims is reported and left standing, never guessed at and never moved
          statement_hash: sha256:43e88185b989
          reworded:
            - hash: sha256:c2e4b20e7f0d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:90679f4f6194
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:195a0540e150
              at: 2026-09-14T02:20:43Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: locations.answer
    title: Anyone can ask where this project's pieces are
    statement: As someone standing in a repository, I can ask where every piece lives and why it was chosen there, and the asking never changes the answer.
    rules:
      - id: locations.answer.says-why
        origin: prd
        statement: "Every path walkdown reports says why it was chosen: named on the command line, found in this machine's registry (and how that entry got there), the home a registry entry names, or the built-in default."
        because: A person who disagrees with where something is needs to know which decision to argue with.
        verify: [checks]
        steps:
          given:
            - A project with some paths defaulted and some configured
          when:
            - walkdown is asked where things live
          then:
            - Each of the spec, runs, threads, evidence, drafts and code carries its reason
            - The reason names the rule that decided it, not merely that a decision was made
          statement_hash: sha256:50638c8edeb8
          reworded:
            - hash: sha256:fd21bba75c2e
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:26757965fbdd
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:cb01c6594b8f
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: locations.answer.asking-writes-nothing
        origin: prd
        statement: "Asking where something lives creates nothing: no directory, no config file, no placeholder."
        because: The command a confused person reaches for first must not itself change what they were confused about.
        verify: [checks]
        steps:
          given:
            - A project with no personal config at all
          when:
            - walkdown is asked where every kind of record lives
          then:
            - It answers in full, naming directories that do not exist yet
            - The disk is exactly as it was found, including the personal home
          statement_hash: sha256:7d27e6b8d5a3
          reworded:
            - hash: sha256:0ba6f381a575
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:47b87b883d14
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:bc8314186c2a
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: locations.answer.nearest-blueprint-wins
        retired: >-
          Answered by deleting the question (2026-09-01, q-0138). Walkdown no longer searches the tree for blueprints, so there is no tree answer to arbitrate against a configured one and no precedence left to state. The half of this that survived - a repository may hold several blueprints without them bleeding into each other - is now locations.answer.declared-not-discovered, which carries it without the contest.
        origin: prd
        statement: A blueprint found inside the working tree wins over a registered project rooted higher up the tree. A blueprint asked for by name is answered only by the registered project that owns it, or by none.
        because: A repository can hold several blueprints. A project registered at the whole tree would otherwise answer for its siblings and show one project's spec beside another project's ledger.
        verify: [checks]
        steps:
          given:
            - A repository holding two blueprints, and a config entry rooted at the whole repository
          when:
            - The location is resolved from inside the inner one
          then:
            - The inner blueprint answers, with its own runs and threads
            - The outer entry still answers where the tree offers no blueprint, which is what an out-of-tree spec is for
          statement_hash: sha256:8abbb2442baa

      - id: locations.answer.one-walkdown-answers
        origin: walkdown
        retired: >-
          Its statement is about which of two files answers, and there is one file now (ADR 0003, accepted 2026-09-11): a reader consults ~/.walkdown/registry.yml and nothing else, a committed .walkdown/config.yml is a manifest that only `walkdown import` reads, and no `.walkdown` is ever found by walking. Every mechanism this rule named - the nearest-and-stop walk, the merge with the personal file, the crossing guard on both files - was deleted at step 3 of that ADR, after n-0275 showed a symlink walking through the guard on the read side while the write side refused the same path. The half that survives - no inference, nothing merely lying nearby is a project - is locations.answer.declared-not-discovered; what replaces the boundary is locations.answer.registry-is-the-only-door.
        statement: The nearest `.walkdown` at or above you is the only one that answers for where you stand, merged with your personal `~/.walkdown` and nothing else. walkdown never guesses that a neighbouring checkout's blueprints are yours, but a blueprint you registered with `walkdown import` is reachable from anywhere.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository holding a `.walkdown` at its root and another inside a pack, and a personal `~/.walkdown`
          when:
            - A location is resolved from inside the pack, and again from the repository root
          then:
            - From the pack, the pack's own answers and the root's is not consulted at all
            - From the root, the root's answers and the pack's is invisible
            - Each is merged with the personal one, and with no second repository config however many lie above it
            - A server offers what the registry holds - the blueprints that `.walkdown` declares, plus the ones this machine imported - and nothing that was merely lying nearby, wherever the blueprint it serves happens to sit
            - A committed entry whose spec lies under another `.walkdown` is refused when written and reported by lint when found - that `.walkdown` already answers for it (q-0168)
            - One that is there anyway is not read either - where names it as refused and says which directory answers for it, and status and serve never see it - and an ephemeral entry may not name it from outside, because a copy means a copy and this is the original (q-0176)
            - The same row in the PERSONAL file is refused on the same terms - set aside on read, named on the report, reported by lint - because a tool that resolved it while refusing the byte-identical committed one would answer the same question two ways in one breath (n-0188)
            - A row may name a blueprint under its OWN `.walkdown` - the personal home, whose config that file is, or the one answering where you stand - so the way to a pack is to stand in its checkout, to list a real copy of it, or to import it by name
            - An IMPORTED row is the one way across, and it is not an exception to the rule but the point of it - `walkdown import` is somebody naming a directory and being shown what it declares, so nothing about it was inferred (ADR 0001 §3)
            - A `.walkdown` holding homes but no config declares nothing and answers for nothing, so a row naming a blueprint under it is that blueprint's only declaration and is read
          statement_hash: sha256:69f36d35a978

      - id: locations.answer.declared-not-discovered
        origin: thread:q-0138
        statement: walkdown answers only for blueprints somebody registered on this machine; it never goes looking for one.
        because: A repository may hold several blueprints without them bleeding into each other.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository holding two blueprints, each registered, and a third nobody registered
          when:
            - The location is resolved from inside each of them, and one is named outright
          then:
            - Each registered blueprint answers for itself, with its own runs and threads
            - The unregistered one is not a project at all, however much it looks like one from the outside - and where its checkout declares it, the answer names the manifest and says `walkdown import`
            - The registry is consulted, and the report says which row answered and how it arrived - a `blueprints:` list in the personal config.yml is set aside and named, however many keys it restates
          statement_hash: sha256:f1df66c74dac
          reworded:
            - hash: sha256:d6788490af67
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:251a2b83c9b6
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:715be4b0e9c9
              at: 2026-09-14T02:20:43Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: locations.answer.registry-is-the-only-door
        origin: thread:n-0275
        statement: walkdown reads only the registry. A `.walkdown` folder nobody registered, or a path nobody added, is not consulted.
        because: What a spelling can fool is the one moment a path is looked at, and that moment is the add.
        history: A symlink created outside a pack, pointing at the pack's home, was followed on the read side while the writer refused the same path - so a second board listed, served and wrote to the pack's ledger with nobody having imported anything (n-0275, ADR 0003).
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository with a registered home at its root and a pack inside it with its own, and a symlink outside the pack pointing at the pack's home
            - A row written by hand into the registry, with no `registered:`, naming the link
          when:
            - The location is asked for through the link's row, a thread is filed through it, and a server is started at the repository root
          then:
            - "`walkdown where` sets the row aside and says it was written by hand; `walkdown status` and `walkdown thread new` through it refuse, and nothing lands in the pack's ledger"
            - The server lists every registered blueprint and never the link's row
            - "`walkdown import` through the link registers the pack's home once, under its real path, and a second import says it is already listed"
            - Standing in the pack reaches the pack's row; standing at the root reaches the root's; nothing about the tree between them is consulted
          statement_hash: sha256:6e50a37dc531
          reworded:
            - hash: sha256:20130d966a11
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:40116907d7ab
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e40318fd68f9
              at: 2026-09-14T02:30:30Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: locations.keeping
    title: A ledger already written is never orphaned or edited
    statement: As a team with history in our blueprint, no preference of anyone's machine can make our records stop being found, and moving them stays something a person did on purpose.
    rules:
      - id: locations.keeping.existing-outranks-preference
        origin: prd
        retired: >-
          The rule was about records found INSIDE a blueprint - `blueprint/runs/`, the layout every project had before homes - outranking a blanket default. That layout is not read any more: every blueprint walkdown answers for is declared, lives in a home, and its entry names the records or the home they derive from, so there is no directory for the resolver to discover and nothing for a preference to give way to (2026-09-04, Topher's call to remove legacy support entirely). What survives of it is locations.keeping.moving-is-a-decision: relocating records is still something a person does, never something a default does to them.
        statement: A default location never overrides a directory that already holds a blueprint's records. The existing directory wins, and moving those records is a decision a person makes.
        because: An existing directory is a fact and a default is only a preference.
        verify: [checks]
        steps:
          given:
            - A blueprint whose runs directory already holds records
          when:
            - A personal config declares a different default for runs
          then:
            - The existing directory is still the answer, and the report says it is because the blueprint already holds it
            - No record is moved, copied or hidden by the resolution
          statement_hash: sha256:c5603d183d94

      - id: locations.keeping.moving-is-a-decision
        origin: prd
        statement: Moving records relocates the files unchanged, remembers the choice in the personal config beside the person's own comments, and refuses a destination that already holds records.
        because: The records are append-only, and dropping one set into a directory that already holds another would change both.
        verify: [checks]
        steps:
          given:
            - A blueprint whose runs live in the repository
          when:
            - They are moved somewhere else
          then:
            - Every file arrives byte for byte, and none is rewritten to suit its new address
            - The personal config records where they went, keeping whatever the person had already written in it
            - A destination that already holds records is refused rather than merged into
          statement_hash: sha256:f650bd21c46f
          reworded:
            - hash: sha256:452142df8095
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:797a6afe9cc9
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

  - id: locations.travel
    title: A record means the same thing on somebody else's machine
    statement: As a second person cloning this project, the verdicts I read were made against a spec I can identify and point at evidence I can actually open, without anyone having to have used my directory layout.
    rules:
      - id: locations.travel.evidence-by-key
        origin: prd
        statement: A run names the evidence it left by a logical key rather than a filesystem path, and the server resolves that key per machine.
        because: A screenshot filed on one laptop must still be findable from another, and no ledger entry should be pinned to the disk of whoever recorded it.
        verify: [checks]
        steps:
          given:
            - A run recorded while evidence lived in the repository
          when:
            - Evidence is moved out of the repository and the run is read again
          then:
            - The same key still resolves, and the picture still opens
            - No run file was edited to make that true
            - A key that climbs out of the evidence directory is refused
          statement_hash: sha256:9a1654d1a68d
          reworded:
            - hash: sha256:a7bc7cd07be3
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:4254ee8a1f3d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: locations.travel.judged-against-a-spec
        origin: prd
        statement: Every run records a content hash of the spec it was judged against, computed from the blueprint's own files, and recording a verdict never changes that hash.
        because: A verdict has to say what it was measured against even when the project has no repository. A run is the spec's output, not part of it, so recording one cannot change the hash.
        verify: [checks]
        steps:
          given:
            - A blueprint and a run recorded against it
          when:
            - A verdict, a thread and a draft are written, then a rule is reworded
          then:
            - The three writes leave the spec hash exactly where it was
            - The rewording moves it
            - The same words in a different feature file are a different spec
          statement_hash: sha256:20d85cac1943
          reworded:
            - hash: sha256:5014abd76d50
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:39d6a730c5d8
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: locations.travel.provenance-not-currency
        origin: prd
        statement: A run records which commit it saw so a person can look it up later. A newer commit never makes an older verdict stop counting.
        because: Provenance tells a person digging into a verdict where to look; an unrelated commit must not turn a board from green to grey.
        verify: [checks]
        steps:
          given:
            - A ledger of passing verdicts
          when:
            - Commits land that touch neither the rules nor the code they describe
          then:
            - Every cell reads exactly as it did before
            - The runs still carry the shas they were recorded with, for anyone who wants to look
          statement_hash: sha256:b1efe71a4d3b
          reworded:
            - hash: sha256:c513160f49fc
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:6e10186c5b9c
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:d5257f44d2df
              at: 2026-09-14T02:30:30Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: locations.pointer
    title: An agent arriving in the repository finds the spec
    statement: As an AI agent cloning this project, I find one paragraph telling me a spec exists and where it is - in the file this project actually keeps its conventions in, saying where the spec is now rather than where it used to be.
    rules:
      - id: locations.pointer.placed-where-agents-read
        origin: prd
        statement: Initialising a repository adds one paragraph, saying where the spec is, to the file that repository already keeps its agent instructions in. If several files could be that one, walkdown writes nothing and names them.
        because: A project keeping conventions in several files has made a choice walkdown cannot read, and guessing puts the sentence where nobody reads it.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository being initialised with its spec committed - an uncommitted one gets no pointer, since the pointer would be the one thing in the tree
          when:
            - It holds no agent-instruction file, or exactly one, or several
          then:
            - With no agent-instruction file, CLAUDE.md is created carrying the pointer
            - With exactly one, the pointer goes into that file, and no second file is made to compete with it
            - With more than one, nothing is written and the report names them all, for a person to settle by naming the one they want
          statement_hash: sha256:c74747fd201e
          reworded:
            - hash: sha256:e10f6a000d16
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
