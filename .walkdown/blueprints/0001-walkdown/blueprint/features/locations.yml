      - id: locations.pointer.owns-only-its-block
        origin: prd
        statement: "walkdown owns the fenced pointer block and nothing else in the file that holds it. It rewrites what lies between its own markers, leaves every other line as it was, and updates the block when the spec moves."
        because: A pointer still naming a directory the spec has left is worse than no pointer at all - an agent believes it and goes looking.
        verify: [checks]
        steps:
          given:
            - An agent-instruction file with a person's own words above and below a walkdown block
          when:
