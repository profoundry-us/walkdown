        verify: [checks]
        signoff: [eng, product]
        screens: [review, rule-detail]
        steps:
          given:
            - A walkdown session in the panel with at least one verdict
          when:
            - Finish it
          then:
            - A walkdown run record is appended with those verdicts and that actor
            - An unnamed or agent actor is refused before anything is written
            - Discarding instead of finishing writes nothing
            - Finishing says what was RECORDED, from the door's own answer - which roles landed and under whose names - because a field the door dropped is invisible in a count of verdicts (n-0226)
