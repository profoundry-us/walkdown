          when:
            - Open a rule the ledger holds no pass or fail for, then one it does
          then:
            - The first shows Approve and Refine, labelled as signing off the rule rather than judging a build
            - The second shows Pass and Fail
            - Approving a rule does not flip it to the Pass/Fail pair - only build evidence does
