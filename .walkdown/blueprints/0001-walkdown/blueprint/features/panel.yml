          then:
            - The roles it offers are already ticked as the config declares them, so the common answer is to agree
            - A role can be handed to somebody else by name, and that person is who the signature is recorded under
            - Who this sitting is being signed as stays legible while it runs, so accepting on somebody's behalf cannot be forgotten half way through
            - The next sitting starts from the config again - a role handed to somebody else is never the default a second time
            - Nothing the browser remembers decides who a record is written under
