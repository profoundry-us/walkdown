      - id: panel.walkdown.one-control-owns-the-sitting
        origin: walkdown
        statement: The same button in the bar starts a sitting and ends it. The control that carries on to the next rule sits beside the count of rules already judged.
        because: Starting and ending are two halves of one act.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel with no sitting running, then one running
          when:
            - Read anchor `panel.walk` in the bar, and anchor `panel.continue` beside the tally in anchor `panel.actor`
          then:
            - With nothing running the bar's control begins a sitting; while one runs, the same control is how it is recorded, and it says so
            - Carrying on is a different question from ending - it is about the next rule rather than the sitting as a whole - so it sits with the count of the ones already judged rather than in the bar
            - Carrying on opens the next rule still owing a verdict after the one you are on, wrapping to the top - not always the next in the list, and never simply the first, so a rule you stepped past comes round again after the others rather than every time
            - The tally beside it reads as a fraction - judged over judged plus still owed - so how far through the sitting is, and how much is left, are one glance rather than two
            - A pass or an approval carries you on by itself; a fail or a refine keeps you on the rule so the reason can be pinned, and this is the way onward from there
            - Both controls wear the panel's warning colour, the one it already uses for work owed to you, so the sitting reads as one thing from the tab's count through to the record - the ending filled and carrying on outlined, since two solid yellows would argue about which is the act
            - Beginning wears it too when rules are owed, so the blueprint says there is work before being asked; with nothing owed it drops back to the ordinary action colour, because a control that is always loud says nothing
            - Every one of these counts comes from a single list - the rules owing you a verdict, less the ones judged this sitting - so the tab's number, the footer's kinds, the tally's denominator and the rule Continue opens cannot drift apart
