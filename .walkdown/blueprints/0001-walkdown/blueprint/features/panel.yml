        created_at: 2026-09-07
        statement: Starting a sitting asks who is signing it and in which roles, pre-filled from the machine's config and changeable before it starts. The session strip shows that answer for as long as the sitting runs.
        because: Naming somebody else is how one person drives a walk two people are doing.
        signoff: [eng, product]
