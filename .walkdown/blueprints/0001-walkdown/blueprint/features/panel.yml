feature: panel
title: The docked panel
source:
  prd: (design exploration, 2026-08-21; see docs/04-embed-and-anchors.md)
stories:
  - id: panel.dock
    title: The chrome around the page under review
    statement: As a reviewer, I get one set of controls around the application - the bar, the fade between design and build, pin mode - and they behave the same however walkdown arrived.
    # The id stays `panel.dock` because ids are assigned once and every run
    # record, thread and check keys off it. What it names changed on
    # 2026-08-26: the docked layout was withdrawn, and the four rules that were
    # actually about docking are marked retired. The rest were always about the
    # review screen and are untouched.
    rules:
      - id: panel.dock.no-framing
        retired: The docked delivery is withdrawn (2026-08-26). walkdown frames the page it reviews; there is no longer a layout that renders beside it.
        origin: walkdown
        statement: Docked into a page's own document, the panel renders beside what it reviews rather than framing it - a script tag cannot put its own page in a frame, so the docked delivery works within the application's document and pushes it aside instead of covering it.
        history: Docking by script tag is what the agent tier uses for testing; a real sitting goes through the Chrome extension, which never docks into the page and so never met this rule.
        screens: [docked]
        steps:
          given:
            - A dev page loading panel.js
          when:
            - The page loads
          then:
            - The panel occupies the right edge and the document is inset by its width
            - No part of the application is hidden behind the panel
            - Undocking restores the page's own margin and leaves a tab to redock
            - What the application positions against the viewport is beyond this layout's reach, which is the reason the framed delivery exists
          statement_hash: sha256:45e629ff8e85

      - id: panel.dock.wraps-the-page
        retired: The docked delivery is withdrawn (2026-08-26). Nothing insets the host document any more - the page under review is a frame on walkdown’s own desk.
        origin: thread:n-0015
        statement: The page under review is presented as a sheet lying on walkdown's desk - inset on every side, with rounded corners and a shadow - so it reads as the thing being examined rather than as part of the tool.
        screens: [docked]
        steps:
          given:
            - A dev page loading panel.js
          when:
            - walkdown docks
          then:
            - The document is inset to leave the chrome its room and a margin of desk all round
            - The page carries rounded corners and a shadow against that desk
            - Page and panel share every edge - same top, same bottom, same margin - including on a page too short to fill the window
            - A page with no background of its own is still drawn as a page, not as a hole
            - Undocking restores every one of those styles to what the page had before
          statement_hash: sha256:3b454ec97134

      - id: panel.dock.toolbar
        origin: thread:n-0015
        statement: "A toolbar across the top of the panel holds the controls that belong to the session rather than to any one rule: which project, which screen, which surface, and pin mode. Which of a project's blueprints is in hand is chosen on the Blueprints tab."
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - walkdown framing a page, with sibling projects on the server
          when:
            - Read the bar
          then:
            - Anchor `panel.project` is the project switcher; anchor `panel.blueprint` names the blueprint in hand and is not a control - choosing a different blueprint is the Blueprints tab's job, since n-0017 took that selector off the bar on purpose
            - Anchor `panel.screen-picker` says which screen this page is without being opened, and opens anchor `panel.screens-list` to pick a different one or to go back to detecting it
            - A screen picked by hand is marked as picked, because it outranks detection and the difference has to be readable from the bar
            - Detecting, the control reports the page rather than remembering an answer, so the label in the bar and the row the open list marks both follow the page when it moves
            - Prototype and App switch which of the two the page area shows
            - Pin mode can be turned on and off there
          statement_hash: sha256:4725cfa2fe18
          reworded:
            - hash: sha256:aaf28fbb5e0a
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:d1fa86f02626
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:d4d83635d936
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:ce78ef9239cc
              at: 2026-09-14T16:05:26Z
              why: the project switcher lives in the bar now (ADR 0001, n-0283); what the bar does not choose is the blueprint within a project

      - id: panel.dock.surface-swap-is-instant
        origin: walkdown
        statement: Swapping between the design and the app costs no page load.
        because: Comparing two surfaces means going back and forth, and a reload on every crossing flashes the thing you are trying to compare.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with both surfaces, the ghost showing one of them
          when:
            - Swap to the other surface and back, several times
          then:
            - Only the first look loads the page; every crossing after it is instant, with nothing reloading
            - The hidden copy takes no clicks and cannot be pinned while it is hidden
            - Resizing the window re-measures the copy rather than reloading it
            - What does reload it - a different screen, a different surface, a viewport preset, the end of a sketch detour - reloads it, so what you compare is never the wrong page
            - The copy is as old as its last load, and reloading walkdown refreshes it
          statement_hash: sha256:e13f6a1e1d6c
          reworded:
            - hash: sha256:c74a4c999299
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:9481b0c2deef
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: panel.dock.controls-survive-use
        origin: thread:n-0022
        statement: A control in the bar keeps working for as long as you are using it. The fade slider can be grabbed and dragged the whole way without being replaced under the pointer.
        history: The bar was rebuilt on every state change, which replaced the slider under the pointer mid-drag.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel docked on a screen that has a design on file
          when:
            - Grab the slider's handle and drag it across the track
          then:
            - The surfaces cross-fade continuously under the pointer, all the way
            - The drag is not dropped after the first movement
            - Clicking a spot on the track still jumps there, and the arrow keys still step
            - What the drag settles on is what the bar shows once it ends
          statement_hash: sha256:065ce87e41c5
          reworded:
            - hash: sha256:e55758ff63da
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:26a643eecf8c
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:b98abe2d27a3
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: panel.dock.above-the-app
        retired: The docked delivery is withdrawn (2026-08-26). Framed, the application cannot paint outside its own frame, so nothing has to climb into the top layer to stay above it.
        origin: thread:n-0028
        statement: Nothing the application draws paints over walkdown's own chrome, because the tool has to stay readable exactly when the app is showing the state you came to judge - and a z-index cannot promise that, since a modal joins a layer painted above every z-index there is.
        screens: [docked]
        steps:
          given:
            - An application whose modal is promoted to the browser's top layer
          when:
            - It opens while walkdown is docked
          then:
            - The bar and the panel stay drawn above it, and undimmed by its backdrop
            - The ghosted design stays above it too, so a modal state can still be compared against its design - and the panel stays above the ghost
            - Closing and reopening the modal does not put it back on top
            - A browser without that layer falls back to the ordering it does have rather than failing
          statement_hash: sha256:a2640eb509a6

      - id: panel.dock.one-pin-mode
        origin: thread:n-0015
        statement: Pin mode has one control, the bar's Pin mode button, and one state behind it. Whichever way pin mode is turned on or off, every part of the review agrees on whether it is on.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A page with both the embed and the panel
          when:
            - Turn pin mode on from the bar, then press Escape
          then:
            - The bar's Pin mode button is lit while pin mode is on and plain while it is off
            - The page under review takes a crosshair cursor while pin mode is on, and drops it when pin mode ends
            - Escape ends pin mode, and the button and the cursor both follow
            - The bar's button is the only way to turn pin mode on, so there is no second control to fall out of step
          statement_hash: sha256:d3ba0fc1202c
          reworded:
            - hash: sha256:a66c41a78d23
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:83dcb4f2e6c2
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:d4d252913f0c
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"

      - id: panel.dock.no-pin-mid-fade
        origin: thread:n-0023
        statement: While the panel is still fading from one of its two surfaces to the other, nothing can be pinned.
        because: Both surfaces are on screen at once, so a pin has no honest answer to which one it is about.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with a design on file, the panel docked
          when:
            - Move the fade off either end
          then:
            - Pin mode cannot be entered, and the control says why rather than simply refusing
            - Pin mode already running is turned off, not left armed over an ambiguous view
            - Landing fully on either end opens pinning again
          statement_hash: sha256:014e0ac5f915
          reworded:
            - hash: sha256:a25c933fc24f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:fe75bc55788c
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:8326821fbcee
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: panel.dock.own-skin
        origin: thread:n-0015
        statement: "The walkdown panel has a theme of its own: drafting blue, pale ink, flat surfaces."
        because: It must never be mistaken for the application it is inspecting, whatever that application looks like.
        signoff: [eng, product]
        screens: [review, settings]
        steps:
          given:
            - The panel beside any application
          when:
            - Look at the chrome and the page together
          then:
            - The chrome is visibly a different surface from the app
            - The skin is a theme definition, so retuning it is one block and no component knows about it
            - Prototype screens keep their own wireframe skin, distinct from both
          statement_hash: sha256:f00b306d484d
          reworded:
            - hash: sha256:93bfd901cfcd
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:fb65bfe894b1
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:1e93098c1dea
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: panel.dock.host-isolation
        retired: The docked delivery is withdrawn (2026-08-26). The panel no longer runs inside anybody else’s document. The embed still does, and embed.pin.own-skin still governs that.
        origin: walkdown
        statement: The panel is injected into somebody else's application, so its styles never reach the host page and the host's styles never reach it.
        screens: [docked]
        steps:
          given:
            - A page that has its own stylesheet, loading panel.js
          when:
            - The panel renders
          then:
            - Everything the panel draws lives inside a shadow root
            - The host document gains no rule that paints anything
            - The host's own buttons, headings and form controls are unchanged
          statement_hash: sha256:116d1940d94f

      - id: panel.dock.chrome-not-a-pin-target
        origin: thread:n-0011
        statement: "In pin mode, walkdown's own chrome is never a place to put a pin: not the bar, an open form, an existing pin, or the docked panel. Escape leaves pin mode."
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A page with the embed and the panel, pin mode on
          when:
            - Use a control in the bar, or click anywhere in the panel
          then:
            - No pin form opens; the click does what the control says
            - Controls stay usable in pin mode - the slider still drags, buttons still fire
            - Escape closes an open pin form, and leaves pin mode when none is open
          statement_hash: sha256:081fc3d92080
          reworded:
            - hash: sha256:466c5e212ed7
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:65b74be89995
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

  - id: panel.desk
    title: The desk the work lies on
    statement: As a reviewer, I can tune how the paper lies without any of it touching what gets verified.
    rules:
      - id: panel.desk.reads-as-paper
        origin: thread:n-0076
        statement: The desk under the page looks like drafting paper, not a spreadsheet. It is ruled faintly and lies at an angle, drawn in real perspective rather than a flat skew.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel docked beside a page
          when:
            - Look at what lies under the page
          then:
            - The ruling is faint rather than a grid of hard lines
            - It lies at an angle, as paper on a desk does
            - The perspective is a real 3D transform, falling back to something flat only where that is unavailable
          statement_hash: sha256:23b43c1536ff
          reworded:
            - hash: sha256:60871d489f4d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:7824cf252425
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: panel.desk.tuner
        origin: thread:n-0076
        statement: A gear in the top bar opens dials that set the desk's angle and perspective, and the desk changes as a dial moves. The choice is kept across sessions and never changes what is verified.
        because: The desk's angle and perspective are each reviewer's own taste.
        signoff: [eng, product]
        screens: [settings]
        steps:
          given:
            - The panel docked, with the desk visible
          when:
            - Open the gear and move a dial
          then:
            - The desk changes as the dial moves, without a reload
            - Each dial's number can be typed directly, not only dragged to
            - The choice is still there in the next session
            - Nothing about it reaches the ledger - no verdict, no run, no thread
            - The tuner closes on Escape or on a click anywhere outside it, the gear excluded since its own click already toggles it
            - It sits clear of the app's corner rather than flush against it, by the same distance on both axes, so it reads as something on the desk rather than part of the app's layout
          statement_hash: sha256:e54d1b750069
          reworded:
            - hash: sha256:09636342aada
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:04ab90372c93
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:a2132cfbe9b9
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:a8c8826e3bff
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"
            - hash: sha256:4abca9a31981
              at: 2026-09-14T04:25:47Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"

      - id: panel.desk.peek
        origin: thread:n-0076
        statement: A checkbox in the panel dims everything on the desk instead of hiding it, so what lies underneath shows through.
        because: The ruling is judged against everything that would otherwise sit on top of it, so both must stay visible at once. Dimming is a way of looking, not a preference.
        signoff: [eng, product]
        screens: [settings]
        steps:
          given:
            - The tuner open, with an app and an aside on the desk
          when:
            - Tick the peek checkbox
          then:
            - The app, the aside, and any cover over them - the headless cover included - all dim together rather than disappearing
            - The bar stays at full strength throughout, its buttons and the gear still working
            - Adjusting a dial does not undo the peek
            - It always starts unchecked, and closing the tuner ends it
          statement_hash: sha256:194a40e90c69
          reworded:
            - hash: sha256:9b19ad4a2f80
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:35c73a3a20ec
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:c1c00e394894
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:aff39ea2420f
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"

  - id: panel.delivery
    title: walkdown reaches the page, however the page was built
    statement: As a reviewer, I can walk down an application whether or not anyone can add a script tag to it.
    rules:
      - id: panel.delivery.one-implementation
        retired: How walkdown's own files are packaged is an implementation detail with no surface a reviewer can see (2026-08-26, thread n-0078); the byte-for-byte comparison stays as a node test.
        origin: thread:q-0016
        statement: The panel and the embed stay two files because they load into two documents - the embed into the application being reviewed, the panel only into walkdown's own page above it - and neither carries a copy of the other.
        verify: [checks]
        steps:
          given:
            - A page carrying the script tags, and a page carrying nothing
          when:
            - walkdown starts on each
          then:
            - Both run the same embed.js and panel.js
            - The tag supplies server, project and anchor attribute from its own attributes
            - The extension supplies the same answers before loading them, and nothing is forked
            - A page carrying both gets one panel and one badge, not two - the tag wins, because it runs first and its project is the app's own answer
          statement_hash: sha256:4477bced1c62

      - id: panel.delivery.absent-until-asked
        origin: thread:q-0016
        statement: The extension adds nothing to a page until you click its toolbar button, and clicking the button again ends the review and hands the page back exactly as it was.
        unverifiable:
          agent: The control is the browser's own toolbar button, which is browser chrome rather than part of the page - no tool an agent drives reaches it.
          checks: The same button, for the same reason - a test that drives a page cannot click something that is not in the page.
        signoff: [eng, product]
        steps:
          given:
            - The extension installed, on any page
          when:
            - Visit it, then click the toolbar button, then click it again
          then:
            - Before the click, nothing is added to the page at all
            - The click begins a review of that page, and the button says which of the two states it is in
            - Clicking again returns to the page itself, at the URL it had reached rather than the one the review started from
            - Nothing about the review outlives it - not the framing, not the headers it needed removed
          statement_hash: sha256:7e8666198401
          reworded:
            - hash: sha256:f7a1627079f4
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone

      - id: panel.delivery.framed-isolation
        origin: thread:n-0030
        statement: The extension reviews an application by giving it a viewport of its own inside walkdown's page.
        because: The application lays itself out against that viewport, and nothing it draws can paint over walkdown's chrome.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - An application whose modal covers the window, and one that refuses to be framed at all
          when:
            - Review each of them through the extension
          then:
            - The app's modals, overlays and sticky chrome are laid out against the sheet rather than the whole window
            - Nothing the app draws paints over walkdown, and nothing it opens makes walkdown unusable
            - A page that refuses framing is reviewed anyway, by removing the header that refuses - for that tab only, and only while it is being reviewed
            - The panel keeps up with the application - navigating inside it moves the panel to the screen the app landed on, including when the app moves without a page load
          statement_hash: sha256:3ae6e9260f6c
          reworded:
            - hash: sha256:967abb13513f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:0a724efb0d5d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: panel.delivery.stale-server-says-so
        origin: thread:n-0227
        created_at: 2026-09-07
        statement: A server still running on code that has since changed says so, and the panel shows that with the same badge it uses for a stale copy of itself.
        because: A running server keeps the code it started with, and it is the only party that can see both when it started and what is on disk now.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A running server, and then an edit to the code it would load if it started again
          when:
            - The panel asks for the blueprint
          then:
            - The payload says the running code is older than the tree, and when the tree moved
            - The panel says so plainly and names the fix, which is to restart it
            - A server started after the last edit says nothing at all, so the warning keeps meaning something
            - Rebuilding the panel or the embed does not make a server stale - those are read from disk per request, and crying wolf on every rebuild would teach a reviewer to ignore it
            - A server that cannot read its own source reads as current rather than as an alarm nobody can act on
          statement_hash: sha256:930942690e23
          reworded:
            - hash: sha256:2ba91beef131
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:34c0eee005b6
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e24275abff33
              at: 2026-09-14T03:07:39Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: panel.delivery.one-switch
        origin: thread:n-0018
        statement: "The extension has one control: the toolbar button, which turns it on or off for this site and shows which it is. Every other choice is made in the panel."
        because: The panel has room to explain; browser chrome does not.
        unverifiable:
          agent: The control is the browser's own toolbar button, which is browser chrome rather than part of the page - no tool an agent drives reaches it, and its icon is not something an agent can see.
          checks: The same button, for the same reason - a test that drives a page cannot click something that is not in the page.
        signoff: [eng, product]
        steps:
          given:
            - The extension installed
          when:
            - Click its toolbar button on a site
          then:
            - Clicking starts it, clicking again stops it - there is no second place to look
            - The button wears the state as its own icon, colour for on and drained for off, rather than a badge pinned to it
            - Server and blueprint are chosen in the panel, not in browser chrome
            - On a tab with no page to review, the click opens the running walkdown server at its standard port - its root, where a project is picked - and when none answers, a page of the extension's own says so; the click is never silent
          statement_hash: sha256:2a7b364ef850
          reworded:
            - hash: sha256:84bda3b30c1d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:bed2a74ca17d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:608a242984fb
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: panel.delivery.stale-copy-says-so
        origin: thread:n-0062
        statement: The panel compares the copy of walkdown it is running against what the server ships, and says plainly when it has gone stale.
        because: The extension's vendored copy only updates when the extension is reloaded, and an outdated walkdown reviewing a moving spec quietly undermines every verdict.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The extension reviewing a page after walkdown's panel changed on disk
          when:
            - The panel loads the blueprint
          then:
            - A banner states the extension is running an older walkdown and names the fix - reload the extension, then the page
            - A current copy shows nothing
