              at: 2026-09-14T02:38:10Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: panel.start.address-opens-what-it-names
        origin: thread:n-0297
        created_at: 2026-09-15
        statement: walkdown's own page opens what its address names - a rule, or a thread - so a link from outside the panel has somewhere to arrive.
        because: An id beside a pin, or in a run record pasted anywhere, is only a link if there is an address that opens the thing it names.
        history: The standalone popover put rule ids and unpinned thread ids back to plain words because the panel had no address for them (n-0294, n-0297); the address is what lets them be links again.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail, thread-panel]
        steps:
          given:
            - A running server, and a blueprint named by `?bp=` on walkdown's own page
          when:
            - Open that page with `?rule=<id>` or `?thread=<id>` in its address, with or without a page to review named in the fragment
          then:
            - With a rule named, the board opens on that rule's detail
            - With a thread named, the board opens on that thread, over its rule's detail so Back lands somewhere that makes sense
            - An id the blueprint does not know says so, rather than opening nothing
            - Opened once on arrival - moving on inside the panel is not undone
          statement_hash: sha256:682e1f446062
      - id: panel.start.address-keeps-the-pick
        origin: walkdown
        created_at: 2026-09-16
        statement: walkdown's own page writes the blueprint, the open rule or thread, and the page in the frame into its own address, so a reload comes back to the same view - and the address is the only thing that carries it.
        because: A stored choice is a fact about what you chose somewhere else; the address is a fact about this tab, and reading it back on reload is not memory.
        history: Nothing was remembered at all (ADR 0001 §9), so every reload of the extension's page brought the chooser back; the address took the pick on 2026-09-16. A `?rule=` that arrived by link stayed after "All rules", so a reload went back to the rule you had just left; the address follows the view since 2026-09-18.
        signoff: [eng, product]
        verify: [checks]
        screens: [review]
        steps:
          given:
            - walkdown's own page - framed by the extension, or served at the server's root - open on a page under review
          when:
            - Pick a blueprint, then move the frame to another screen, then open a rule, then reload the tab; then press All rules and reload again
          then:
            - The address names the blueprint by key in `?bp=` from the moment it is picked, the page in the frame after `#` from the moment it moves, and the open rule in `?rule=` (or thread in `?thread=`) from the moment it opens
            - The reload comes back to that board on that page, on that rule, with no chooser
            - Back to the list drops `?rule=` from the address, so the second reload comes back to the list, not the rule
            - At the server's root with only `?bp=` named, the board opens on the storyboard's front door and the address then names that page, so a reload comes back to it
            - A `?bp=` naming a blueprint the server no longer has is dropped from the address, and the chooser asks instead of an error being shown where the page should be
            - Nothing is written to the browser's storage for this - opening a fresh address with no `?bp=` asks as before, and inside somebody else's application the panel never touches that page's address
          statement_hash: sha256:f81b1c70e65f

