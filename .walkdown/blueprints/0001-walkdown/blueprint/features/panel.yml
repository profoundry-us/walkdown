  - id: panel.start
    title: A fresh install knows nothing, and says so
    statement: As a reviewer opening walkdown for the first time, I am asked what to open and which blueprint this site is - once - rather than shown an empty tool.
    rules:
      - id: panel.start.open-a-folder
        origin: thread:n-0017
        statement: With no walkdown server to read blueprints from, the panel says so plainly and tells you how to start one, rather than rendering an empty or broken review surface. Once it connects, it shows which folder that server is serving.
        verify: [checks]
        signoff: [eng, product]
        screens: [start]
        steps:
          given:
            - The extension on for a site, and no server running
          when:
            - The panel starts
          then:
            - It says no blueprints are open and names the command that opens them
            - The address it looks at can be changed and retried without a reload
            - It is stated as a first step, not as an error
            - The box you type into is labelled as a server address, not as a folder
            - Once connected, the panel names the folder that server is serving
          statement_hash: sha256:5ace895ac628
          reworded:
            - hash: sha256:2a5e9a0925a7
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone

      - id: panel.start.choose-a-blueprint
        origin: thread:n-0017
        statement: When several of a project's blueprints claim the page you are on, the panel asks which one. Holding several blueprints is not a reason to ask.
        because: What a folder holds says nothing about the page you are looking at.
        verify: [checks]
        signoff: [eng, product]
        screens: [choose-blueprint]
        steps:
          given:
            - A project whose blueprints claim the page under review more than once, or a project you crossed to that holds more than one
          when:
            - The panel starts there, or you pick that project
          then:
            - The project's blueprints are offered, with their names and their own descriptions
            - The ones claiming this page come first and say so
            - The reason for the question is said out loud - how many claim this page, and that nothing is remembered
            - Choosing one loads it and writes nothing down; the same question is asked again next time
            - Nothing is offered that nobody wrote down - the list is the registry's, so a fixture or a vendored copy is absent by never having been declared rather than by being filtered out
            - The same list is the Blueprints tab, so the choice can be changed later without reinstalling anything
          statement_hash: sha256:f89c8ffc710e
          reworded:
            - hash: sha256:3ff33b8e9c41
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:d535c64dd41b
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:f2c3915679bc
              at: 2026-09-14T02:38:10Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: panel.start.unclaimed-page-says-so
        retired: >-
          Folded into panel.start.which-project (2026-09-09, ADR 0001 §7). Everything it said still holds - nothing is opened over a page nobody claimed, and a count of blueprints is never evidence - but it said it about one of three cases where the address cannot decide, and the three are now one screen because they are one question.
        origin: walkdown
        statement: On a page no blueprint claims, the panel says so and says how to claim it, rather than opening whichever blueprint it happens to hold - and it asks that question however many blueprints the server offers, because one blueprint on a server is not evidence that this page belongs to it.
        signoff: [eng, product]
        screens: [unclaimed-page]
        steps:
          given:
            - A server offering one or more blueprints, and a page none of them claims - an ordinary site you have simply browsed to
          when:
            - The panel starts there
          then:
            - It says no blueprint claims this page, and names the address it asked about
            - Nothing is opened by default - a server holding exactly one blueprint is answered the same way as one holding six, because the count of blueprints says nothing about who this page belongs to
            - It says how to claim the address - the storyboard entry or the target base_url that would make this page part of a blueprint
            - The blueprints the server does hold stay reachable, so opening one deliberately is still one step
            - A page a blueprint claims, or one that declares its own, is never asked
          statement_hash: sha256:3ac55c00c5a3

      - id: panel.start.which-project
        origin: thread:q-0269
        statement: When the address alone cannot say which project this page belongs to, the panel asks. Whether nothing claims the page, several projects do, or there is no page at all, the same modal asks the same question.
        because: Three screens asking one question were three places for the answer to differ, and a long list of projects must not push the way out of view.
        verify: [checks]
        signoff: [eng, product]
        screens: [project-modal]
        steps:
          given:
            - A machine with projects imported, and a page none of their blueprints claims - or one that several projects claim, or walkdown's own server root, where there is no page to route from
          when:
            - The panel starts there, or the project control in the bar is pressed at any time
          then:
            - One modal and one backdrop answer every case, and only the substrate underneath differs - crossing projects from inside one project's board would read as something that board was doing
            - The backdrop is a blur and nothing else - blurring says the board is suspended without hiding it, and a dim on top of it buys legibility the blur already bought
            - Arriving on a page nothing claims, the page still loads in the frame and the panel still opens - but the panel carries no tabs and one centred line where the rules would be, because until a project is chosen the panel has nothing true to say and a panel reciting a state it is not in is worse than an empty one
            - That line is a fallback, not the design - it is what a reviewer reads if the blur does not paint, so it says plainly that a project has to be picked
            - Arriving that way, the modal cannot be dismissed, there being nothing behind it to go back to
            - On walkdown's own server root there is no frame, no panel and no bar - the desk ruling alone - and the backdrop blurs nothing there, because nothing is behind the modal to blur
            - The switcher pressed inside a loaded project leaves the frame and the panel exactly as they were, blurred, and Escape or the backdrop gives them back unchanged
            - It names the address it asked about, because a claim misses on a port or a fragment and "no blueprint" without the address leaves you guessing which one was asked
            - How to make this page reviewable, and how to bring a project in, sit above the list - `walkdown claims --url`, `walkdown import`, `walkdown init`, named rather than described
            - Neither of those ever runs from the browser - they write to a person's disk and to their personal config, and a button here would be walkdown adopting a directory on the strength of a click in a web page
            - Projects claiming this page come first and name the blueprint that matched
            - Nothing is opened by default, at any count - a machine holding exactly one blueprint is answered the same way as one holding six
            - Choosing a project with one blueprint opens it; choosing one with several asks which, on the Blueprints tab - and several blueprints inside a single project never reach this modal at all, because the project is not in question there
            - A server that lists nothing offers no list at all rather than an empty one, and still says what to do about it
          statement_hash: sha256:8927716089a7
          reworded:
            - hash: sha256:fb4343377bab
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:fbc01fc45771
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
