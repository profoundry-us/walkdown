feature: screens
title: Which screen is this?
source:
  prd: (docs/06-prototype-contract.md §2; thread n-0020)
stories:
  - id: screens.identity
    title: A screen is a URL, and the URL can change without a reload
    statement: As a reviewer, walkdown knows which screen I am looking at - including the modal, drawer or route the fragment opened - and keeps knowing it as I move around a single-page app.
    rules:
      - id: screens.identity.fragment-is-identity
        origin: thread:n-0020
        statement: A screen is identified by its origin, path and fragment. So a state the URL fragment expresses, such as a modal, a drawer, a tab or an SPA route, is a screen in its own right and not a footnote on the page behind it.
        verify: [checks]
        steps:
          given:
            - A storyboard holding both a page and a fragment state of that page
          when:
            - Standing on each of the two URLs in turn
          then:
            - The bare path resolves to the page, and the path with the fragment resolves to the fragment state
            - A declared fragment must match exactly - a different fragment is a different screen, never a near miss
            - A fragment nobody has enumerated still resolves to the screen at that path, so an app is usable before every route is written down
            - The state is reachable by its URL on load, not only by clicking - a state you can only click your way to cannot be walked down
          statement_hash: sha256:9484646bb993
          reworded:
            - hash: sha256:ac30c2879d52
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:b0bbdbe721cb
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: screens.identity.query-is-not-identity
        origin: thread:n-0020
        statement: "A query string is data, not identity, so the same screen showing page two is still the same screen. A query written into the storyboard is the exception: it still tells two screens sharing one path apart."
        verify: [checks]
        steps:
          given:
            - Two screens declared at one path, distinguished by a query
          when:
            - Resolving a URL at that path
          then:
            - An undeclared query changes nothing about which screen you are on
            - A declared query is honoured, and the more specific of the two wins
            - The constraint that a page belongs to exactly one blueprint is still read on path and fragment alone
          statement_hash: sha256:56d83a30a6b1
          reworded:
            - hash: sha256:9b8b3c9e5881
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:88e5a4d85423
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: screens.identity.one-matcher
        origin: thread:n-0020
        statement: The panel, the embed and the server answer "which screen is this?" with one implementation rather than three lookalikes.
        because: A pin filed under one screen here and another there is worse than no pin at all.
        verify: [checks]
        unverifiable:
          agent: The claim is that one implementation answers the question, and that cannot be seen from outside the code. An agent can watch the panel, the embed and the server agree, but agreement is what follows from the rule rather than the rule itself - three lookalikes that happen to match today would look identical. The checks tier reads the source.
        steps:
          given:
            - The two browser files, which ship self-contained and cannot import
          when:
            - The shared matcher changes
          then:
            - Each browser file carries a generated copy, not a hand-written one
            - A copy that has drifted from the source fails the build rather than shipping
          statement_hash: sha256:94c5e18bf909
          reworded:
            - hash: sha256:c7d51f5c89d3
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:8481b0cbb2e4
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: screens.identity.follows-navigation
        origin: thread:n-0020
        statement: When the page's URL changes without a reload, walkdown notices and works out again which screen it is on. A `pushState` navigation raises no event, so walkdown catches it by checking the address on a timer.
        steps:
          given:
            - walkdown on a single-page app, on a screen the storyboard knows
          when:
            - Open a drawer, follow a hash route, press Back
          then:
            - The panel re-resolves the screen and redraws against it
            - The embed re-resolves too, so a pin placed after the navigation files against the screen you are actually on
            - An answer a person gave about the previous page - which screen it was, whose art to ghost - does not carry across the navigation
            - pushState announces nothing and the extension cannot patch the page's own History, so the address is checked every 400ms and a change found that way is handled exactly like one an event announced
          statement_hash: sha256:5b51c16f7b2b
          reworded:
            - hash: sha256:e8763cbea8b6
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:10cd6346d20b
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e0ed85a9e4ac
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:1519a942634a
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"
            - hash: sha256:327979bf4aad
              at: 2026-09-14T16:05:25Z
              why: dropped 'says that is how it knew' - nothing user-facing says it; the statement now says the address is checked on a timer and the step says how often

  - id: screens.ownership
    title: Which blueprints a page belongs to is a fact about its address
    statement: As a team, we can point walkdown at the projects we have imported and have it say which blueprints claim any given page - several, one, or none - without it ever choosing between them on our behalf.
    rules:
      - id: screens.ownership.one-claimant
        retired: >-
          Withdrawn by ADR 0001 (2026-09-09). A page may be claimed by several blueprints: two efforts about different functionality of one homepage are not two pages, and making the storyboard say otherwise put a lie in the spec to protect an invariant that existed for the tooling's convenience. What the constraint was really protecting - that nothing ever has to guess whose page this is - is kept by asking instead: `walkdown claims` reports shared pages as an inventory, and the panel puts the question to the person (screens.ownership.routes-by-page, panel.start.which-project).
        origin: thread:q-0019
        statement: No two blueprints claim the same page - a claim being an origin from a target's base_url plus a path, compared on path and fragment alone, so that two projects declaring the same path under different queries is still a collision while the same path on two different origins is not.
        verify: [checks]
        steps:
          given:
            - A folder holding several blueprints
          when:
            - The set is examined as a whole, which no single blueprint lint can do
          then:
            - A page claimed by two blueprints is reported, naming both and the screens involved
            - One blueprint claiming a page under several queries is not a collision - that is a page in two states
            - The same path on two origins is not a collision, because a target's base_url is part of the claim
          statement_hash: sha256:b7fa784715cc

      - id: screens.ownership.routes-by-page
        origin: thread:q-0019
        statement: Which blueprints a page belongs to is decided by the page's address, not by what was chosen last time or by what the server happens to hold.
        because: A server holding one blueprint is not evidence that this page belongs to it.
        history: A folder holding exactly one blueprint used to open it over any page, claimed or not, and a folder holding several asked about pages none of them claimed (n-0256, n-0258, n-0260, n-0261).
        verify: [checks]
        screens: [choose-blueprint, project-modal]
        steps:
          given:
            - The projects this machine has imported, and a page that may belong to none, one, or several of their blueprints
          when:
            - The panel starts there
          then:
            - Every blueprint claiming that address is named, in no order of preference - a claim being an origin from a target's base_url plus a path, compared on path and fragment with the query dropped
            - Exactly one claimant is opened, and nothing is asked
            - Several claimants is a question for the person, never a rank - ordering survives WITHIN one blueprint, because that is how a screen is identified at all, and is abandoned across them
            - An address no blueprint claims is not guessed at, whatever the server holds
            - A caller that names a blueprint explicitly is never overridden by this
          statement_hash: sha256:015ebac2b063
          reworded:
            - hash: sha256:3021d25287e8
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:c2308bf1988a
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:a32c2a668e6d
              at: 2026-09-14T02:50:03Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: screens.surfaces
    title: Both surfaces, even when one of them is not a page
    statement: As a reviewer, I can compare a design against the app on every screen - including screens whose app is chrome rather than a URL, or is not built yet.
    rules:
      - id: screens.surfaces.stand-in-app
        origin: walkdown
        statement: A screen whose app is not a page can declare a stand-in. Walkdown then shows that screen's own design in place of the app, visibly marked as a stand-in, and fading, ghosting and pinning work on it as on any app surface.
        because: Some of what is built is browser chrome with no page of its own, and some is not built yet. Nobody must be able to mistake a stand-in for the build.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen whose storyboard app path points at the server's stand-in for it
          when:
            - Switch the surface to App
          then:
            - The app pane shows that screen's design, and the comparison controls come alive - fade, ghost, and pin mode on the app side
            - It announces itself on its own face - a marked edge and a corner label - and wears a theme of neither the mockups nor walkdown's chrome
            - The anchors are the design's own, so a pin lands on the same element on either surface, and is recorded against the app
            - It is not evidence - what it shows is the design, so a verdict given against it is a verdict about the design
          statement_hash: sha256:1d809c5c6f9f
          reworded:
            - hash: sha256:8c976257c8c0
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:079c4dd0164a
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:2a72bd1318f4
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
