feature: screens
title: Which screen is this?
source:
  prd: (docs/06-prototype-contract.md §2; thread n-0020)
stories:
  - id: screens.identity
    title: A screen is a URL, and the URL can change without a reload
    statement: As a reviewer, walkdown knows which screen I am looking at - including the modal, drawer or route the fragment opened - and keeps knowing it as I move around a single-page app.
    rules:
      - id: screens.identity.fragment-is-identity
        origin: thread:n-0020
        statement: A screen is identified by origin, path and fragment, so a state the URL fragment expresses - a modal, a drawer, a tab, an SPA route - is a screen in its own right and not a footnote on the page behind it.
        verify: [checks]
        steps:
          given:
            - A storyboard holding both a page and a fragment state of that page
          when:
            - Standing on each of the two URLs in turn
          then:
            - The bare path resolves to the page, and the path with the fragment resolves to the fragment state
            - A declared fragment must match exactly - a different fragment is a different screen, never a near miss
            - A fragment nobody has enumerated still resolves to the screen at that path, so an app is usable before every route is written down
            - The state is reachable by its URL on load, not only by clicking - a state you can only click your way to cannot be walked down
          statement_hash: sha256:ac30c2879d52

      - id: screens.identity.query-is-not-identity
        origin: thread:n-0020
        statement: A query string is data, not identity - the same screen showing page two is the same screen - but a query written into the storyboard still tells two screens sharing a path apart.
        verify: [checks]
        steps:
          given:
            - Two screens declared at one path, distinguished by a query
          when:
            - Resolving a URL at that path
          then:
            - An undeclared query changes nothing about which screen you are on
            - A declared query is honoured, and the more specific of the two wins
            - The constraint that a page belongs to exactly one blueprint is still read on path and fragment alone
          statement_hash: sha256:9b8b3c9e5881

      - id: screens.identity.one-matcher
        origin: thread:n-0020
        statement: The panel, the embed and the server answer "which screen is this?" with one implementation rather than three lookalikes, because a pin filed under one screen here and another there is worse than no pin at all.
        verify: [checks]
        unverifiable:
          agent: The claim is that one implementation answers the question, and that cannot be seen from outside the code. An agent can watch the panel, the embed and the server agree, but agreement is what follows from the rule rather than the rule itself - three lookalikes that happen to match today would look identical. The checks tier reads the source.
        steps:
          given:
            - The two browser files, which ship self-contained and cannot import
          when:
            - The shared matcher changes
          then:
            - Each browser file carries a generated copy, not a hand-written one
            - A copy that has drifted from the source fails the build rather than shipping
          statement_hash: sha256:c7d51f5c89d3

      - id: screens.identity.follows-navigation
        origin: thread:n-0020
        statement: When the URL changes without the page reloading, walkdown notices and re-answers which screen this is - and it says so honestly for the one kind of navigation it cannot be told about.
        steps:
          given:
            - walkdown on a single-page app, on a screen the storyboard knows
          when:
            - Open a drawer, follow a hash route, press Back
          then:
            - The panel re-resolves the screen and redraws against it
            - The embed re-resolves too, so a pin placed after the navigation files against the screen you are actually on
            - An answer a person gave about the previous page - which screen it was, whose art to ghost - does not carry across the navigation
            - pushState announces nothing and the extension cannot patch the page's own History, so that case is caught by watching rather than left to pretend it was heard
          statement_hash: sha256:e8763cbea8b6

  - id: screens.ownership
    title: A page belongs to exactly one blueprint
    statement: As a team, we can point walkdown at a folder of projects and have it know which one any given page is, without anyone being asked to disambiguate.
    rules:
      - id: screens.ownership.one-claimant
        origin: thread:q-0019
        statement: No two blueprints claim the same page - a claim being an origin from a target's base_url plus a path, compared on path and fragment alone, so that two projects declaring the same path under different queries is still a collision while the same path on two different origins is not.
        verify: [checks]
        steps:
          given:
            - A folder holding several blueprints
          when:
            - The set is examined as a whole, which no single blueprint lint can do
          then:
            - A page claimed by two blueprints is reported, naming both and the screens involved
            - One blueprint claiming a page under several queries is not a collision - that is a page in two states
            - The same path on two origins is not a collision, because a target's base_url is part of the claim
          statement_hash: sha256:b7fa784715cc

      - id: screens.ownership.routes-by-page
        origin: thread:q-0019
        statement: Which blueprint a page belongs to is answered from the page's own address rather than from whatever was chosen last - so the panel opens the project the page is part of, and a pin filed from a page that carries no walkdown tag at all still lands in that project's threads rather than in whichever blueprint the server happens to serve by default.
        verify: [checks]
        screens: [choose-blueprint]
        steps:
          given:
            - A server holding several blueprints, and a page belonging to one of them
          when:
            - The panel starts there, or a pin is filed from there with no project named
          then:
            - The blueprint claiming that address is the one used, without asking
            - A caller that names a project explicitly is never overridden by this
            - An address no blueprint claims is not guessed at - the picker still asks
          statement_hash: sha256:5ad49373b1d0

  - id: screens.surfaces
    title: Both surfaces, even when one of them is not a page
    statement: As a reviewer, I can compare a design against the app on every screen - including screens whose app is chrome rather than a URL, or is not built yet.
    rules:
      - id: screens.surfaces.stand-in-app
        origin: walkdown
        statement: A screen whose app is not a page - because the thing being built is chrome, or is not built yet - can declare a stand-in, and walkdown serves that screen's own design back as the app, visibly marked as a stand-in, so fading, ghosting and pinning on the app surface all work while nobody can mistake it for the build.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen whose storyboard app path points at the server's stand-in for it
          when:
            - Switch the surface to App
          then:
            - The app pane shows that screen's design, and the comparison controls come alive - fade, ghost, and pin mode on the app side
            - It announces itself on its own face - a marked edge and a corner label - and wears a theme of neither the mockups nor walkdown's chrome
            - The anchors are the design's own, so a pin lands on the same element on either surface, and is recorded against the app
            - It is not evidence - what it shows is the design, so a verdict given against it is a verdict about the design
          statement_hash: sha256:8c976257c8c0
