feature: embed
title: The feedback layer
source:
  prd: (pin behaviors; docs lag - see origin)
stories:
  - id: embed.pin
    title: A pin lands wherever feedback strikes
    statement: As a reviewer in pin mode, I can attach a note to whatever I am looking at - anchored when the element is known, by position when it is not.
    rules:
      - id: embed.pin.anchored-target
        origin: walkdown
        statement: In pin mode, hovering highlights any element that carries an anchor, and a pin placed on one is recorded against that anchor - the note follows the element, not the pixel - while the spot it was placed at is recorded too, so the pin draws where the reviewer was pointing rather than at a corner of the element.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, viewing screen `review`
          when:
            - Click an anchored element such as `panel.counts`
          then:
            - The pin form opens; the saved note is anchored to that element id
            - The exact spot is saved with it - the point on the surface, and where within the element that point was
            - The pin draws at that spot, and follows the element when the element moves, because the spot is replayed against wherever the element is now
            - The anchor is the optional part - a spot with no anchored element under it is still a pin, kept by position alone
            - Later visitors see the pin on that element wherever it renders
          statement_hash: sha256:6feaf28d3505

      - id: embed.pin.right-project
        origin: thread:n-0012
        statement: A pin files against the project the page belongs to, not whichever blueprint the server happens to be serving by default, so feedback never lands in a sibling project's threads.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - One server hosting sibling blueprints, and a page that declares its project
          when:
            - Pin an element on that page
          then:
            - The thread is written to that project's threads/, not the server's default
            - A page that declares no project still files against the default, unchanged
          statement_hash: sha256:399853aef960

      - id: embed.pin.both-surfaces
        origin: thread:n-0003
        statement: Pins can be placed on the app exactly as on the prototype - the same anchors exist in both - and a pin records which surface it was placed on.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, both surfaces showing the same screen on `review`
          when:
            - Pin an anchored element in the app surface
          then:
            - The pin form opens and the note is anchored to that element id
            - The saved note records surface app; a prototype pin records surface prototype
            - Both pins show on the rule, distinguished by the surface they came from
          statement_hash: sha256:77fdab028ac1

      - id: embed.pin.follows-the-visible-surface
        origin: thread:n-0025
        statement: A pin lands on the surface you are actually looking at - so when the design is fully covering the app, the pin goes on the design, and whichever surface is in front is the one taking the click.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with a design on file, the panel docked, pin mode on
          when:
            - Take the fade all the way to one surface and pin something
          then:
            - The pin is recorded against the surface in front, not the one hidden behind it
            - It anchors to that surface's own anchors, and its position is in that surface's coordinates
            - The control says which surface a pin would land on before you place one
            - Pins already on that screen show on the surface they were placed on
            - A surface with no walkdown running inside it cannot be pinned, and says so rather than letting the pin fall through to the page underneath
          statement_hash: sha256:7c9b1c0e3da1

      - id: embed.pin.own-skin
        origin: thread:n-0027
        statement: Everything walkdown draws into somebody else's application wears walkdown's own skin and reaches nothing outside itself - one theme across the panel and the feedback layer alike, and not a stroke of it applied to the host page.
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - Any application, with the embed running in it
          when:
            - Open a pin form, look at a pin, look at the badge
          then:
            - A pin is drawn as a map marker - a filled pin whose tip is on the spot it marks - carrying its state in its colour and its kind in the disc at its head
            - They wear the same blueprint theme as the panel, from the same stylesheet, not a hand-rolled lookalike
            - The host page's own buttons, headings and form controls are untouched
            - Everything with a surface of its own lives in a shadow root; only what must style the host's own elements - what a pinnable thing looks like under the cursor - is added to the page
          statement_hash: sha256:1f3400a09629

      - id: embed.pin.viewport-recorded
        origin: thread:n-0005
        statement: A pin records the viewport it was placed at, so feedback about a layout is never read against the wrong width.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, the surfaces set to a mobile viewport
          when:
            - Place a pin
          then:
            - The saved note records the viewport name and width in use
            - The panel shows that viewport alongside the note's other provenance
          statement_hash: sha256:6971846eb2cc

      - id: embed.pin.settled-pins-leave
        origin: walkdown
        statement: A pin stands on the page only while its thread is unsettled - verifying, waiving or incorporating it takes the pin off the surface there and then, without waiting for a reload - because a page still carrying pins for finished conversations reads as work that is still owed.
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - A surface showing a pin whose thread is still open or addressed
          when:
            - End that thread from the panel
          then:
            - The pin leaves the surface immediately, on both the page and the ghosted copy of the other one
            - Nothing else about the page moves, and the other pins stay where they are
            - The thread itself is not gone - it is in the ledger and reachable, just no longer standing on the page
          statement_hash: sha256:c82607d3ac2e

      - id: embed.pin.tooltip-says-what-it-is
        origin: walkdown
        statement: Hovering a pin says what it is in three short lines - which thread and what state, the rule and screen it belongs to (or that it belongs to no rule), and enough of the note to recognise it - so a page of pins can be read without spending a click on each one.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A surface carrying several pins
          when:
            - Rest the pointer on one
          then:
            - It appears on contact, because it is walkdown's own markup rather than the browser's title attribute and its second of waiting
            - It names the thread, its kind and its status
            - It names the rule it is anchored to, or says plainly that it has none, along with the screen and the element
            - It shows the start of the note, truncated - a tooltip that has to be read is one nobody reads
            - It opens away from whatever edge the pin is near - down near the top, up near the bottom, and towards the side with the room - so it is never half off the surface
            - Clicking it still opens the thread's own screen, wherever you were
          statement_hash: sha256:50dfb40b9f83

      - id: embed.pin.form-at-the-spot
        origin: walkdown
        statement: The pin form opens at the spot that was clicked - just below it, or just above when the spot is near the bottom of the surface - and a placeholder pin stands on that spot while the form is open, so what you are writing about stays in view and where the pin will land is never in doubt.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, over an element tall enough that its foot is far from its head
          when:
            - Click a spot near the top of it, and then a spot near the bottom of the surface
          then:
            - The form opens just under the first spot, not at the foot of the element it landed on
            - Near the bottom it opens above the spot instead, so it is never half off the surface, and it never runs off the side
            - A placeholder pin marks the spot the whole time the form is open, and changes its mark when the form switches between note and question
            - Cancelling or pressing Escape takes the placeholder with the form; filing replaces it with the real pin in the same place
          statement_hash: sha256:5bb13509dc3b

      - id: embed.pin.form-is-chrome
        origin: thread:n-0004
        statement: The pin form is ordinary UI - inside it the cursor and clicks behave normally, and pin mode does not reach through it to the surface underneath.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, with the pin form open on screen `review`
          when:
            - Moving over the form's checkbox and buttons
          then:
            - The cursor is a pointer over controls and a caret over text, never the crosshair
            - Clicking a control acts on the form and never places another pin
          statement_hash: sha256:cac6da4be24f

      - id: embed.pin.surface-coordinates
        origin: thread:n-0005
        statement: A pin's position is recorded in the surface's own coordinate space - CSS pixels of the document as rendered at its viewport - never in the panel's screen pixels, so pins stay on their spot when the frame is resized, the fade moves, or the surface is zoomed.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A pin placed by position while a surface is scaled to fit its pane
          when:
            - Change the zoom, move the fade, or resize the window
          then:
            - The pin stays on the same spot of the surface it was placed on
            - The recorded position is unchanged by any of those actions
          statement_hash: sha256:7d33bd0c80b2

      - id: embed.pin.coordinate-fallback
        origin: thread:n-0001
        statement: A pin dropped where no anchored element sits is still placed, recorded by its x/y position within the surface - feedback is never blocked by a missing anchor.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, viewing screen `review`
          when:
            - Click a spot with no anchored element under it
          then:
            - The pin form opens at the click point
            - The saved note records the screen and position; later visitors see the pin at that spot
          statement_hash: sha256:3c6fb006c94b

  - id: embed.threads
    title: A thread you can read at a glance
    statement: As a reviewer opening a pin, I want the note itself - not a wall of provenance and instructions I have to read past.
    rules:
      - id: embed.threads.note-first
        origin: walkdown
        statement: The thread popover leads with the note's own words; its provenance - id, kind, status, rule, screen, element, author, age - is condensed to a compact line rather than stacked sentences.
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A pinned note open on screen `thread-panel`
          when:
            - Reading anchor `thread.panel`
          then:
            - Anchor `thread.body` is the most prominent text in the popover
            - Anchor `thread.provenance` fits on one line and never pushes the note below the fold
            - A long reply history collapses behind a count rather than growing the popover
          statement_hash: sha256:870249ed1a7a

      - id: embed.threads.actions-in-context
        origin: walkdown
        statement: The popover's actions are short verbs on one row, and an action that needs a reason asks for it when chosen - the reply box carries no standing instructions.
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A pinned note open on screen `thread-panel`
          when:
            - Reading anchor `thread.actions`, then choosing an action that requires a reason
          then:
            - The reply box in anchor `thread.reply` reads simply as a reply box
            - Choosing waive or reopen asks for the reason then; other actions never mention it
            - Actions a person may not take are absent, not shown and refused
          statement_hash: sha256:9878eb8459f2
