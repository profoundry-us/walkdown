feature: embed
title: The feedback layer
source:
  prd: (pin behaviors; docs lag - see origin)
stories:
  - id: embed.pin
    title: A pin lands wherever feedback strikes
    statement: As a reviewer in pin mode, I can attach a note to whatever I am looking at - anchored when the element is known, by position when it is not.
    rules:
      - id: embed.pin.anchored-target
        origin: walkdown
        statement: In pin mode, hovering highlights any element that carries an anchor, and a pin placed on one is recorded against that anchor on the surface it was placed on, with the spot it was placed at recorded too.
        because: A note follows the element it was placed on, not a position on the page; the spot keeps the pin drawn where the reviewer pointed.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, viewing screen `review`
          when:
            - Click an anchored element such as `panel.counts`
          then:
            - The pin form opens; the saved note is anchored to that element id
            - The exact spot is saved with it - the point on the surface, and where within the element that point was
            - The pin draws at that spot, and follows the element when the element moves, because the spot is replayed against wherever the element is now
            - The anchor is the optional part - a spot with no anchored element under it is still a pin, kept by position alone
            - Later visitors see the pin on that element wherever it renders on that surface - the prototype and the app carry the same anchor ids, and a pin placed on one never draws on the other
          statement_hash: sha256:53f47b01acea
          reworded:
            - hash: sha256:c59f178ebedf
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:56bdca60495d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: embed.pin.right-project
        origin: thread:n-0012
        statement: A pin is filed in the blueprint the panel has open, never in another blueprint and never in the one the server serves by default. The panel names that blueprint in the request; the server does not work it out from the page address.
        because: Feedback has to land in the ledger of the thing you were reviewing, and by the time anything can be pinned the panel always has one open.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - One server offering sibling blueprints, and a page carrying no walkdown tag of its own - the ordinary case, reviewed through the extension
          when:
            - Pin an element on that page
          then:
            - The thread is written to the open blueprint's threads/, not the server's default
            - The panel tells the embed in the frame which blueprint is open, because there is no script tag on somebody else's page to carry one
            - The server never re-routes a write by looking the address up and overriding what the caller said - several blueprints may claim an address, and choosing between them at a door is the server deciding whose page you are on
            - A tag on the page naming a blueprint does not redirect a write - the panel has one open, and that is the thing being reviewed; a tag is a fact about the page, goes stale when the blueprint moves, and used to send a reply to a blueprint where the pin it answered did not exist
          statement_hash: sha256:292c89ee776a
          reworded:
            - hash: sha256:8d8ef265ac6d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:3609f1573878
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:6f6dcac974a9
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.both-surfaces
        origin: thread:n-0003
        statement: The same anchors exist on the app as on the prototype, so a pin can be placed on either surface in the same way. Each pin records which surface it was placed on.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, both surfaces showing the same screen on `review`
          when:
            - Pin an anchored element in the app surface
          then:
            - The pin form opens and the note is anchored to that element id
            - The saved note records surface app; a prototype pin records surface prototype
            - Both pins show on the rule, distinguished by the surface they came from
          statement_hash: sha256:8dcf85fbee90
          reworded:
            - hash: sha256:77fdab028ac1
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:4c64071b699d
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.follows-the-visible-surface
        origin: thread:n-0025
        statement: "A pin lands on the surface in front, the one that would take your click. When the prototype fully covers the app, that surface is the prototype."
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with a prototype on file, the panel docked, pin mode on
          when:
            - Take the fade all the way to one surface and pin something
          then:
            - The pin is recorded against the surface in front, not the one hidden behind it
            - It anchors to that surface's own anchors, and its position is in that surface's coordinates
            - The control says which surface a pin would land on before you place one
            - Pins already on that screen show on the surface they were placed on
            - A surface with no walkdown running inside it cannot be pinned, and says so rather than letting the pin fall through to the page underneath
          statement_hash: sha256:3bd7a904fa1b
          reworded:
            - hash: sha256:005ee8fa7a1e
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:771cd68f690f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:6f170a1e2778
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.own-skin
        origin: thread:n-0027
        statement: The panel and the feedback layer walkdown draws into a host application share one theme, and it is walkdown's own. None of that styling touches the host page.
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - Any application, with the embed running in it
          when:
            - Open a pin form, look at a pin, look at the badge
          then:
            - A pin is drawn as a map marker - a filled pin whose tip is on the spot it marks - carrying its state in its colour and its kind in the disc at its head
            - They wear the same blueprint theme as the panel, from the same stylesheet, not a hand-rolled lookalike
            - The host page's own buttons, headings and form controls are untouched
            - Everything with a surface of its own lives in a shadow root; only what must style the host's own elements - what a pinnable thing looks like under the cursor - is added to the page
          statement_hash: sha256:7a85f116b73d
          reworded:
            - hash: sha256:1f3400a09629
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:4e1bdc231fd0
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e34255353d94
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.viewport-recorded
        origin: thread:n-0005
        statement: A pin records the viewport it was placed at.
        because: Feedback about a layout must never be read against the wrong width.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, the surfaces set to a mobile viewport
          when:
            - Place a pin
          then:
            - The saved note records the viewport name and width in use
            - The panel shows that viewport alongside the note's other provenance
          statement_hash: sha256:85503fb1eb9b
          reworded:
            - hash: sha256:6971846eb2cc
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:7a12fb0d24f7
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: embed.pin.settled-pins-leave
        origin: walkdown
        statement: A pin stays on the page only while its thread is unsettled. Verifying, waiving or incorporating the thread takes the pin off the page at once, without waiting for a reload.
        because: A page still carrying pins for finished conversations reads as work that is still owed.
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - A surface showing a pin whose thread is still open or addressed
          when:
            - End that thread from the panel
          then:
            - The pin leaves the surface immediately, on both the page and the ghosted copy of the other one
            - Nothing else about the page moves, and the other pins stay where they are
            - The thread itself is not gone - it is in the ledger and reachable, just no longer standing on the page
          statement_hash: sha256:79224f400eb4
          reworded:
            - hash: sha256:c82607d3ac2e
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:9e777d797a94
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:9f24cae46d18
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.tooltip-says-what-it-is
        origin: walkdown
        statement: "Hovering a pin shows a tooltip of three short lines: what the thread is, where it belongs, and enough of the note to recognise it."
        because: A page of pins should be readable without spending a click on each one.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A surface carrying several pins
          when:
            - Rest the pointer on one
          then:
            - It appears on contact, because it is walkdown's own markup rather than the browser's title attribute and its second of waiting
            - It names the thread, its kind and its status
            - It names the rule it is anchored to, or says plainly that it has none, along with the screen and the element
            - It shows the start of the note, truncated - a tooltip that has to be read is one nobody reads
            - It opens away from whatever edge the pin is near - down near the top, up near the bottom, and towards the side with the room - so it is never half off the surface
            - Clicking it still opens the thread's own screen, wherever you were
            - The pins on whichever surface is in front answer the pointer, pin mode on or off - faded all the way to the design, the design's pins do; pin mode only decides whether a click places one
            - Part-way between the two surfaces, neither one's pins answer, because a hover cannot say which surface it meant
          statement_hash: sha256:9ed8ebb2af0a
          reworded:
            - hash: sha256:50dfb40b9f83
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:cbaf0007bc64
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:7dacc9350895
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:7d2deb9991b0
              at: 2026-09-14T16:05:24Z
              why: the statement now summarises the three lines; what each line holds was already in the steps
            - hash: sha256:c5847b11a900
              at: 2026-09-21T01:18:36Z
              why: the pins in front answer the pointer with pin mode off, and mid-fade neither surface's do (n-0306, q-0285)

      - id: embed.pin.form-at-the-spot
        origin: walkdown
        statement: The pin form opens just below the spot that was clicked, or just above it when the spot is near the bottom of the surface. A placeholder pin stands on that spot while the form is open.
        because: What you are writing about stays in view, and where the pin will land is never in doubt.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, over an element tall enough that its foot is far from its head
          when:
            - Click a spot near the top of it, and then a spot near the bottom of the surface
          then:
            - The form opens just under the first spot, not at the foot of the element it landed on
            - Near the bottom it opens above the spot instead, so it is never half off the surface, and it never runs off the side
            - A placeholder pin marks the spot the whole time the form is open, and changes its mark when the form switches between note and question
            - Cancelling or pressing Escape takes the placeholder with the form; filing replaces it with the real pin in the same place
          statement_hash: sha256:f8bbc8411ce9
          reworded:
            - hash: sha256:5bb13509dc3b
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:19fb19983eaf
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:5de485741d96
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.form-is-chrome
        origin: thread:n-0004
        statement: The pin form is ordinary UI. Inside it the cursor and clicks behave normally, and pin mode does not act on the surface underneath it.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, with the pin form open on screen `review`
          when:
            - Moving over the form's checkbox and buttons
          then:
            - The cursor is a pointer over controls and a caret over text, never the crosshair
            - Clicking a control acts on the form and never places another pin
          statement_hash: sha256:5ad17108eb3c
          reworded:
            - hash: sha256:cac6da4be24f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:67822b8df3f5
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.surface-coordinates
        origin: thread:n-0005
        statement: A pin's position is recorded in the surface's own coordinate space, as CSS pixels of the document rendered at its viewport. It is never recorded in the panel's screen pixels.
        because: Pins have to stay on their spot when the frame is resized, the panel's fade moves, or the surface is zoomed.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A pin placed by position while a surface is scaled to fit its pane
          when:
            - Change the zoom, move the fade, or resize the window
          then:
            - The pin stays on the same spot of the surface it was placed on
            - The recorded position is unchanged by any of those actions
          statement_hash: sha256:669bb14b197a
          reworded:
            - hash: sha256:7d33bd0c80b2
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:fa24e63fbe8b
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:759df2c0e0ed
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: embed.pin.coordinate-fallback
        origin: thread:n-0001
        statement: A pin dropped where no anchored element sits is still placed, recorded by its x/y position within the surface.
        because: Feedback is never blocked by a missing anchor.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - Pin mode on, viewing screen `review`
          when:
            - Click a spot with no anchored element under it
          then:
            - The pin form opens at the click point
            - The saved note records the screen and position; later visitors see the pin at that spot
          statement_hash: sha256:bc91613d4b86
          reworded:
            - hash: sha256:3c6fb006c94b
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:7899d763ed1f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

  - id: embed.threads
    title: A thread you can read at a glance
    statement: As a reviewer opening a pin, I want the note itself - not a wall of provenance and instructions I have to read past.
    rules:
      - id: embed.threads.note-first
        origin: walkdown
        statement: The thread screen shows the note's text first. Its id, kind, status, rule, screen, element, author and age follow on one compact line rather than as stacked sentences.
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A pinned note open on screen `thread-panel`, reached from the tag on its rule's conversation or from the Threads tab
          when:
            - Reading anchor `thread.panel`
          then:
            - Anchor `thread.body` is the most prominent text on the screen
            - Anchor `thread.provenance` fits on one line and never pushes the note below the fold
            - A long reply history collapses behind a count rather than growing the screen
          statement_hash: sha256:2d3685ac1da6
          reworded:
            - hash: sha256:870249ed1a7a
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:b4e6177d8153
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:24c2d4094356
              at: 2026-09-21T04:39:22Z
              why: the thread popover became the thread screen (n-0319, ADR 0006); the words moved, the meaning did not, and the given now names the tag as the way there

      - id: embed.threads.picture-on-a-pin
        origin: thread:n-0096
        created_at: 2026-09-21
        statement: A screenshot dropped or pasted into the pin form, or into a thread's composer, goes on the message and is shown under its words as a small picture that opens full size. The bytes live beside the threads, and the record names the file.
        because: Some feedback is a picture, and describing a picture in a sentence is slower and less exact than showing it.
        history: Asked on 2026-08-26 after a geometry bug that was obvious in one image and would have taken a paragraph (n-0096, n-0072); built 2026-09-21 with the pictures under the threads directory, the one place beside the records a moved ledger takes with it.
        verify: [checks]
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - Pin mode on screen `review`, and a screenshot on the clipboard
          when:
            - Drag it onto anchor `pin.note`, or paste it there, write a word, and pin it
          then:
            - While a file is in the air over the window, the form, the thread screen and the rule pane each show they will take it, and show it louder while the file is over them; dragged text lights nothing
            - The pasted picture shows small in the form before it is filed, with a way to drop it
            - The thread on disk names the picture under `attachments`, and the file sits in `attachments/` under the threads directory, never anywhere else
            - The message in the stream draws the picture under its words as a thumbnail that opens it full size
            - The same drop, or paste, into anchor `thread.reply` on screen `thread-panel` puts the picture on the reply
            - Anything that is not a picture, or is over five megabytes, is refused in words and nothing is written
          statement_hash: sha256:0f42990a24bc

      - id: embed.threads.actions-in-context
        origin: walkdown
        statement: The thread popover's actions are short verbs on one row. An action that needs a reason asks for it when chosen, and the reply box carries no instructions of its own.
        verify: [checks]
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A pinned note open on screen `thread-panel`
          when:
            - Reading anchor `thread.actions`, then choosing an action that requires a reason
          then:
            - The reply box in anchor `thread.reply` reads simply as a reply box
            - Choosing waive or reopen asks for the reason then; other actions never mention it
            - Actions a person may not take are absent, not shown and refused
            - Verify is offered beside the pin when the config declares who is sitting here and the note is answered and waits on a person; never on an observation, a question, or under a guessed name
            - Pressing it records the thread as verified under that name and the pin leaves the page; waiving still needs the panel or the CLI, where a reason can be given
          statement_hash: sha256:6caaf490496b
          reworded:
            - hash: sha256:9878eb8459f2
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:a473c0119449
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
