feature: thread-lifecycle
title: Thread lifecycle governance
source:
  prd: docs/02-blueprint-schema.md (Threads section)
stories:
  - id: threads.lifecycle
    title: Feedback and questions move through validated, attributable states
    statement: As a team, we can trust a thread's status because every transition is validated and attributed.
    rules:
      - id: threads.lifecycle.validated-transitions
        origin: prd
        statement: A thread status change outside its kind's lifecycle is rejected.
        verify: [checks]
        steps:
          given:
            - A note (open > addressed > verified | reopen | waived) or a question (open > answered > incorporated | reopen | waived), where every ending may reopen and a recorded decision never moves
          when:
            - A transition not in that flow is attempted (e.g. open straight to verified)
          then:
            - The mutation is rejected with the illegal transition named, and the file is unchanged
          statement_hash: sha256:c2384ee386f5
          reworded:
            - hash: sha256:102a0b235d5a
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone

      - id: threads.lifecycle.claim-never-accept
        origin: prd
        statement: Only a person who has said who they are can set a thread to verified or waived. A name the machine guessed, an actor named "agent" in any spelling, or a change a machine says it typed are all rejected.
        verify: [checks]
        steps:
          given:
            - A thread in a state from which verified or waived is legal
          when:
            - The transition is attempted where nobody has written down who is sitting here, or under an actor named "agent", or marked as typed by a machine
          then:
            - Each is rejected and the thread is unchanged - work can be claimed on somebody's behalf, and accepted only by them
            - The refusal says where to say who you are, and never fills the gap with a login name
            - The name is compared as written, case folded and trimmed - this is an agent declaring itself, not authentication, so a confusable spelling is not chased and "the-agent", "agents" and "claude" stay accepted (q-0218)
          statement_hash: sha256:1c0b2e99daa0
          reworded:
            - hash: sha256:482531dc241f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:7ea67873e7a5
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:176058816e54
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"

      - id: threads.lifecycle.acts-for-a-person
        origin: thread:n-0139
        created_at: 2026-09-01
        statement: Attribution follows the words - a machine's own are the agent's, and a person's words it relays stay theirs, as typed, marked as machine-typed, with what the machine added kept apart. No request chooses whose name a record carries.
        because: A reader must be able to tell which sentences a person actually said, and a record that names them as author of a machine's paragraph says the opposite.
        history: For a month every sentence an agent typed was filed under the person it worked for with `via agent` beside the name - and since nearly every sentence in a thread is one the agent typed, the board filled with "topher via agent" over paragraphs Topher never wrote (2026-09-17). `said` and `added` split a relayed message into the person's words and the machine's.
        verify: [checks]
        steps:
          given:
            - A machine whose personal config says who is sitting at it
          when:
            - An agent opens a thread, replies, or moves one in its own words; and relays what the person said, with something of its own beside it
          then:
            - Its own words are recorded as the agent's - no person named, no mark needed
            - The person's words are recorded under the person, exactly as typed, with the agent as the provenance beside the name
            - What the machine added is a field of its own on the same message, never folded into the person's words, and every reader draws it apart and names it as the agent's
            - An addition with no person's words to sit beside is refused
            - The report and the stream name both, so a reader can tell a sentence a person wrote from one a machine did
            - No argument and no environment variable can name somebody else
            - A finding or an observation is the machine's own account, authored by the agent with no person named
          statement_hash: sha256:0306629cf026
          reworded:
            - hash: sha256:6790e9b3474c
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:0306cfdcd747
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:df8e11a02202
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: threads.lifecycle.reasoned-endings
        origin: prd
        statement: Waiving a thread records who waived it and why, and reopening one requires a reason. Both reasons are kept as replies on the thread.
        verify: [checks]
        unverifiable:
          agent: The passing case needs a completed waive, and waiving is a human-only transition an agent may never perform (blueprint/AGENTS.md). The reopen half could be walked; the waive half cannot, so the tier cannot honestly hold.
        steps:
          given:
            - A thread being waived, or an addressed, answered or ended thread being reopened
          when:
            - The transition is attempted without a reason
          then:
            - It is rejected; with a reason, the reason is appended as a reply and waived_by records the person
            - Reopening a verified or waived thread takes a person's acceptance back, so only a person may do it; a machine is refused and files a new thread instead
          statement_hash: sha256:97912647f98b
          reworded:
            - hash: sha256:24591753abaa
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:e93d45c639b7
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: threads.lifecycle.says-why-it-exists
        origin: walkdown
        created_at: 2026-09-14
        statement: "A note says why it exists: feedback, a finding, an observation, a request, or a decision. A finding or an observation is signed by the agent, and a decision is filed closed."
        because: Why a note exists decides whose look closes it, and a machine's account of what it saw is not a person's words.
        history: "Of 185 notes waiting on Topher's verify on 2026-09-14, 105 had nothing human in them and 90 wore his name over a judge's finding (ADR 0005)."
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A machine whose personal config says who is sitting at it
          when:
            - A note is filed from the CLI or the browser, with a reason or without one
          then:
            - The note carries the reason it was given; a word walkdown does not know is refused
            - Left unsaid, a machine's note is an observation and a person's is feedback
            - A finding or an observation is authored by the agent, with no mark saying it was typed for a person
            - A decision is filed already recorded, a status nothing transitions out of
            - A question carries no reason and refuses one
          statement_hash: sha256:5bb935c7abc6
      - id: threads.lifecycle.closes-where-it-was-asked
        origin: walkdown
        created_at: 2026-09-14
        statement: A person's signed pass on a rule verifies the findings and the feedback that were addressed on it before the pass, under that person's name. An observation is settled by the agent that made it, and asks nothing of anyone.
        because: The person's acceptance already exists as their verdict on the rule, and demanding the same look a second time, thread by thread, is what made the verify queue one nobody worked.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A rule with an addressed finding and an addressed note of the person's own, a request, and a note on another rule
          when:
            - The person records a walkdown signed in a role, passing the rule
          then:
            - The finding and the feedback on that rule read as verified, named for the signer, with the run that closed them and a reply saying so
            - The request still waits on a person; the other rule's note is untouched
            - A note addressed after the pass stays addressed - that fix is not what the person looked at
            - A fail, a walkdown signed in no role, or a machine's pass closes nothing
            - An observation is settled on the agent's word; feedback, a finding and a request refuse that ending
          statement_hash: sha256:3048447b9d59
      - id: threads.lifecycle.says-what-it-did
        origin: walkdown
        statement: A command that changes a thread reports what changed rather than printing the thread back. It says which status the thread left, which status it reached, whose name the change was recorded under, and how many replies landed.
        because: Output that looks the same whether or not anything happened is output nobody can act on.
        verify: [checks]
        steps:
          given:
            - A thread, and a command that will reply to it, transition it, or both
          when:
            - The command is run
          then:
            - One line names the thread and both ends of the move, and waiving names the person it was recorded under
            - A reply with no transition says the status did not move, rather than staying silent and letting a reader assume it did
            - Reading a thread with no flags still prints the whole conversation - reading is a different ask from changing
            - A refused change says why on the error stream and exits non-zero, so a loop over several threads can stop on the first one rather than plunging on
          statement_hash: sha256:ea3c4135ac21
          reworded:
            - hash: sha256:224b3a652a3a
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:0c1f3dff50e4
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:da7cbe35b72d
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

  - id: threads.conversation
    title: A thread reads as a conversation
    statement: As a reviewer, reading and answering feedback feels like talking - I can see who said what and when, catch up on what is new, and reply without leaving the page under review.
    rules:
      - id: threads.conversation.one-stream
        origin: walkdown
        statement: A thread is one stream of messages. The opening note is the first of them, with an author and a time like any other, and consecutive messages from one author show under a single name.
        because: A long exchange should read as talking rather than as filing.
        verify: [checks]
        signoff: [eng, product]
        screens: [thread-panel, rule-detail]
        steps:
          given:
            - A thread with an opening note and several replies
          when:
            - Open it in the panel, and beside its pin
          then:
            - Collapsed, a thread is that first message - face, name, time, what was said - with the people in it, the number of replies and when it was last touched underneath
            - The threads on a rule share one surface, divided by hairlines rather than boxed into cards or tinted with coloured rails - what waits on you is said in words, in the status and the unread count
            - Every message carries the same shape - who, when, what - and the opening note is not treated as a different kind of thing
            - A second message from the same author minutes later drops the repeated name and tile, and its time appears on hover
            - Line breaks written into a message survive, and a day boundary is drawn between messages
            - The two deliveries render a thread the same way, from one shared implementation rather than two lookalikes
            - Thread and rule ids written inside a message are links to the thing they name
            - Beside a pin, an id the popover cannot open itself links out to walkdown's own page at that thing's address, in a new tab - never a link that does nothing
            - Before you follow an id, it says what it names - under the cursor or keyboard focus, a card with the rule's statement and verdict, or the thread's status, author, age and first line, and whether the link leaves the page
          statement_hash: sha256:d3d0b129a2e7
          reworded:
            - hash: sha256:e58134b3796f
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:6b387227a957
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:38f76ce52560
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
      - id: threads.conversation.question-leads-with-the-question
        origin: thread:n-0202
        created_at: 2026-09-16
        statement: A question's first line is the question, and the thread draws it as the headline - above the context, in the list and on the thread's own screen - so what is being asked is read before anything else.
        because: A decision that needs a person is only ever answered if that person can find it.
        history: Two decisions of Topher's sat for eleven days in the middle of a note's third paragraph (n-0202), where nothing offered him a way to answer and nothing showed him the question.
        verify: [checks]
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A question whose body is the question on its first line and the context under it
          when:
            - Meet it in the threads list, open it, and read a reply on it
          then:
            - The first line is the headline of the collapsed card and of the opened thread - bolder and larger than the context beneath it
            - The context follows as the body, unchanged
            - A reply is never headlined, and a note's opening message is drawn as before
            - The preview card under the question's id leads with the same line
          statement_hash: 'sha256:68c8184ae5c9'
      - id: threads.conversation.written-in-markdown
        origin: thread:n-0288
        statement: A message is markdown, rendered from a short list of allowed elements; anything else in it is plain text.
        because: People write markdown by habit, and it reads better rendered than raw - but a body is untrusted input, so only a fixed set of elements may become markup.
        history: The 664 messages on file were already written as markdown - lists, backticks, paragraphs - and read as one pre-wrapped block; rendering them touched no byte on disk (n-0288).
        verify: [checks]
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A thread whose body carries a list, a code span, a link and raw HTML that would run
          when:
            - Open it on screen `thread-panel` and read anchor `thread.body`
          then:
            - The list is a list and the code span is code, not the markdown characters that made them
            - A link to the web opens in a new tab; a link to anything else is not a link
            - The raw HTML is text or gone - nothing in a body can run, load or style
            - A heading is not offered - a reply is not a document
            - A thread id in the prose is still a link to that thread, and the same id inside a code span is plain text
            - Plain text with line breaks reads as it did before - one line per line, no markup needed
          statement_hash: sha256:de2e900e6c17
          reworded:
            - hash: sha256:b8ec06681f9a
              at: 2026-09-14
              why: the statement is the goal in a sentence; the element list, the links and the code-span detail were the then-steps said twice (Topher, 2026-09-13)

      - id: threads.conversation.composer-stays
        origin: walkdown
        statement: The reply box stays at the bottom of an open thread. Enter sends, Shift-Enter breaks the line, and the reply is filed under whoever you are recording as.
        signoff: [eng, product]
        screens: [thread-panel, rule-detail]
        steps:
          given:
            - An open thread and a name set in Settings
          when:
            - Type a reply and press Enter
          then:
            - The message is on screen immediately, marked as sending, and settles when the server confirms it
            - A refused reply is marked as not sent and the text comes back, so nothing written is lost
            - The box asks for no name - the name a reply is recorded under stands in the thread's header, and leads to Settings
            - Typing survives a repaint - the caret is where it was
          statement_hash: sha256:5452b79a41b9
          reworded:
            - hash: sha256:fc8772c1687a
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:3559d463e994
              at: 2026-09-14T02:53:55Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)
            - hash: sha256:4b045e0c4e80
              at: 2026-09-18T03:10:58Z
              why: "composer-stays: the recorded name moved from under the box to the thread's header; the composer still asks for no name"
      - id: threads.conversation.says-whose-move
        origin: walkdown
        created_at: 2026-09-17
        statement: An open thread says whose move it is and what that party does next, and its composer offers only the moves this reader takes from here. A person's Done records verified; the agent's Done records addressed or incorporated.
        because: Every thread is waiting on exactly one of the two parties, and the composer should say which rather than offer both sides' buttons.
        history: Addressed stood beside Verify beside Waive on every thread, whoever was reading, and it read as a control panel with nothing saying which button was yours; Topher asked why a button he was never meant to press was there at all (2026-09-17). The design was settled on a canvas of every state from both seats before it was built.
        verify: [checks]
        signoff: [eng, product, design]
        screens: [thread-panel]
        steps:
          given:
            - A note the agent has not yet addressed, one it has, an open question, an answered one, and an ended thread
          when:
            - Open each on screen `thread-panel`, as a person and as the agent
          then:
            - Above the box, one line names the party whose move it is - yours, the agent's, or a person's - and says in a sentence what that party does next
            - The line is coloured by the party, not the reader - amber for a person, blue and dashed for the agent, green for a thread that has ended - so the same thread reads the same from both seats
            - A person is offered Reply and Waive on a note the agent still owes; Reopen, Waive and Done on one it has addressed; Reply, Waive and Answer on an open question; Reply, Reopen and Waive on an answered one. Done and Answer are the filled primary, Waive is the one amber, the rest are quiet
            - The agent is offered Reply and Done on what waits on it, and only Reply on what waits on a person. It is never offered Verify or Waive; a person is never offered Addressed, Settled or Incorporated
            - Done records what the seat means by it - verified for a person, addressed or incorporated for the agent - and the status chip keeps the record's own name
            - Enter sends what the box is for - the answer on a question that is yours to answer, a reply everywhere else - and the box says which
            - An ended thread offers a person Reply and Reopen, the agent Reply alone, and its line says how it ended and by whom
            - In the stream, the agent's face is a robot in a dashed ring in the agent's blue; a person's is their initials on a filled disc, marked in the corner when a machine typed their words for them - so who said what is told without reading the names
            - Nothing under the box says who you are or how to send - the name stands in the thread's header
          statement_hash: sha256:a79d09343f13
      - id: threads.conversation.new-since-you-looked
        origin: walkdown
        statement: A thread remembers where your reading stopped and marks what arrived since as new.
        because: Returning to a conversation the agent has added to should show what to read rather than ask you to find it.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A thread you have read, which has since gained replies
          when:
            - Look at the rule, then open the thread
          then:
            - The collapsed thread says how many messages are new
            - Opening it draws a line above the first message you have not seen, and the line stays put while you read
            - Your own reply is never marked new to you
            - The mark is remembered per blueprint, and survives a reload
          statement_hash: sha256:c115b84e8407
          reworded:
            - hash: sha256:e3e890cf2091
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:4dce0214cbdd
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
      - id: threads.conversation.append-only
        origin: walkdown
        statement: A conversation is append-only. A message cannot be edited or deleted, no reaction stands in for a verdict, and reopening an ended thread adds its reason and moves the status without unsaying anything.
        because: A thread is the record of what was said, and a thread that ended and came back is the same conversation.
        history: Ended and append-only were one clause for a month - "a thread that has reached its final state cannot be reopened" - until a verified thread regressed and the only honest move was a new thread that had to explain the old (Topher, 2026-09-17).
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A thread with replies, and one that has been verified or waived
          when:
            - Look for a way to change what was said
          then:
            - No message offers editing or deletion
            - Nothing offers a reaction that would mean addressed or approved without recording it
            - The ended thread shows how it ended and by whom, and a person may reopen it with a reason - the reason lands as a reply, the status goes back to open, and verified_by or waived_by stays on the file as what once happened
            - Replying to an ended thread is still possible - the record continues, the state does not
            - A recorded decision never reopens - it is a record, not a task
          statement_hash: sha256:d5a522828937
          reworded:
            - hash: sha256:06a879b1032c
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:f9bd0d576c3f
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:13405960e940
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: threads.conversation.thread-is-a-screen
        origin: walkdown
        statement: Opening a thread slides the panel to a screen of its own, one step to the right of the rule it belongs to. The way back is labelled with the name of where it leads.
        because: A conversation deserves the width, and reading one should never cost you your place.
        signoff: [eng, product]
        screens: [rule-detail, thread-panel]
        steps:
          given:
            - A rule with threads on it
          when:
            - Click the reply count under a thread
          then:
            - The panel slides one screen to the right, and the thread has the whole column - stream, and a composer pinned at the foot
            - Back slides the same way it came and names its destination - the rule, or the rules list for a pin attached to none
            - Ending a thread from its screen - verifying, waiving, incorporating - slides back to the rule and says what happened, rather than emptying the screen and stranding the reader on a blank one
            - The screen is never a dead end - a thread that is gone still leaves the way back
            - The surface under review does not move - reading a conversation is not a walkdown step
            - A pin clicked on the page opens the same screen, wherever you were
          statement_hash: sha256:033a338bf6bb
          reworded:
            - hash: sha256:9971d7aaef65
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:bfa90fd6ebab
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:6d4f25afd8de
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
