# walkdown's own screens.
#
# walkdown has no running page to point the App surface at: the running build
# IS the panel you are holding, which cannot frame itself. So each screen's
# app path is an AS-BUILT drawing (ADR 0007): the panel's own markup as it was
# actually built, kept under as-built/ in its own theme and marked on
# its face, while prototype/ stays as design drew it - so the slider shows
# the distance between what was designed and what was built. Until 2026-09-18
# the app path was a stand-in, the design served back as the app; that
# feature stays in walkdown for projects that want it. Neither is the build,
# and neither is evidence that one exists.
# Where a surface goes when nothing else says. A blueprint is about a product,
# and a product has a front door — so crossing between the design and the build
# is possible from anywhere, not only from a page walkdown already recognises.
default_screen: review

screens:
  - id: review
    title: The review page
    prototype: /screens/review.html
    app: { path: /as-built/review.html }
    anchors:
      - panel.legend
      - panel.skip
      - panel.bar
      - panel.desk
      - panel.desk-tuner
      - panel.project
      - panel.blueprint
      - panel.fade
      - panel.viewport-toggle
      - panel.pin-mode
      - panel.pin-why
      - panel.walk
      - panel.continue
      - panel.actor
      - panel.actor-handle
      - panel.app-frame
      - panel.zoom
      - panel.tabs
      - panel.screen-picker
      - panel.screens-list
      - panel.rules-list
      - panel.rules-search
      - panel.rule-tiers
      - panel.threads-list
      - panel.thread-filter
      - panel.counts
      - panel.judged

  - id: rule-detail
    title: Rule detail (state — open a rule on the Rules tab)
    prototype: /screens/rule-detail.html
    app: { path: /as-built/rule-detail.html }
    # Anchors that moved (q-0252): a thread filed under the old name still
    # resolves through here, still shows the name it was filed under, and
    # says it was renamed. Oldest name on the left; chains are followed.
    renames:
      detail.screenshots-modal: detail.evidence-modal
      detail.screenshots: detail.evidence
    anchors:
      - detail.screen
      - detail.ask
      - detail.back
      - detail.stepper
      - detail.rule-id
      - detail.statement
      - detail.because
      - detail.history
      - detail.verdict
      - detail.feedback
      - detail.conversation
      - detail.stream
      - detail.turn
      - detail.evidence
      - detail.setup
      - detail.steps
      - detail.technical-disclosure
      - detail.evidence-open
      - detail.evidence-modal
      - detail.verify

  - id: thread-panel
    title: The thread screen (state — open a thread, or a pin)
    prototype: /screens/thread-panel.html
    app: { path: /as-built/thread-panel.html }
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close

  - id: start
    title: First run (state — no server connected)
    prototype: /screens/start.html
    app: { path: /as-built/start.html }
    anchors:
      - start.message
      - start.server
      - start.connect

  - id: unclaimed-page
    retired: >-
      Folded into project-modal (2026-09-09, ADR 0001 §7). "Nothing claims this
      page" turned out to be one of three ways the address can fail to decide -
      the others being several projects claiming it and there being no page to
      route from at all - and three screens asking one question were three
      places for the answer to differ.
    title: No blueprint claims this page (state — connected, nothing claims it)
    prototype: /screens/unclaimed-page.html
    app: { path: /as-built/unclaimed-page.html }
    anchors:
      - start.unclaimed
      - start.claim
      - start.new
      - start.options

  - id: project-modal
    title: Which project? (state — the address cannot decide on its own)
    # Promoted from proposals/project-modal.html on 2026-09-10 (n-0271), so the
    # screen can be walked down against a design rather than against nothing.
    prototype: /screens/project-modal.html
    app: { path: /as-built/project-modal.html }
    anchors:
      - project.modal
      - project.address
      - project.why
      - project.commands
      - project.new
      - project.list
      - project.claims
      - project.close

  - id: choose-blueprint
    title: Choose a blueprint (state — folder holds several)
    prototype: /screens/choose-blueprint.html
    app: { path: /as-built/choose-blueprint.html }
    anchors:
      - start.folder
      - start.options

  - id: docked
    retired: The docked delivery was withdrawn on 2026-08-26. walkdown frames the page it reviews; nothing renders beside it any more.
    title: The docked layout (withdrawn 2026-08-26)
    prototype: /screens/docked.html
    app: { path: /as-built/docked.html }
    anchors:
      - docked.page

  - id: settings
    title: Settings (state — open the gear)
    prototype: /screens/settings.html
    app: { path: /as-built/settings.html }
    anchors:
      - settings.panel
      - settings.actor
      - settings.display-name
      - settings.timezone
      - settings.dials
      - settings.hide
