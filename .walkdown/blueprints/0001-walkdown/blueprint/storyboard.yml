# walkdown's own screens.
#
# walkdown has no running page to point the App surface at: the running build
# IS the panel you are holding, which lives beside whatever page it rides. That
# left the app side of every comparison empty - no fade, no ghost, no pin on
# the app. So each screen's app path is a STAND-IN: the server serves the
# screen's own design back under /stand-in/<id>, in a different theme and
# marked as such (see lib/serve.js). It makes the comparison machinery usable
# for judging the panel; it is not the build, and never evidence that one
# exists.
# Where a surface goes when nothing else says. A blueprint is about a product,
# and a product has a front door — so crossing between the design and the build
# is possible from anywhere, not only from a page walkdown already recognises.
default_screen: review

screens:
  - id: review
    title: The review page
    prototype: /screens/review.html
    app: { path: /stand-in/review }
    anchors:
      - panel.legend
      - panel.bar
      - panel.desk
      - panel.desk-tuner
      - panel.project
      - panel.blueprint
      - panel.fade
      - panel.viewport-toggle
      - panel.pin-mode
      - panel.pin-why
      - panel.walk
      - panel.continue
      - panel.actor
      - panel.actor-handle
      - panel.app-frame
      - panel.zoom
      - panel.tabs
      - panel.screen-picker
      - panel.screens-list
      - panel.rules-list
      - panel.rules-search
      - panel.rule-tiers
      - panel.threads-list
      - panel.thread-filter
      - panel.counts
      - panel.judged

  - id: rule-detail
    title: Rule detail (state — open a rule on the Rules tab)
    prototype: /screens/rule-detail.html
    app: { path: /stand-in/rule-detail }
    anchors:
      - detail.screen
      - detail.back
      - detail.stepper
      - detail.rule-id
      - detail.statement
      - detail.verdict
      - detail.feedback
      - detail.evidence
      - detail.setup
      - detail.steps
      - detail.technical-disclosure
      - detail.evidence-open
      - detail.evidence-modal
      - detail.verify
      - detail.threads

  - id: thread-panel
    title: The thread screen (state — open a thread, or a pin)
    prototype: /screens/thread-panel.html
    app: { path: /stand-in/thread-panel }
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close

  - id: start
    title: First run (state — no server connected)
    prototype: /screens/start.html
    app: { path: /stand-in/start }
    anchors:
      - start.message
      - start.server
      - start.connect

  - id: unclaimed-page
    retired: >-
      Folded into project-modal (2026-09-09, ADR 0001 §7). "Nothing claims this
      page" turned out to be one of three ways the address can fail to decide -
      the others being several projects claiming it and there being no page to
      route from at all - and three screens asking one question were three
      places for the answer to differ.
    title: No blueprint claims this page (state — connected, nothing claims it)
    prototype: /screens/unclaimed-page.html
    app: { path: /stand-in/unclaimed-page }
    anchors:
      - start.unclaimed
      - start.claim
      - start.new
      - start.options

  - id: project-modal
    title: Which project? (state — the address cannot decide on its own)
    # No design yet. The panel ships this screen; prototype/ has nothing to
    # compare it against, and prototype/ is design's. The sketch is
    # proposals/project-modal.html and the request is the thread anchored here
    # (ownership.drift.design-requests-required).
    prototype: null
    anchors:
      - project.modal
      - project.address
      - project.why
      - project.commands
      - project.new
      - project.list
      - project.claims
      - project.close

  - id: choose-blueprint
    title: Choose a blueprint (state — folder holds several)
    prototype: /screens/choose-blueprint.html
    app: { path: /stand-in/choose-blueprint }
    anchors:
      - start.folder
      - start.options

  - id: docked
    retired: The docked delivery was withdrawn on 2026-08-26. walkdown frames the page it reviews; nothing renders beside it any more.
    title: The docked layout (withdrawn 2026-08-26)
    prototype: /screens/docked.html
    app: { path: /stand-in/docked }
    anchors:
      - docked.page

  - id: settings
    title: Settings (state — open the gear)
    prototype: /screens/settings.html
    app: { path: /stand-in/settings }
    anchors:
      - settings.panel
      - settings.actor
      - settings.display-name
      - settings.dials
      - settings.hide
