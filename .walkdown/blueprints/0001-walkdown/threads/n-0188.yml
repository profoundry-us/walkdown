kind: note
author: topher
via: agent
created: 2026-09-04T21:08:13.391Z
anchor:
  rule: locations.answer.one-walkdown-answers
status: addressed
body: >-
  A hand-written PERSONAL entry crosses the boundary the committed one is
  refused for, and one .walkdown's server then lists, serves and writes to
  another's ledger.


  Fixture: mono/ (git repo, .walkdown declares `mono`), mono/packs/app/ (its own
  .walkdown declares `app`), and a pinned personal home. Everything the steps
  ask for holds: the nearest .walkdown answers from each side, neither sees the
  other's projects even with --project, a third .walkdown above the repository
  is never consulted, each server offers only its own list and refuses the
  other's blueprint by id AND by key, and every writer refuses the crossing -
  `project add` of the pack's blueprint from the root, --ephemeral of an
  original from inside or outside a repo, and even listing a wholly separate
  repository's blueprint personally (evidence keys
  runs/evidence/2026-09-04T20-48-18Z/one-walkdown-answers-01-nearest.txt,
  -02-third-above.txt, -03-servers.txt, -04-writers-refuse.txt). The committed
  hand-written entry q-0168 is about is held on every surface: refused on read,
  named on `where`, reported by lint, invisible to projects and to the server
  (-05-committed-held.txt).


  What is open is the same entry written into ~/.walkdown/config.yml instead.
  readUserConfig filters the crossing only out of the COMMITTED half
  (lib/locations.js, `const committed = (shared.projects ?? []).filter(...)`),
  and lint reads only the config of the .walkdown that answered (lib/lint.js).
  So a personal row naming the pack's own blueprint outright is accepted
  everywhere: `walkdown projects` at the repository root lists it beside `mono`;
  `where --project pcross` resolves the pack's spec, runs, threads, evidence and
  drafts, and prints, in the same block, that it refuses the identical committed
  entry; lint at the root and inside the pack are both silent; and the server
  started in mono/ offers it in /api/blueprint, serves it at ?bp=pcross, and a
  POST /api/threads there wrote n-0001 into the PACK's threads directory, where
  the pack then reads a thread it never filed (-06-personal-open.txt).


  That is the harm the statement names - one board listing, serving and writing
  to another's ledger - reached through a file walkdown itself will not write it
  into. The committed side was closed by refusing the row on read plus a lint
  error; the personal side has neither. Worth deciding as part of the fix:
  whether a personal row whose spec lies under some other .walkdown should be
  set aside like a stray relative path (with an `ignored` line on `where`), or
  refused only when that .walkdown is not the one answering where you stand -
  the writers already take the first, stricter line, since `project add` refuses
  it from anywhere.
replies:
  - author: topher
    via: agent
    created: 2026-09-05T04:18:39Z
    body: >-
      Topher's decision, 2026-09-05: refuse it in both files.


      The personal half gets the same filter the committed half already has — a
      row naming a blueprint that lives under another `.walkdown` is set aside
      and named on the report, rather than honoured. `readUserConfig` currently
      applies the crossing filter only to the committed half (lib/locations.js),
      and lint only ever reads the config of the `.walkdown` that answered, so
      both ends want fixing.


      What settles it is not the harm on its own but the contradiction:
      `walkdown where` prints, in one block, that it resolves the personal row
      and refuses the byte-identical committed one. A tool that answers the same
      question two ways in the same breath is worse than one that is merely
      strict.


      The way to reach a nested pack stays what it always was: stand in that
      checkout, or list a throwaway copy with `--ephemeral`.


      Left open until it is built.
  - author: topher
    via: agent
    created: 2026-09-05T23:23:18Z
    body: >-
      Built, in the commit that carries this reply.


      `readUserConfig` now applies the crossing filter to the personal half too:
      a row whose spec lies under another `.walkdown` is set aside, named on
      `where`, and never seen downstream as a project. Two directories stay a
      row's own to declare from — the personal home itself, because blueprints
      kept out of a repository live under it and that file IS its config; and
      the `.walkdown` answering where you stand, because that is what standing
      in a checkout means.


      One refinement the tests forced, and it is worth writing down: the refusal
      only fires when that other `.walkdown` actually has a `config.yml`. A
      directory holding homes and no config declares nothing, so nothing there
      is claiming the spec and the personal row is its only declaration — a
      monorepo pack whose entries a person keeps personally, not a boundary
      crossing. The harm you measured needs somebody on the other side: in your
      fixture the pack's own config declared the blueprint, and two boards then
      listed, served and wrote to one ledger.


      `walkdown lint` reads the personal file now as well. It had only ever read
      the config of the `.walkdown` that answered, which is why both sides of
      the repository were silent.


      The contradiction you named is gone: `where` refuses the personal row and
      the byte-identical committed one in the same block, in the same words, and
      points at the same two ways through — stand in that checkout, or list a
      copy with `--ephemeral`.


      Tested with your fixture: a personal `pcross` naming a pack's own
      blueprint is absent from `projects`, unresolvable by `--project`, named on
      `where` with the ephemeral hint, and a lint error against the personal
      file — while standing in the pack still simply works.
