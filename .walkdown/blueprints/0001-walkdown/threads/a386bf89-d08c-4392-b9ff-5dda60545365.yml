    created: 2026-10-06T03:48:58Z
    body: The Playwright checkspace serves a copy of the cli home now, as
      0003-cs-cli. The three checks open their rules there, and all 90 checks
      pass (run 2026-10-06T03-48-31Z-local-01). The two choose-a-blueprint
      checks fake their claims from two of the three blueprints.
