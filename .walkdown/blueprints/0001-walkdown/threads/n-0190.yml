body: |-
  Provenance holds as a rule about currency and fails as a rule about the record: in the layout `walkdown init` now produces by DEFAULT, a run carries no git_sha and no tree_hash at all, so there is nothing for a person digging into a verdict to look at.

  Reproduced end to end in runs/evidence/2026-09-04T20-48-27Z/provenance-not-currency-probe-d-missing-git-sha.txt: a throwaway project, code in a clean git repository at 713cda4, home in ~/.walkdown. `walkdown where code` names the repository; `walkdown run` records only spec_hash. The same project after `init --commit spec` records git_sha 6d5e2cd on the very next run.

  The cause is one argument in lib/run-record.js: writeRunRecord (and writeSweep) call gitSha(blueprintDir) and treeHash(blueprintDir), asking the BLUEPRINT directory — which outside the repository is ~/.walkdown and no repository at all. lib/locations.js already resolves this: `code` is documented as the repository "for the report and for git_sha" (line 1233) and its null case says "runs will carry no git_sha" (line 1340). Nothing asks it. lib/skills/walkdown-judge.md:78 tells a hand-driven judge to record "the repository holding the CODE", so the automatic emitters and the skill disagree about the same field.

  The other half of the rule holds under everything tried (probe-ab, probe-c): three commits touching neither rules nor code, an untracked file, and a history rewrite that made the recorded sha unreachable left `status --json` byte-identical and every run file unchanged, while rewording a statement and `sweep --tiers agent` each moved exactly one cell.
