body: Also, we probably need a way to attach screenshots to a pin or thread;
  let's add that as a new thread somewhere relevant
added: >-
  A pin should be able to carry a screenshot. Some feedback is a picture: this
  overlaps awkwardly, this is cut off, this is the wrong shade — and describing
  it in a sentence is slower and less exact than showing it. n-0072 is the case
  in point; the geometry bug in it was obvious in one image and would have taken
  a paragraph to write down.


  Two halves worth separating. A person pinning on a page should be able to
  attach an image, probably by paste from the clipboard, since that is where a
  screenshot already is. And an agent walkdown already captures evidence images
  into runs/evidence/ — those should be reachable from the thread they belong to
  rather than only from the run record.


  Open: where the bytes live (runs/evidence/ is the only precedent), whether a
  thread references an image or embeds it, and what the panel shows in the
  stream — a thumbnail that opens, most likely. Not designed.
reason: feedback
