  - author: agent
    created: 2026-09-21T02:57:16Z
    body: Built. A screenshot pasted into the pin form, or into a thread's composer
      on its own screen, goes on the message. The bytes live in attachments/
      under the threads directory, beside the records, so a moved ledger takes
      them along. The record names the file and the name it was pasted with. The
      stream draws the picture under the words as a thumbnail that opens full
      size over the desk. The CLI takes --attach <file> on thread new and on a
      reply, and lists the pictures when it reads a thread. Pictures only, four
      at most, under five megabytes each; anything else is refused in words.
      Rule embed.threads.picture-on-a-pin holds the checks (recorded
      2026-09-21T02-56-48Z).
