body: Having the full thread in the rule is far too much to scroll through;
  let's just show the last note with a button to click to open the entire
  history (slide it in from the right like the other ones do). Any questions
  that are asked should appear at the bottom of both screens (Rule detail and
  thread) so a user can answer from either place.
added: Filed from Topher's list, 2026-09-21. The ask card already stands above
  the composer on the rule; this moves it to the foot of both screens and
  collapses the stream to its last message with the history a slide away - a
  change to the one-conversation rule's steps.
