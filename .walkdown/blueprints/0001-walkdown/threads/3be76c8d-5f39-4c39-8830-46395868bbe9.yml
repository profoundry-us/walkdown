    created: 2026-10-10T18:35:21Z
    body: Let's use design everywhere, but note in the docs it is almost always a
      prototype when we can make it one.
    answer: true
  - author: agent
    created: 2026-10-10T18:53:26Z
    body: "Design everywhere: ADR 0015 §1 now says the artifact is called a design
      on screen and on disk, and the docs say it is almost always a prototype."
