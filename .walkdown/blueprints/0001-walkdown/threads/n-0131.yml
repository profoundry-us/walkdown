    body: "Re-judged 2026-09-01, run 2026-09-01T01-06-52Z-local-01: PASS. Re-drove
      walkdown where under a scratch WALKDOWN_HOME through the four situations
      this note names and seven more (bare repo, in-tree with runs/ present and
      threads/ absent, config-named spec outside any repository with a per-kind
      override, cross-repo spec, no-git directory, --dir same- and cross-repo,
      defaults: with {id}, unreadable config, legacy projects/<id>/ home,
      single-kind form, and the real project's answer). The code row now names
      its actual decision in all three of its situations: 'the git repository
      the spec sits in' only where true, 'the working directory's repository -
      the spec sits outside any repository' in the fresh-adopter shape this note
      failed on (measured in probe-a-bare.txt and probe-c-config-outside.txt:
      the same screen shows the spec allocated to the personal home and the code
      row explaining itself against it, no contradiction left), and 'no git
      repository - runs will carry no git_sha' with no path when there is none.
      Every other row still names its deciding rule, --json carries the same why
      strings, and a broken config degrades with the parse error printed
      verbatim. Evidence under runs/evidence/2026-09-01T01-06-52Z/ (fourteen
      files). While verifying the cross-repo code row against what runs actually
      record I found an adjacent provenance gap - git_sha is computed from the
      spec's directory, not the roots-named code repo - filed as n-0134 against
      locations.travel.provenance-not-currency rather than here, because the
      where answer reports the resolver's real choice honestly."
