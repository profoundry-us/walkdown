id: n-0213
kind: note
author: topher
via: agent
created: 2026-09-06T01:04:41.362Z
anchor:
  rule: locations.answer.one-walkdown-answers
status: addressed
body: >-
  A blueprint that lives in the PERSONAL home is refused as a boundary crossing
  whenever any .walkdown with a config.yml sits above that home — so `walkdown
  init --commit none` can create a project its own checkout cannot then see.


  Repro (runs/evidence/2026-09-06T00-44-21Z/personal-home-refused.txt): with
  WALKDOWN_HOME redirected to <app>/tmp/test-home (the shape this repo's own
  runner uses: `WALKDOWN_HOME=tmp/test-home`), `walkdown init --dir app --commit
  spec` then `cd other && walkdown init --commit none`. init reports `+ listed
  .../tmp/test-home/config.yml as \`other\`` and puts the home there. From
  `other`, `walkdown projects` says "No projects", `status`/`lint`/`serve` all
  say nothing claims this directory, and `where` prints "walkdown where — other"
  above a block that refuses it: "its spec
  .../tmp/test-home/blueprints/0001-other/blueprint lies under <app>/.walkdown,
  which answers for it". The same happens when the personal home is itself named
  .walkdown (lab2 shape): a personal home at <top>/home/.walkdown with a
  .walkdown at <top> loses every blueprint it holds, in every checkout below
  <top> except <app> itself.


  The rule's own step says a row may name a blueprint under "the personal home,
  whose config that file is" — and lib/locations.js:785 encodes exactly that (`t
  === mineToDeclare`). It is unreachable: `theirs` comes from walkdownRoot(),
  which skips the personal home by construction (lib/locations.js:604,
  `resolve(mine) !== personal`), so a spec inside the personal home is always
  attributed to the next .walkdown ABOVE it. The clause only appears to hold in
  the default layout, where nothing sits above ~/.walkdown and walkdownRoot
  returns null first. Two smaller consequences: the refusal names a directory
  the spec does not actually lie under, and `where` prints the project's name in
  its header while every row below says nothing declares it.


  Everything else in the rule held under the same probing — see
  runs/evidence/2026-09-06T00-44-21Z/boundary-holds.txt and server-scope.txt.
replies:
  - author: topher
    via: agent
    created: 2026-09-06T01:24:03Z
    body: "Confirmed and not fixed — this needs a decision about what the exemption
      is FOR, and I would rather ask than guess. Your mechanism reading is
      right: lib/locations.js encodes it as `t === mineToDeclare` while `theirs`
      comes from walkdownRoot(), which by construction never returns the
      personal home — so the exemption is unreachable, and it only looks like it
      holds because the default ~/.walkdown has nothing above it and
      walkdownRoot returns null first. The reason I am not just widening the
      test: the crossing guard exists so that one .walkdown never answers for a
      blueprint living under another, and a personal home nested inside a
      checkout is precisely the shape where 'which .walkdown answers' has two
      defensible answers. The arrangement you reproduced — WALKDOWN_HOME inside
      a repo, which is what this project's own test runner does — is common
      enough that refusing it silently is bad, but so is having the pack's
      .walkdown and the personal home both claim it. Two ways out, both design:
      make the exemption reachable by testing against walkdownHome() before
      walkdownRoot() ever runs, so a personal home always wins for its own
      blueprints; or refuse a personal home nested under a declaring .walkdown
      at init time, loudly, rather than accepting it and then answering 'nothing
      claims this directory' forever after. The second is more honest and more
      disruptive. Worth noting the failure mode is the bad one either way: init
      prints '+ listed ... as other' and then every command says nothing claims
      the directory, so the tool contradicts itself within two commands."
  - author: topher
    via: agent
    created: 2026-09-06T16:49:02Z
    body: >-
      Fixed in the commit above, with your answer: the personal home always wins
      for its own blueprints. A new insidePersonalHome() is consulted before
      walkdownRoot ever runs, at both places the crossing is tested — the entry
      writer (lib/locations.js, the paths.spec guard) and the reader's
      crosses(). Verified end to end in the layout you reproduced: WALKDOWN_HOME
      inside a checkout that declares its own, then init --commit none from a
      sibling — projects now lists it, status answers for it, and where no
      longer prints the project's name above a block refusing it.


      The guard this must not have broken is covered in the same test: a pack
      carrying its own .walkdown is still nobody else's to declare, so n-0188's
      failure stays closed. I did not touch the committed-entry path at line
      ~895 — a repo config reaching into the personal home is a different
      question and nothing has asked it yet.


      Test: test/locations.test.js, 'a blueprint in the personal home answers,
      whatever sits above that home'.
