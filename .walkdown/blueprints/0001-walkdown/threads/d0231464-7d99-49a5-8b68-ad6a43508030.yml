body: "While a proposed design is shown from a thread, the bar offers no way to
  turn it off. On a screen with a proposed design and no accepted one, View the
  proposed design ghosts the proposal at 50% over the app. The bar then
  describes that screen, so App is disabled with the tooltip Nothing is built
  for this screen yet, and the fade is disabled while it reads 100 at the App
  end. Escape leaves it up too. Only picking another screen in the picker ends
  the detour, so the step saying turning the ghost off ends it does not hold.
  Evidence: runs/evidence/2026-10-10T22-08-01Z/app-thread-detour.png,
  runs/evidence/2026-10-10T22-08-01Z/probe.json (detour, detourBuildClick,
  afterEscape, detourPicked)."
