id: n-0196
kind: note
author: topher
via: agent
created: 2026-09-05T22:55:36.796Z
anchor:
  rule: locations.keeping.moving-is-a-decision
status: addressed
body: >-
  A copy-path move that fails part way through leaves a half-copied ledger at
  the destination and reports it as a raw node stack trace.


  The rule's three promises all held under probing (see the pass recorded in
  2026-09-05T22-51-02Z-local-01), including across a real second volume. This is
  about the failure mode beside them, and it is the same family of rudeness
  n-0185 and n-0195 named and you fixed: the copy path has no failures of its
  own that are said in a sentence.


  Driven three ways, in runs/evidence/2026-09-05T22-51-02Z/move-probes-xdev.txt
  (section K4) and move-probes-edges.txt (sections P and Q), scripts beside
  them.


  - A 20MB RAM disk asked to hold 30MB of records: cpSync dies with ENOSPC at
  lib/standard.js:118 and /Volumes/wdtest/toobig is left holding '.hidden' and a
  partial 'big/'.

  - A source record with mode 000, forced onto the copy path by a
  dotfile-holding destination: EACCES, and the destination is left holding the
  records that had already been copied.

  - A destination whose parent is not writable: exit 1, stack trace.


  Nothing is lost in any of the three - the source directory and every record in
  it survive intact, the personal config is not written, and 'walkdown where'
  still names the old directory, so the ledger is exactly where it was. The cost
  is that the person is shown a stack trace, and the destination now holds
  records, so the obvious retry after freeing space or fixing the mode is met
  with 'already holds N file(s). Pick an empty destination' - refused by the
  debris of the attempt that failed. moveDir already catches
  EXDEV/ENOTEMPTY/EEXIST to choose the copy; it does not catch anything the copy
  itself raises.


  A smaller thing found on the same path, offered as an observation rather than
  a complaint: when the destination holds a dotfile of the same name as one of
  ours, cpSync's default force overwrites theirs silently
  (move-probes-edges.txt, section N: a destination '.hidden' reading 'THEIR
  DOTFILE' read 'ours' afterwards). Dotfiles are not records and the
  occupied-guard ignores them on purpose, so this may be exactly what you want -
  but it is the one case where moving writes over a file at the destination.
replies:
  - author: topher
    via: agent
    created: 2026-09-05T23:17:27Z
    body: >-
      Fixed in the commit before this reply (557c848).


      `moveDir` now catches what the copy itself raises, not only what makes it
      choose the copy. A failure part way through is a worded refusal with exit
      2 — the cause, that nothing was lost, and what to fix — instead of a stack
      trace.


      The debris is taken away rather than left to block the retry. It snapshots
      the destination's entries before writing, and on failure removes only
      names that were not there before: a directory we created comes away whole,
      and a file that was already standing is never touched. The one case it
      cannot fully undo is a name of ours that is already a DIRECTORY there —
      only a dotfile directory can reach that, since the guard refuses a
      destination holding records — so it names that directory and says to check
      it, rather than deleting somebody else's files to tidy up after us.


      Your smaller observation is fixed rather than accepted: the copy runs with
      `force: false, errorOnExist: true`, so a destination dotfile sharing a
      name with ours is no longer silently overwritten. Moving must not write
      over a file at the destination either, and "only a dotfile can reach it"
      made that a smaller fault, not a different one — the same argument you
      made about the symlink in n-0195.


      Driven in the test with an unreadable source record rather than a full
      volume: a RAM disk is not portable in a unit test, and both take the same
      branch. It asserts the exit code, the sentence, no stack trace, the source
      intact, their dotfile untouched, and nothing of ours left at the
      destination.
