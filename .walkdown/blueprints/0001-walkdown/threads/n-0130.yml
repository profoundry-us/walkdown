    body: "Re-judged in run 2026-09-01T01-06-33Z-local-01 at 3d72f2a: PASS - both
      breaches this note recorded are closed, measured by walking through the
      gate again on a fresh scratch copy (rj-lcna), sha256-checking each thread
      file after every attempt. The CLI no-actor door: bare --verify and --waive
      with WALKDOWN_ACTOR unset, --actor '' and '   ', and empty or whitespace
      WALKDOWN_ACTOR now all exit 2 with 'recorded under a person's name... the
      machine username is not a decision' - the username substitution this note
      caught is gone, and the differently-spelled --status verified/waived path
      refuses identically. The capital-letter door: Agent, AGENT, aGeNt and
      padded ' agent ' refuse 'requires a named human actor' at the CLI (flag
      and env) and 400 over POST /api/threads/<id>/status alike; HTTP also
      refuses absent, empty, whitespace, null and trailing-newline actors, every
      attempt leaving the thread file byte-identical. Controls show the gate is
      the actor, not the state: 'agent' still claims open to addressed at both
      doors, and 'Probe Human' verified and waived the very threads the agent
      was refused on, from the same states, landing verified_by/waived_by on
      disk. Nineteen CLI and sixteen HTTP attempts in all. Evidence:
      runs/evidence/2026-09-01T01-06-33Z/cli-gate.txt,
      runs/evidence/2026-09-01T01-06-33Z/http-gate.txt."
