added: "Seen on rule detail during a walkdown on 2026-09-18: the tiers tooltip
  (panel.rule-tiers-tip) opens upward from the detail head and its top rows
  disappear under the 'Recording as … Continue' strip, so 'checks' and the start
  of 'agent' cannot be read. Topher's own screenshot shows it; my headless
  reproduction did not raise the tooltip, so the saved shot is only the area it
  happens in - runs/evidence/2026-09-19T03-44-37Z/rule-tiers-tip-area.png.
  Likely the strip stacks above the pane, or the tooltip's z-20 is scoped to the
  scrolling pane. Noted, not fixed - Topher is mid-walkdown."
replies:
  - author: agent
    created: 2026-09-19T03:58:47Z
    body: "Topher's own screenshot, pulled from his Screenshots folder (2026-09-18
      10:40 PM): runs/evidence/2026-09-19T03-44-37Z/rule-tiers-tip-clipped.png.
      The tooltip's top rows - checks, and the head of agent - are under the
      Recording-as strip. The placeholder area shot is withdrawn."
  - author: agent
    created: 2026-09-21T01:19:44Z
    body: Fixed. On the rule detail the strip's bubble now hangs from the strip's
      top edge instead of centring on it (tierMarks takes tipDown, set only by
      rule-detail, and sets daisyUI's own
      --tt-inset/--tt-trans/--tt-tail-inset). The strip is the first thing in a
      pane that scrolls, so a centred bubble ran up out of the pane's clip and
      under the Recording-as strip - it was the pane's overflow, not a z-index.
      A check hovers the strip on an open rule and asserts the bubble's box lies
      inside the pane's.
