anchor:
  rule: panel.rules.steps-not-an-appendix
status: open
body: >-
  The then/given/when clauses are separate strings in the data (steps.given,
  steps.when, steps.then are each an array), but the detail pane joins them with
  <br> — see src/panel/rule-detail.js around the steps builder. On screen they
  read as a wrapped paragraph run, so where one clause ends and the next begins
  is only legible by where the line happens to break, and a clause long enough
  to wrap looks like two.


  Topher wants them shown as bullet points, one bullet per clause. The data
  supports it as-is: no schema change, no migration, just a list in place of the
  <br> joins. Worth keeping the phase label (given/when/then) where it sits and
  bulleting only the items under it.
