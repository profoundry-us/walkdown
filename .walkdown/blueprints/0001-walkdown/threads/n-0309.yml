id: n-0309
kind: note
reason: feedback
author: topher
created: 2026-09-19T03:59:41.381Z
anchor:
  rule: panel.walkdown.one-control-owns-the-sitting
status: addressed
body: >-
  1. This sitting only

  2. Record the skip

  3. Yes, we need skip to be a valid option on a rule in any state and a user
  may fill out additional details if they desire to provide additional context;
  but the we should not require it.

  4. Let's rework the top bar a bit that shows the current walkdown progress.
  Remove the username after the "Recording as" since we already have the full
  name (if we have no full name, then we can show the username instead). Remove
  the "as" and "," from "as eng, product, design"; just list all roles being
  signed, one on each line. Remove the "8/45 judged"; make the "+8" in the
  bottom show "+8/45" with the same hover tooltip. Put a skip button to the left
  of the continue button; make it a regular button similar to reply so it has
  less visual priority. And remove the "37 walk" badge at the bottom right now
  that we have more info directly in the list view. And move the Legend all the
  way to the right.
replies:
  - author: agent
    created: 2026-09-21T01:26:24Z
    body: "Built, all four. (1-3) Skip sits beside Continue in the sitting's strip,
      as quiet as Reply: it takes the open rule out of the sitting's count, the
      run records it as skipped, and anything in the box goes on the rule's
      conversation as the reason - optional. On the board the rule is untouched:
      lib/status.js reads a person's skip as a record of not judging, so a
      signed rule stays signed and an owed one stays owed and comes round next
      sitting. Any state can be skipped. The row wears ↷ for it while the
      sitting runs. (4) The strip shows the name you go by only - the username
      is a hover away and in Settings; the roles list one per line with no 'as'
      or commas, and a proxied role says 'for <signer>' on its line; '8/45
      judged' is gone from the strip and the footer's +8 reads +8/45 with the
      same explanation; the walk badge is gone and the Legend sits at the right
      edge. Rule steps updated, a check drives Skip end to end, a unit test
      covers the ledger half. Answers q-0315."
