body: >-
  And let's do this:


  1. If the user opens a page, and clicks the Walkdown extension, and we don't
  know which project claims it, then:
     1. The app-frame should load and show the requested page
     2. The panel should load but have no tabs and have a simple "Please select a project..." message centered vertically and horizontally
     3. We should then load the Project modal above that and use the `bg-blur` Tailwind class to make sure the app-frame and the panel are both blurred out, and we can add the dimmer if we think that helps too
  2. If the user visits the walkdown server URL directly, then:
     1. We load only the desk ruling background (no app frame, no panel, no top actions)
     2. We load the project selector modal with the same bg-blur / dimmer as the other one
  3. If the user is in a loaded project / blueprint and selects the project
  switcher, then:
     1. We show the app-frame as-is
     2. We show the panel as-is
     3. We load the project selector modal with the same bg-blur / dimmer as the other cases


  Does this make sense? Did we miss anything? This is essentially saying it's
  two pages, but it uses the same modal component (and bg component)?


  Let's get rid of the dim since it seems to be causing issues, the blur should
  be sufficient.


  Yes, reword `panel.start.which-project`.
added: >-
  Design request - the drawing and the build now disagree about this screen in
  three ways, and none of them is a build defect.


  panel.start.which-project was reworded today (statement_hash
  sha256:fb4343377bab) to say what Topher settled on 2026-09-10.
  prototype/screens/project-modal.html was promoted from
  proposals/project-modal.html on 2026-09-10 (n-0271) and still draws the
  earlier idea. prototype/ is design's, so this is a request rather than an
  edit.


  WHAT THE DRAWING SAYS NOW. A dimmed empty-state bar across the top, a flat
  bg-base-300/70 scrim under the card, and nothing else - no framed page, no
  side panel.


  WHAT THE RULE SAYS NOW.


  1. The backdrop is a blur and nothing else. The dim is gone - it was
  bg-base-300/70, it painted nothing at all (n-0276), and the decision was to
  drop it rather than repair it, because a dim over a blur buys legibility the
  blur already bought. The build is on backdrop-blur-sm and it paints.


  2. There are three substrates under one modal, not one. Arriving on a page
  nothing claims leaves the page loaded in the frame and the panel open, both
  blurred. Walkdown's own server root has no frame, no panel and no bar - the
  desk ruling alone, and nothing behind the modal to blur. The switcher pressed
  inside a loaded project leaves that project's board exactly as it was,
  blurred, and gives it back on Escape. The drawing currently shows something
  close to none of these - a bar with no page and no panel under it.


  3. The panel in the arrival case has no tabs and one centred line, "Please
  select a project...". It is explicitly a fallback rather than the design -
  what a reviewer reads if the blur does not paint - so it needs to be drawn as
  something quiet, not as a feature. It replaces a pane that presently asserts
  three things that are false in that state ("Not connected" while connected,
  "This project holds more than one blueprint" while listing one, "Which
  blueprint?" while the modal asks which project).


  WHAT WOULD SETTLE IT. Either one drawing showing the arrival case with the
  frame and the blurred empty panel behind it, plus a second showing the server
  root on the ruling alone - the switcher case being the arrival case with a
  real board behind it - or a decision that the promoted drawing covers the
  server root only and the other two are drawn separately.


  I have not touched prototype/ or proposals/. Say the word and I will put a
  proposal up for the two cases rather than leaving design to start from the
  reworded prose.
