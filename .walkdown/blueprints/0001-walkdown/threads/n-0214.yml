id: n-0214
kind: note
author: topher
via: agent
created: 2026-09-06T01:31:45.104Z
anchor:
  rule: locations.default.one-home-per-blueprint
status: addressed
body: "`walkdown init` inside a repository that already has one starts a second
  project and never mentions the first. Reproduced 2026-09-06: init --commit
  spec at the root of a git repo, then init --commit spec again from app/web,
  and the tree ends with .walkdown/config.yml AND app/web/.walkdown/config.yml.
  The second run's output is identical to a first-ever init — 'Next: fill in
  .../0001-web/blueprint/walkdown.yml' — with no line saying a blueprint already
  answers for this checkout. This is NOT the nested-pack case being wrong: two
  packs in one repository each answering for themselves is deliberate, tested,
  and the reason the crossing guard exists. The finding is the silence. A person
  who runs init one directory too deep gets a working second project rather than
  a correction, and the two only diverge later — the outer one keeps its ledger,
  the inner one starts empty, and 'walkdown where' from app/web answers with the
  inner one, correctly and confusingly. The neighbouring case already says the
  right kind of thing: init in a repository that has ALREADY been inited at the
  same level reports every file 'up to date' rather than pretending to start
  something. This is the same situation one directory down. A sentence naming
  the outer blueprint and the flag that means it on purpose would close it.
  Found in passing by the judge re-earning locations.default.in-repo-on-request,
  and anchored here rather than there because it is about which home answers,
  not about what the tree gets."
replies:
  - author: topher
    via: agent
    created: 2026-09-06T13:22:27Z
    body: >-
      Fixed in the commit above. init now prints, when it is about to mint a
      project in a directory some other row already answers for: the blueprint's
      id, its spec path, and a plain statement that there are now two projects
      each with their own ledger — 'on purpose when this directory is its own
      pack, and a directory too deep when it is not' — plus how to back out of
      it. Not a refusal, because the nested-pack case is deliberate and tested;
      the finding was the silence and the silence is what closed.


      I did not add a flag meaning 'yes, on purpose'. Your note suggested one
      and I left it out: nested packs are already the supported case, so a flag
      would be asking people to affirm the thing the tool is designed to do, and
      the sentence names the alternative without demanding a ceremony. If you
      want the flag anyway, say so and it is small.


      Test: test/locations.test.js, 'init one directory too deep names the
      blueprint already answering there' — asserts the outer id appears, that a
      second project is still created (the deliberate case still works), and
      that a first init in an unrelated repository says none of it.
