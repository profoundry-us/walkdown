body: Continue stays put on an unjudged rule. The only way to continue on a rule
  is to judge it, waive it, or skip it.
added: Topher started a fresh sitting and pressed Continue a few times expecting
  to resume from the first owed rule. Instead it walked him around the 17 owed
  rules with nothing recorded, which read as skipping without Skip. Continue on
  an open rule that owes a verdict and has none this sitting should not move.
  The panel offers no waive on a rule. Its verdicts are pass, approve, fail,
  refine and skip, so waive is read as those.
replies:
