    body: Built. Continue is disabled on an open rule that owes you a verdict and
      has none this sitting, and its title says to pass, fail or skip it to
      carry on. From a judged rule, or from the list, it moves to the next owed
      rule as before. The rule's steps say so, and both checks on the rule
      passed in run 2026-09-21T04-03-55Z. The panel has no waive on a rule, so
      the ways past are a verdict and Skip. Your server on 4700 needs a page
      reload to pick up the rebuilt panel.
