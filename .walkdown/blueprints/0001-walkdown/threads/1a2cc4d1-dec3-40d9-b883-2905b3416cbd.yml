body: I'm slightly confused here; Walkdown doesn't run the review specs, which
  is what "checks" really is. We can't know this `checks/review` information can
  we?
replies:
  - author: agent
    created: 2026-11-10T23:25:43Z
    body: "We can know it, but only when someone ran the checks there. walkdown does
      not run the review app's specs by itself. A checks run carries the target
      it ran against: walkdown run --target review hands the project's own
      runner that target's env, and the reporter records the run under review.
      CI on a review app can do the same. The row is that record read back. A
      target nobody ran the checks on gets no row, which is the staging case in
      the rule. Nothing is guessed from the local run."
