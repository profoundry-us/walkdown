    body: >-
      Addressed in the commit that carries this reply, the same way n-0186 was.


      The six `.claude/skills/*/SKILL.md` are real copies now, and
      `skills-copied` in .highball diffs each against `lib/skills/<name>.md` —
      the drift protection the links were buying, without a door that `--force`
      can write through.


      Left as a question rather than patched: whether the lint warning added for
      n-0186 should cover every directory walkdown WRITES to rather than the
      home alone. It walks the answering `.walkdown`, so it could not see these,
      and `installSkills` is the second writer this year to reach a file nobody
      named. That wants a decision about scope, not another special case.
