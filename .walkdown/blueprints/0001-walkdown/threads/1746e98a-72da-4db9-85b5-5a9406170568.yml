body: "Draw the rule detail of rule-detail-setup for a screen that is signed in
  as a user. The setup section gains one line, anchor detail.signed-in, naming
  the user and its persona, as in Signed in as View-only team manager, a
  Manager. Under it, detail.setup-steps lists the user's steps first and the
  screen's own steps after, told apart. The App pane's progress,
  panel.setup-progress, names the step it is on and whose it is. Draw three
  small states beside it. One is a screen signed in as a persona with no users,
  where the line says nobody signs in as this persona. One is a screen with
  prose setup, where the user's steps are listed and the prose is shown under
  them. One is a user that could not be read because its blueprint is not
  registered on this machine: the line names the user as written, says it could
  not be read, and names the blueprint to register. Use the expenses example of
  the accepted rule-detail-setup design. Rules
  screens.setup.signs-in-as-the-user and
  screens.setup.unread-personas-run-no-sign-in name this screen."
