    created: 2026-09-03T16:29:02Z
    body: "Claimed in 583d041. project add compares the blueprint's own .walkdown
      root with the one where you stand canonically, so naming a pack's
      blueprint through /tmp when cwd resolves to /private/tmp reads as already
      listed rather than as lying under itself. Test: 'a pack's own blueprint
      named through another spelling of its path is already listed, not
      refused'."
