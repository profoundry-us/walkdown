id: n-0133
kind: note
author: agent
created: 2026-09-01T01:05:28.925Z
anchor:
  rule: locations.default.nothing-in-the-tree
status: open
body: "Sitting 2026-09-01, observed while judging this rule (run
  2026-09-01T00-11-44Z-local-01): after a default init, the out-of-tree spec is
  invisible to most of the CLI. `walkdown serve`, `status`, and `lint` run from
  the probe repo all answered 'No blueprint found ... Use --dir', while
  `walkdown where` from the same directory resolved the spec correctly —
  bin/commands/context.js loadOrExit only searches the tree upward
  (findBlueprintDir) and never consults the locations resolver. Nothing lands in
  the tree, so this rule held; but the person the default-out design serves runs
  `walkdown status` as their second command and is told there is no blueprint
  they just created. The fix direction is a decision, not an agent's call:
  loadOrExit falling back to resolveLocations' spec answer would make every
  command agree with `where`, but it changes which blueprint ambient commands
  bind to in multi-project repos, so the nearest-blueprint-wins rules should get
  a say."
replies:
  - author: Topher Fangio
    created: 2026-09-01T04:41:44Z
    body: >-
      Decision: every command resolves where things live through one answer —
      resolveLocations — so status, lint, serve, run, judge, sweep, thread,
      threads and hash agree with where, move and every record-writing path.
      loadOrExit's tree-only findBlueprintDir search goes; spec.missing is what
      keeps 'no blueprint found' honest when nothing has been created yet.


      And the precedence is settled in the same breath: a config entry ALWAYS
      wins. Where an entry names a spec, that spec is the answer even when the
      repository also holds a blueprint. Writing the entry is the act of saying
      which blueprint this is; the tree does not get to overrule it.


      Not to be started yet — see the question filed against
      locations.answer.nearest-blueprint-wins, which this contradicts and which
      must be answered first.
  - author: Topher Fangio
    created: 2026-09-01T04:46:10Z
    body: >-
      Revising the decision above, which q-0138 now answers more simply. Not 'a
      config entry wins over the tree' — there is no tree answer to win against.
      Every blueprint is listed in the config, and walkdown stops looking for
      blueprints anywhere else.


      That still fixes what this thread is about: the nine commands behind
      loadOrExit resolve through the same answer as where, and an out-of-tree
      spec is visible to all of them, because the config entry names it and
      nothing has to find it. It fixes it by removing a resolution path rather
      than teaching a second one to agree with the first.


      Three things the change has to answer, and none is decided yet:

      1. First run. init does not write a config entry today — it allocates a
      home in the registry and leaves config.yml untouched. Under config-only, a
      project with no entry does not exist, so init must write one, and a fresh
      clone of an existing project needs a one-command way to say 'this repo is
      that project' before anything works. Today a clone plus walkdown status
      simply works, and that stops.

      2. The panel's picker. panel.start.choose-a-blueprint and the ?bp=
      switching are built on discoverBlueprints scanning the tree; their list
      becomes the config's. In this repository example/ has no entry, so today's
      two-project picker becomes one until it gets one.

      3. Two lists. config.yml projects: and blueprints/index.yml both enumerate
      blueprints. If the config is the list, the registry should be demoted to
      what it actually is — where an entry's out-of-tree records live, keyed by
      that entry — rather than a second directory of projects.
  - author: Topher Fangio
    created: 2026-09-01T04:51:10Z
    body: >-
      Third item settled, and further than 'demoted': the registry is deleted.
      ~/.walkdown/blueprints/index.yml goes, and the config entry carries its
      own home — one list, one file, nothing to keep in sync with anything.


      The registry only ever existed to hand out collision-free directory names
      with no human involved, because walkdown could not assume a project had
      been written down. Both halves of that premise are gone. Every blueprint
      is written down now, by decision; and the writer is an agent, not a person
      at an editor — so there is no 'hand-written config' to be spared the
      bookkeeping. The asymmetry that justified a second machine-owned file
      (yours to declare, walkdown's to allocate) does not describe how this file
      is actually maintained. init writes the entry and the home path in it, and
      where becomes a formality that reads back what the file already says.


      What this raises, and it is the last thing to decide before building: the
      same file carries identity — username, name, roles — and that is the file
      naming which humans may accept work. An agent-written file that says who
      the humans are needs the n-0130 boundary restated at the file level:
      agents may write project entries and never the identity block, or identity
      moves out. Two files split by AUTHORITY is a different thing from two
      files split by bookkeeping, and only the second one is what we are
      deleting here.
  - author: Topher Fangio
    created: 2026-09-01T04:55:04Z
    body: "The identity boundary raised above is settled, and filed as n-0139
      because it outgrew this thread: identity is read from the config and never
      supplied by a caller. Generating the config is fine — it happens at a
      human's request and is built around whoever is running it — but an agent
      may not change the identity block without explicit permission, and no CLI
      or MCP argument may override it. Note that the block is inert today;
      nothing reads it. So the config-only work includes making identity real,
      not just guarding it."
  - author: Topher Fangio
    created: 2026-09-01T05:20:58Z
    body: >-
      Three of the plan's open items answered.


      example/ gets a config entry. It is a real blueprint that this repository
      ships and several browser checks need a second project to switch to, so it
      should be written down like any other rather than surviving on being
      findable.


      {results} is defined in the config. It is hardcoded to the relative
      '.walkdown/results.out' today (lib/run-cmd.js:27), which is the same class
      of bug as issue #7 — a relative path following whichever cwd wins. It
      becomes runner.results_file in walkdown.yml, defaulting to
      .walkdown/results.out and always resolved ABSOLUTE against the code root.
      Project-level rather than personal, because which file a framework writes
      is a fact about the project; the path is scratch, per-checkout, alongside
      where Playwright's output now goes. Worth noting walkdown never reads this
      file — it only substitutes the token, and the project's own reporter emits
      the record — so this is fixing a path handed to somebody else's tool, not
      our own ingestion.


      one-home-per-blueprint is reworded rather than retired, and reworded to
      survive the change rather than to describe its destination. Everything
      mechanical came out of the statement — numbered directories, allocation on
      creation, legacy name-keyed homes, migrate renumbering — leaving the
      properties that are true both before and after: a home belongs to one
      blueprint, no blueprint gets a second home with records stranded in the
      first, asking allocates nothing, an existing home keeps answering, and a
      home nothing claims is left standing. Measured after the reword: both
      tiers went stale as they should, and all 33 tagged tests still pass, so no
      coverage was lost and nothing falsely claims the new wording. It will not
      need rewording again when the registry goes.
