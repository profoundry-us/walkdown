body: 'Hovering a redline pin shows a tooltip that calls it a note. On the
  scratch copy, redline n-0586 on panel.walk showed "n-0586 · note · recorded"
  on hover, on both sides of the fade. The accepted redline-pin design shows
  "Redline · n-0412 · closed" and the line "The build leaves the design here on
  purpose." The tooltip shows on contact, so nearly every person meets it before
  opening the pin. It reads as a note waiting on someone, which the rule says a
  redline never does. pinTip in src/embed/index.js prints pin.kind and
  pin.status, and a redline is stored as kind note with status recorded.
  Evidence: runs/evidence/2026-10-10T21-53-30Z/proto-redline-pin.png and
  app-redline-pin.png.'
