replies:
  - author: agent
    created: 2026-08-27T05:47:47Z
    body: >-
      Widened - and the reason they felt squished turned out to be more than
      taste.


      What changed

      - lib/viewer/panel.js: the tab buttons now carry px-6 instead of px-4.
      Worth knowing: the px-4 that was already there had never reached the built
      stylesheet at all. Tailwind scans this file as text, and the class sat
      flush against a \${…} interpolation ("px-4\${listTab === id ? …"), which
      is not a candidate its extractor can see - so the tabs were running on
      daisyUI's own default padding the whole time. The class is now written
      mid-list, with a space on both sides, and the built sheet has a .px-6 rule
      in it for the first time.

      - npm run build re-ran, so lib/viewer/walkdown.css and the two copies of
      it carry the change.


      Verified

      - Grepped the built sheet before and after: no .px-4 rule existed, .px-6
      does now.

      - By eye in the panel at the fixture: the three tabs are visibly roomier
      and the row still centres without wrapping at 384px.

      - Full suite: node --test 93/93, WALKDOWN_RECORD=0 npm run checks:dev
      28/28, walkdown lint 0 errors 0 warnings.


      No check: tab padding is cosmetic, and a check on a pixel measurement
      would break the next time anything near it moves.
  - author: Topher Fangio
    created: 2026-08-27T13:19:38Z
    body: Drop the padding to px-2; the tabs now take up too much space and are
