  - author: agent
    created: 2026-08-27T13:28:22Z
    body: >-
      Set to px-4.


      Worth recording, because it is the whole story of this note: px-4 is what
      the tabs already said, and had said for months. The class sat flush
      against a ${…} interpolation, so Tailwind's extractor never saw it as a
      candidate and never wrote the rule - the tabs were running on daisyUI's
      own default padding the entire time. The value was right; only the
      position in the string was wrong. Moving it mid-list is what made it real,
      and px-6 then overshot into wrapping because it was the first padding that
      had ever actually applied.


      The comment above it now says that, so the next person who reads px-4 and
      wonders why it was ever a question has the answer.
  - author: agent
    created: 2026-08-27T13:31:41Z
    body: >-
      px-3, and this time measured rather than eyeballed.


      On the live panel at 384px: three tabs on one row, 12px padding confirmed
      applied, tabs totalling 343.1px inside a 351.1px container. Eight pixels
      of headroom.


      That number is the thing worth knowing. The tab widths are not fixed -
      they grow with the count badges, which are data. Today Rules reads 7 and
      Threads reads 77. A second digit on Rules eats most of the remaining eight
      pixels; a third digit on either wraps the row again, and no padding value
      prevents that, because the padding is not what varies.


      So px-3 is right, but the wrapping is only settled until the numbers grow.
      The structural fix is to stop the row wrapping at all - let the tabs
      shrink or the labels truncate instead - which would make the padding a
      matter of taste again rather than something load-bearing. Not doing it
      unasked; filing the observation here so the next wrap is not a surprise.


      Verified: node --test 93/93, checks:dev 28/28, lint 0 errors 0 warnings.
