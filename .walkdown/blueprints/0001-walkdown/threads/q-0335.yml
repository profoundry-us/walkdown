body: |-
  Should the pick among several claimants be remembered per page?

  Your answer to q-0317 says the second question, which blueprint am I reviewing against, is a session choice remembered as a default. Two things on the board say the opposite:

  - ADR 0001 section 9: nothing is remembered.
  - Rule `panel.start.choose-a-blueprint` has a step, and a check, saying a pick for an unclaimed page is not remembered next time.

  If it is remembered:

  - this browser keeps the pick per page and honors it on the next visit
  - ADR 0001 gets a dated note
  - the step is reworded and the check changed

  If not, the panel asks every time a page has several claimants, and q-0317 is incorporated as is.
options:
  - label: Remember it
    why: this browser keeps the pick per page and honors it next visit; ADR 0001
      section 9 gets a dated note, the choose-a-blueprint step is reworded and
      its check changed
  - label: Ask every time
    why: the panel asks whenever a page has several claimants, nothing is
      remembered, and q-0317 is incorporated as is
