body: While a new version of a screen's design is proposed, what are that
  screen's already-built rules judged against? The proposal is shown first now,
  but those rules were built to the accepted design.
options:
  - label: The accepted one until the proposal is accepted
    why: Built rules keep their verdicts; accepting the proposal makes them stale,
      so they are judged again against the new design (recommended)
  - label: The proposed one at once
    why: Every built rule on the screen reads as failing or stale while the proposal
      waits, which says the build is behind a design nobody has accepted yet
replies:
  - author: topher
    created: 2026-10-10T18:33:25Z
    body: The accepted one until the proposal is accepted
    answer: true
chosen: The accepted one until the proposal is accepted
