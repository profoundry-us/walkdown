      and that reason now carries pictures like a reply does (the server did not
      take them on a status move before). Moving to another rule drops what was
      held. Checked by 'a picture dropped while failing a rule goes with the
      why' in checks/panel.spec.js (recorded 2026-09-21T16-05-53Z) and 'a
      reopen's reason carries the pictures dropped with it' in
