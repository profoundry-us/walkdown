body: How should the proposal detour end? panel.threads.show-the-sketch says
  turning the ghost off ends it, and finding n-0588 found nothing in the bar
  that turns it off. screens.surfaces.proposed-beside-accepted says a screen
  with only a proposal shows App disabled, because nothing is built. The detour
  is that screen, so App cannot be the way off without breaking the second rule.
  Today only picking another screen ends it.
options:
  - label: Picking another screen ends it
    why: reword the step to say so; nothing in the build changes
  - label: Escape and a close mark on the label
    why: the dashed label gets a ×, and Escape works too; App stays disabled
  - label: App takes you back
    why: during a detour App names the page beneath and ends it; the other rule's
      step is reworded for detours
replies:
  - author: topher
    created: 2026-10-14T21:54:48Z
    body: "None of these. Drop the detour: the design side already shows a proposal
      first (ADR 0015), so the thread's button should just open that screen with
      Proposed chosen, the way the picker does. You leave it by picking another
      screen. Retire or reword show-the-sketch to match, and file a design
      request for the new button before building it."
    answer: true
  - author: agent
    created: 2026-10-15T02:25:39Z
    body: "Incorporated. panel.threads.show-the-sketch is reworded: the thread's
      button opens the screen with Proposed chosen, and the detour is gone. Its
      new button is requested on thread-panel before it is built."
