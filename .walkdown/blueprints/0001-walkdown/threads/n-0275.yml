      Parked on a decision rather than fixed, 2026-09-11.


      The instance is one line - walkdownRoot() should walk from canon(start)
      rather than resolve(start), with the personal-home guard compared
      canonically on both sides - and I walked Topher through exactly that. His
      answer was a bigger question: why does the reader consult a path it did
      not register at all? If every walkdown we know about is in the registry -
      personal ones, scratch copies, all of them - then every reader consults
      the registry and stops worrying about paths, and the only moment a path
      matters is when someone asks to add one.


