      What that does to this note: the code it is about - walkdownRoot() on the
      read side, crosses() and its committed twin, the walk the link jumped over
      - is deleted at step 3 of the build, not fixed. There is no read-side code
      left for a spelling to fool. The fixture here (the link outside the pack,
      the hand-written personal row) becomes the check for the new rule, turned
      around - where, status, thread new and serve all say 'set aside, not
      registered', and import through the link registers the real path once.


      If the ADR is NOT accepted, the one-line fix above is the fallback and
      this note reopens for it. Left open until then.
