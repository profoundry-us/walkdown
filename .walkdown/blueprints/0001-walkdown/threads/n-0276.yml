    added: >-
      Fixed by removing the dim rather than repairing it. Topher's call - the
      blur is sufficient, and a dim over a blur buys legibility the blur already
      bought.


      src/panel/projects.js:110 now reads

        <div class="absolute inset-0 backdrop-blur-sm" @click=...>

      MEASURED at the same viewport, on the same page
      (localhost:4730/#https://example.com/):

        rect            [0, 0, 1280, 720] - unchanged, still covers, still swallows clicks
        backdrop-filter blur(8px)          - resolved, not dropped
        background      rgba(0,0,0,0)      - deliberately, there is no dim any more

      And it paints - the framed page and the panel behind both read as blurred,
      the card crisp on top.


      WHY THIS ONE RESOLVES WHERE THE DIM DID NOT. backdrop-filter takes no
      daisyUI theme variable. It does take one Tailwind variable -
      blur(var(--blur-sm)) - which is the same shape of trap, so it is worth
      saying why it does not bite. --color-base-300 is declared on
      [data-theme=...], a selector nothing above the scrim matches. --blur-sm is
      declared on ':root,:host', and custom properties inherit through a shadow
      boundary from the host, so it resolves inside the panel's shadow tree at
      8px wherever the scrim sits. Confirmed by reading it off the scrim itself.


      The lesson from this thread still stands and is not fixed by this change -
      a color-mix() over an unresolved var() fails silently, and nothing in the
      build says so. Any future themed utility used outside the themed subtree
      will do the same thing.


      panel.start.which-project has been reworded to say the backdrop is a blur
      and nothing else; its statement_hash is now sha256:fb4343377bab, so every
      prior verdict on it reads stale and the rule must be re-judged.


      Design has not been updated: prototype/screens/project-modal.html still
      draws bg-base-300/70, so the design and the build now disagree on the
      backdrop. Filed separately as a design request - prototype/ is design's to
      change.
