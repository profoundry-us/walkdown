body: I think you have way too many instances of "topher via agent". In general,
  if I type something, it should still appear as me (and my avatar) even if I
  said it in this chat instead of within Walkdown. I think the "via agent" is ok
  as a note, and maybe we just have some simple indicator to denote it instead
  of changing to the robot avatar. Also, I think a lot of times you take my
  words and put them in there, but then add additional context or parts to it.
  So perhaps the answer is to mark my words as-typed in my own name / avatar,
  but show a dashed "add-on" of whatever contents you added?
