      deleted: its obsolete layout rules (drawer, rail, stage modes) died with
      the design, and the living ones migrated with their thread origins intact
      - identity and session rules into panel.identity/panel.walkdown, detail
      reading and counts into panel.rules, viewport presets and zoom-to-fit into
      panel.viewport (to build), the thread popover rules into embed.threads.
      The serve test was retagged to panel.identity.default-actor and a fresh
      local run recorded its pass. Threads n-0001 through n-0008 were
      re-anchored to their successor rules so provenance survives lint."
