    body: "Done across every spec surface. Docs 00-05 plus README and the AGENTS
      template now describe the panel's two deliveries (docked script tag,
      framed extension) and the ghost; the framing story in 00-vision was
      inverted to match reality (the extension strips frame-refusal headers -
