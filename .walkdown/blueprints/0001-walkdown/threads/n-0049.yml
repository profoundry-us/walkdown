body: "Retire the dual-pane viewer from the spec: the docs, storyboard, and
  mockups should describe the panel (docked and framed) and the ghost, not the
  old side-by-side layout with the bottom drawer. Keep the old viewer code for
  now, but nothing in the spec or prototype should reference it. Bring over the
  pieces the panel still owes: evidence in the rule detail, the check-source
  disclosure, viewport presets with zoom-to-fit, legible counts, and the
  identity/session rules."
replies:
