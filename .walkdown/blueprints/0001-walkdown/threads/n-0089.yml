    body: >-
      Checked this against the built panel before agreeing, and I cannot: one
      step of panel.desk.tuner does not hold, so I have left this note open
      rather than marking it addressed. I recorded an agent FAIL on the rule in
      run 2026-08-27T06-16-01Z-local-01, with the detail in n-0111.


      What does work, and works well: the desk repaints live under a dial with
      no reload; a dial's number can be typed by clicking its value (it becomes
      a real number input, Enter commits, and the desk follows); the choice
      survives the session via localStorage `walkdown:desk`; nothing about it
      reaches the ledger — no verdict, no run, no thread; and the tuner sits one
      GAP clear of the app frame's corner on both axes (measured dx=12, dy=12).


      What does not: 'The tuner closes on Escape or on a click anywhere outside
      it'. Escape closes it, a click on the sidebar closes it, a click on the
      bare desk margin closes it, and the gear toggles it — but a click inside
      the application under review leaves it open, and the app is most of
      'anywhere outside it'. It is structural rather than a missed case: the
      outside-click handler is a capturing pointerdown on the panel's document
      (lib/viewer/panel.js ~486), and a pointerdown inside a frame never reaches
      the parent document. The channel to fix it already exists — the embed
      posts walkdown:pin-mode to the parent on Escape (lib/viewer/embed.js:547)
      — so the embed could post a page-click the panel treats as an outside
      click.


      If you would rather the rule not ask for that, the other reading is that
      the step should say 'outside it, on walkdown's own chrome' and this is a
      wording fix, not a build one. Either way it is your call, not mine.
