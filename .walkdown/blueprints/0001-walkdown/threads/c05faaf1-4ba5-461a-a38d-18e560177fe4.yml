body: "For screens.setup.runs-before-the-screen and
  screens.setup.docked-carries-on (ADR 0017 §§1-2). The rule detail of a rule
  whose screen has setup steps: under the setup heading (detail.setup),
  detail.setup-steps lists the steps (visit a path, post a form, wait for an
  anchor) with fixtures shown filled in, and detail.setup-again runs them again.
  While the steps run, panel.setup-progress says which step of how many it is
  on, where the App pane would otherwise show the page. Draw it mid-setup, on
  step 2 of 3. Prose setup keeps its current look."
