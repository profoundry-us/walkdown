anchor:
  rule: panel.start.unclaimed-page-says-so
  screen: choose-blueprint
status: incorporated
body: >-
  Design request: the choose-blueprint screen has no drawing for the state
  panel.start.unclaimed-page-says-so describes — connected, and no blueprint
  claims the page you are on. The existing mockup
  (prototype/screens/choose-blueprint.html) draws only the case where the folder
  holds several blueprints and one of them is this site; visiting an ordinary
  page with the extension on is the case with nothing drawn, and it is the
  commonest first experience of the tool.


  Asked for by Topher on 2026-09-07, after visiting google.com with the
  extension and getting walkdown's own board.


  A sketch is at proposals/choose-blueprint-unclaimed.html, in the same
  wireframe idiom so the argument is about content rather than styling. It
  proposes four blocks:

    start.unclaimed  the fact, with the address named — a claim misses because of a port or a fragment, so the address asked about has to be visible
    start.claim      how to make this page part of a blueprint you already have (a screen's app address, or a target base_url), plus  to ask who claims an address today
    start.new        , for when the page belongs to nothing yet
    start.options    the blueprints this server does hold, reachable but not opened for you

  I have not touched prototype/ — design owns it (blueprint/AGENTS.md). If the
  shape is right, the drawing is Topher's to make or to tell me to promote.
replies:
  - author: topher
    via: agent
    created: 2026-09-08T03:33:33Z
    body: >-
      Two lines above lost their command names: the shell ate the backticked
      text when this note was filed. They should read:

        start.claim   ... plus "walkdown claims --url <address>" to ask who claims an address today
        start.new     "walkdown init", for when the page belongs to nothing yet

      The sketch at proposals/choose-blueprint-unclaimed.html has both commands
      in it correctly.
  - author: topher
    via: agent
    created: 2026-09-08T21:19:10Z
    body: >-
      The sketch is standing and now renders truthfully. It is at
      proposals/choose-blueprint-unclaimed.html - open it at
      /proposals/choose-blueprint-unclaimed.html on any walkdown serve.


      Two things changed today.


      First, it was drawing itself wrong. Tailwind scans a fixed list of
      surfaces (styles/walkdown.css) and proposals/ was not on it, so every
      utility no shipped surface already happened to use was silently dropped -
      pt-3 on the divider was doing nothing, and the section label sat on the
      dashed rule. A sketch that renders differently from what it says is worse
      than no sketch, since the review is by eye. proposals/ is on the list now,
      beside sketches/.


      Second, it has the measurements behind it. n-0256 judged the rule on
      2026-09-08: a server holding ONE blueprint opens it - the whole board over
      a page it does not claim - and a server holding two stops at the existing
      gate, which asks which and never whether. Only the fourth THEN holds
      today. That is why the sketch lists exactly one blueprint under "Open one
      anyway": the single-blueprint card is the one the build skips entirely,
      and drawing the several case would have let the asymmetry hide. Six
      blueprints is the same card with five more rows.


      The four blocks are unchanged in shape: start.unclaimed (the fact, with
      the address named, because a claim misses on a port or a fragment and the
      gate today names the panel own origin instead), start.claim (the
      storyboard entry or the target base_url, plus walkdown claims --url to ask
      who claims an address today), start.new (walkdown init), start.options
      (what this server does hold, reachable but never opened for you).


      To promote it: it is one page in the wireframe idiom and can move to
      prototype/screens/ as it stands. It wants its own storyboard entry rather
      than replacing choose-blueprint - start and choose-blueprint are already
      two entries for two states of one screen - and the file header carries the
      entry to paste. I have not touched prototype/ and will not; say the word
      and I will move it, or redraw it to whatever you decide instead.
  - author: topher
    via: agent
    created: 2026-09-08T21:27:28Z
    body: "Answered by Topher on 2026-09-08: promote it."
  - author: topher
    via: agent
    created: 2026-09-08T21:27:28Z
    body: >-
      Promoted.


      The drawing is now prototype/screens/unclaimed-page.html - moved as it
      stood, with the header rewritten from a proposal into a mockup: what the
      state is, why it is separate from choose-blueprint (that screen asks WHICH
      of several this site is; here the answer may be none of them), and why the
      list of blueprints holds exactly one row.


      The storyboard gained its own entry rather than the drawing replacing
      choose-blueprint, since start and choose-blueprint were already two
      entries for two states:

        - id: unclaimed-page
          title: No blueprint claims this page (state - connected, nothing claims it)
          prototype: /screens/unclaimed-page.html
          app: { path: /stand-in/unclaimed-page }
          anchors: [start.unclaimed, start.claim, start.new, start.options]

      panel.start.unclaimed-page-says-so now names unclaimed-page as its screen
      rather than choose-blueprint, which is where a judge will look for it.
      Statement and steps are untouched, so no signature moved - walkdown hash
      reports all 129 ok, and lint 0 errors with the same eight old warnings.


      proposals/choose-blueprint-unclaimed.html is gone: two copies of one
      drawing is how they drift, and the design is the prototype now. The
      @source line that made proposals/ render truthfully stays for the next
      sketch.


      What this does NOT do is build it. The rule still fails - n-0256 measured
      what the panel does today, and a drawing is not a build. n-0244 stays
      open, holding the note to fold in when the panel is built against this
      screen.
