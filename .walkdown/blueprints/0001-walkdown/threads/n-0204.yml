body: "The refusal tells you to fix a file that is not the one being read.
  mustBeDeclared() in lib/writes.js:79 prints 'Say who you are in
  ~/.walkdown/config.yml under `identity:`' as a literal, and so do six more
  sites (src/panel/conversation.js:179,254, src/panel/app.js:317,320,326,
  bin/walkdown.js:81,92, lib/identity.js:107). But the config actually consulted
  comes from configPath(), which is built on walkdownHome() —
  'process.env.WALKDOWN_HOME || join(homedir(), \".walkdown\")' at
  lib/locations.js:34. With WALKDOWN_HOME=/tmp/elsewhere-home, configPath() is
  /tmp/elsewhere-home/config.yml, and the refusal still names the home
  directory. Somebody following the instruction adds identity: to a file nothing
  reads, is refused again, and has no way to see why. Everything else in
  walkdown reports the path that actually answered — 'walkdown where' exists for
  exactly this — so the fix is for these sentences to name configPath() rather
  than a spelling of it. Reproduced 2026-09-06."
