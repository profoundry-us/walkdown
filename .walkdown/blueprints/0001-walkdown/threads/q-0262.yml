body: >-
  Does this rule still have a job, now that the panel asks whose page it is?


  Two rules describe the same moment and disagree about the mechanism:


  - panel.start.choose-a-blueprint: 'When the config lists more than one
  blueprint, the panel asks which one this site is.'

  - panel.start.unclaimed-page-says-so: the panel asks the same question however
  many blueprints the server offers, 'because one blueprint on a server is not
  evidence that this page belongs to it'.


  Four judgings (n-0256, n-0258, n-0260, n-0261) all found the same fault, a
  count deciding whose page you are on - so the count-based branch is now gone
  from src/panel/app.js. What remains is: ask /api/whose, then a remembered
  choice, then the unclaimed gate, which lists what the server holds so a
  blueprint is one press away. That covers every clause of choose-a-blueprint's
  'then' list except the heading, and nothing sets the 'choose' phase any
  longer, so prototype/screens/choose-blueprint.html is unreachable from start.
  Its renderer is still in the file, unreached, because deleting the only
  implementation of a signed rule is a person's call.


  Three ways out, and I have no view on which is right:

  1. Retire choose-a-blueprint - the unclaimed gate is now the one screen that
  asks, and the choose screen is the same list under a heading that presumes an
  answer.

  2. Reword it so the question is not conditioned on a count, and merge its
  screen into unclaimed-page.

  3. Keep it as a distinct screen and give it a reader that is not a count -
  some other reason the panel would show the picker at start.


  Related, on the same screen: with no blueprints listed at all, the panel now
  omits the 'Open one anyway' section rather than showing it empty. The
  prototype draws that section with exactly one row on purpose, and does not say
  what it should be when there are none - so that is design's, not mine.
