body: "Judged 2026-09-03 (run 2026-09-03T02-45-46Z-local-01, PASS): the q-0168
  THEN holds - project add refuses a spec under another .walkdown from every
  direction and for every layout, lint names the entry and both files, and only
  --ephemeral gets through. This question is about what --ephemeral then lets
  through. The refusal says 'list a throwaway copy with --ephemeral', but
  project add --ephemeral accepts the pack's LIVE spec, the very path it just
  refused, and an ephemeral entry's records follow records-follow-the-spec: for
  a legacy-layout pack (spec: blueprint, threads inside it) the personal entry's
  threads: row IS the pack's live ledger, so a root server's POST
  /api/threads?bp=delta-eph landed n-0001 in packs/delta/blueprint/threads,
  which 'walkdown threads' inside packs/delta lists as the pack's own
  (runs/evidence/2026-09-03T02-45-46Z/server-probe.txt E1w/E1y,
  ephemeral-and-writers-probe.txt C2/C5). And from inside the pack itself,
  ?bp=gamma-eph resolved to gamma's committed ledger rather than the ephemeral's
  home, because the served spec matches the pack's own entry first
  (server-probe.txt E2w). Neither crosses the .walkdown boundary the rule is
  about - the person wrote the entry - but the message promises a copy and the
  tool writes to the original. For a person: should --ephemeral refuse a spec
  that another .walkdown declares unless it is actually a copy (a path nothing
  declares), or at least say that its writes will reach the pack's ledger when
  the pack keeps records inside its blueprint?"
replies:
  - author: topher
    via: agent
    created: 2026-09-03T16:29:01Z
    body: "Decided with Topher 2026-09-03: refuse it, a copy means a copy. In
      583d041 an ephemeral entry may no longer name a blueprint some .walkdown
      declares - listed in its config, or standing in one of its numbered homes
      - and project add says where to copy it instead
      (<that>/.walkdown/tmp/<label>/blueprint, say). And a committed entry whose
      spec lies under another .walkdown is now refused when READ, in
      readUserConfig itself: where names it on the repository row with the
      directory that answers for it, status never lists it, serve never offers
      it. The one-walkdown-answers THEN says both; the statement is unchanged.
      Tests: 'a committed entry never reaches under another .walkdown'
      (rewritten) and 'a server offers what the .walkdown where it was started
      declares'."
