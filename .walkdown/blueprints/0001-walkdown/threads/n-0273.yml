body: "Agent walkdown 2026-09-10: crossing to another project keeps the OLD
  project's claimant count, so the panel says out loud a reason that is false.
  Repro on a scratch copy (four blueprints in the served project, two of them —
  alpha \"Checkout redesign\" and beta \"Payments hardening\" — claiming
  /stand-in/choose-blueprint; a second imported project \"other\" holding delta
  and epsilon, whose only target is http://localhost:9999 so neither claims
  anything here). Start the panel on the claimed page: correct — 'Which
  blueprint?', the two claimants first with 'claims this page' badges, notice '2
  blueprints in this project claim this page. Nothing is remembered...'. Now
  open the project switcher and cross to 'other'. The pane redraws as that
  project's two blueprints, NEITHER carrying a claims badge, and /api/whose
  still returns only alpha and beta — yet the notice still reads '2 blueprints
  in this project claim this page.' Zero claim it. The screen contradicts
  itself: a stated reason of two claimants over a list where nothing claims
  anything. This is exactly what the statement's second sentence forbids — the
  question is being asked because that folder happens to hold several
  blueprints, and the panel dresses it up as several claimants. Cause:
  src/panel/app.js, the 'pick-project' handler sets S.project/S.phase and calls
  renderGate() without recomputing or narrowing S.claimants, which is only ever
  populated in boot(); renderGate() reads 'const claimed = S.claimants.length'.
  The honest fallback text already exists in the same expression ('This project
  holds more than one blueprint. Pick the one you are reviewing against.') and
  is unreachable after any crossing from a claimed page. Evidence:
  runs/evidence/2026-09-10T13-12-00Z/choose-a-blueprint-app-crossed-false-notic\
  e.png and choose-a-blueprint-probe.txt (sections A, F, G). Everything else in
  the rule held: names and own descriptions, claimants first and badged,
  choosing loads it and writes nothing (checksum over the copy's home, config
  and every declared blueprint identical before and after; localStorage and
  sessionStorage empty), the same question on reload, an undeclared blueprint
  sitting in the folder never offered, one claimant among four never asked
  about, and the same list on the Blueprints tab with the choice changeable
  there."
replies:
  - author: topher
    via: agent
    created: 2026-09-11T14:00:28Z
    body: >-
      Fixed, 2026-09-11, with the plain fallback sentence as Topher asked - no
      two-clause notice.


      renderGate() in src/panel/app.js now counts claimants WITHIN the current
      project rather than across the page:

        const claimed = S.claimants.filter((m) => projectIdOf(S.blueprints.find((pr) => pr.key === m.key)) === S.project).length;

      so crossing from a project with two claimants to one with none reads 'This
      project holds more than one blueprint. Pick the one you are reviewing
      against.' - the sentence that was already in the ternary and unreachable.
      S.claimants itself is untouched: it is still the page's list, gathered
      once at boot, and the modal still uses the page-wide count for 'N
      blueprints claim this page, in more than one project', which is the right
      count there.


      The same wrong read was behind the three false statements in the pane
      behind the project modal (n-0276); that pane is now one centred line with
      no tabs while the modal is up and nothing is chosen, per the reworded
      panel.start.which-project.


      Covered by a check tagged to this rule - 'crossing to a project that
      claims nothing here does not keep the old count' (checks/panel.spec.js) -
      which manufactures a second project holding two blueprints that claim
      nothing, starts on a page two of the served project's blueprints claim,
      asserts the '2 blueprints in this project claim' notice with both badged,
      crosses from the bar, and asserts two rows, zero badges, the fallback
      sentence and no 'claim this page'.


      Everything the note said held still holds. Awaiting a re-judge.
reason: finding
