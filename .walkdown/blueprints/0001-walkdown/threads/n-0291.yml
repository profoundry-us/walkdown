    body: "Fixed in lib/message-stream.js body(): an <a> the sanitizer stripped the
      href from is unwrapped into the words it held, so a
      javascript:/file:/mailto: link is plain text, not an underlined element
      going nowhere. The tagged check in checks/panel.spec.js now asserts no
      hrefless <a> survives and the link text still reads. (The rule did have a
      check; it lives in checks/, which the grep of test/ missed.)"
