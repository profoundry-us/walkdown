body: >-
  But first, let's do one small change to the panel view: Make it feel like it
  really "wraps" the page.


  1. Add a small bit of margin around the wrapped page and give it a drop shadow
  (using Tailwind) and rounded corners so it feels like it "sits above" our
  walkdown controls.

  2. Add a small header section at the top across the entire screen where we can
  add some additional tools / buttons (I'm thinking the project switcher, pin
  mode, and some "Prototype / App" joined buttons (like our current "Prototype /
  Split / App" but without the split

  3. Let's reskin our walkdown theme to look more like a blueprint so it stands
  out and is distinct from any app that we will be testing (make sure to use the
  standard way of selecting theme colors that DaisyUI supports)
added: "Make the panel feel like it really wraps the page: margin, drop shadow
  and rounded corners so the app sits above the walkdown controls; a header bar
  across the top for session-level tools (project switcher, pin mode,
  Prototype/App); and reskin walkdown so it is visibly not the app under test."
replies:
  - author: agent
    created: 2026-08-23T23:33:37Z
    body: "Built. The page is now a sheet on walkdown's desk: the document is inset
      (44px bar, 384px panel, 12px of desk all round), body carries a 10px
      radius and a shadow, and undocking restores the exact inline styles the
      page had before. The mechanism is one CSS rule — the canvas takes its
      background from <html> and only falls through to <body> when <html> has
      none, so painting the desk on <html> stops <body> propagating and lets it
      paint its own box for the first time. A bar across the top carries the
      project switcher, Prototype/App, pin mode and undock; Prototype is the
      ghost at full strength, so it is one idea rather than two, and there is no
      Split because the app is already at its real size. Pin mode gained a
      single owner: the embed exposes window.walkdownEmbed, and the bar mirrors
      it, so badge, bar and Escape cannot disagree. Skin is a daisyUI theme
      named blueprint, all standard theme variables, worn by the panel and the
      viewer. Specified as panel.dock.wraps-the-page, .toolbar, .one-pin-mode
      and .own-skin."
reason: feedback
