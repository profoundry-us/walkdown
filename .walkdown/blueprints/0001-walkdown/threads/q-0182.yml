body: "Seen while judging 2026-09-03 (run 2026-09-03T16-30-11Z-local-01, PASS -
  not the reason for the verdict). project add --ephemeral now refuses a pack's
  declared original (q-0176), but the same shape written BY HAND into
  ~/.walkdown/config.yml - a rootless entry with ephemeral: true whose spec is a
  pack's live blueprint - is read, listed and served: a root server's pin landed
  in packs/legacy/blueprint/threads, which the pack then lists as its own, with
  no where row and no lint finding. Second door of the same shape: project add
  --ephemeral accepts an UNDECLARED legacy-shaped blueprint under a bare
  .walkdown, and the entry's runs and threads follow the spec into that pack's
  tree - allowed by the declared test, but not a copy. The q-0176 THEN reserves
  'not read either' for committed entries. Should a personal ephemeral entry
  whose spec any .walkdown declares (or that stands under one) be set aside the
  same way when read, so the hand-edit cannot reopen q-0176? Evidence:
  runs/evidence/2026-09-03T16-30-11Z/ephemeral-probe.txt"
replies:
  - author: topher
    via: agent
    created: 2026-09-03T16:53:03Z
    body: "Topher, 2026-09-03: not a door we defend. A hand-written personal entry
      is outside the tools - people who edit the config by hand are likely to
      break things, and that is on them. walkdown supports its own commands
      working well; project add refuses this shape, and that is the whole of the
      guarantee."
  - author: topher
    via: agent
    created: 2026-09-05T23:33:55Z
    body: >-
      Folded in, with one thing worth recording because the answer has been
      partly overtaken.


      The principle stands as you gave it: a hand-edited personal config is
      outside the tools, and walkdown's guarantee is that its own commands work
      well.


      What changed since is n-0188, decided 2026-09-05: a personal row naming a
      blueprint that another .walkdown declares is now refused on READ, not only
      when written. So the specific door you found here — a hand-written
      rootless ephemeral entry pointing at a pack's live blueprint — is closed
      too, wherever that pack's .walkdown has a config of its own. Not because
      hand-edits are defended, but because the refusal turned out to belong at
      the reader for a different reason: 'where' was resolving the personal row
      while refusing the byte-identical committed one, in the same block.


      The limit your answer draws is still the limit. A .walkdown holding homes
      but no config declares nothing, and a row naming a blueprint under it is
      read — that is a person's own arrangement, and it is theirs.
