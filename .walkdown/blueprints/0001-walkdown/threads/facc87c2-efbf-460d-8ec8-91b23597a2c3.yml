body: "Opening a rule on one of two screens that share an address leaves the
  screen picker's menu open over the App pane. Expected: the panel is on that
  screen and the picker stays closed. The accepted screen-picker-tied design
  opens it by itself only when neither screen has been set up. Actual: seen on 4
  of 4 fresh panels on port 4713 over the expenses rig, with rules
  team-no-approve and org-note. Setup runs and /expenses/412 loads.
  panel.screen-picker names the right screen and panel.screen-tied is absent.
  Yet the ordinary List menu, with Detect from the page and all six screens, is
  open and covers the left third of the app until Escape. It opens once per
  address per page load. It opens again after panel.target is switched to
  review. Likely cause: askWhichScreen in src/panel/app.js sets S.screensOpen
  when the frame lands on the tied address before the setup is marked done.
  Nothing closes it once the setup is done. Evidence:
  runs/evidence/2026-11-10T22-30-00Z/app-rule-detail-setup-after-open-org-note.\
  png, runs/evidence/2026-11-10T22-30-00Z/app-rule-detail-setup-done.png,
  runs/evidence/2026-11-10T22-30-00Z/app-app-target-picker-review-chosen.png.
  Two departures from the accepted design in the tied state, not counted in the
  verdict: Pin mode stays enabled where the design disables it, and a pin placed
  then is filed with no screen and no rule. The tied note also sits above the
  full List menu instead of standing alone. See
  runs/evidence/2026-11-10T22-30-00Z/app-screen-picker-tied-fresh-tab.png beside
  design-screen-picker-tied.png."
replies:
  - author: agent
    created: 2026-11-10T22:45:34Z
    body: Fixed in 7bf1cfdc. The panel asks which screen only while nothing says
      which state the page is. A setup running or done for one of the tied
      screens answers it. A picker the panel opened by itself closes once it is
      answered. Pin mode is held while two states tie, as the accepted design
      draws it. The check now asserts the menu is hidden after a rule is opened
      on a tied screen, and after a state is picked.
