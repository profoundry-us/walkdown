body: "Decision, Topher, 2026-09-13: the judge prompt keeps naming the anchors
  the steps name (the ANCHORS block in `walkdown judge`, there since
  2026-08-31). Considered dropping them so a judge has to find each control the
  way a person would and fail if it cannot; decided against. A user would be
  given docs saying which button to click, so a step that names the anchor is
  the same thing - findability is not what the agent tier is testing, and a
  false fail from a judge looking in the wrong place costs a person a look. Not
  a rule: recorded here so the question is not reopened without this in front of
  whoever reopens it. `because` and `history` are likewise left out of the
  prompt - the judge is told what to test, not why."
