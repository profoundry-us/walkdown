body: >-
  Is a proxy signature ever remembered for the next walk?


  Your own roles default from config every walk. A remembered proxy is the
  mechanism that silently signs for an absent person next month (q-0225).
options:
  - label: Never
    why: a proxy is per walk; the next walk starts from your config alone
  - label: Offered, not assumed
    why: the last proxy is shown as a suggestion you must tick again
