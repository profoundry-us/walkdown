    via: agent
    created: 2026-09-14T23:11:38Z
    body: "Fixed in src/embed/index.js openThreadPopover: the stream gets the
      blueprint rule ids so a rule id is recognised; after render, an evidence
      key becomes a real link to /evidence/<key> (new tab), a thread id opens
      that thread when it is a pin on this page, and any ref the popover cannot
      open is put back to the words the author typed - no link that does
      nothing. The popover is also clamped to the viewport like the pin form
      (the right-column aside). New check in checks/embed.spec.js drives the
      standalone popover top-level and asserts all four."
