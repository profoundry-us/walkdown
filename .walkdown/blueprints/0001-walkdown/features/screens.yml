feature: screens
title: Which screen is this?
source:
  prd: (docs/06-prototype-contract.md §2; thread n-0020)
stories:

  - id: screens.ownership
    title: Which blueprints a page belongs to is a fact about its address
    statement: As a team, we can point walkdown at the projects we have imported and have it say which blueprints claim any given page - several, one, or none - without it ever choosing between them on our behalf.
    rules:
      - id: screens.ownership.one-claimant
        retired: >-
          Withdrawn by ADR 0001 (2026-09-09). A page may be claimed by several blueprints: two efforts about different functionality of one homepage are not two pages, and making the storyboard say otherwise put a lie in the spec to protect an invariant that existed for the tooling's convenience. What the constraint was really protecting - that nothing ever has to guess whose page this is - is kept by asking instead: `walkdown claims` reports shared pages as an inventory, and the panel puts the question to the person (screens.ownership.routes-by-page, panel.start.which-project). Settled again 2026-09-22 (q-0317, q-0335): several blueprints may claim one page; when they do the panel always asks, and the answer is carried in the address, so a reload of that tab is not asked again and nothing else remembers it (ADR 0001 §9, panel.start.address-keeps-the-pick).
        origin: thread:q-0019
        statement: No two blueprints claim the same page - a claim being an origin from a target's base_url plus a path, compared on path and fragment alone, so that two projects declaring the same path under different queries is still a collision while the same path on two different origins is not.
        verify: [checks]
        steps:
          given:
            - A folder holding several blueprints
          when:
            - The set is examined as a whole, which no single blueprint lint can do
          then:
            - A page claimed by two blueprints is reported, naming both and the screens involved
            - One blueprint claiming a page under several queries is not a collision - that is a page in two states
            - The same path on two origins is not a collision, because a target's base_url is part of the claim
          statement_hash: sha256:b7fa784715cc

      - id: screens.ownership.routes-by-page
        origin: thread:q-0019
        statement: Which blueprints a page belongs to is decided by the page's address, not by what was chosen last time or by what the server happens to hold.
        because: A server holding one blueprint is not evidence that this page belongs to it.
        history: A folder holding exactly one blueprint used to open it over any page, claimed or not, and a folder holding several asked about pages none of them claimed (n-0256, n-0258, n-0260, n-0261).
        verify: [checks]
        screens: [choose-blueprint, project-modal]
        steps:
          given:
            - The projects this machine has imported, and a page that may belong to none, one, or several of their blueprints
          when:
            - The panel starts there
          then:
            - Every blueprint claiming that address is named, in no order of preference - a claim being an origin from a target's base_url plus a path, compared on path and fragment with the query dropped
            - Exactly one claimant is opened, and nothing is asked
            - Several claimants is a question for the person, never a rank - ordering survives WITHIN one blueprint, because that is how a screen is identified at all, and is abandoned across them
            - An address no blueprint claims is not guessed at, whatever the server holds
            - A caller that names a blueprint explicitly is never overridden by this
          statement_hash: sha256:015ebac2b063
          reworded:
            - hash: sha256:3021d25287e8
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:c2308bf1988a
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:a32c2a668e6d
              at: 2026-09-14T02:50:03Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: screens.surfaces
    title: Both surfaces, even when one of them is not a page
    statement: As a reviewer, I can compare a design against the app on every screen - including screens whose app is chrome rather than a URL, or is not built yet.
    rules:
      - id: screens.surfaces.as-built-drawing
        origin: walkdown
        created_at: 2026-09-18
        statement: A project whose build cannot be framed may keep as-built drawings of it under `as-built/`, and `walkdown serve` serves that folder as written so the storyboard's app paths can name its pages.
        because: Some builds are not pages - walkdown's own panel, a native app - and the design served back as the app shows the design twice. A drawing of what was built, kept by the project, gives the App side something true to show while prototype/ stays as design drew it.
        history: Decided in ADR 0007 on 2026-09-18, when walkdown's own screens moved from the stand-in to as-built/. How the folder is made and kept is deliberately the project's own business; walkdown only serves it.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A project with an `as-built/` folder beside its blueprint, holding an HTML page
          when:
            - Request that page under `/as-built/` from `walkdown serve`
          then:
            - The page is served exactly as written - no theme swapped in, no mark added; what it says about itself is the project's own
            - A page the folder does not hold is a 404, and nothing above the folder is reachable through it
            - A storyboard screen may name such a page as its app path. The panel frames it as it frames any app, and the build-side button reads As-built
          statement_hash: sha256:098b9682020b
      - id: screens.surfaces.stand-in-app
        origin: walkdown
        statement: A screen whose app is not a page can declare a stand-in. Walkdown then shows that screen's own design in place of the app, visibly marked as a stand-in, and fading, ghosting and pinning work on it as on any app surface.
        because: Some of what is built is browser chrome with no page of its own, and some is not built yet. Nobody must be able to mistake a stand-in for the build.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen whose storyboard app path points at the server's stand-in for it
          when:
            - Switch the surface to Stand-in
          then:
            - The app pane shows that screen's design, and the comparison controls come alive - fade, ghost, and pin mode on the app side
            - It announces itself on its own face - a marked edge and a corner label - and wears a theme of neither the mockups nor walkdown's chrome
            - The anchors are the design's own, so a pin lands on the same element on either surface, and is recorded against the app
            - It is not evidence - what it shows is the design, so a verdict given against it is a verdict about the design
          statement_hash: sha256:6a69c42a5b6c

      - id: screens.surfaces.app-address-is-resolved
        origin: walkdown
        created_at: 2026-09-24
        statement: A screen's app path is read against the target's address the way a browser reads a link, so a path written as a whole URL is shown where it points.
        because: A stand-in for an unbuilt screen lives on walkdown's server while the target is the app, and the frame, the picture and the page's owner must agree on where it is.
        history: "Found while setting walkdown up on a Rails app (GitHub issue #15). The panel glued the target's address to the path, so the frame for a stand-in was blank while the storyboard drew it correctly."
        verify: [checks]
        signoff: [eng]
        screens: [review]
        steps:
          given:
            - A target whose address is the app, and a screen whose app path is a whole URL on walkdown's own server
          when:
            - The screen is opened on the App surface
          then:
            - The frame loads that URL, the same page the storyboard photographs
            - Framed there, the page is recognised as that screen, and the same path on the app's own server is not
            - The page is claimed at its own address, not at the target's
            - A path written from the root still lands on the target's address
          statement_hash: sha256:f5007e73e677

      - id: screens.surfaces.proposed-beside-accepted
        origin: walkdown
        created_at: 2026-10-09
        verify: [checks]
        signoff: [eng, product]
        statement: When a screen has a proposed version of its design, the design side shows it first, with the accepted one a click away.
        because: A proposal is what is up for judgment, so it comes first, and it is compared with the design it would replace and with the build.
        history: Proposals lived in their own folder, reached from a thread's button and never from the design side (ADR 0015).
        screens: [design-version-switch]
        steps:
          given:
            - The screen `design-version-switch`, with an accepted version and a proposed one
          when:
            - The screen is opened, and then Accepted is chosen
          then:
            - "`panel.design-version` offers Accepted and Proposed beside the design side's label, with Proposed chosen"
            - The proposed version is on the design side, and the fade and pins work against `panel.app-frame` as they do for an accepted one
            - Choosing Accepted shows the design the proposal would replace, and choosing Proposed brings it back
            - The choice is in the address, so a link opens on the version it names
            - A screen with only a proposed version shows it with no switch, and its App side says nothing is built
            - Opening a rule on the screen, in a walk or from the list, shows the proposed version, because that is what is being judged
          statement_hash: sha256:0842937f10e9

      - id: screens.surfaces.proposed-is-yours
        origin: walkdown
        created_at: 2026-10-09
        verify: [checks]
        signoff: [eng, product]
        statement: A proposed version of a design is framed as a person's to accept, in a dashed ring of the panel's warning yellow labelled "Proposed — yours to accept".
        because: A proposal waits on a person's acceptance, so it wears the colour of a person's turn, and dashes keep it apart from the solid ring that means the build.
        screens: [design-proposed]
        steps:
          given:
            - The screen `design-proposed`, with Proposed chosen on the design side
          when:
            - The screen is opened
          then:
            - "`panel.proposed-frame` rings the page in a dashed line of the warning yellow"
            - "`panel.proposed-label` reads \"Proposed — yours to accept\" and opens the screen's design request"
            - An as-built page keeps its solid ring, so the two are never mistaken for each other
          statement_hash: sha256:0c8d5e77db4b

  - id: screens.anchors
    title: Anchors move; records do not
    statement: As a reviewer, a thread I filed against an element still reads as the record I made when the element has since been renamed - and it says so, rather than warning forever or being rewritten.
    rules:
      - id: screens.anchors.renames-are-recorded
        origin: thread:q-0252
        created_at: 2026-09-21
        statement: A storyboard records an anchor's renames, so a thread filed under the old name still resolves to the element, still shows the name it was filed under, and says it was renamed.
        because: A thread is a record of a moment and its anchor is part of that record; the names move underneath it, and the record should say so.
        history: Three threads warned for a fortnight after two anchors were renamed on 2026-09-07, with no door to fix them and the conventions rightly forbidding a hand edit (q-0252).
        verify: [checks]
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A screen whose storyboard entry lists renames from an old anchor to its new name, and a thread anchored under the old name
          when:
            - The blueprint is linted, and the thread is opened on its own screen
          then:
            - Lint reads the thread's anchor through the renames and raises no warning; a rename whose end is not a declared anchor is what it warns about instead
            - The thread's screen shows the anchor as it was filed, in the original spelling, with a mark saying it was renamed
            - Resting on the anchor lists every name it has had, oldest to newest, in a bubble that is readable and stays inside the pane
            - Nothing in the thread's file is changed
          statement_hash: sha256:a0495cc39a56
  - id: screens.identity
    title: A screen is a URL, and the URL can change without a reload
    statement: As a reviewer, walkdown knows which screen I am looking at - including the modal, drawer or route the fragment opened - and keeps knowing it as I move around a single-page app.
    rules:

      - id: screens.identity.follows-navigation
        origin: thread:n-0020
        statement: When the page's URL changes without a reload, walkdown notices and works out again which screen it is on. A `pushState` navigation raises no event, so walkdown catches it by checking the address on a timer.
        screens: [review]
        steps:
          given:
            - walkdown on a single-page app, on a screen the storyboard knows
          when:
            - Open a drawer, follow a hash route, press Back
          then:
            - The panel re-resolves the screen and redraws against it
            - The embed re-resolves too, so a pin placed after the navigation files against the screen you are actually on
            - An answer a person gave about the previous page - which screen it was, whose art to ghost - does not carry across the navigation
            - pushState announces nothing and the extension cannot patch the page's own History, so the address is checked every 400ms and a change found that way is handled exactly like one an event announced
          statement_hash: sha256:5b51c16f7b2b
          reworded:
            - hash: sha256:e8763cbea8b6
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:10cd6346d20b
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:e0ed85a9e4ac
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:1519a942634a
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"
            - hash: sha256:327979bf4aad
              at: 2026-09-14T16:05:25Z
              why: dropped 'says that is how it knew' - nothing user-facing says it; the statement now says the address is checked on a timer and the step says how often

      - id: screens.identity.setup-tells-states-apart
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: When the App pane's address matches two screens that differ only in their setup, the panel takes the one it last set up at that address. When it has set up neither, it asks which one you are on.
        because: Two states of one page share its address, so only the panel's own setup can say which one the frame is showing.
        history: "Issue #25 and ADR 0017 §4 (2026-10-23). Before it, the matcher skipped the tie and the second screen could only be picked by hand."
        screens: [screen-picker-tied]
        steps:
          given:
            - Two screens at `/expenses/412`, one set up as a view-only team manager and one as a view-only org manager
          when:
            - Open a rule on the second screen, and then load the same address in a fresh tab
          then:
            - After the rule opens, the panel is on the second screen, and a pin placed then is filed under it
            - In the fresh tab, anchor `panel.screen-picker` opens by itself, lists the two screens and says they share this address, and nothing is filed under either until one is picked
            - Picking one runs its setup, as opening a rule on it would
            - Two screens with the same path and the same setup are still a tie, and lint still warns about them
          statement_hash: sha256:099086f49c0a

  - id: screens.setup
    title: A screen's setup puts the app in its state
    statement: As a reviewer, opening a rule shows me its screen as the right person, on the right record, without my signing in or finding the record by hand.
    rules:

      - id: screens.setup.runs-before-the-screen
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: Opening a rule whose screen has setup steps runs them in the App pane, in order, and then loads the screen's path. Setup written as prose is shown and never run.
        because: A page that depends on who is signed in and which record is open cannot be reached by its path alone, and setting it up by hand on every rule stops a walk.
        history: "Issue #25 and ADR 0017 §§1-2 (2026-10-23): an expense page meant for a view-only manager opened on the sign-in page."
        screens: [rule-detail-setup]
        steps:
          given:
            - A screen whose setup visits a sign-in route, posts a form and waits for an anchor, with fixtures for the local target
          when:
            - Open a rule on that screen
          then:
            - The App pane visits, posts and waits in that order, then loads the screen's path with its fixtures filled in
            - While the steps run, anchor `panel.setup-progress` names the step it is on
            - Anchor `detail.setup-steps` lists the steps under the setup heading, and `detail.setup-again` runs them again
            - Opening another rule on the same screen does not run them again, and opening a rule on another screen does
            - A screen whose setup is prose shows it in `detail.setup`, as before, and nothing is run
          statement_hash: sha256:e7e5adf3b438

      - id: screens.setup.failure-stops-it
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: A setup step that fails stops the setup, and the App pane says which step failed and why instead of loading the screen.
        because: A screen loaded after a failed sign-in shows the sign-in page where the screen should be, and the reviewer judges the wrong page.
        history: ADR 0017 §2 (2026-10-23).
        screens: [app-setup-failed]
        steps:
          given:
            - An app with the embed on its pages, a screen whose second step posts to a route that answers 500, and a screen whose path needs a fixture the local target lacks
          when:
            - Open a rule on each
          then:
            - On the first, anchor `panel.setup-failed` names step 2, its path and the status it got, and the screen's path is not loaded
            - On the second, nothing is run, and `panel.setup-failed` names the missing fixture and the target, and gives the `walkdown fixtures set` command for this blueprint and target
            - A wait_for whose anchor has not appeared after ten seconds fails the same way, and names the anchor
            - "`detail.setup-again` runs the setup again from its first step"
          statement_hash: sha256:46284ad32d8f
