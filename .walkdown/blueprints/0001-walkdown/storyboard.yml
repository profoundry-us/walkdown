# walkdown's own screens.
#
# walkdown has no running page to point the App surface at: the running build
# IS the panel you are holding, which cannot frame itself. So each screen's
# app path is an AS-BUILT drawing (ADR 0007): the panel's own markup as it was
# actually built, kept under as-built/ in its own theme and marked on
# its face, while prototype/ stays as design drew it - so the slider shows
# the distance between what was designed and what was built. Until 2026-09-18
# the app path was a stand-in, the design served back as the app; that
# feature stays in walkdown for projects that want it. Neither is the build,
# and neither is evidence that one exists.
# Where a surface goes when nothing else says. A blueprint is about a product,
# and a product has a front door — so crossing between the design and the build
# is possible from anywhere, not only from a page walkdown already recognises.
default_screen: review

screens:
  - id: review
    title: The review page
    prototype: /screens/review.html
    app: { path: /as-built/review.html }
    anchors:
      - panel.legend
      - panel.skip
      - panel.bar
      - panel.desk
      - panel.desk-tuner
      - panel.project
      - panel.blueprint
      - panel.fade
      - panel.viewport-toggle
      - panel.pin-mode
      - panel.pin-why
      - panel.walk
      - panel.continue
      - panel.actor
      - panel.actor-handle
      - panel.app-frame
      - panel.zoom
      - panel.tabs
      - panel.screen-picker
      - panel.screens-list
      - panel.rules-list
      - panel.rules-search
      - panel.rule-tiers
      - panel.threads-list
      - panel.thread-filter
      - panel.counts
      - panel.judged

  - id: rule-detail-since-signed
    title: Rule detail (state — a rule you signed has changed since)
    prototype: /screens/rule-detail-since-signed.html   # accepted 2026-10-22 in Topher's walk (n-0616)
    app: { path: /as-built/rule-detail-since-signed.html }
    anchors:
      - detail.since-signed
      - detail.turn

  - id: rule-detail
    title: Rule detail (state — open a rule on the Rules tab)
    prototype: /screens/rule-detail.html
    app: { path: /as-built/rule-detail.html }
    # Anchors that moved (q-0252): a thread filed under the old name still
    # resolves through here, still shows the name it was filed under, and
    # says it was renamed. Oldest name on the left; chains are followed.
    renames:
      detail.screenshots-modal: detail.evidence-modal
      detail.screenshots: detail.evidence
    anchors:
      - detail.screen
      - detail.ask
      - detail.history-open
      - detail.back
      - detail.stepper
      - detail.rule-id
      - detail.statement
      - detail.because
      - detail.history
      - detail.verdict
      - detail.feedback
      - detail.conversation
      - detail.stream
      - detail.turn
      - detail.evidence
      - detail.setup
      - detail.steps
      - detail.technical-disclosure
      - detail.evidence-open
      - detail.evidence-modal
      - detail.verify

  - id: thread-panel
    title: The thread screen (state — open a thread, or a pin)
    prototype: /screens/thread-panel.html
    app: { path: /as-built/thread-panel.html }
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close

  - id: start
    title: First run (state — no server connected)
    prototype: /screens/start.html
    app: { path: /as-built/start.html }
    anchors:
      - start.message
      - start.server
      - start.connect

  - id: unclaimed-page
    retired: >-
      Folded into project-modal (2026-09-09, ADR 0001 §7). "Nothing claims this
      page" turned out to be one of three ways the address can fail to decide -
      the others being several projects claiming it and there being no page to
      route from at all - and three screens asking one question were three
      places for the answer to differ.
    title: No blueprint claims this page (state — connected, nothing claims it)
    prototype: /screens/unclaimed-page.html
    app: { path: /as-built/unclaimed-page.html }
    anchors:
      - start.unclaimed
      - start.claim
      - start.new
      - start.options

  - id: project-modal
    title: Which project? (state — the address cannot decide on its own)
    # Promoted from proposals/project-modal.html on 2026-09-10 (n-0271), so the
    # screen can be walked down against a design rather than against nothing.
    prototype: /screens/project-modal.html
    app: { path: /as-built/project-modal.html }
    anchors:
      - project.modal
      - project.address
      - project.why
      - project.commands
      - project.new
      - project.list
      - project.claims
      - project.close

  - id: choose-blueprint
    title: Choose a blueprint (state — folder holds several)
    prototype: /screens/choose-blueprint.html
    app: { path: /as-built/choose-blueprint.html }
    anchors:
      - start.folder
      - start.options

  - id: docked
    retired: The docked delivery was withdrawn on 2026-08-26. walkdown frames the page it reviews; nothing renders beside it any more.
    title: The docked layout (withdrawn 2026-08-26)
    prototype: /screens/docked.html
    app: { path: /as-built/docked.html }
    anchors:
      - docked.page

  - id: settings
    title: Settings (state — open the gear)
    prototype: /screens/settings.html
    app: { path: /as-built/settings.html }
    anchors:
      - settings.panel
      - settings.actor
      - settings.display-name
      - settings.timezone
      - settings.dials
      - settings.hide

  # 0.5.0, ADR 0015. Designed before it is built; no build yet, so no app.
  - id: pin-form-kinds
    title: "The pin form asks what kind of pin it is"
    prototype: /screens/pin-form-kinds.html   # accepted 2026-10-10, redrawn and accepted 2026-10-18 (n-0606)
    anchors:
      - pin.kind
      - pin.redline-pair
      - pin.note
      - pin.shots
      - pin.save
      - pin.cancel

  # 0.5.0, ADR 0015. Designed before it is built; no build yet, so no app.
  - id: design-version-switch
    title: "The design side offers a proposed version beside the accepted one"
    prototype: /screens/design-version-switch.html   # accepted 2026-10-10 in Topher's walk
    anchors:
      - panel.design-version
      - panel.fade
      - panel.app-frame

  # 0.5.0, ADR 0015. Designed before it is built; no build yet, so no app.
  - id: design-proposed
    title: "A proposed version, framed as yours to accept"
    prototype: /screens/design-proposed.html   # accepted 2026-10-10 in Topher's walk
    anchors:
      - panel.design-version
      - panel.proposed-frame
      - panel.proposed-label
      - panel.fade

  # 0.5.0, ADR 0015. Designed before it is built; no build yet, so no app.
  - id: redline-pin
    title: "A redline pinned where the build leaves the design"
    prototype: /screens/redline-pin.html   # accepted 2026-10-10 in Topher's walk
    anchors:
      - pin.redline
      - panel.fade
      - panel.app-frame

  # Issue #22. Accepted 2026-10-10 (n-0578).
  - id: app-not-answering
    title: "The app is not answering, so the design is shown"
    prototype: /screens/app-not-answering.html
    anchors:
      - panel.surface-build
      - panel.app-down
      - panel.fade

  # ADR 0017, issue #25.
  - id: rule-detail-setup
    title: "Rule detail (state — the screen's setup steps are running)"
    prototype: /screens/rule-detail-setup.html
    app: { path: /as-built/rule-detail-setup.html }
    anchors:
      - detail.setup
      - detail.setup-steps
      - detail.setup-again
      - panel.setup-progress

  - id: app-setup-failed
    title: "A setup step failed, so the screen is not loaded"
    prototype: /screens/app-setup-failed.html
    app: { path: /as-built/app-setup-failed.html }
    anchors:
      - panel.setup-failed
      - detail.setup-again

  - id: screen-picker-tied
    title: "The address matches two screens that differ in setup"
    prototype: /screens/screen-picker-tied.html
    app: { path: /as-built/screen-picker-tied.html }
    anchors:
      - panel.screen-picker

  - id: app-target-picker
    title: "The App pane's target picker"
    prototype: /screens/app-target-picker.html
    app: { path: /as-built/app-target-picker.html }
    anchors:
      - panel.target

  - id: rule-detail-targets
    title: "Rule detail (state — a verdict on each target)"
    prototype: /screens/rule-detail-targets.html
    app: { path: /as-built/rule-detail-targets.html }
    anchors:
      - detail.evidence

  - id: mode-switch
    title: "The mode switch, on Rules"
    prototype: null
    anchors:
      - panel.modes

  - id: mode-boards
    title: "Boards, taking the whole window"
    prototype: null
    anchors:
      - panel.modes
      - modes.page
      - modes.board-picker
