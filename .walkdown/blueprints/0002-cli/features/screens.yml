feature: screens
stories:
  - id: screens.identity
    title: A screen is a URL, and the URL can change without a reload
    statement: As a reviewer, walkdown knows which screen I am looking at - including the modal, drawer or route the fragment opened - and keeps knowing it as I move around a single-page app.
    rules:
      - id: screens.identity.fragment-is-identity
        origin: thread:n-0020
        statement: A screen is identified by its origin, path and fragment. So a state the URL fragment expresses, such as a modal, a drawer, a tab or an SPA route, is a screen in its own right and not a footnote on the page behind it.
        verify: [checks]
        screens: [claims-url-fragment]
        steps:
          given:
            - A storyboard holding both a page and a fragment state of that page
          when:
            - Standing on each of the two URLs in turn
          then:
            - The bare path resolves to the page, and the path with the fragment resolves to the fragment state
            - A declared fragment must match exactly - a different fragment is a different screen, never a near miss
            - A fragment nobody has enumerated still resolves to the screen at that path, so an app is usable before every route is written down
            - The state is reachable by its URL on load, not only by clicking - a state you can only click your way to cannot be walked down
          statement_hash: sha256:9484646bb993
          reworded:
            - hash: sha256:ac30c2879d52
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:b0bbdbe721cb
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: screens.identity.query-is-not-identity
        origin: thread:n-0020
        statement: "A query string is data, not identity, so the same screen showing page two is still the same screen. A query written into the storyboard is the exception: it still tells two screens sharing one path apart."
        verify: [checks]
        screens: [claims-url-query]
        steps:
          given:
            - Two screens declared at one path, distinguished by a query
          when:
            - Resolving a URL at that path
          then:
            - An undeclared query changes nothing about which screen you are on
            - A declared query is honoured, and the more specific of the two wins
            - The constraint that a page belongs to exactly one blueprint is still read on path and fragment alone
          statement_hash: sha256:56d83a30a6b1
          reworded:
            - hash: sha256:9b8b3c9e5881
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:88e5a4d85423
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: screens.identity.one-matcher
        origin: thread:n-0020
        statement: The panel, the embed and the server answer "which screen is this?" with one implementation rather than three lookalikes.
        because: A pin filed under one screen here and another there is worse than no pin at all.
        verify: [checks]
        unverifiable:
          agent: The claim is that one implementation answers the question, and that cannot be seen from outside the code. An agent can watch the panel, the embed and the server agree, but agreement is what follows from the rule rather than the rule itself - three lookalikes that happen to match today would look identical. The checks tier reads the source.
        steps:
          given:
            - The two browser files, which ship self-contained and cannot import
          when:
            - The shared matcher changes
          then:
            - Each browser file carries a generated copy, not a hand-written one
            - A copy that has drifted from the source fails the build rather than shipping
          statement_hash: sha256:9dc36939b131
          reworded:
            - hash: sha256:c7d51f5c89d3
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:8481b0cbb2e4
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:94c5e18bf909
              at: 2026-10-12T14:16:25Z
              why: the hash covers the excuses now; the rule and its excuse are unchanged
          excused: [agent]

  - id: screens.setup
    title: A screen's setup is read, filled in and checked
    statement: As an author, I can write how to reach each screen's state once, with the ids that differ by machine kept apart from the blueprint, and lint tells me what will not run.
    rules:

      - id: screens.setup.steps-or-prose
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: "A screen's setup is prose, a list of steps, or a recipe named under the storyboard's `recipes:`. Lint refuses steps the panel cannot run."
        because: A setup that cannot run should be found by lint at the desk, not by a reviewer on a sign-in page.
        history: Issue #25 and ADR 0017 §1 (2026-10-23).
        screens: [lint-setup-steps]
        steps:
          given:
            - A screen with prose setup, one with visit, post and wait_for steps, and one naming a declared recipe
            - A screen with a step of an unknown kind, one naming a recipe nobody declared, and one waiting for an anchor its screen does not declare
          when:
            - Run `walkdown lint`
          then:
            - The first three pass
            - The unknown step and the missing recipe are errors, each naming its screen and the step, and lint exits non-zero
            - The undeclared anchor is a warning that names it
          statement_hash: sha256:5c6c941f8039

      - id: screens.setup.fixtures-set-keeps-this-machines-values
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: "`walkdown fixtures set --blueprint <b> --target <t>` keeps the values it is handed, as JSON on standard input or as `key=value` pairs, for this machine only. walkdown never runs the app's code to make them."
        because: The records a screen needs have different ids on every machine, and making them is the app's job, so walkdown only keeps what it is told.
        history: Issue #25 and ADR 0017 §3 (2026-10-23).
        screens: [fixtures-set, fixtures-set-refused]
        steps:
          given:
            - A blueprint called expenses, and an app task that prints a JSON object of three keys and their ids
          when:
            - Pipe the task's output into `walkdown fixtures set --blueprint expenses --target local`
          then:
            - Each key is printed with its value
            - The values are written under `~/.walkdown/fixtures/`, in a file for this blueprint and target, and nothing is written to the blueprint's home or the repository
            - "`key=value` pairs given as arguments are kept the same way"
            - Without `--blueprint` nothing is kept, and it says to name one, as every command that writes does
            - Input that is not a flat JSON object of strings, numbers and booleans keeps nothing, shows what it was given, and exits 2
          statement_hash: sha256:6e0afbf92524

      - id: screens.setup.fixtures-per-target
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: A screen's setup and path take their fixtures from the target, with the values `walkdown fixtures set` kept winning over those in spec.yml. Lint warns about a key a target lacks.
        because: An id that is right on one machine is wrong on the next, so the blueprint names the record and each target says which one it is.
        history: Issue #25 and ADR 0017 §3 (2026-10-23).
        screens: [lint-fixture-missing]
        steps:
          given:
            - A screen whose path and setup use two fixtures
            - A staging target that gives both in spec.yml, a local target with no fixtures set, and a review target that gives one
          when:
            - Run `walkdown lint`
          then:
            - "review gets a warning naming the target, the missing key and the screen"
            - "local gets one warning that says to set its fixtures with `walkdown fixtures set --blueprint expenses --target local`, rather than one per key"
            - "staging gets none"
            - Once local's fixtures are set, a key both they and spec.yml give takes the value that was set
          statement_hash: sha256:85fe533de4af

      - id: screens.setup.setup-is-identity
        origin: walkdown
        created_at: 2026-10-23
        verify: [checks]
        signoff: [eng, product]
        statement: Lint warns that two screens' app sides tie only when they share both a path and a setup. Each path is compared with its target's fixtures filled in.
        because: Two states of one page are two screens, and a warning about them would tell the author to undo the right way of writing them.
        history: "Issue #25 and ADR 0017 §4 (2026-10-23). The warning had no rule before this; it said a tie was the honest spelling until setup could run."
        screens: [lint-screens-tie]
        steps:
          given:
            - Two screens at one path with different setups, two at one path with the same setup, and two whose paths differ only once fixtures are filled in
          when:
            - Run `walkdown lint`
          then:
            - Only the pair with the same path and the same setup is warned about, and the warning names the screen that loses the tie
            - The pair whose fixtures fill in to two paths is not warned about
            - A pair that ties on one target and not another is warned about on the target it ties on, and the warning names that target
            - Two screens sharing a design ref are warned about as before, because a design has no setup
          statement_hash: sha256:9a9388488257
