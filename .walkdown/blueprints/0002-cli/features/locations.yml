feature: locations
stories:
  - id: locations.default
    title: Adopting walkdown costs the repository nothing
    statement: As a person trying walkdown on a repository I did not start, I can run it without adding anything to the tree, and stop by deleting one directory nobody else can see.
    rules:
      - id: locations.default.nothing-in-the-tree
        origin: prd
        statement: Until a person asks walkdown to keep a blueprint in the repository, walkdown adds, edits and deletes nothing there. The spec, threads, runs, evidence and drafts live in the person's own `~/.walkdown/projects/`.
        because: Trying the tool should commit a project to nothing, and abandoning it should mean deleting one directory.
        history: "A `.walkdown/` beside the code was tried and reversed: however well ignored, it was still a thing git had to be told about, and the pointer it needed carried a home-directory path into shared history."
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository that has never seen walkdown, and no profile
          when:
            - A blueprint is made, and a run, a thread and a draft are recorded
          then:
            - "The tree is byte for byte as it was: no `.walkdown/`, no pointer, no `AGENTS.md`, no `.gitignore`, nothing for git to see"
            - Everything walkdown made sits in one home under `~/.walkdown/projects/<project>/blueprints/`
            - Deleting that one folder removes everything walkdown made for that blueprint
            - Asked what is tracked, walkdown answers nothing, and says why
          statement_hash: sha256:f06360e3e6e5

      - id: locations.default.home-is-one-folder
        formerly: [locations.default.records-follow-the-spec]
        origin: prd
        statement: A blueprint's home is one folder. The spec (`spec.yml`, `storyboard.yml`, `features/`), its `AGENTS.md`, `records.yml` and `.gitignore`, and the four kinds of record (`threads/`, `runs/`, `evidence/`, `drafts/`) sit side by side in it, with no folder between.
        because: A home moves as one directory, and nothing inside it needs rewriting when it does.
        verify: [checks]
        steps:
          given:
            - A blueprint in its home, kept in the repository, and another kept in `~/.walkdown/projects/shop/blueprints/`
          when:
            - Its location is asked for
          then:
            - The spec and the four records resolve as siblings in one folder, laid out the same in both places
            - There is no `blueprint/` folder inside a home
            - No kind of record sits inside another
            - Moving the home moves all of it together and edits none of it
          statement_hash: sha256:2eadd5cdafaf

      - id: locations.default.in-repo-on-request
        origin: prd
        statement: A blueprint stays out of version control unless asked. Asking is one choice for the spec and its threads, and another for everything, made per blueprint and visible in that blueprint's own `.gitignore`.
        because: The tree is the only place the answer cannot drift from the truth, and the command reports what git actually holds rather than what walkdown meant to arrange.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project with two blueprints, fresh or already set up
          when:
            - The person commits one blueprint's spec, then everything, then nothing again
          then:
            - The home sits under the repository's `.walkdown/blueprints/`, laid out as every home is
            - With the spec committed, the home's own `.gitignore` keeps runs, evidence and drafts out
            - With everything committed, the home has no `.gitignore`
            - The other blueprint's files are untouched by each change
            - Asked again with a different choice, the home's `.gitignore` is written or removed, or the home moves whole with no record edited
            - The command reports what is tracked now, in words, and how to change its mind later
            - What is tracked is asked of git, not read from the ignore file walkdown wrote. A root `.gitignore` hiding `.walkdown`, an ignore file somebody emptied, and a home that left with its files still in the index are each said outright, and lint errors where they disagree (n-0179, n-0180, n-0181)
          statement_hash: sha256:b55ca34f14f7

      - id: locations.default.skills-are-yours-by-default
        origin: prd
        statement: The agent procedures walkdown ships install into your own skills directory and never into a repository unless a team asks for it.
        because: In your own skills directory they work in every project on the machine; a committed skill is a copy of walkdown's own source that walkdown cannot keep current afterwards.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project being set up, and a machine with a personal skills directory
          when:
            - The skills are installed, either by init or on their own
          then:
            - For Claude Code they arrive as one link to the clone (delivery.plugin.one-link); for any other agent, as copies in the directory named
            - The tree gains nothing, whether or not the spec is committed
            - Setting up does not put a copy in the repository, and leaving does not take one away - a copy there is one somebody asked for
            - Installing them on their own asks where they should go rather than picking, and writes nothing to a place nobody named
            - A skill that depends on a harness only walkdown's own repository has is not among them
            - A copy the person has edited is kept and reported rather than overwritten
          statement_hash: sha256:dd86f56c7d59

      - id: locations.default.one-home-per-blueprint
        retired: "Replaced by locations.default.folder-names-are-yours and locations.registry.ids-stay-here (ADR 0014 (2026-10-05)). A number allocated once is no longer how homes are kept apart: a folder path cannot collide with itself, and the registry ID tells blueprints apart."
        origin: thread:n-0124
        statement: Every blueprint has a numbered home of its own, and no path walkdown resolves is keyed by a name two projects could share.
        because: A name two projects can both have is not an address; a number allocated once is.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - Two blueprints in one `.walkdown`, and two repositories whose directories share a name
          when:
            - Each is asked about, then written to for the first time
          then:
            - Asking reports where records would go and writes nothing, not even the claim on that home
            - Each blueprint ends up with a numbered home of its own, and no two ever coincide
            - Nothing resolves through a name two projects could share, whichever door does the resolving - not the config merge, not a server's list, not a move
            - Two checkouts that share a name, one listed personally, stay two projects with two ledgers
            - A home that already holds a blueprint's records keeps answering for it
            - A home nothing claims is reported and left standing, never guessed at and never moved
          statement_hash: sha256:43e88185b989
          reworded:
            - hash: sha256:c2e4b20e7f0d
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:90679f4f6194
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:195a0540e150
              at: 2026-09-14T02:20:43Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

      - id: locations.default.prototype-beside-the-spec
        origin: walkdown
        created_at: 2026-09-24
        statement: A relative `prototype.root` is looked for beside the spec first and in the code second, so a home kept outside the repository can hold its own design.
        because: A home outside the repository can only keep its design beside the spec, and neither layout should need a path to one person's disk in the shared config.
        history: "GitHub issue #17. With the home outside the repository, `prototype: { root: prototype/ }` looked in the repository, and every design page and stand-in was a 404."
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A blueprint whose prototype root is a relative path
          when:
            - A design page, a stand-in or a storyboard picture of the design is asked for
          then:
            - A directory by that name beside the spec answers when there is one
            - Otherwise the directory by that name in the code answers, as it always has
            - The design pages, the stand-ins and the storyboard all read the same directory
          statement_hash: sha256:a30a7a594efd
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [import-any-folder]
        signoff:
          - eng
          - product
        id: locations.default.folder-names-are-yours
        statement: A blueprint's home is any folder under `.walkdown/blueprints/` that holds a `spec.yml`, at any depth and with any name. walkdown never reads a number or a date out of the name.
        because: A team arranges its own repository, and two homes cannot be the same folder.
        history: Homes were numbered folders allocated under a lock, renumbered on commit, and the number was parsed in about twenty places (ADR 0014 (2026-10-05)).
        steps:
          given:
            - A repository with homes at `.walkdown/blueprints/202610-search/`, `0002-search/` and `billing/api/invoices/`, and a fourth home inside `202610-search/`
          when:
            - The repository is imported, and `walkdown blueprints new checkout` is run in it
          then:
            - The three homes are found and offered, each under its own folder
            - The home inside another home is refused, and both folders are named
            - "`blueprints new` suggests a folder named for this month, such as `202610-checkout`, and accepts any other name it is given"
            - No folder is renumbered or renamed to suit walkdown
          statement_hash: sha256:20a203168083
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [where-records-yml]
        signoff:
          - eng
        id: locations.default.records-yml-informs
        statement: A blueprint's `records.yml` says where its runs, threads, evidence and drafts usually live. The blueprint's row in this machine's registry may say otherwise.
        because: A team can agree where records usually go without one person's disk deciding it for everyone.
        steps:
          given:
            - A committed home whose `records.yml` sends evidence to `../evidence`, checked out on two machines, one of which has moved its evidence with `records move`
          when:
            - Each records a run with evidence
          then:
            - The first files the evidence where `records.yml` says
            - The second files it where its registry row says, and `walkdown where` names the row as the reason
            - "`records move` never edits `records.yml`"
          statement_hash: sha256:26e8fb639e2a

  - id: locations.answer
    title: Anyone can ask where this project's pieces are
    statement: As someone standing in a repository, I can ask where every piece lives and why it was chosen there, and the asking never changes the answer.
    rules:
      - id: locations.answer.says-why
        origin: prd
        statement: "Every path walkdown reports says why it was chosen: a flag on the command line, this machine's registry, the blueprint's own `records.yml`, a worktree of a registered checkout, or the built-in default."
        because: A person who disagrees with where something is needs to know which decision to argue with.
        verify: [checks]
        steps:
          given:
            - A project with some paths defaulted and some configured
          when:
            - walkdown is asked where things live
          then:
            - Each of the spec, runs, threads, evidence, drafts and code carries its reason
            - The reason names the rule that decided it, not merely that a decision was made
          statement_hash: sha256:b31372ab894d

      - id: locations.answer.asking-writes-nothing
        origin: prd
        statement: "Asking where something lives creates nothing: no directory, no config file, no placeholder."
        because: The command a confused person reaches for first must not itself change what they were confused about.
        verify: [checks]
        steps:
          given:
            - A project with no `~/.walkdown` at all
          when:
            - walkdown is asked where every kind of record lives
          then:
            - It answers in full, naming directories that do not exist yet
            - The disk is exactly as it was found, including the personal home
          statement_hash: sha256:7112ec403004
          reworded:
            - hash: sha256:0ba6f381a575
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:47b87b883d14
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:bc8314186c2a
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"
            - hash: sha256:7d27e6b8d5a3
              at: 2026-10-06T00:47:54Z
              why: ADR 0014 renamed the files it names; what it asks of the build is unchanged

      - id: locations.answer.nearest-blueprint-wins
        retired: >-
          Answered by deleting the question (2026-09-01, q-0138). Walkdown no longer searches the tree for blueprints, so there is no tree answer to arbitrate against a configured one and no precedence left to state. The half of this that survived - a repository may hold several blueprints without them bleeding into each other - is now locations.answer.declared-not-discovered, which carries it without the contest.
        origin: prd
        statement: A blueprint found in the working tree beats a configured entry rooted above it, and a blueprint named outright is answered by the entry that owns that blueprint or by none at all - because a repository can hold several, and an entry rooted at the whole tree would otherwise answer for its own siblings and report one project's spec beside another project's ledger.
        verify: [checks]
        steps:
          given:
            - A repository holding two blueprints, and a config entry rooted at the whole repository
          when:
            - The location is resolved from inside the inner one
          then:
            - The inner blueprint answers, with its own runs and threads
            - The outer entry still answers where the tree offers no blueprint, which is what an out-of-tree spec is for
          statement_hash: sha256:8abbb2442baa

      - id: locations.answer.one-walkdown-answers
        origin: walkdown
        retired: >-
          Its statement is about which of two files answers, and there is one file now (ADR 0003, accepted 2026-09-11): a reader consults ~/.walkdown/registry.yml and nothing else, a committed .walkdown/config.yml is a manifest that only `walkdown import` reads, and no `.walkdown` is ever found by walking. Every mechanism this rule named - the nearest-and-stop walk, the merge with the personal file, the crossing guard on both files - was deleted at step 3 of that ADR, after n-0275 showed a symlink walking through the guard on the read side while the write side refused the same path. The half that survives - no inference, nothing merely lying nearby is a project - is locations.answer.declared-not-discovered; what replaces the boundary is locations.answer.registry-is-the-only-door.
        statement: "Exactly one `.walkdown` directory answers for where you are standing - the nearest one at or above you - and it is merged with the personal `~/.walkdown` and with nothing else. What that forbids is INFERENCE - walkdown never works out from the tree that a neighbouring checkout's blueprints are yours, so a pack carrying its own `.walkdown` never sees the repository root's and the root's never sees the pack's. It does not forbid breadth - a blueprint you named yourself, with `walkdown import`, is reachable from anywhere, because you said so and nothing was guessed."
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository holding a `.walkdown` at its root and another inside a pack, and a personal `~/.walkdown`
          when:
            - A location is resolved from inside the pack, and again from the repository root
          then:
            - From the pack, the pack's own answers and the root's is not consulted at all
            - From the root, the root's answers and the pack's is invisible
            - Each is merged with the personal one, and with no second repository config however many lie above it
            - A server offers what the registry holds - the blueprints that `.walkdown` declares, plus the ones this machine imported - and nothing that was merely lying nearby, wherever the blueprint it serves happens to sit
            - A committed entry whose spec lies under another `.walkdown` is refused when written and reported by lint when found - that `.walkdown` already answers for it (q-0168)
            - One that is there anyway is not read either - where names it as refused and says which directory answers for it, and status and serve never see it - and an ephemeral entry may not name it from outside, because a copy means a copy and this is the original (q-0176)
            - The same row in the PERSONAL file is refused on the same terms - set aside on read, named on the report, reported by lint - because a tool that resolved it while refusing the byte-identical committed one would answer the same question two ways in one breath (n-0188)
            - A row may name a blueprint under its OWN `.walkdown` - the personal home, whose config that file is, or the one answering where you stand - so the way to a pack is to stand in its checkout, to list a real copy of it, or to import it by name
            - An IMPORTED row is the one way across, and it is not an exception to the rule but the point of it - `walkdown import` is somebody naming a directory and being shown what it declares, so nothing about it was inferred (ADR 0001 §3)
            - A `.walkdown` holding homes but no config declares nothing and answers for nothing, so a row naming a blueprint under it is that blueprint's only declaration and is read
          statement_hash: sha256:69f36d35a978

      - id: locations.answer.declared-not-discovered
        origin: thread:q-0138
        statement: walkdown answers only for blueprints somebody registered on this machine; it never goes looking for one.
        because: A repository may hold several blueprints without them bleeding into each other.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository holding two blueprints, each registered, and a third nobody registered
          when:
            - The location is resolved from inside each of them, and one is named outright
          then:
            - Each registered blueprint answers for itself, with its own runs and threads
            - The unregistered one is not a project at all, however much it looks like one. Where its checkout holds a home, the answer names the folder and says `walkdown blueprints import`
            - The registry is consulted, and the report says which row answered and how it got there
          statement_hash: sha256:e6a814857fe7

      - id: locations.answer.registry-is-the-only-door
        origin: thread:n-0275
        statement: walkdown reads only what the registry lists, and worktrees of the checkouts it lists. A `.walkdown` folder in any other checkout is not consulted.
        because: A path is examined once, when it is added; every read after that trusts what the add wrote, so nothing a tree grows later can open a second door.
        history: A symlink created outside a pack, pointing at the pack's home, was followed on the read side while the writer refused the same path - so a second board listed, served and wrote to the pack's ledger with nobody having imported anything (n-0275, ADR 0003). The `because` was rewritten on 2026-09-21 (n-0322); the first draft said the same thing in a voice nobody could hear.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository with a registered home at its root and a pack inside it with its own, and a symlink outside the pack pointing at the pack's home
            - A row written by hand into the registry, with no `registered:`, naming the link
          when:
            - The location is asked for through the link's row, a thread is filed through it, and a server is started at the repository root
          then:
            - "`walkdown where` sets the row aside and says it was written by hand; `walkdown status` and `walkdown threads new` through it refuse, and nothing lands in the pack's ledger"
            - The server lists every registered blueprint and never the link's row
            - "`walkdown blueprints import` through the link registers the pack's home once, under its real path, and a second import says it is already listed"
            - Standing in the pack reaches the pack's row; standing at the root reaches the root's; nothing about the tree between them is consulted
            - A registered spelling is canonicalised on read only to compare, the way the writers canonicalised it to write - a symlink planted at a registered path is the same directory and matches its row - and no path is ever resolved to find a row that was not written
            - A worktree of a registered checkout is read as that checkout's project (locations.worktree.same-project), and gets no row of its own
          statement_hash: sha256:646e9430df33

      - id: locations.answer.serve-starts-anywhere
        origin: walkdown
        created_at: 2026-09-30
        statement: "`walkdown serve` starts from any directory and serves every blueprint registered on this machine. Which blueprint a page shows is named in its address, or chosen by the person when the address names none."
        because: The server serves what the registry lists, not what the directory it was started in holds, so where it starts from decides nothing.
        history: "Until 2026-09-30 it refused to start outside a registered project, and the setup skill told agents to pass `--blueprint`, so agents handed people one server per blueprint, started from its directory (GitHub issue #19). A blueprint registered, or a storyboard drawn, while it ran was not recognised from its pages until a restart."
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A machine with blueprints registered, and a directory that belongs to none of them
          when:
            - "`walkdown serve` is started there"
          then:
            - It starts, and says it serves every blueprint registered on this machine
            - Its root, opened with no blueprint in the address, shows the registered blueprints to choose from, and no rules
            - Named by id, any registered blueprint is served as it would be by a server started in its own project
            - A request that needs a blueprint and names none is refused, and the refusal says how to name one
            - Started instead inside a registered project, or with `--blueprint`, that blueprint is the one a page naming none shows
            - A blueprint registered, or a storyboard edited, after the server started is recognised from its own app pages without a restart
          statement_hash: sha256:8fc3f6d54231

      - id: locations.answer.adapters-file-where-walkdown-says
        origin: walkdown
        created_at: 2026-09-24
        statement: A test adapter files its run where `walkdown where` says runs go, including when the blueprint's home is outside the repository.
        because: A run filed where nothing reads it is a pass nobody sees, and the adapter is the one place a person cannot watch.
        history: "GitHub issue #16. The RSpec formatter found the blueprint by walking up from the code, never reached a home outside the repository, and recorded nothing while every spec passed."
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A blueprint whose home is outside the repository, and an RSpec suite in the code tagged with its rules
          when:
            - The suite runs through walkdown run, or as a bare rspec in the code
          then:
            - The run lands in the home's runs, where `walkdown status` counts it
            - walkdown run hands the suite the spec and runs directories it resolved
            - Run bare, the formatter asks walkdown where of the clone it was loaded from
            - A spec committed in the repository is still found by looking up from the code
            - The config init writes loads the formatter from the clone by its path, so no gem is needed
          statement_hash: sha256:7e1aecb8560b
  - id: locations.registry
    title: Every blueprint has a name on this machine
    statement: As someone with several projects on one machine, I can name any blueprint I registered with an ID that is mine, without a repository needing to know it.
    rules:
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [import-moved-checkout]
        signoff:
          - eng
          - product
        id: locations.registry.ids-stay-here
        statement: Every registered blueprint has an ID that this machine gave it, such as `0002-wd-cli`. No file walkdown writes outside `~/.walkdown/registry.yml` contains it.
        because: Two people's machines can number the same blueprint differently without either repository being wrong.
        history: Registry ids had to be unique on the whole machine, so a second project's `search` was refused or renamed, and a repository's own instructions named a blueprint this machine called something else (ADR 0014 (2026-10-05)).
        steps:
          given:
            - A machine with two projects, `hireart_main` and `shop`, each with a blueprint whose folder is named `search`
          when:
            - Each is registered, a thread is filed and a run recorded in each, and the first is committed
          then:
            - Each gets an ID made of four digits, its project's code and a description, such as `0003-ha-search` and `0004-sh-search`
            - "`--blueprint` and `?bp=` accept the ID, and inside a project they also accept the description alone"
            - The thread, the run record, the pointer and the committed home hold no ID
            - Committing, un-committing or moving the checkout changes the path on the row and keeps the ID
            - A number once given is never given again, even after its blueprint is forgotten
          statement_hash: sha256:f561ad6f21be
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [blueprints-new-label-taken]
        signoff:
          - eng
          - product
        id: locations.registry.projects-are-labels
        statement: A project is a label on registry rows, named after the repository unless the person names it. When a new blueprint joins a project that already has blueprints, walkdown says so.
        because: A blueprint filed under the wrong project should be noticed when it is made, not weeks later in a list.
        steps:
          given:
            - A git project whose `origin` remote is `acme/shop`, one with no remote in a directory `notes`, and a second checkout whose label and code would both be taken
          when:
            - A blueprint is made in each, then another in `shop`
          then:
            - The first is labelled `shop`, from the remote, and the second `notes`, from the directory
            - The second blueprint in `shop` is reported as added to `shop`, beside the one already there
            - A label or code that is already taken is offered for the person to change, and nothing is registered until they do
            - With no terminal to ask, it is refused, and the refusal says how to choose a label and code
          statement_hash: sha256:81ff13fccdce

  - id: locations.keeping
    title: A ledger already written is never orphaned or edited
    statement: As a team with history in our blueprint, no preference of anyone's machine can make our records stop being found, and moving them stays something a person did on purpose.
    rules:
      - id: locations.keeping.existing-outranks-preference
        origin: prd
        retired: >-
          The rule was about records found INSIDE a blueprint - `blueprint/runs/`, the layout every project had before homes - outranking a blanket default. That layout is not read any more: every blueprint walkdown answers for is declared, lives in a home, and its entry names the records or the home they derive from, so there is no directory for the resolver to discover and nothing for a preference to give way to (2026-09-04, Topher's call to remove legacy support entirely). What survives of it is locations.keeping.moving-is-a-decision: relocating records is still something a person does, never something a default does to them.
        statement: A blanket default never points past records a blueprint already holds - an existing directory is a fact and a default is a preference, so the preference gives way and moving those records stays a decision somebody makes.
        verify: [checks]
        steps:
          given:
            - A blueprint whose runs directory already holds records
          when:
            - A personal config declares a different default for runs
          then:
            - The existing directory is still the answer, and the report says it is because the blueprint already holds it
            - No record is moved, copied or hidden by the resolution
          statement_hash: sha256:c5603d183d94

      - id: locations.keeping.moving-is-a-decision
        origin: prd
        statement: Moving records relocates the files unchanged and writes the new place on the blueprint's row in this machine's registry. A destination that already holds records is refused.
        because: The records are append-only, and dropping one set into a directory that already holds another would change both.
        verify: [checks]
        steps:
          given:
            - A blueprint whose runs live in the repository
          when:
            - They are moved somewhere else
          then:
            - Every file arrives byte for byte, and none is rewritten to suit its new address
            - The blueprint's row in this machine's registry records where they went, and nothing else on that row or any other changes
            - A destination that already holds records is refused rather than merged into
          statement_hash: sha256:1422c8dcbeae
          reworded:
            - hash: sha256:452142df8095
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:797a6afe9cc9
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:f650bd21c46f
              at: 2026-09-14T04:24:19Z
              why: "ADR 0004 wording pass, second round: the words moved, the meaning did not"
            - hash: sha256:af8538a1091f
              at: 2026-09-14T16:05:25Z
              why: the move has been recorded on the registry row since ADR 0003, not in the personal config; the words now say what the code does

      - id: locations.keeping.old-config-never-misfiles
        retired: Replaced by locations.keeping.upgrade-moves-once (ADR 0014 (2026-10-05)). The layouts it guarded against are moved by the upgrade, never read in place.
        origin: walkdown
        created_at: 2026-09-24
        statement: A personal config written before the registry never files a registered blueprint's records outside its home, and walkdown names each line of it that it no longer reads.
        because: A record filed where its readers do not look is lost without a word. A line that is kept but not read waits to surprise someone.
        history: "GitHub issue #18. On a machine with an older config, `init` left its `projects:` block and `defaults:` in place. Nine questions went to a directory beside the new home, and `walkdown threads` never saw them."
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A config.yml with a projects row about this checkout, and per-kind defaults spelled for the layout before numbered homes
          when:
            - The checkout is initialised, and its records are asked for
          then:
            - The row's machine-local keys, such as its targets, move to the registry row, the row leaves config.yml, and init says so
            - A default that would land beside the home, not in it, is not used, and the home's own directory answers
            - Both where and lint name that default and say why it is not used
            - A default aimed anywhere else, such as evidence on another disk, still applies
          statement_hash: sha256:3ad02c787d78
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [upgrade]
        signoff:
          - eng
          - product
        id: locations.keeping.upgrade-moves-once
        statement: "`walkdown upgrade` moves walkdown's files from the old layout to the current one, once, when a person runs it. It keeps every folder name and every verdict."
        because: A layout should change once, on purpose, and never be half-moved by whichever command happened to run first.
        steps:
          given:
            - A machine with `~/.walkdown/config.yml` and a personal home `~/.walkdown/blueprints/0003-shop/blueprint/`, and a repository with `.walkdown/config.yml`, a shared `.walkdown/.gitignore` and threads named `n-0001.yml`
          when:
            - "`walkdown status` is run, then `walkdown upgrade`, then `walkdown upgrade` again"
          then:
            - "`status` says an upgrade is due, names `walkdown upgrade`, and changes nothing"
            - "`config.yml` becomes `profile.yml`"
            - Each home's `blueprint/` folder is flattened, and `walkdown.yml` becomes `spec.yml`
            - Each home gets a `records.yml` and its own `.gitignore`, and the repository's `.walkdown/config.yml` and shared `.gitignore` are removed
            - The personal home moves to `~/.walkdown/projects/shop/blueprints/0003-shop/`, keeping its name
            - Registry rows get IDs and project labels
            - Each thread gets a UUID, and its file is renamed to it, keeping its label
            - "`walkdown status` then shows every verdict it showed before"
            - Run again, it reports nothing to do
          statement_hash: sha256:49cd12caf11c

  - id: locations.travel
    title: A record means the same thing on somebody else's machine
    statement: As a second person cloning this project, the verdicts I read were made against a spec I can identify and point at evidence I can actually open, without anyone having to have used my directory layout.
    rules:
      - id: locations.travel.evidence-by-key
        origin: prd
        statement: A run names the evidence it left by a logical key rather than a filesystem path, and the server resolves that key per machine.
        because: A screenshot filed on one laptop must still be findable from another, and no ledger entry should be pinned to the disk of whoever recorded it.
        verify: [checks]
        steps:
          given:
            - A run recorded while evidence lived in the repository
          when:
            - Evidence is moved out of the repository and the run is read again
          then:
            - The same key still resolves, and the picture still opens
            - No run file was edited to make that true
            - A key that climbs out of the evidence directory is refused
          statement_hash: sha256:9a1654d1a68d
          reworded:
            - hash: sha256:a7bc7cd07be3
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:4254ee8a1f3d
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)

      - id: locations.travel.judged-against-a-spec
        origin: prd
        statement: "Every run records a content hash of the spec it was judged against: `spec.yml`, `storyboard.yml` and `features/`, and no other file. Recording a verdict never changes that hash."
        because: A verdict has to say what it was measured against even when the project has no repository. A run is the spec's output, not part of it, so recording one cannot change the hash.
        verify: [checks]
        steps:
          given:
            - A blueprint and a run recorded against it
          when:
            - A verdict, a thread and a draft are written, then a rule is reworded
          then:
            - The three writes leave the spec hash exactly where it was
            - The rewording moves it
            - The same words in a different feature file are a different spec
            - Editing `AGENTS.md`, `records.yml` or `.gitignore`, or adding any other file to the home, leaves the hash where it was
          statement_hash: sha256:e055b263a9d3

      - id: locations.travel.provenance-not-currency
        origin: prd
        statement: A run records which commit it saw so a person can look it up later. A newer commit never makes an older verdict stop counting.
        because: Provenance tells a person digging into a verdict where to look; an unrelated commit must not turn a board from green to grey.
        verify: [checks]
        steps:
          given:
            - A ledger of passing verdicts
          when:
            - Commits land that touch neither the rules nor the code they describe
          then:
            - Every cell reads exactly as it did before
            - The runs still carry the shas they were recorded with, for anyone who wants to look
          statement_hash: sha256:b1efe71a4d3b
          reworded:
            - hash: sha256:c513160f49fc
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:6e10186c5b9c
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:d5257f44d2df
              at: 2026-09-14T02:30:30Z
              why: the statement is the goal in a breath; what it restated of its own steps went back to the steps (ADR 0004, walked with Topher 2026-09-13)

  - id: locations.pointer
    title: An agent arriving in the repository finds the spec
    statement: As an AI agent cloning this project, I find one paragraph telling me a spec exists and where it is - in the file this project actually keeps its conventions in, saying where the spec is now rather than where it used to be.
    rules:
      - id: locations.pointer.placed-where-agents-read
        origin: prd
        statement: Committing a repository's first blueprint adds one paragraph, saying where the specs are, to the file that repository already keeps its agent instructions in. If several files could be that one, walkdown writes nothing and names them.
        because: A project keeping conventions in several files has made a choice walkdown cannot read, and guessing puts the sentence where nobody reads it.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A repository whose first blueprint is being committed. A blueprint that is not committed gets no pointer, because nothing of walkdown's is in the tree.
          when:
            - It holds no agent-instruction file, or exactly one, or several
          then:
            - With no agent-instruction file, CLAUDE.md is created carrying the pointer
            - With exactly one, the pointer goes into that file, and no second file is made to compete with it
            - With more than one, nothing is written and the report names them all, for a person to settle by naming the one they want
          statement_hash: sha256:0315ecba8c84

      - id: locations.pointer.owns-only-its-block
        origin: prd
        statement: "walkdown owns one fenced paragraph in the repository's agent-instruction file, and nothing else in that file. It writes the paragraph once, and removes it when the last blueprint is moved back out of the repository."
        because: A paragraph that never names a blueprint never goes stale, so there is nothing to keep up to date.
        verify: [checks]
        steps:
          given:
            - An agent-instruction file with a person's own words above and below a walkdown block
          when:
            - A second blueprint is committed, one is renamed, and then every blueprint is un-committed
          then:
            - The second commit and the rename leave the file byte for byte as it was
            - Un-committing the last blueprint removes the block and nothing else
            - Every line outside the markers is untouched throughout
          statement_hash: sha256:fd33259c4a4e

      - id: locations.pointer.names-every-blueprint
        retired: Replaced by locations.pointer.names-no-blueprint (ADR 0014 (2026-10-05)). A blueprint's ID differs from machine to machine, so the pointer no longer lists blueprints, and is written once.
        statement: In a project with several blueprints, the paragraph `walkdown pointer` writes lists each blueprint by id with where its spec is, and says that commands which write need `--blueprint`.
        because: An agent arriving in the repository should find every spec in it, not only the first.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A project with blueprints a and b, and one agent-instruction file
          when:
            - "`walkdown pointer` places the paragraph, then b is renamed or moved and it is placed again"
          then:
            - The paragraph names a and b, each with where its spec is
            - It says that commands which write take `--blueprint <id>`
            - Placed again, it says what is true now, and appears once
            - With one blueprint the paragraph reads as before
          statement_hash: sha256:fc78cb716fcc
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        signoff:
          - eng
        id: locations.pointer.names-no-blueprint
        statement: The paragraph walkdown writes into the repository's agent-instruction file says that the specs live under `.walkdown/blueprints/`, that an agent reads the `AGENTS.md` in the blueprint it works on, and that `walkdown blueprints` lists their IDs. It names no blueprint.
        because: A blueprint's ID differs from one machine to the next, so committed text can only say where to look.
        steps:
          given:
            - A repository with blueprints `a` and `b` committed
          when:
            - The pointer is read
          then:
            - It says each of those three things
            - It holds no blueprint's name, folder or ID
            - It says that commands which write take `--blueprint <id>`, with `<id>` as written
          statement_hash: sha256:ea412d8747cd

  - id: locations.several
    title: A project holds several blueprints
    statement: As someone keeping two features' specs apart in one project, I can give each its own blueprint outside the repository, and still read them all from the project without naming one.
    rules:
      - id: locations.several.new-makes-another
        formerly: [locations.several.init-makes-another]
        statement: "`walkdown blueprints new <name>` gives a project that already has a blueprint a second one, in a home of its own. Running the same command again changes nothing."
        because: Two unrelated features in one project each want their own rules, threads and runs, kept out of the repository like the first.
        history: "On 2026-10-02 a project on Topher's work machine could not get a second blueprint without committing it to the repository (issue #20, ADR 0011). The id changed from init-makes-another, because the rule is about `blueprints new`, not `init` (n-0355)." #20, ADR 0011).
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng, product]
        screens: [init-another]
        steps:
          given:
            - A project `shop` with the blueprint `search`, kept outside the repository, and a second project that also has a `search`
          when:
            - "`walkdown blueprints new checkout` is run in `shop`, then the same again, then with no name"
          then:
            - The first makes a home for `checkout` beside `search`'s, registers it with an ID, and says it joined `shop` beside `search`
            - The second reports everything up to date and creates nothing
            - With no name, it means the name it would give the project anyway, and reuses that blueprint. If none has that name, it refuses and names them
            - A name another project already uses is not refused, and gets an ID of its own
            - With several blueprints in the project, `blueprints commit` needs `--blueprint`, and without it refuses and names the choices
            - "`walkdown serve` lists both, and `walkdown claims` reports both when both claim a page"
          statement_hash: sha256:a3cdd067af7b

      - id: locations.several.reads-cover-all
        statement: With several blueprints in a project, `status`, `lint`, `threads` and `where` run with no `--blueprint` report on every one, each under its ID.
        because: Adding a blueprint should not stop the first one's commands working.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng, product]
        screens: [status-two-blueprints, where-one-kind]
        steps:
          given:
            - A project with blueprints a and b
          when:
            - Each command is run with no `--blueprint`, then with `--json`, then with `--blueprint b`
          then:
            - Each prints one section per blueprint, headed by its ID, in the order they were registered
            - "With `--json` the answer is `{ blueprints: [...] }`, each entry the single-blueprint answer plus its id"
            - With `--blueprint b` it reports on b alone, as it does today
            - A project with one blueprint prints exactly what it printed before
          statement_hash: sha256:a7b80479ff35
          reworded:
            - hash: sha256:b52ccdd8164e
              at: 2026-10-06T00:47:54Z
              why: ADR 0014 renamed the files it names; what it asks of the build is unchanged

      - id: locations.several.writes-name-one
        statement: With several blueprints in a project, a command that writes or acts on one blueprint refuses until `--blueprint` names it, and the refusal lists the ids.
        because: Guessing would file a thread or a verdict under the wrong blueprint.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng]
        screens: [writes-refused-among-several]
        steps:
          given:
            - A project with blueprints a and b
          when:
            - "`hash --write`, `threads new`, a change to a thread, `judge`, `sweep` and `records move` are run with no `--blueprint`, then with `--blueprint b`"
          then:
            - Each exits with status 2, says several blueprints are registered here, names a and b, and says `--blueprint` picks one
            - With `--blueprint b`, each acts on b alone
            - A thread id that only one of them holds is changed without `--blueprint`
            - "\"No blueprint here\" is said only where none is registered"
            - "`walkdown run` is not among them: it runs the project's suite and files each result by rule (locations.several.results-filed-by-rule)"
          statement_hash: sha256:f0c27cd71949
          reworded:
            - hash: sha256:de5bdad5a7a4
              at: 2026-10-05T02:28:57Z
              why: ADR 0012 renamed the commands it quotes; what it asks of the build is unchanged

      - id: locations.several.results-filed-by-rule
        statement: In a project with several blueprints, a recorded test run files each result in the blueprint that holds its rule, and `walkdown run` with no `--blueprint` runs the suite once for the whole project.
        because: One test suite checks rules from every blueprint in a project, and a result filed in the wrong blueprint, or in none, leaves a built rule reading as unbuilt.
        history: On 2026-10-02 a project with two blueprints recorded nothing at all, because the reporter could not tell which blueprint a run was for (ADR 0013).
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project with blueprints a and b, and one test suite with a test tagged for a rule of each and a test tagged with a rule neither holds
          when:
            - The suite runs with walkdown's reporter, then `walkdown run` is run with no `--blueprint`, then with `--blueprint a`
          then:
            - a's runs hold a's result and b's runs hold b's, in two records sharing one run id
            - The tag neither blueprint holds is named in the reporter's output and recorded nowhere
            - "`walkdown run` with no `--blueprint` runs the suite once, or each distinct runner command once, and files results the same way"
            - "With `--blueprint a`, only a's results are recorded, and b's are named as set aside"
            - The node reporter, the Playwright reporter and the RSpec formatter all file this way
            - A project with one blueprint records exactly as before
          statement_hash: sha256:e6bc38c97ca2

      - id: locations.several.lint-reads-the-project
        statement: In a project with several blueprints, lint accepts what names another blueprint's rule, thread or screen.
        because: Sharing a test suite and citing each other's threads is normal for blueprints in one project, and lint that errors on every run for it teaches people to ignore lint.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A project with blueprints a and b, a test tagged with a rule of b's, and a rule of a's whose history cites a thread of b's
          when:
            - "`walkdown lint` runs"
          then:
            - a reports no error for the test tagged with b's rule, and no warning for the thread of b's
            - A tag that no blueprint in the project holds is still an error
            - A thread id that no blueprint in the project holds is still a warning
            - A run record's result for a rule another blueprint holds raises no warning, and neither does a thread on another blueprint's screen
          statement_hash: sha256:a2090d8e2e07

      - id: locations.several.thread-ids-unique
        retired: Replaced by locations.threads.uuid-is-the-identity and locations.threads.clashing-labels-ask (ADR 0014 (2026-10-05)). A counter in one checkout let two branches each file the same id.
        statement: A new thread's id is not used by any other thread in any blueprint of its project.
        because: A rule or a commit message that cites a thread by id should name exactly one conversation.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - A project where blueprint a's threads run to n-0005 and blueprint b's to n-0002
          when:
            - A note is filed in b, then a question in a
          then:
            - b's new note is n-0006, and a's new question is q-0007
            - Threads that already share an id keep it, and nothing is renumbered
            - A project with one blueprint numbers its threads as before
          statement_hash: sha256:edca96d77671

      - id: locations.several.serve-shows-each-screen
        statement: "`walkdown serve` over several blueprints shows a screen's pages without being told which blueprint, and refuses by name when two blueprints have different files at one address."
        because: A screen's page is loaded by the browser in a frame, so neither it nor anything it loads can say which blueprint it belongs to.
        history: After walkdown's spec split in two on 2026-10-02, a server started at the repository root answered every framed screen with "no blueprint named" (Topher, 2026-10-05).
        origin: walkdown
        created_at: 2026-10-05
        verify: [checks]
        signoff: [eng]
        steps:
          given:
            - "A project with blueprints a and b sharing one `as-built/`, each with its own prototype root, served from the project with no blueprint named"
          when:
            - "A page under `/as-built/`, `/proposals/` or `/prototype/` is asked for with no `?bp=`"
          then:
            - A file every blueprint that has it has as the same file is served
            - A file only one blueprint has is served from that one
            - "A file a and b each have, but as different files, is refused with status 409, naming a and b and saying `?bp=` picks one"
            - A file no blueprint has is not found, and a request naming its blueprint is served as before
          statement_hash: sha256:623f1388325d
      - id: locations.several.rules-move
        statement: "`walkdown rules move <rule|story|feature> --to <blueprint>` moves rules to another blueprint in the same project, with their threads, and copies the run records and evidence behind their verdicts."
        because: A project that grows a second blueprint should not lose the verdicts and signatures its rules already earned.
        origin: walkdown
        created_at: 2026-10-02
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A project with blueprints a and b, and a story in a whose rules have threads, checks, agent verdicts, signatures and a sweep
          when:
            - "`walkdown rules move <story> --to b --dry-run` is run, then the same without `--dry-run`"
          then:
            - The dry run lists the rules, threads, run records and evidence it would move or copy, and changes nothing
            - The rules leave a's feature file and arrive in the feature file of the same name in b, with their statements, steps and hashes unchanged
            - Their threads move to b and keep their ids
            - Each run record holding a result for a moved rule is copied to b, keeping its run id, time and author, holding only the moved rules' results, and saying which blueprint and run it was copied from
            - a's run records are unchanged
            - Sweep markers and the evidence the copies cite are copied to b
            - "`walkdown status` in b shows every moved rule with the verdicts and signatures it had in a"
            - A destination outside the project, a rule id the destination already has, uncommitted changes in either blueprint's features, and verdicts recorded at an address the destination's target does not point at are each refused, and nothing moves
            - It says how many rules and threads moved, and how many run records were copied
          statement_hash: sha256:7d24fcbae138
  - id: locations.threads
    title: A thread is one conversation, wherever it was filed
    statement: As someone working on branches and with teammates, I can file a thread without it colliding with one somebody else filed at the same time.
    rules:
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        signoff:
          - eng
          - product
        id: locations.threads.uuid-is-the-identity
        statement: Every thread gets a UUID when it is filed, and its file is named by it. Its label, such as `n-0357`, is the next number after the threads already present where it is filed.
        because: Two people filing at once should get two threads, not one merge conflict.
        steps:
          given:
            - Two branches of one repository, each filing a note in blueprint `a`, whose threads run to `n-0005`, and blueprint `b` in the same project, whose threads run to `n-0002`
          when:
            - Each branch files its note, the branches are merged, and a question is filed in `b`
          then:
            - Each branch's note is labelled `n-0006`, in a file named by its own UUID
            - The merge adds two files and gives git no conflict
            - "`b`'s new question is `q-0007`, numbered across the project"
            - A run record or reply written now names a thread by its UUID
            - Records already in the ledger are unchanged, and still find their threads by label
          statement_hash: sha256:945e5cd8fc01
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [threads-relabel]
        signoff:
          - eng
          - product
        id: locations.threads.clashing-labels-ask
        statement: When two threads in a blueprint share a label, walkdown says so, and relabels the newer one only when a person agrees. The old label stays as an alias.
        because: A label in a commit message cannot be edited, so it has to keep finding its thread.
        steps:
          given:
            - A blueprint where a merge has left two threads labelled `n-0006`
          when:
            - "`walkdown threads` and `walkdown lint` are run, the person agrees to relabel, and `walkdown threads show n-0006` is run"
          then:
            - Both commands name the two threads and the label they share
            - Nothing is relabelled until the person agrees. With no terminal, the command that does it is named
            - Agreeing gives the newer thread the next free label, and keeps `n-0006` as its alias
            - "`threads show n-0006` names both threads, and says which one holds the label now"
            - No run record or reply is edited
          statement_hash: sha256:d6cf9b7d1abb
  - id: locations.worktree
    title: A worktree is the same project
    statement: As someone whose agents build in worktrees, I can record runs and threads from a worktree into the project it belongs to.
    rules:
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        screens: [where-worktree]
        signoff:
          - eng
          - product
        id: locations.worktree.same-project
        statement: A worktree of a registered checkout belongs to that checkout's project. That is so when git says they share a repository, or when their `origin` remotes match.
        because: Agents build in worktrees, and the records they make there belong to the project.
        history: A worktree resolved to the main checkout, reading its spec, filing threads into its tree and stamping runs with its commit (ADR 0014 (2026-10-05)).
        steps:
          given:
            - A registered checkout of `shop`, a Claude Code worktree of it, an Archon worktree made from Archon's own clone under `~/.archon/workspaces/acme/shop/worktrees/`, and an unrelated clone
          when:
            - "`walkdown where` and `walkdown status` are run in each, and `walkdown blueprints new` in a worktree"
          then:
            - Both worktrees answer as `shop`'s blueprints, and `where` says which way each was matched
            - The unrelated clone is not a project
            - No worktree gets a registry row
            - "`blueprints new` in a worktree adds the blueprint to `shop`, and the home is made in the registered checkout's place, not in the worktree"
          statement_hash: sha256:a28e38241c7c
      - origin: walkdown
        created_at: 2026-10-05
        verify:
          - checks
        signoff:
          - eng
          - product
        id: locations.worktree.branch-spec-shared-records
        statement: In a worktree, walkdown reads the spec and threads from the worktree. The runs, evidence and drafts that git ignores are written where the registry says they live.
        because: A branch's rule changes should count on that branch, and deleting a worktree must not take a ledger with it.
        steps:
          given:
            - The Claude Code worktree of `shop`, on a branch that rewords a rule
          when:
            - "`status` is run, a thread is filed, checks are recorded, the worktree is deleted, and the same is done for a blueprint that commits its runs"
          then:
            - "`status` reads the reworded rule as the branch has it"
            - The thread lands in the worktree's tree
            - The run lands in the registered checkout's runs, stamped with the worktree's commit and branch
            - Deleting the worktree loses no run, evidence or draft
            - A blueprint that commits its runs writes them into the worktree instead
            - "`serve` started in the worktree serves the branch's spec"
          statement_hash: sha256:303430aff403
