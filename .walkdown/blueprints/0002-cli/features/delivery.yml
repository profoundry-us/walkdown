feature: delivery
stories:
  - id: delivery.install
    title: Getting walkdown needs nobody's permission
    statement: As someone inside an organisation that controls what may be installed, I can try walkdown without asking anyone, because there is nothing to approve.
    rules:
      - id: delivery.install.clone-is-the-install
        origin: prd
        statement: walkdown runs from a clone with nothing installed - no package registry, no build step, no network.
        because: The projects that most need their requirements made legible are the governed ones, where installing anything is a conversation rather than a command.
        verify: [checks]
        screens: [clone-config-by-path]
        signoff: [eng, product]
        steps:
          given:
            - A machine with git and Node, and a clone with no node_modules directory
          when:
            - walkdown is run from it
          then:
            - Every command works - init, where, lint, status, serve - and the panel and embed are served
            - Nothing walkdown ships at runtime resolves outside itself or Node's own library
            - The config init writes names the clone's Playwright reporter by its file path, so a project with no walkdown package installed can record its checks
            - Third-party code it carries is committed, attributed, and built from a named source rather than edited by hand
            - "`walkdown run` never has npx fetch a test runner: one the project has not installed is refused by name, saying how to install it, and nothing runs"
          statement_hash: sha256:8ebfb3b4fd1b

  - id: delivery.plugin
    title: walkdown is one plugin in Claude Code
    statement: As someone using walkdown from Claude Code, I find its skills under walkdown's own name, and they are always the version of walkdown I have installed.
    rules:
      - id: delivery.plugin.named-for-walkdown
        origin: walkdown
        created_at: 2026-10-01
        statement: In Claude Code, walkdown's skills and commands are listed under walkdown's own name, as `/walkdown:judge` and `/walkdown:lint` are, and nothing else in the clone is.
        because: One tool's skills should read as one tool's, and typing `/walkdown:` should show everything it offers.
        verify: [checks, agent]
        screens: [plugin-skills]
        signoff: [eng, product]
        steps:
          given:
            - A clone linked into Claude Code's skills folder
          when:
            - Claude Code starts a session
          then:
            - It loads one plugin named walkdown, at the clone's version
            - The skills setup, formulate, judge, incorporate and backlog, and the commands lint and status, are listed under `walkdown:`
            - Nothing else from the repository is listed - not walkdown-sitting, not this repository's hooks or agents
            - "`/walkdown:lint` and `/walkdown:status` run the CLI and report what it said"
            - "`claude plugin validate` passes on the clone"
          statement_hash: sha256:f528af8a645e

      - id: delivery.plugin.one-link
        origin: walkdown
        created_at: 2026-10-01
        statement: Installing walkdown's skills for Claude Code puts one link in Claude Code's skills folder, named `walkdown` and pointing at the clone, so updating the clone upgrades the skills with nothing else to run.
        because: A copied skill is a snapshot that goes stale with nothing to say so, and refreshing it overwrites whatever the person changed.
        history: Until 0.3.0 the skills were copied. The 0.2.0 upgrade needed `init --force`, and rehearsing it overwrote four of Topher's copies (2026-10-01, ADR 0010).
        verify: [checks]
        screens: [skills-again]
        signoff: [eng, product]
        steps:
          given:
            - A clone, and a Claude Code skills folder with nothing of walkdown's in it
          when:
            - "`walkdown init` or `walkdown skills` installs for Claude Code"
          then:
            - One link named walkdown points at the clone, and the command says so
            - Run again, it reports the link as up to date and changes nothing
            - After the clone checks out another version, the skills are that version's without running anything
            - "An edit made through the link shows in the clone's `git status`"
          statement_hash: sha256:d5fa92fb8b72

      - id: delivery.plugin.never-through-a-link
        origin: walkdown
        created_at: 2026-10-01
        statement: The skills installer never writes through a link, and it leaves alone any link it did not make.
        because: Writing through a link changes whatever the link points at.
        history: walkdown's own installer once wrote through this repository's skill links into its shipped source (n-0197, 2026-09-05).
        verify: [checks]
        screens: [skills-others-links]
        signoff: [eng]
        steps:
          given:
            - "A skills folder holding walkdown's own link, a link to something else at a name walkdown would use, and a skill folder whose SKILL.md is a link"
          when:
            - Skills are installed, with and without `--force`
          then:
            - walkdown's own link is reported as up to date
            - The other links are reported as someone else's and left as they are, even with `--force`
            - Every file a link points at is unchanged
          statement_hash: sha256:a8b1fc5a9e59

      - id: delivery.plugin.old-copies-make-way
        origin: walkdown
        created_at: 2026-10-01
        statement: Installing the skills for Claude Code with `--force` also removes the copies an earlier version of walkdown left in Claude Code's skills folder, and keeps any copy the person edited.
        because: Left in place, the copies make Claude Code list every skill twice. An edited copy is the person's own work.
        verify: [checks]
        screens: [skills-old-copies]
        signoff: [eng, product]
        steps:
          given:
            - "Claude Code's skills folder holding walkdown-judge exactly as a released version shipped it, and walkdown-setup edited by its person"
          when:
            - The skills are installed, first without `--force`, then with it
          then:
            - Without `--force`, the link is made, both copies are named as duplicates, and the command to remove them is given
            - With `--force`, walkdown-judge is removed and walkdown-setup is kept and reported as edited
            - A copy counts as unedited when it matches any version walkdown has released, not only the current one
          statement_hash: sha256:05c5546a78f3
