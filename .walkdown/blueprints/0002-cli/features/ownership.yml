feature: ownership
stories:
  - id: ownership.drift
    title: Spec ahead of its sources is routed, never silent
    statement: As a design team, we get a request in our queue whenever the spec needs something we haven't drawn.
    rules:
      - id: ownership.drift.design-requests-required
        origin: prd
        statement: Lint flags any screen that has no design and no open design request. Filing one clears the flag.
        verify: [checks]
        screens: [lint-no-design-request]
        steps:
          given:
            - "A storyboard screen with no design (`prototype: null`) and no note anchored to it"
          when:
            - The blueprint is linted
          then:
            - The screen is named as having no design and no open design request
            - An open note with the reason "request", anchored to that screen, clears it, because a request is queued for design
            - A note with any other reason does not clear it, because it is queued for the agent, where design will not see it
            - "A note whose thread has ended stops clearing it: a request is open work or it is nothing"
            - "A proposal sketch is not a request: a drawing nobody asked design for routes nothing"
            - A retired screen is exempt, because it describes something we stopped meaning
          statement_hash: sha256:418069b7b1f6

  - id: ownership.design
    title: The design is drawn by someone other than the builder
    statement: As a team, we get two perspectives on every screen, because whoever builds it never drew it.
    rules:
      - id: ownership.design.declared-per-blueprint
        origin: walkdown
        created_at: 2026-10-01
        statement: A blueprint names who draws its design in its `spec.yml`, with `design.by` set to `person` or `agent`. When a blueprint says nothing, a person draws.
        because: Who designs differs between projects. What holds on every one is that the builder does not draw.
        history: Decided in ADR 0009 on 2026-10-01 (GitHub issue #2). On Topher's own projects an agent designs; at work a designer does.
        verify: [checks]
        screens: [status-design-agent]
        signoff: [eng, product]
        steps:
          given:
            - 'Blueprints declaring design.by "person", design.by "agent", nothing, and some other value, each with an open design request'
          when:
            - Each is linted and its status report's attention list read
          then:
            - With "person", or with nothing said, the request is queued for the designer, shown the way a person's queue is
            - With "agent", it is queued for the design agent, never for the agent building the app
            - Any other value is a lint error that names "person" and "agent" as the values allowed
          statement_hash: sha256:95fef80f3517
          reworded:
            - hash: sha256:e1ce6c441f53
              at: 2026-10-06T00:47:54Z
              why: ADR 0014 renamed the files it names; what it asks of the build is unchanged

      - id: ownership.design.request-on-a-screen
        origin: walkdown
        created_at: 2026-10-01
        statement: A design request can be filed on a screen alone, with `walkdown threads new --screen <id>`. A thread filed on a screen with no rule is a design request unless a `--reason` says otherwise.
        because: The screen that most needs a request is one that design has not drawn, and it often has no rule yet to anchor to.
        history: AGENTS.md told agents to file a design request anchored to the screen while `walkdown thread new` refused any thread without `--rule` (found 2026-09-29, deferred until ADR 0009 was decided).
        verify: [checks]
        screens: [thread-screen-request, threads-new-request]
        signoff: [eng]
        steps:
          given:
            - "A screen with `prototype: null` and no rule naming it"
          when:
            - "`walkdown threads new --screen <id> --body <text>` is run"
          then:
            - It is filed anchored to the screen, with no rule, and with the reason "request"
            - It satisfies ownership.drift.design-requests-required for that screen
            - Given `--reason <reason>`, the thread carries that reason
            - With neither `--rule` nor `--screen`, it is refused, and the refusal says to name one
          statement_hash: sha256:d92cdf580877
          reworded:
            - hash: sha256:f073f61e1435
              at: 2026-10-05T02:28:57Z
              why: ADR 0012 renamed the commands it quotes; what it asks of the build is unchanged

      - id: ownership.design.every-screen-has-rules
        origin: walkdown
        created_at: 2026-10-09
        verify: [checks]
        signoff: [eng, product]
        statement: Every screen in a storyboard is named by at least one rule, and lint names any screen no rule names.
        because: A design is accepted by approving the rules on its screen, so a screen no rule names could never be accepted.
        history: On 2026-10-09 seven screens were designed before any rule named them, and nothing walked Topher to them. It was a warning until 2026-10-12, when Topher made it an error like a rule with no screen.
        screens: [lint-unnamed-screen]
        steps:
          given:
            - A storyboard with one screen that no rule's screens list names
          when:
            - The blueprint is linted
          then:
            - Lint names that screen as an error and says to write the rules it must show, and exits 1
            - A retired rule does not count as naming a screen, so a screen only a retired rule names is named the same way
            - A retired screen is not linted
          statement_hash: sha256:01920019bc11

      - id: ownership.design.approved-rules-accept-the-design
        origin: walkdown
        created_at: 2026-10-09
        verify: [checks]
        signoff: [eng, product]
        statement: Once a person has approved every rule on a screen, the screen's pending design request is accepted in their name.
        because: Approving what a screen must do, with its design beside it, is accepting the design. A second click would ask for the same decision twice.
        history: Topher, 2026-10-09, while walking the 0.5.0 designs.
        unverifiable:
          agent: What it changes is a record, the request's status and the name that accepted it. How an accepted design then shows is judged under screens.surfaces.proposed-beside-accepted, so a look here would judge that rule again. The checks read the request on disk after each approval.
        steps:
          given:
            - A screen with a proposed design, its pending design request, and three unbuilt rules that name it
          when:
            - A person's walkdown approves the rules one by one
          then:
            - After two, the request is still pending
            - After the third, the request is accepted in that person's name, and the proposed version becomes the accepted one
            - Sending any of the rules back leaves the request pending
            - An agent's verdict never accepts a design
            - A rule that names two screens counts toward each
          statement_hash: sha256:98aad72d33a6
          excused: [agent]

      - id: ownership.design.retired-counted-apart
        origin: walkdown
        created_at: 2026-10-12
        verify: [checks]
        signoff: [eng, product]
        statement: Lint checks nothing about a retired rule or a retired screen, and its closing line says how many of each it left out.
        because: A retired rule or screen describes something we stopped meaning, so a finding on one is noise. Counting them apart keeps them visible without mixing them into what was linted.
        history: Topher, 2026-10-12, while reading the lint-unnamed-screen draft.
        screens: [lint-unnamed-screen, lint-no-screen]
        steps:
          given:
            - A blueprint holding live rules and screens, two retired rules and one retired screen
          when:
            - The blueprint is linted
          then:
            - Nothing is said about the retired rules or the retired screen, other than that a retired rule's id still resolves
            - The closing line counts only the live rules and screens
            - It then says how many were left out, as `2 retired rules and 1 retired screen were not linted`
            - With nothing retired, that part is not printed
          statement_hash: sha256:dc971fcf98e1

      - id: ownership.design.request-names-its-version
        origin: thread:q-0587
        created_at: 2026-10-12
        verify: [checks]
        signoff: [eng, product]
        statement: "`walkdown threads set <id> --proposes <version>` names the design version a request proposes. Anyone may set it, a person or an agent, and nothing else writes it except the upgrade."
        because: The walk shows a proposed design beside its rules only when its request names it, and a designer should not have to edit a thread's file by hand to do that.
        history: Until 2026-10-12 only `walkdown upgrade` wrote `proposes:`, so new drafts were named by editing the thread's YAML, which AGENTS.md forbids (Topher, q-0587).
        screens: [threads-set-proposes]
        steps:
          given:
            - A design request on screen receipt, and a version drawn at /receipt/20261012.html under the blueprint's design root
          when:
            - "`walkdown threads set <request> --proposes /receipt/20261012.html --blueprint <bp>` is run"
          then:
            - The request names that version, and the walk shows it beside the screen's accepted design
            - A reply on the request says who named which version, so a later change of version is in its history
            - A path that names no file under the design root is refused by name, nothing is written, and it exits 2
            - A thread that is not a design request is refused the same way
            - An accepted request is refused, because a new version of an accepted design goes on a new request
          statement_hash: sha256:0680eae68b81

      - id: ownership.design.live-rule-names-a-live-screen
        origin: thread:q-0598
        created_at: 2026-10-12
        verify: [checks]
        signoff: [eng, product]
        statement: A live rule that names a retired screen is a lint error on that rule.
        because: Lint validates live rules, and a live rule on a retired screen is one no walk reaches.
        history: Topher, 2026-10-12 (q-0598), after a judge found such a rule passing lint because it named a screen, though that screen was retired. A retired screen may name its replacement with `replaced_by:`, so the error can say where the rule belongs.
        screens: [lint-retired-screen-named]
        steps:
          given:
            - "A storyboard with a retired screen old-cart, declared `replaced_by: cart`, that two live rules still name"
            - A retired screen old-receipt that only a retired rule names, and a retired screen old-promo with no replacement that one live rule names
          when:
            - The blueprint is linted
          then:
            - Each live rule naming old-cart is an error, named in its file and at the rule. It says the rule names the retired screen old-cart, which cart replaced, and to point it at cart or retire the rule too
            - The rule naming old-promo is the same error, saying to point it at a live screen, since nothing names a replacement
            - No retired screen is linted, and all three are counted among the retired screens that were not linted
            - Lint exits 1
          statement_hash: sha256:4455e2293cb6

  - id: ownership.authoring
    title: A rule is written so it can be built from
    statement: As a team, we can hand a rule to whoever implements it - a person or an agent - and have them build the right thing without asking us what we meant.
    rules:
      - id: ownership.authoring.steps-are-required
        origin: walkdown
        statement: Every rule carries given/when/then steps. A rule without them is reported as an error, not as a warning.
        because: The steps are what a check is built from; a statement standing alone leaves whoever implements it to invent the detail and whoever judges it with nothing to judge against.
        verify: [checks]
        screens: [lint-steps-and-length]
        steps:
          given:
            - A rule carrying a statement and no steps, and a retired rule carrying neither
          when:
            - The blueprint is linted
          then:
            - The rule with no steps is an error, named in the file and at the rule
            - A rule whose steps are present is silent, whatever else is true of it
            - "A retired rule is exempt: it describes something we stopped meaning, and owes nothing but an id that still resolves"
            - The error says why - a check is built from the steps - so the fix is obvious to whoever reads it
          statement_hash: sha256:3227ee91ac45
          reworded:
            - hash: sha256:a0e7cc9e7139
              at: 2026-09-13
              why: the hash covers the steps now; this one named the statement alone
            - hash: sha256:511aa1c28355
              at: 2026-09-13
              why: the statement is the claim alone now; its reason moved to `because` and what happened to `history` - same rule, split (n-0286, 2026-09-13)
            - hash: sha256:5215a4e2b046
              at: 2026-09-14T04:15:34Z
              why: "ADR 0004 wording pass: the words moved, the meaning did not"

      - id: ownership.authoring.statement-reads-at-a-glance
        origin: walkdown
        created_at: 2026-09-13
        statement: A statement is one or two sentences a stranger can read without the steps. Lint names a statement that has grown into a paragraph, and a reason that has grown into a story.
        because: A rule is read by product and design before it is built, and a statement restating its own steps hides what it wants.
        history: Twenty-two of 132 statements had grown past forty-five words, every one restating its then-steps, and were reworded in one sitting (ADR 0004, 2026-09-13).
        verify: [checks]
        screens: [lint-steps-and-length]
        steps:
          given:
            - A rule whose statement runs past forty-five words or three sentences, and one whose because runs past thirty-five words
          when:
            - The blueprint is linted
          then:
            - The long statement is a warning that says what a statement is for, not only what number it crossed
            - The long because is a warning that says what belongs in history
            - A statement under the line is silent, whatever else is true of it
            - Both are warnings, never errors, because length is a symptom and a person decides
          statement_hash: sha256:97f1bacfb270

      - id: ownership.authoring.machine-words-pass-the-voice
        origin: thread:n-0323
        created_at: 2026-09-20
        statement: The machine's own words are refused at the door when they miss the voice, with each fault named, and lint names the same faults in every rule already on the board. A person's words are never gated.
        because: Most of the prose on a board is the machine's, and a sentence that failed a stranger is cheaper to fix before it is filed than to find after.
        history: Twenty-one of the agent's own observations read as one paragraph each, dashes chaining three thoughts, and Topher asked for a voice and a check against it before anything is saved (n-0323, 2026-09-20).
        verify: [checks]
        screens: [reply-refused-voice]
        steps:
          given:
            - A thread the machine is about to reply on, and a rule whose statement runs past forty words
          when:
            - The machine files a reply with a dash-chained sentence, then again with --as-is
            - A person files the same words as their own
            - The blueprint is linted
          then:
            - The first reply is refused and the refusal names the fault and the sentence, and nothing lands on disk
            - The --as-is reply lands unchanged
            - The person's reply lands unchanged, gated by nothing
            - Lint warns on the long statement under the category `voice`, saying what to do, never an error
          statement_hash: sha256:4c46fabe7d48

      - id: ownership.authoring.focus-is-a-declared-anchor
        origin: walkdown
        created_at: 2026-10-10
        verify: [checks]
        signoff: [eng, product]
        statement: Lint refuses a rule whose focus names no anchor declared on one of its screens.
        because: A focus nothing on the screen carries would open the rule at the top while it claims to open at an element.
        history: Proposed with the focus field in ADR 0016 (issue #24, 2026-10-10).
        screens: [lint-focus-undeclared]
        steps:
          given:
            - A rule whose focus is an anchor none of its screens declares
          when:
            - Run `walkdown lint`
          then:
            - Lint reports an error on that rule naming the focus and the rule's screens, and exits non-zero
            - A focus declared on one of the rule's screens passes, and a rule with no focus is never asked for one
          statement_hash: sha256:0f4cacbd010f

  - id: ownership.writes
    title: The server writes specification, never implementation
    statement: As a team, we can let a browser talk to the review server because the only things a request can create are the things review is FOR - feedback, sittings, verdicts - and never the product itself.
    rules:
      - id: ownership.writes.spec-never-implementation
        origin: thread:q-0019
        statement: "The review server lets a browser write three kinds of record: a thread, a draft, a run. Anything it writes outside those three directories is a breach, not a bug."
        because: The browser captures intent and the agent structures it; the product is never written from a web page.
        verify: [checks]
        signoff: [eng, product]
        unverifiable:
          agent: The claim is about every byte on disk after every write the API offers. No screen shows which files did not change, and the checks compare the whole tree before and after.
        steps:
          given:
            - A running review server, and a browser that can reach it
          when:
            - Every write the API offers is performed - a thread opened, a reply, a transition, a draft saved and discarded, a walkdown sealed
          then:
            - Everything that changed on disk is under the resolved threads, drafts or runs directories
            - Nothing under features, the storyboard, the prototype root, source or checks moved by a byte
            - The one module every write passes through names the author policy once, so a new writer cannot re-invent it
          statement_hash: sha256:b82aec1ea7cc
          excused: [agent]

  - id: ownership.evidence
    title: A check is evidence only for what it actually exercises
    statement: As a team, we trust the checks column because a green cell means the described behaviour was exercised, not that something adjacent to it was.
    rules:
      - id: ownership.evidence.same-surface
        retired: The ledger tracks behaviour a person can see, and this is a rule about how the test suite is written (2026-08-26, thread n-0074) - it lives in blueprint/AGENTS.md, and its mechanical half is already carried by status.derived.unbacked-pass-goes-stale.
        origin: thread:q-0070
        statement: A check may only claim a rule whose behaviour it actually exercises - a rule describing what the panel or the embed does is not verified by a test that drives the server they talk to, because such a test passes in full while the described surface is broken, which makes the cheapest and most-trusted tier the one most able to lie.
        steps:
          given:
            - A rule whose statement describes something a person sees or does
          when:
            - A check is written and tagged with that rule id
          then:
            - The check drives the surface the statement describes, not a layer beneath it
            - If it cannot, the rule keeps demanding checks and reads as unverified rather than borrowing a neighbour's pass
          statement_hash: sha256:a77756271587
