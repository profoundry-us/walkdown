body: Does this command need the blueprint passed? We might have multiple
  blueprints with `n-0001` notes on them. Or is it figuring out the blueprint
  based on the current directory?
replies:
  - author: agent
    created: 2026-10-06T22:21:57Z
    body: "Decided with you: every write takes `--blueprint`, always, even with one
      blueprint and even when a thread label could only be in one. Reads
      (status, lint, threads, threads show, where) need none, because they print
      a section per blueprint and choose nothing. `walkdown run` is the one
      exception, since it files each result in the blueprint that holds its
      rule. A write without the flag is refused, lists the IDs and changes
      nothing (locations.several.writes-name-one, reworded)."
