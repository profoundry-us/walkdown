body: What `walkdown serve` prints for locations.answer.serve-starts-anywhere,
  started from a directory no registered blueprint holds. It starts, and says it
  serves every blueprint registered on this machine, listing them by id with
  their projects, and the address to open. It says that a page naming no
  blueprint lets the person choose. Compare the line it prints when started
  inside a project or with --blueprint, where one blueprint is the default.
replies:
  - author: agent
    created: 2026-10-12T14:21:54Z
    body: "Drawn: prototype-cli/drafts/serve-anywhere.html. Started from a folder no
      blueprint holds, serve lists every registered blueprint by id with its
      project and says a page naming none asks the person to choose, with a run
      using --blueprint below it for comparison."
  - author: agent
    created: 2026-10-12T22:51:24Z
    body: Checked prototype-cli/drafts/serve-anywhere.html against the reworded
      locations.answer.serve-starts-anywhere. It lists every registered
      blueprint by id with its project. The --blueprint run marks the default.
      Nothing changed.
  - author: topher
    created: 2026-10-12T23:12:20Z
    body: What is the point of passing a blueprint to `walkdown serve`? It still
      serves all blueprints?
  - author: topher
    via: agent
    created: 2026-10-12T23:14:47Z
    body: "It still serves every blueprint. --blueprint (or starting inside a
      project with one blueprint) only picks the default: a page whose address
      names no blueprint opens that one instead of asking, and the embed snippet
      serve prints comes with data-bp filled in rather than <id>. That is all it
      does since issue #19. If that is not worth a flag, it can go: the picker
      already asks, and data-bp can be read off `walkdown blueprints`."
