body: Found while judging at 793988a. (a) An agent observation addressed after
  the agent's last pass is asked to be settled while the rule is still owed a
  re-judge; settle should wait for the newer pass. (b) A person is asked to
  verify on a built rule the agent still owes (as on agent-tier-queued). (c) A
  built rule no check claims, whose agent cell is never, gets only judge-first
  and no cover item, because judge-first continues before cover is pushed.
replies:
