id: q-0300
kind: question
author: agent
created: 2026-09-17T00:11:04.934Z
anchor:
  rule: status.evidence.agent-assumed
status: incorporated
body: >-
  Should the judge prompt hand out a port, so two judges driven at once cannot
  pick the same one?


  Context: two judges collided on 2026-09-05 (n-0202) because each chose its own
  port and the shared browser pane pulled tabs between them. Handing out the
  port is the one half walkdown could own: `walkdown judge <rule> --port <n>`
  printed into the prompt, and the scratch copy made on it.
options:
  - label: Yes - the prompt hands out a port
    why: walkdown judge <rule> --port <n>, and the scratch copy is made on it
  - label: No - judges pick their own
    why: the collision was the shared pane, not the port
replies:
  - author: topher
    created: 2026-09-21T00:48:01Z
    body: Yes - the prompt hands out a port
  - author: agent
    created: 2026-09-21T01:47:30Z
    body: Built. walkdown judge <rule> takes --port <n>; without it the port is
      derived from the rule id in the 4730s, so two judges driven at once land
      apart and the same rule always lands on the same one. The prompt says
      'Your port is N. Make the scratch copy with --port N and serve it there'
      in its governance block. A unit test drives both forms; a step on
      status.evidence.agent-assumed says so.
chosen: Yes - the prompt hands out a port
