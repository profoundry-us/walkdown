body: Which door should write a design request's `proposes:`? Today only
  `walkdown upgrade` writes it. A designer, or the design agent, who draws a new
  version has to edit the thread's YAML by hand to name it, and AGENTS.md tells
  agents never to.
options:
  - label: A flag on threads set
    why: "`walkdown threads set <id> --proposes /receipt/20261010.html`, by anyone,
      like a reply"
  - label: Inferred from designs/
    why: the newest version in designs/<screen>/ that no accepted pointer names is
      the proposed one, so nothing is written
  - label: Leave it for now
    why: the upgrade writes it for drafts that exist today, and a designer asks when
      they need it
replies:
  - author: topher
    created: 2026-10-12T23:07:41Z
    body: A flag on threads set
    answer: true
  - author: topher
    via: agent
    created: 2026-10-13T01:53:35Z
    body: "Folded in: ownership.design.request-names-its-version, written and its
      draft proposed."
chosen: A flag on threads set
