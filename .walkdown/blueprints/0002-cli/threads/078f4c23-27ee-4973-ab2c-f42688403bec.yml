body: "Fourth sitting: once a new repository stands at a moved checkout's old
  path, the move is not seen. Re-pointing keyed on the old directory being gone.
  A committed home then imports as a new ID, and a personal one cannot be named
  back."
replies:
  - author: agent
    created: 2026-10-06T03:48:59Z
    body: A committed row now counts as moved when its home is gone from its place,
      whatever stands at the old path. A project named with --project moves even
      if its old path holds a new repository. A second import of an already
      re-pointed checkout says 'already listed'.
