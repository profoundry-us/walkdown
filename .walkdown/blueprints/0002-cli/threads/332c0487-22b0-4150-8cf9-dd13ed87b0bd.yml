body: ADR 0015 §2a. Draw 'walkdown upgrade --dry-run' on a blueprint with
  prototype/screens/, prototype/drafts/ and proposals/. It lists each accepted
  screen moving to prototypes/<screen>-YYYYMMDD.html, dated by its first commit.
  Each draft or proposal an open request names becomes that request's proposed
  version. It lists every file it would remove because nothing names it, and
  says they stay in git history. It names the folders it would remove, and
  as-built/redlines.json becoming redline threads. It ends saying nothing was
  moved, and how to run it for real.
