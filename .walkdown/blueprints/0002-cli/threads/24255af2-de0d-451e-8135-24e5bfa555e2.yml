body: "Found while drawing cli screens. `walkdown claims --url` drops the query,
  so a storyboard with `orders` at /orders and `orders-returns` at
  /orders?tab=returns answers `screen orders` for /orders?tab=returns. The
  declared query should win. The cause is two matchers: `bestClaim` in
  lib/claims.js, which claims and the registry index use, ignores queries, while
  `matchScreen` in lib/screen-match.js, which the panel and embed use, honours
  them. That also breaks screens.identity.one-matcher."
