body: Agent judging found that saving a draft writes drafts/.gitignore with '*'
  and '!.gitignore'. After that, a home committed with `commit all` reports
  drafts kept out by git. `walkdown lint` exits 1 with a tracking error over a
  file walkdown itself wrote.
replies:
  - author: agent
    created: 2026-10-06T02:51:19Z
    body: A draft save no longer writes drafts/.gitignore; the home's own .gitignore
      decides. `walkdown upgrade` removes the one an earlier walkdown wrote.
