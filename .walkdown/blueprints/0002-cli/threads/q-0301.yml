id: q-0301
kind: question
author: agent
created: 2026-09-17T00:11:22.483Z
anchor:
  rule: status.evidence.agent-assumed
status: incorporated
body: >-
  Is there anything to do about the shared browser pane pulling one judge's tab
  onto another judge's server, or is the answer simply 127.0.0.1 plus confirming
  /api/blueprint before trusting a page?


  Context: on 2026-09-05 two judges, each isolated by port, scratch copy and
  WALKDOWN_HOME, still had their tabs navigated onto each other's servers - one
  started a recording on the wrong copy before noticing (n-0202). The
  confirm-first step is in every judge prompt since 2026-09-14. What is left is
  whether walkdown can defend the client side at all, or whether the procedure
  is the whole answer.
options:
  - label: The procedure is the answer
    why: 127.0.0.1 plus confirming /api/blueprint before trusting a page, as every
      judge prompt has said since 09-14
  - label: Defend the client too
    why: the panel refuses to record against a server whose blueprint key differs
      from the one it opened with
replies:
  - author: topher
    created: 2026-09-21T00:48:43Z
    body: Defend the client too
  - author: agent
    created: 2026-09-21T01:47:30Z
    body: Built. The panel remembers the key of the board it opened - the
      blueprint's home on disk - and every later answer from /api/blueprint is
      compared against it. A server that starts answering for another blueprint
      (a restart on the same port for a different copy; the case a shared
      browser hands a judge) drops the sitting on the spot, starts over on what
      is there now, and says so in a sticky toast - nothing of the sitting is
      carried to a board nobody chose. A step on
      panel.walkdown.records-to-ledger and a check that rewrites the server's
      answer.
chosen: Defend the client too
