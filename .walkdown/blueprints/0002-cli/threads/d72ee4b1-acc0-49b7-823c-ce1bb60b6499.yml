body: 'Found while judging at 793988a. `threads new --reason finding --as-agent
  --said "…" --added "I reproduced it"` exits 0 and drops the --added text
  without a word; the same flag on relayed feedback keeps it. lib/writes.js
  openThread sets added to null for a finding or an observation. Also: when the
  reason is filled in by default, the confirmation leaves it out, while show and
  threads print it.'
replies:
  - author: agent
    created: 2026-10-08T13:47:21Z
    body: Fixed. A finding or an observation is the machine's own words, so relayed
      words (`said`, `added`) on one are refused rather than filed as the
      machine's, which dropped `added`. The confirmation line now prints a
      defaulted reason too.
