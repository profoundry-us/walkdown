body: ADR 0014 changed this screen's shape. as-built/cli/help.html is the build.
  A new 'walkdown upgrade [--dry-run]' line under Getting ready. 'blueprints
  new' takes [<name>] [--folder <folder>] [--project <label>] [--code <pc>] (no
  --dir), 'import' takes --all|--only <folders> (no --id), and 'blueprints
  rename' takes <new-name> [--folder <folder>]. 'rules rename' is listed beside
  'rules move'.
