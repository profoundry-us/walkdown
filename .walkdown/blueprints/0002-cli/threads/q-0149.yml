body: >-
  Should `serve --dir` scope the server to the blueprint it names?


  Today it does not, and every judging prompt is relying on the assumption that
  it does. The governance lines in walkdown.yml tell an agent to make a scratch
  copy and serve it with --dir precisely so the app under review cannot write to
  the real ledger. But the served process still resolves every OTHER listed
  blueprint, and the panel's own chooser offers them — so the isolation is one
  click deep.


  Measured just now against a scratch copy of this blueprint, served on :4933
  with --dir .walkdown/tmp/hazard-0901/blueprint, with a marker thread n-9999
  planted in the copy:

    GET /api/blueprint              147 threads, has n-9999: true   (the copy)
    GET /api/blueprint?bp=walkdown  146 threads, has n-9999: false  (the REAL ledger)
    GET /api/blueprint?bp=example     6 threads, has n-9999: false

  The chooser lists walkdown and example, both marked "current": false — so the
  served scratch is not offered as an option at all, while the two things it
  exists to protect are. An agent told to serve a copy, browsing its own board,
  is one selection away from filing notes and verdicts into the real blueprint.
  Nothing was mutated through that path while measuring; the marker file was
  removed and the scratch cleaned.


  Raised by an independent judge of threads.lifecycle.claim-never-accept
  (2026-09-01), which also reported the same session's browser pane being
  navigated onto another judge's server mid-run — the same hazard from the other
  direction: a surface that does not say which blueprint it is about.


  Three shapes this could take, and which is right is a decision rather than a
  fix:


  1. --dir pins the server. ?bp= for anything else is 404, and the chooser shows
  the one blueprint. Strongest, and it makes the governance line true; costs the
  multi-project panel whenever --dir is used.

  2. --dir marks the server disposable. The chooser still lists others but they
  are read-only, or the panel says plainly that the served blueprint is a copy.

  3. Leave the behaviour, fix the prompts. Judging prompts stop implying
  isolation --dir does not provide, and say to pin WALKDOWN_HOME and stay off
  the chooser.


  I lean 1: the governance text already describes it, and an isolation an agent
  has to remember is not one. But it changes what --dir means for everybody, not
  only for judges, so it is yours.
replies:
  - author: topher
    via: agent
    created: 2026-09-02T20:46:00Z
    body: Yes, and it is settled structurally rather than by care. There is no
      --dir; a server offers what the .walkdown WHERE IT WAS STARTED declares,
      merged with the personal config (locations.answer.one-walkdown-answers,
      n-0159). That alone is not enough for a scratch copy served from the real
      repository - the real project's config is merged in and its roots contain
      the copy, so the real ledger was still one ?bp= away. So `node
      tools/scratch.mjs new` now gives the copy a .walkdown of its own declaring
      only itself and a home/ of its own, and the governance lines say to serve
      it from inside the copy with WALKDOWN_HOME pointed at that home. Started
      there, /api/blueprint offers [blueprint] and ?bp=walkdown is 404 (checked
      by hand, 2026-09-02). Serving a copy with --project from the real
      repository is now named in governance as the thing not to do.
  - author: topher
    via: agent
    created: 2026-09-02T20:46:57Z
    body: "Folded into locations.answer.one-walkdown-answers (statement and THEN 4:
      a server offers only what the .walkdown where it was started declares,
      wherever the served blueprint sits) and into the governance lines of
      walkdown.yml, which now say how a scratch copy is served so that the real
      ledger is unreachable from it."
