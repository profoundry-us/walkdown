body: Found while judging. `walkdown threads show n-0099`, for a label no
  blueprint holds, in a project with two blueprints, says "Several blueprints
  are registered for ~/shop … Choose one with `--blueprint <id>`". With
  `--blueprint checkout` it says `No thread "n-0099"`. show is a read and needs
  no flag, so it should say the label is in no blueprint.
