  rule: commands.shape.noun-then-verb
status: verified
body: Lint reads every backticked single word in a step as a screen id. So the
  commands rules raise 28 'step mentions unknown screen' warnings on words like
  `list`, `show`, `status` and `shop`, which are commands and example names, not
  screens. The rule's wording is right; the heuristic is the noise.
  panel.rules.steps-not-an-appendix was once reworded only to dodge the same
  warning. Here is the fix I would propose. A rule that names its screens with
  `screens:` has said which ones it touches, so lint would stop guessing from
  its backticks. A rule without `screens:` keeps the warning, where a typo is
  likeliest. No rule asks for this yet, so it is not built; say the word and I
  will write the rule first.
