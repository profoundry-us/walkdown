body: Judged on a scratch machine (evidence
  2026-10-06T22-00-32Z/folder-names-are-yours.txt). A home inside a home is
  refused only by the scan. `blueprints import .` refuses the nested home and
  names both folders, and `new --folder 202610-search/sub` is refused. But
  `blueprints import .walkdown/blueprints/202610-search/inner` registers the
  inner home, and importing its parent next registers that too, so two homes end
  up nested one inside the other.
