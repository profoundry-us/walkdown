body: "What walkdown hash --write prints when a signed rule's words changed and
  no reason was given (status.derived.a-change-says-why). The signed rule is
  refused by name; the refusal says a signed rule's change needs its reason and
  gives both commands with the rule's id: --changed \"<why>\" (the meaning
  moved; signatures go stale) and --reword \"<why>\" (words only; signatures
  stand). An unsigned rule in the same run is stamped and listed as written.
  Nothing is written for the refused rule; exit 2. Sit it beside
  hash-reword-adds-excuse, which is the nearest accepted refusal."
