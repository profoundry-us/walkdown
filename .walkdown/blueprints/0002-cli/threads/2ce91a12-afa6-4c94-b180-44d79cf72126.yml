    created: 2026-10-06T03:14:31Z
    body: "`blueprints import <checkout>` on a moved checkout holding only personal
      homes now re-points the rows whose checkout is gone. It matches by the
      label the new place would get, and only when those rows name one old
      checkout. IDs, labels, codes and homes are kept."
