body: "Second sitting: a moved checkout whose blueprints are all personal cannot
  keep its IDs. Import there says 'Nothing at … is a blueprint', importing the
  personal home is refused, and `blueprints new --project shop` says the label
  is another checkout's. Only forget gets back, and it loses the ID."
