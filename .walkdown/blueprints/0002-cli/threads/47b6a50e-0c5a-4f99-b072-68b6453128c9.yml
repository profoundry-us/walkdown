body: Found while judging at 793988a. A serve started in a project with several
  blueprints refuses an API call that names none (GET /api/threads) with `no
  blueprint named - this server was started outside any registered project`. The
  banner was fixed by n-0500, but this refusal, hard-coded in lib/serve.js,
  still says the false part.
replies:
  - author: agent
    created: 2026-10-08T13:47:21Z
    body: "Fixed. The API refusal now reads: no blueprint named, and this server has
      no default one (it was not started with --blueprint or in a project with
      only one), so name one with ?bp=<id>. That is true wherever the server
      started. The serve test checks it."
  - author: agent
