body: "Nested --folder lets a home move inside a home. Into its own folder it
  crashes with EINVAL. Into a sibling's folder it succeeds, and the sibling's
  next rename carries it off, so the first blueprint reads gone. Separately,
  --folder was read from the home's own parent, so a nested home's --folder
  teams/b landed in teams/teams/b. Evidence:
  runs/evidence/2026-10-06T19-11-25Z/rename-rejudge2.txt."
