body: "A home in a nested repository is answered as the outer one. Setup: store
  is a git repo with one registered blueprint, checkout. store/vendor/pack is
  its own repo, holding an unimported home at .walkdown/blueprints/202610-pack.
  Standing inside that home, status and where answer as 0001-sr-checkout, and
  'threads new' files into checkout's ledger. Nothing names 202610-pack or its
  import, although the same nested repo does name it when the outer checkout has
  nothing registered. Evidence:
  runs/evidence/2026-10-06T20-39-55Z/declared-not-discovered.txt (P3)."
