body: Found auditing the HireArt setup. The RSpec formatter still reads identity
  from ~/.walkdown/config.yml (adapters/rspec/lib/walkdown/formatter.rb:326, and
  its header comment at line 32). ADR 0014 renamed that file profile.yml, so
  after `walkdown upgrade` every RSpec run is recorded under the OS login (actor
  "root" in the audit), not the profile's username. It should read profile.yml,
  falling back to config.yml, and a test should cover it.
