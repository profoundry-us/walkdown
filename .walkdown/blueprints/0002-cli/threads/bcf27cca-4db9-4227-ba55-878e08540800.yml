body: "Found while judging at 793988a. Take a built rule that the agent has
  never judged, or whose agent verdict is stale. A person's note on it is then
  addressed by the agent. Status puts it in two queues: the agent is asked to
  judge it first, and a person is asked to walk it down because their note was
  answered. Nothing tells the person that no agent has looked at the fix. The
  verify item in lib/status.js does not check the judge-first hold."
replies:
