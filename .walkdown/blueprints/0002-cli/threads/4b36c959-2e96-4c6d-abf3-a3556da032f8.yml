kind: question
author: agent
created: 2026-10-12T23:40:44.058Z
anchor:
  rule: status.evidence.no-screen-needs-an-excuse
status: incorporated
body: "A live rule whose only screen is retired passes lint: it names a screen,
  so the no-screen check is satisfied, and retired screens are not linted at
  all. No walk ever looks at it, which is what the check exists to catch (judge,
  2026-10-12, ~15%: a screen retired with its rules left pointing at it).
  Options: (a) a retired screen does not count as naming one, so the rule gets
  the same error, with a step added saying so; (b) leave it, since retiring a
  screen is a person's deliberate act."
replies:
  - author: topher
    via: agent
    created: 2026-10-13T01:41:53Z
    body: A live rule that points to a retired screen should definitely error on
      lint. If any screen has a live rule, it shouldn't be retired and we need
      to alert the system about that.
    added: Written as ownership.design.retired-screen-has-no-live-rules (screen
      lint-retired-screen-named, request n-0600).
  - author: topher
    created: 2026-10-14T21:59:23Z
    body: It should error and mention that the current screen is retired. Also, you
      shouldn't be able to retire a screen if it has live rules pointing at it.
    answer: true
  - author: agent
    created: 2026-10-14T22:19:06Z
    body: Incorporated into ownership.design.live-rule-names-a-live-screen, which
      you approved on 2026-10-14. Its error line says the screen is retired.
      Retiring a screen is an edit to the storyboard, so this lint error is what
      refuses a screen with live rules.
