body: "From outside every checkout, 'where spec --blueprint checkout' prints one
  empty line and exits 1 with nothing on stderr. It does this for a registered
  blueprint named by spec name, for --blueprint nosuch, for a bare 'where spec',
  and for an unimported home named from inside its checkout. The full 'where'
  gives the reason each time; the one-field form drops it. Evidence:
  runs/evidence/2026-10-06T20-50-39Z/declared-not-discovered.txt"
