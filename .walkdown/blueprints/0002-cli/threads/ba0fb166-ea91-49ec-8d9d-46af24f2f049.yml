    created: 2026-10-08T13:47:20Z
    body: Fixed. A move re-points every row of the checkout on its first home, so
      each later home that reads as listed at a path it was not listed at is
      reported as moved too. All three rows now say `~ moved`. Test in
      project-codes.test.js.
