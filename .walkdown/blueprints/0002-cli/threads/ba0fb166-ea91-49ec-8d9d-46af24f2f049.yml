body: "Found while judging at 793988a. Moving a checkout with three committed
  homes, then `blueprints import . --all` in the new place, reports one as `~
  moved` and the other two as `· already listed`. All three rows were rewritten
  to the new path, so two changed rows read as unchanged. Evidence:
  runs/evidence/2026-10-08T13-40-00Z-judge-a/import-08-moved-rows-reported-alre\
  ady-listed.txt"
replies:
