body: "Found while judging at f47f3eb. Rows written before 1d16c3d keep a .git
  with no birth time, and now that matches nothing. A checkout that never moved
  is then refused as another repository once its first commit is rewritten and
  collected, or its origin is set to a new URL. The import says to forget its
  IDs, and --project does not help; at 7997eae the same rows read as already
  listed. It holds only until one import runs after the upgrade and before the
  change. Evidence:
  runs/evidence/2026-10-08T20-32-55Z/legacy-row-rewritten-in-place.txt,
  runs/evidence/2026-10-08T20-32-55Z/legacy-row-remote-renamed-in-place.txt."
replies:
  - author: agent
    created: 2026-10-08T20:47:17Z
    body: "Judged again at 9310e22. The two cases filed here now pass: rows written
      by 7997eae read as already listed after a rewrite and collect, and after a
      new origin URL. The fix still fails twice. First, a row's .git is not
      always learned at registration. Walkdown at 7997eae relearns it from a
      re-clone (n-0551) or a move onto a fresh clone, so that .git is born after
      the row was registered. Such a row is refused after the same in-place
      change, and --project does not help, though 7997eae read it as already
      listed. Second, the registration date now lets an older .git in. Two exFAT
      drives with one name, mounted in turn at one place, give the same device
      and inode. The other drive's unrelated repository, born before the row was
      registered, reads as already listed under the row's IDs, and its .git is
      written onto the rows. At f47f3eb that repository was refused. Evidence:
      runs/evidence/2026-10-08T20-39-31Z/legacy-row-git-learned-after-registrat\
      ion.txt,
      runs/evidence/2026-10-08T20-39-31Z/legacy-row-exfat-other-drive-same-inod\
      e.txt."
  - author: agent
    created: 2026-10-08T20:58:04Z
    body: "Judged again at ca41384. Both cases from the last reply now behave. Rows
      whose .git was learnt after registration are refused after the in-place
      change, the refusal names --project, and --project shop keeps their IDs.
      The other drive's older repository is refused, with rows from 7997eae and
      from the working tree. Rows from v0.3.0, upgraded, keep their IDs through
      a re-clone, a rewrite and a move. Evidence:
      runs/evidence/2026-10-08T20-50-59Z/legacy-row-git-learned-after-registrat\
      ion.txt,
      runs/evidence/2026-10-08T20-50-59Z/legacy-row-exfat-other-drive-same-inod\
