body: The statement says no file walkdown writes outside
  ~/.walkdown/registry.yml holds an ID, and ~/.walkdown/cache/claims.json does.
  It is a machine-local cache that serve rebuilds, never committed. Is the rule
  about files that travel, or about every file?
options:
  - label: Reword the rule
    why: Say no file outside ~/.walkdown holds an ID; the cache is the machine's own
  - label: Key the cache by home
    why: Keep the wording, and stop the cache holding IDs
