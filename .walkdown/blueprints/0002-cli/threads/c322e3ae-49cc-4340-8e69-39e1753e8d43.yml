body: "Should `walkdown hash --write --reword` refuse when a rule's excuses
  changed, rather than only their words? Today --reword keeps every verdict
  whatever moved, so an agent can add `unverifiable.agent` and pass --reword,
  and the approval you gave before the excuse still stands (judge evidence
  07-reword-adds-excuse.txt, 2026-10-12). That is the hole hashing the excuses
  was meant to close, and lint will soon ask rules with no screen for an excuse.
  Options: (a) --reword refuses when a tier is excused or un-excused, and allows
  only a changed reason; (b) it warns and proceeds; (c) leave it, since --reword
  is already a person's declaration."
replies:
  - author: topher
    via: agent
    created: 2026-10-12T22:35:43Z
    body: Reword should not allow adding an excuse; it can only reword one if it
      already exists.
    added: Folded into status.derived.reword-never-adds-an-excuse (screen
      hash-reword-adds-excuse, request n-0595). Removing an excuse under
      --reword stays allowed, since it sets nothing aside.
  - author: topher
    created: 2026-10-12T23:06:10Z
    body: Go with a
    answer: true
