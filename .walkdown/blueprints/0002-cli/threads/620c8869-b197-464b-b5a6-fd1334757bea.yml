  rule: screens.identity.one-matcher
status: settled
body: "Found while drawing cli screens. Two matchers decide which screen a URL
  is: `bestClaim` in lib/claims.js (the claims command, the registry index) and
  `matchScreen` in lib/screen-match.js (the panel, the embed, lib/api.js). They
  disagree on a declared query: /orders?tab=returns is `orders` to claims and
  `orders-returns` to the panel. See the thread on
  screens.identity.query-is-not-identity."
replies:
  - author: agent
    created: 2026-10-08T13:27:20Z
    body: Fixed. `bestClaim` in lib/claims.js now scores with the panel's own
      `scoreRef` from lib/screen-match.js, so there is one matcher. Priority is
      a declared fragment, then each declared query value, then the longer path.
