body: Judged 2026-10-07 (evidence
  2026-10-07T13-40-00Z/username-is-the-record.txt). With no profile and a git
  identity set only in the repository's own .git/config, rspec records that
  identity while the node:test and Playwright reporters record the OS account.
  lib/filing.js asks for the actor from the blueprint's home, which under
  ~/.walkdown is in no repository; the formatter asks from the checkout.
