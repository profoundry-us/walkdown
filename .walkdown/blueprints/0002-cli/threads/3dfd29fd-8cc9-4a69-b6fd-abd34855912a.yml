    body: 'Rewritten. The refusal now says what happened in words: "This machine
      already has a project called `shop`, at ~/shop. ~/work/shop is another
      checkout, so its project needs a name of its own. Nothing was made." Below
      it is the exact command to run, `walkdown blueprints new search --project
      work-shop --code ws`. The rule was reworded to match, and the
      blueprints-new-label-taken screen was recaptured.'
