body: No command renames a project or changes its code. After the upgrade put
  the example in a project labelled walkdown-2 with code w2, Topher wanted it as
  walkdown-example with code we, which makes its ID 0002-we-example. blueprints
  rename changes only the name at the end of an ID, so the row was changed by a
  script calling readRegistry and writeRegistry under the registry lock. A
  projects rename command would give that a supported door. It would refuse a
  label or code another project holds, and rewrite every row of the project
  together.
