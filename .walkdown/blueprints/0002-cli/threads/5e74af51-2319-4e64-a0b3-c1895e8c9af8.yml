body: "Found while judging: `blueprints new` run from a subdirectory of a
  registered checkout refuses. It says 'the project label `repo` is another
  checkout's', naming that same checkout. Since ADR 0014 a project is a
  checkout, which argues for joining it. But n-0214 kept a subdirectory as a
  project of its own on purpose, so this is a choice."
options:
  - label: Join the checkout's project
    why: A project is a checkout since ADR 0014, so a subdirectory has none of its
      own
  - label: Stay a second project
    why: Keep n-0214's deliberate case, and give it a label of its own
