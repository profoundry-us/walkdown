  rule: commands.blueprints.new-makes-one
status: incorporated
body: "Found while judging: `blueprints new` run from a subdirectory of a
  registered checkout refuses. It says 'the project label `repo` is another
  checkout's', naming that same checkout. Since ADR 0014 a project is a
  checkout, which argues for joining it. But n-0214 kept a subdirectory as a
  project of its own on purpose, so this is a choice."
options:
  - label: Join the checkout's project
    why: A project is a checkout since ADR 0014, so a subdirectory has none of its
      own
  - label: Stay a second project
    why: Keep n-0214's deliberate case, and give it a label of its own
replies:
  - author: topher
    created: 2026-10-06T18:56:53Z
    body: We should probably just ask. I think either case is valid, but I think the
      default usage will be same-project (just pointing to a subdirectory).
    answer: true
  - author: agent
    created: 2026-10-06T22:21:58Z
    body: 'Folded in: `blueprints new` in a folder inside a registered checkout asks
      "Add this blueprint to `shop`? [Y/n]" at a terminal, and without one joins
      and says so, naming `--project <label>` as the way to make a project of
      its own. commands.blueprints.new-makes-one carries the new THEN lines.'
