body: 'What `walkdown hash --write --reword "<why>"` prints for
  status.derived.reword-never-adds-an-excuse when one rule has gained an excuse
  since it was last stamped (here an agent-tier excuse on a rule that had none).
  The rule is refused by name: rewording cannot add an excuse, so run `walkdown
  hash --write` without --reword, and its verdicts read stale until it is judged
  and approved again. Nothing is written for any rule, and it exits 1. Match the
  other hash and refusal screens.'
