added: "Draw what `walkdown init` prints on a machine with no ~/.walkdown
  (commands.init.this-machine-only): the home and registry created, who you are,
  the skills installed with the lines `walkdown skills` prints, what walkdown
  needs (node, git, Claude Code), and that `walkdown blueprints new` starts a
  spec. Anchors: cli.prompt, cli.init.home, cli.init.you, cli.init.skills,
  cli.init.needs, cli.init.next, cli.exit. The frame is the terminal frame
  tools/cli-captures.mjs --frame prints, so the design and the as-built line up
  under the fade; /as-built/cli/init-fresh-machine.html shows what the build
  prints today."
