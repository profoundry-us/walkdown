body: "A pushed committed home loses its records when its checkout moves and the
  origin is cloned at the old path. Import in the moved tree says already
  listed, the row keeps the fresh clone, and the moved tree's runs go unread.
  Its eng acceptance drops to never. Evidence:
  runs/evidence/2026-10-06T04-45-31Z/ids-stay-here-sixth.txt."
replies:
  - author: agent
    created: 2026-10-06T04:48:08Z
    body: Import in a same-origin clone now moves the rows there when that tree
      holds a committed home's runs and the registered checkout holds none, so
      the ID stays and the fresh clone reads the moved tree's records. A
      judged-edges test covers it.
