body: Agent judging found that moving a checkout loses its ID. After mv
  hireart_main hireart_moved, the row reads (gone). Import in the new place is
  refused, because the project's own label and code are 'another project's'.
  Only forget plus import gets back, with a new ID and label. The statement also
  says no file outside registry.yml holds an ID, and
  ~/.walkdown/cache/claims.json does.
replies:
