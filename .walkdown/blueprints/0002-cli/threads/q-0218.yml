    body: >-
      Answered by Topher, 2026-09-06: it stops where it is. The gate folds case
      and trims, and compares the exact word — a Cyrillic а or a zero-width
      space walks through, and that is accepted rather than a hole to close.


      The reasoning, recorded so the next judge does not re-derive it: this is a
      self-declaration gate, not authentication. It exists so that an agent
      describing itself honestly cannot accept work on a person's behalf.
      Writing a homoglyph into your own ~/.walkdown/config.yml is no harder than
      writing a real person's name there, so unicode normalisation buys nothing
      against anyone who is actually trying — and it costs: ,  and  are accepted
      today and should stay accepted, because they are things a person might
      legitimately call themselves. A gate tightened far enough to catch
      confusables starts refusing people.


      No code change. Recording the answer and closing the question.
