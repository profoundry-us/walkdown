id: q-0314
kind: question
author: agent
created: 2026-09-20T17:15:22.431Z
anchor:
  rule: status.acceptance.role-comes-from-the-run
status: incorporated
body: >-
  Is a proxy signature ever remembered for the next walk?


  Your own roles default from config every walk. A remembered proxy is the
  mechanism that silently signs for an absent person next month (q-0225).
options:
  - label: Never
    why: a proxy is per walk; the next walk starts from your config alone
  - label: Offered, not assumed
    why: the last proxy is shown as a suggestion you must tick again
replies:
  - author: topher
    created: 2026-09-21T00:50:21Z
    body: Offered, not assumed
  - author: agent
    created: 2026-09-21T01:47:31Z
    body: "Built. The proxies of your last sitting are kept per blueprint in the
      browser and OFFERED next time: the name comes back filled in with the box
      unticked and a 'last time' mark beside it, so signing for Sam again is one
      tick and by accident is impossible. Steps on role-comes-from-the-run and
      who-signs-is-declared, and a check that signs for sam, ends the sitting,
      and reads the offer."
chosen: Offered, not assumed
