body: "Found in the third sitting, none breaking a step. An unregistered clone's
  code reason says 'the spec sits outside any repository'. A detached worktree
  reads 'on HEAD'. From a worktree with no copy of a committed home, where says
  'tracked: nothing'. Lint labels tracking items '.walkdown/.gitignore:', a file
  the layout no longer has. And `commit none` prints 'Nothing was added' beside
  'tracked: runs'."
