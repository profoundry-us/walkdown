body: "Draw what `walkdown lint --blueprint search` prints when search shares a
  suite with checkout. One of search's rules came from a thread of checkout's.
  Lint names nothing about checkout's rule tags or checkout's thread. It names
  only what no blueprint in the project holds: one tag and one thread id
  (`locations.several.lint-reads-the-project`). Anchors: cli.prompt,
  cli.lint.errors, cli.lint.warnings, cli.lint.summary, cli.exit.
  as-built/cli/lint-across-blueprints.html is the build, from
  test/cli/scenarios/lint-across-blueprints.yml, in the frame
  tools/cli-captures.mjs --frame prints."
