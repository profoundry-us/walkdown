<!doctype html>
<!-- The script-tag delivery as an adopter is told to write it: one tag,
     carrying both halves, with the blueprint named on it. -->
<html lang="en">
<head><meta charset="utf-8"><title>Fixture — one tag</title>
<style>body{font:16px/1.5 Georgia,serif;margin:0;padding:2rem;background:#fbf7ef;color:#2c2416}</style></head>
<body>
  <h1 data-testid="host.title">Carried by one tag</h1>
  <button data-testid="host.cta">Primary action</button>
  <script>
    const q = new URLSearchParams(location.search);
    const WD = q.get('wd') || 'http://localhost:4700';
    const s = document.createElement('script');
    s.src = `${WD}/walkdown.js`;
    s.setAttribute('data-bp', q.get('bp') ?? 'blueprint');
    document.body.appendChild(s);
  </script>
</body>
</html>
