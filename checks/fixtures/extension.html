<!doctype html>
<!-- The EXTENSION delivery's shape: its bootstrap publishes the build it is
     running on window.__walkdownConfig before the panel loads. A vendored copy
     goes stale when the extension is not reloaded, and that is the only way the
     panel can tell — so this fixture can pretend to be any build. -->
<html lang="en">
<head><meta charset="utf-8"><title>Fixture — extension delivery</title></head>
<body>
  <h1 data-testid="host.title">Carried by the extension</h1>
  <script>
    const q = new URLSearchParams(location.search);
    const WD = q.get('wd') || 'http://localhost:4700';
    window.__walkdownConfig = {
      server: WD,
      buildHash: q.get('build') || 'stale-build-hash',
      // The extension's content script runs on every page, so walkdown comes
      // back after a navigation. `reinjects=0` pretends to be a script tag.
      reinjects: q.get('reinjects') !== '0',
      // With a frame url the panel is the FRAMED delivery: it owns the frame
      // and the application under review lives inside it.
      ...(q.get('frame') ? { frame: { url: q.get('frame') } } : {}),
    };
    const s = document.createElement('script');
    s.src = `${WD}/panel.js`;
    if (q.get('bp') !== '') s.setAttribute('data-bp', q.get('bp') ?? 'blueprint');
    document.body.appendChild(s);
  </script>
</body>
</html>
