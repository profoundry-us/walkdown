<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mockup — Walkdown board</title>
<style>
  * { box-sizing: border-box; margin: 0; font-family: -apple-system, sans-serif; }
  body { background: #fafafa; color: #444; height: 100vh; display: flex; flex-direction: column; }
  .wire { border: 1.5px dashed #b6bcc6; border-radius: 8px; background: #fff; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1.5px dashed #b6bcc6; background: #fff; }
  .logo { font-weight: 800; font-size: 14px; }
  .dd { padding: 4px 10px; font-size: 12px; color: #666; }
  .counts { font-size: 12px; color: #999; }
  .counts b { color: #d97706; }
  .spacer { flex: 1; }
  .btn { padding: 4px 12px; font-size: 12px; color: #666; }
  .btn.primary { background: #e2e8f0; }
  main { flex: 1; display: grid; grid-template-columns: 200px 220px 1fr; gap: 10px; padding: 10px; min-height: 0; }
  .col { padding: 10px; overflow: hidden; }
  .h { font-size: 10px; letter-spacing: .05em; text-transform: uppercase; color: #999; margin-bottom: 8px; }
  .rule { display: flex; gap: 6px; font-size: 12px; padding: 5px 2px; color: #555; }
  .flag { margin-left: auto; color: #d97706; font-size: 10px; }
  .muted { color: #aaa; font-size: 12px; }
  .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; height: calc(100% - 40px); }
  .frame { display: grid; place-items: center; color: #b6bcc6; font-size: 12px; }
  .screenbar { display: flex; gap: 6px; margin-bottom: 8px; }
  .chip { padding: 3px 10px; font-size: 11px; color: #666; }
  .chip.cur { background: #e2e8f0; }
</style>
</head>
<body>
  <header>
    <span class="logo">Walkdown</span>
    <span class="wire dd" data-testid="board.project-switcher">project ▾</span>
    <span class="counts">8 verified · 2 pending · 0 failing · <b>needs you: 2</b></span>
    <span class="spacer"></span>
    <span class="wire btn">📌 Pin mode</span>
    <span class="wire btn">your name</span>
    <span class="wire btn primary">Start walkdown</span>
  </header>
  <main>
    <div class="wire col" data-testid="board.rules">
      <div class="h">Rules</div>
      <div class="rule">✓ <span>latest-wins</span></div>
      <div class="rule">✓ <span>stale-never-passes</span></div>
      <div class="rule">○ <span>technical-disclosure</span><span class="flag">1 ⚑</span></div>
      <div class="rule">○ <span>project-switcher</span></div>
    </div>
    <div class="wire col">
      <div class="h">Detail</div>
      <p class="muted">Select a rule.</p>
    </div>
    <div class="col" data-testid="board.surfaces" style="padding:0">
      <div class="screenbar">
        <span class="wire chip cur">board</span>
        <span class="wire chip">rule-detail</span>
      </div>
      <div class="frames">
        <div class="wire frame">PROTOTYPE</div>
        <div class="wire frame">APP</div>
      </div>
    </div>
  </main>
  <script src="http://localhost:4700/embed.js" data-walkdown></script>
</body>
</html>
