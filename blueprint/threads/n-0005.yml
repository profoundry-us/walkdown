id: n-0005
kind: note
author: topher
created: 2026-08-21T03:29:46Z
anchor:
  rule: viewer.layout.surfaces-first
  screen: board
  element: board.surfaces
status: addressed
body: >-
  The prototype and app views should zoom their contents so that you can see
  what it would look like at a desktop resolution (we should add a mobile toggle
  too so that we can see what each looks like, and pins should note what
  viewport was being used when the pin was placed)


  Split these into separate rules.
replies:
  - author: agent
    created: 2026-08-21T03:38:28Z
    body: "Split into three rules as asked: viewer.surface.zoom-to-fit (render at
      the viewport's width, scale the whole layout down to the pane — no mobile
      reflow), viewer.surface.viewport-toggle (desktop/mobile for both surfaces,
      always the same viewport on each side), and embed.pin.viewport-recorded (a
      pin records the viewport it was placed at). Not built yet."
  - author: agent
    created: 2026-08-21T19:04:46Z
    body: "Added embed.pin.surface-coordinates per your confirmation: positions are
      recorded in the surface's own coordinate space (CSS pixels of the document
      at its viewport), never viewer screen pixels, so pins hold their spot
      across zoom, stage-mode, and window changes. I also reworded
      coordinate-fallback from 'position on the screen' to 'position within the
      surface' — 'screen' meant the storyboard screen but read as the display."
  - author: agent
    created: 2026-08-21T19:18:01Z
    body: "Built, all three parts. Each surface now renders at the chosen viewport's
      width (desktop 1440 / mobile 390) and is scaled down whole to fit its
      pane, with the scale shown in the screen bar — measured 1440px fit 25% and
      390px fit 92% in a 950px window. The viewport control drives both surfaces
      together. Pins record their viewport, and positions stay in the surface's
      own CSS-pixel space. Checks: @rule:embed.pin.viewport-recorded and
      @rule:embed.pin.surface-coordinates, passing in run
      2026-08-21T19-17-06Z-local-01."
