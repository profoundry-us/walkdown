id: n-0072
kind: note
author: topher
created: 2026-08-25T22:45:00Z
anchor:
  rule: panel.dock.toolbar
  screen: docked
status: verified
body: When walkdown is put away and only the vertical badge is showing on the
  side, there should be a button right next to the badge that swaps between the
  prototype and the app. Moving between the two surfaces is the thing I do most
  often, and right now it costs re-opening the whole panel to reach the fade
  control - so the cheapest possible comparison is behind the most expensive
  gesture.
replies:
  - author: agent
    created: 2026-08-25T23:42:00Z
    body: Built. Put away, a second tab sits beside WALKDOWN and crosses between the
      design and what shipped in one click. It names the surface it will take
      you TO rather than the one you are on, since a control that reports where
      you already are gives you nothing to act on, and it only appears when the
      current screen has a design on file - offering a crossing to nowhere would
      be worse than offering nothing. Putting walkdown away used to tear the
      ghost down, which meant the panel decided your surface for you the moment
      you got it out of the way; the surface you were looking at now survives,
      which is what makes the swap worth having. Covered by a browser check that
      puts the panel away, crosses, and confirms the offer flipped without the
      panel coming back.
  - author: Topher Fangio
    created: 2026-08-27T00:14:15Z
    body: "Reopened on the walkdown: the swap works, but crossing to the prototype
      while walkdown is put away leaves the design in a box the size of the old
      stage, with the app showing along the edges it no longer covers. Put away
      the panel occupies nothing, so both surfaces should fill the window."
  - author: Topher Fangio
    created: 2026-08-27T00:14:31Z
    body: "Reopened on the walkdown. The swap itself works — put away, the second
      tab crosses in one click, and it names where it will take you. What is
      wrong is the geometry on the other side: crossing to the prototype while
      walkdown is put away leaves the design in a box the size of the old stage,
      offset, with the app showing along the edges it no longer covers. Put away
      the panel occupies nothing, so whichever surface is in front should fill
      the window."
  - author: agent
    created: 2026-08-27T00:14:57Z
    body: >-
      Fixed. The ghost is now placed by the same rules as the app frame and at
      the same moments — placeGhost() beside placeAppFrame(), called whenever
      the panel is put away or brought back, on resize, and when the ghost is
      built while the panel is already away. frameSpace() no longer subtracts a
      panel that is not there: put away, the stage is the whole window.


      The reason only one surface moved was that only one of them was ever
      re-placed. The app frame had a put-away branch (top:0, 100vw/100vh); the
      ghost stated its box once at creation, in stage coordinates, and nothing
      restated it.


      The rule's check now asserts it: put away, cross, and every surface must
      fill the window — measured after the 220ms ease settles, on both surfaces,
      since the swap moves between them. Verified against the old code first: it
      fails there and passes here. Re-run as 2026-08-27T00-14-48Z-local-01.
