id: n-0133
kind: note
author: agent
created: 2026-09-01T01:05:28.925Z
anchor:
  rule: locations.default.nothing-in-the-tree
status: open
body: "Sitting 2026-09-01, observed while judging this rule (run
  2026-09-01T00-11-44Z-local-01): after a default init, the out-of-tree spec is
  invisible to most of the CLI. `walkdown serve`, `status`, and `lint` run from
  the probe repo all answered 'No blueprint found ... Use --dir', while
  `walkdown where` from the same directory resolved the spec correctly —
  bin/commands/context.js loadOrExit only searches the tree upward
  (findBlueprintDir) and never consults the locations resolver. Nothing lands in
  the tree, so this rule held; but the person the default-out design serves runs
  `walkdown status` as their second command and is told there is no blueprint
  they just created. The fix direction is a decision, not an agent's call:
  loadOrExit falling back to resolveLocations' spec answer would make every
  command agree with `where`, but it changes which blueprint ambient commands
  bind to in multi-project repos, so the nearest-blueprint-wins rules should get
  a say."
replies:
  - author: Topher Fangio
    created: 2026-09-01T04:41:44Z
    body: >-
      Decision: every command resolves where things live through one answer —
      resolveLocations — so status, lint, serve, run, judge, sweep, thread,
      threads and hash agree with where, move and every record-writing path.
      loadOrExit's tree-only findBlueprintDir search goes; spec.missing is what
      keeps 'no blueprint found' honest when nothing has been created yet.


      And the precedence is settled in the same breath: a config entry ALWAYS
      wins. Where an entry names a spec, that spec is the answer even when the
      repository also holds a blueprint. Writing the entry is the act of saying
      which blueprint this is; the tree does not get to overrule it.


      Not to be started yet — see the question filed against
      locations.answer.nearest-blueprint-wins, which this contradicts and which
      must be answered first.
