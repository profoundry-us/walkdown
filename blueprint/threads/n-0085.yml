id: n-0085
kind: question
author: topher
created: 2026-08-26T03:20:00Z
anchor:
  rule: panel.delivery.one-implementation
status: incorporated
body: "I thought the embed WAS the panel? Do we need a separate embed if we have
  the panel? If not, get rid of it so we just have one way to do things."
replies:
  - author: agent
    created: 2026-08-26T04:30:00Z
    body: "They are two scripts and they have to be, but not for the reason the
      split suggests - and the answer changes what should be done about it.

      The reason is documents, not features. Framed, the application under
      review lives in an iframe of its own, and that is the whole point of the
      framed delivery: the app keeps a real viewport, its modals centre in it,
      and its own stylesheet cannot reach walkdown. A script in the outer
      document cannot draw pins on elements in the inner one, cannot read them,
      and cannot hit-test them - so something has to run INSIDE. The embed is
      that something, and the panel is the chrome outside it. One script cannot
      be in two documents at once.

      Docked, the split is not necessary at all: both run in the same document,
      and the seam between them is architecture rather than need. That is where
      the badge came from, and the badge is exactly what the seam cost - a
      second pin-mode control that leaked onto every panelled page because the
      panel could only dismiss it by asking, and asking lost a race with its own
      load order.

      So: two INSTANCES, unavoidable. Two FILES, avoidable. One walkdown.js
      could carry both roles and choose by context - `window.parent !== window`
      already decides everything the embed branches on - which would make the
      integration one tag, kill the panel/embed load-order question outright,
      and mean one thing to vendor into the extension instead of two kept in
      step by a checked-in diff. It is a real simplification and I have NOT done
      it tonight: it is a merge of roughly four thousand lines across two files
      that ship down two delivery paths, and doing it at four in the morning
      behind a batch of other changes is how a subtle delivery bug gets in. It
      wants its own sitting, with the browser checks green on both deliveries
      before and after.

      What I did do is remove the thing the split was actually costing: the
      badge is gone, the embed no longer has a control of its own, and pin mode
      has exactly one owner in both deliveries."
  - author: agent
    created: 2026-08-26T06:40:00Z
    body: "Revisited, and the earlier answer was right for a better reason than
      the one I gave. I said the embed should stay a separate file because it is
      injected into someone else's application and ought to be small - true, but
      soft, and it read as a reason to avoid the work. The real reason is in the
      extension's delivery matrix: boot.js is a content script on every http(s)
      page and loads the EMBED only; boot-host.js runs in walkdown's own
      review.html and loads the PANEL only. The two never share a document
      there. So the role cannot be inferred from window.parent !== window - every
      site you visit is top level, and a merged file keyed on that would draw a
      panel over every page you browse. Merging is not conservative, it is
      wrong.

      What Topher actually wanted - one way to do things - was real, and it was
      about the INTEGRATION, not the files. A script-tag app had to paste two
      tags in a fixed order, and getting that order wrong is precisely what left
      two pin-mode controls on every docked page. There is now GET /walkdown.js,
      which serves both halves together; `walkdown serve` advertises that single
      tag instead of the embed one, docs/04 says so, and a browser check drives a
      page carrying only that tag - the panel draws, pin mode reaches the page, a
      pin lands on the right anchor, and there is exactly one pin-mode control
      whatever order the halves arrived in."

