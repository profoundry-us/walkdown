id: n-0086
kind: note
author: agent
created: 2026-08-26T05:40:00Z
anchor:
  rule: panel.dock.controls-survive-use
  screen: review
status: waived
body: >-
  Reproduced, not fixed. Once a ghost has been raised, the rules list stops
  scrolling to the wheel and stays that way until the page is reloaded - which
  is what Topher reported as 'swapping between the app and the prototype is
  breaking my ability to scroll'. Evidence and both probe scripts are in
  runs/evidence/scroll-repro/. Reading the wheel with page.mouse.wheel rather
  than the browser tool's scroll is what finally showed it; my first attempt
  used a tool that cannot drive a shadow-root scroller at all, which is why an
  earlier control test looked clean and led me to a wrong diagnosis.

  The measurements, each on a fresh page, one gesture: fresh load scrolls 600;
  after crossing to the app the same gesture scrolls 0; after crossing BACK the
  gesture still scrolls 0, because the ghost is deliberately kept between
  crossings; after a reload it scrolls 600 again. Programmatic scrollTop keeps
  working throughout, and clicks keep working - it is only the wheel.

  What is ruled out. The ghost does not cover the panel: its box measures
  [12,44,992,888] against the pane's [1005,142,1387,854], and it carries
  pointer-events none. The wheel event does arrive, on the right element - a
  capture listener records target BUTTON>DIV>DIV inside the pane, cancelable
  false, defaultPrevented false - so nothing is swallowing it. There is no wheel
  listener anywhere in the panel or the embed. The pane stays scrollable across
  the crossing, 3237 over 712 both before and after. render() is synchronous
  between saving each pane's scroll position and restoring it, so no repaint can
  be racing the reader.

  What is odd, and where I ran out. Removing the ghost element restores
  scrolling immediately; display:none, visibility:hidden, height 1px, z-index
  auto, position absolute, dropping it out of the top layer, and removing its
  iframe all leave it dead. But a hand-built fixed div of the same box - with a
  same-origin iframe loading the same stand-in, promoted into the top layer or
  not - does not break scrolling at all. So the element is implicated and its
  properties are not, which means the cause is in what the crossing does rather
  than in what the ghost is. That is where a fresh session should start.
replies:
  - author: agent
    created: 2026-08-26T06:10:00Z
    body: >-
      Found and fixed. The cause is raise(), which promoted the ghost into the
      top layer and then re-promoted the shell to put the panel back above it.
      Two promotions in sequence leave the panel's rule list unable to receive a
      wheel event at all until reload. Bisected at the code: with raise()
      disabled the whole cycle scrolls; with only promote(ghost) it scrolls;
      with only promote(shell) it scrolls; with both, dead. That is why nothing
      built by hand reproduced it - a fixed div of the same box, with the same
      same-origin iframe, promoted or not, is harmless, and so is re-promoting
      the shell on its own. It takes the pair.

      Same family as n-0068, where the fade slider died one step into a drag
      because re-promotion cancelled the pointer's grip. The cost of
      re-promotion is paid by whatever the pointer was doing - there a drag,
      here the wheel.

      The fix removes the second top-layer element rather than working around
      it: the ghost is now inserted into the panel's own shadow root ahead of
      the chrome, so lifting the shell lifts both. It still clears the app's
      modals, because the shell is already up there; DOM order keeps the chrome
      above the design it is ghosting. Verified: the whole swap cycle scrolls,
      and the ghost still renders at the right box with its stand-in and pins.
      16 browser checks and 82 unit tests green.

      Worth saying plainly: my first two explanations of this were wrong, and
      both were reasoned rather than measured. What settled it was bisecting the
      code path instead of the DOM - and the reason an earlier control looked
      clean is that the browser tool I was using cannot drive a shadow-root
      scroller at all.
