body: "Reproduced, not fixed. Once a ghost has been raised, the rules list stops
  scrolling to the wheel and stays that way until the page is reloaded - which
  is what Topher reported as 'swapping between the app and the prototype is
  breaking my ability to scroll'. Evidence and both probe scripts are in
  runs/evidence/scroll-repro/. Reading the wheel with page.mouse.wheel rather
  than the browser tool's scroll is what finally showed it; my first attempt
  used a tool that cannot drive a shadow-root scroller at all, which is why an
  earlier control test looked clean and led me to a wrong diagnosis.

  The measurements, each on a fresh page, one gesture: fresh load scrolls 600;
  after crossing to the app the same gesture scrolls 0; after crossing BACK the
  gesture still scrolls 0, because the ghost is deliberately kept between
  crossings; after a reload it scrolls 600 again. Programmatic scrollTop keeps
  working throughout, and clicks keep working - it is only the wheel.

  What is ruled out. The ghost does not cover the panel: its box measures
  [12,44,992,888] against the pane's [1005,142,1387,854], and it carries
  pointer-events none. The wheel event does arrive, on the right element - a
  capture listener records target BUTTON>DIV>DIV inside the pane, cancelable
  false, defaultPrevented false - so nothing is swallowing it. There is no
  wheel listener anywhere in the panel or the embed. The pane stays scrollable
  across the crossing, 3237 over 712 both before and after. render() is
  synchronous between saving each pane's scroll position and restoring it, so
  no repaint can be racing the reader.

  What is odd, and where I ran out. Removing the ghost element restores
  scrolling immediately; display:none, visibility:hidden, height 1px,
  z-index auto, position absolute, dropping it out of the top layer, and
  removing its iframe all leave it dead. But a hand-built fixed div of the same
  box - with a same-origin iframe loading the same stand-in, promoted into the
  top layer or not - does not break scrolling at all. So the element is
  implicated and its properties are not, which means the cause is in what the
  crossing does rather than in what the ghost is. That is where a fresh session
  should start."
