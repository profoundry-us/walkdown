id: n-0087
kind: note
author: topher
created: 2026-08-26T12:30:00Z
anchor:
  rule: panel.rules.steps-not-an-appendix
  screen: rule-detail
status: addressed
body: When I hover an anchor reference in the panel's STEPS area, and I am
  looking at the prototype, the element that anchor names should highlight on
  the surface - the same highlight pin hovering already draws. Reading a step
  that says to click some anchor and then hunting the page for what it means is
  the slow part of judging a rule; the step should be able to point at the thing
  it is talking about.
replies:
  - author: agent
    created: 2026-08-27T05:01:03Z
    body: >-
      Built. An anchor written in backticks inside a step is now a pointer:
      hovering it lights that element up on the surface under review, with the
      same outline pin mode draws under the cursor — one highlight vocabulary
      rather than two. Only DECLARED anchors get it (the same tokens lint scans
      for); a screen id or plain prose in backticks stays plain type. The panel
      tells both surfaces and each answers for itself, so it works against the
      design and against the built page, and the frame with no such element
      simply draws nothing. Leaving the token — or the pane being rebuilt under
      your pointer — puts the surface back.


      The rule gained a step saying so, and a browser check tagged
      @rule:panel.rules.steps-not-an-appendix frames the design of rule-detail,
      hovers the `detail.steps` token in the panel's own steps, and asserts the
      element in the frame lights up and then lets go. It fails against the old
      build and passes now, in recorded run 2026-08-27T05-00-07Z-local-01.
