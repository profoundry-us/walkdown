id: q-0019
kind: question
author: topher
created: 2026-08-24T02:25:00Z
anchor:
  rule: panel.start.choose-a-blueprint
status: open
body: "Five decisions from designing the authoring flow, recorded together
  because they interlock. (1) Naming: walkdown new <path> creates an empty
  blueprint; walkdown extract merges a source into one, as docs/00-vision.md
  already specifies. Init stays the one-per-repo scaffold it is. (2) Write
  allowlist: the server may write specification, never implementation - threads,
  runs, and blueprint creation yes; features/, prototype/, source and tests no,
  because the browser captures intent and the agent structures it. (3) Routing
  key: with dozens of blueprints per repo the panel must route by page, not by
  origin, which needs a light projects index rather than loading every
  blueprint. (4) Prototype as a URL: prototype.root is a filesystem path and a
  hosted prototype is not. (5) Skill distribution: skills only land if someone
  runs init, so an adopter on an existing repo gets an agent that knows none of
  this."
replies:
  - author: topher
    created: 2026-08-24T02:25:14Z
    body: "Two of these are settled. Routing: a page belongs to exactly one
      blueprint — a hard constraint, not a preference. The same page covered by
      two blueprints is a case we do not want, so the picker never has to
      disambiguate and a pin never has to ask which project it belongs to.
      Prototype hosting: Claude Design's own share URLs wrap the page in a way
      that breaks history navigation and deep linking, so the working method is
      to export the HTML or zip and serve the contents at a URL. That is the
      prototype URL to design around; pointing at a live Claude Design URL stays
      a nice-to-have if the wrapper problem is ever solved. Prototypes will also
      carry anchors from the start, since we are the ones generating them."
  - author: agent
    created: 2026-08-24T02:25:14Z
    body: "Consequences of the one-page-one-blueprint constraint worth building
      around. It is a CROSS-blueprint invariant, and every check we have today
      validates one blueprint in isolation — so enforcing it needs a check that
      loads all of them from the served root, which is something only the server
      currently does. Second: app.path carries query strings in practice (the
      example has /confirm.html?email=... and /confirm.html?email=...&already=1
      as two screens), so collision detection has to decide whether a page is
      identified by path or by path plus query. Within one blueprint those are
      legitimately different screens; across blueprints, two projects each
      claiming /confirm.html under different queries would satisfy a naive check
      while violating the intent. Third: base_url scopes it — the same path on
      two origins is not a collision, so the comparison is origin plus path, and
      a blueprint with several targets claims several origins."
  - author: agent
    created: 2026-08-26T02:45:00Z
    body: "Routing built, and it closes the loop this thread opened. lib/claims.js
      holds the index: a claim is an origin from a target's base_url plus a path
      compared on path and fragment alone, exactly as the consequences above set
      out - so a blueprint with several targets claims several origins, the same
      path on two origins is not a collision, and two projects declaring
      /confirm.html under different queries still is. `walkdown claims` reports
      collisions and answers --url; the Highball rule one-page-one-blueprint,
      declared todo since this thread, now runs it, so the constraint is checked
      rather than remembered. The panel asks GET /api/whose before falling back
      to a remembered choice - a blueprint that claims this address is a fact
      about where you are, a remembered choice is a fact about what you picked
      last somewhere else, and preferring memory is what made walkdown open its
      own rules on the example app and stay there. The write path routes too: a
      pin arriving with a url and no bp is filed against the project claiming
      that address, which is what embed.pin.right-project always described and
      never had - a page nobody can edit has no script tag to name its project,
      so its address is the only thing that can. Recorded as
      screens.ownership.one-claimant and screens.ownership.routes-by-page.
      Verified the browser check has teeth by removing the routing and watching
      it fail before recording it."

