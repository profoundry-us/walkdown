  - author: agent
    created: 2026-08-27T13:24:16Z
    body: >-
      Changed: a tier the rule does not ask for is now the same checkmark,
      hollowed out to 20% rather than a middle dot.


      You are right that the dot was the problem and not just the look of it. A
      dot, a check, a cross and a circle are four different widths, so the three
      marks never formed a column down a list of ninety rules - and a row you
      cannot read as a column is not scannable at all, which is the whole point
      of the row. Two changes:


      - 'not applicable' draws the check glyph at opacity-20, so every mark is
      now the same shape family: filled means it holds, hollow means the rule
      never asked for it.

      - Each mark is an inline-block of fixed width, centred, so the cross, the
      tilde and the open circle line up in the same column too - not only the
      checks.


      Colour still separates a real pass from an inapplicable tier, which is
      what the browser check now asserts (glyph plus class, rather than glyph
      alone). Its comment records why the shape vocabulary has this one
      deliberate exception.


      Verified: node --test 93/93, checks:dev 28/28, lint 0 errors 0 warnings,
      and the three new utilities confirmed present in the built sheet.
