    body: >-
      Follow-on, and it goes past what this note literally asks - so here it is
      plainly, and it is one line to reverse.


      The change

      The tier row now renders on EVERY BUILT rule, not only on the verified
      ones. In listPane the condition went from row.verdict === 'pass' to
      row.built. Rules that are not built at all are untouched and keep their
      single lifecycle shape.


      Why I did it anyway

      This note says 'if a rule would currently show a checkmark'. Taken
      literally that is what I built first - and, as I flagged, it made the red
      X, the yellow open circle and the yellow tilde unreachable, because a rule
      only reaches verified when every tier it asks for holds a current pass. So
      the row could only ever say 'all green' or 'green and grey'. That is not
      the thing the note asks for: 'an easy way to visually see how many of our
      rules have all three or are missing some'. The rules that are MISSING a
      tier are exactly the ones that were not showing the row. On the rule list
      now, panel.dock.toolbar reads ~ ✗ · at a glance - a stale agent pass and a
      failing checks tier - which is the news the row exists to carry.


      One consequence worth your eye

      Colour still carries ownership, as panel.rules.lifecycle-legible requires:
      a tier that is required and unrun, or a pass gone stale, is warning yellow
      when the rule is waiting on YOU and quiet otherwise. Shape carries what
      happened either way, so an unrun tier (○) is never read as one the rule
      never asked for (·). A built rule awaiting your walkdown therefore reads
      as warning-yellow open circles rather than as one warning-yellow open
      circle - same vocabulary, three slots.


      Spec

      - panel.rules.tiers-at-a-glance's statement now says 'a built rule' rather
      than 'a verified rule', and names the missing tiers as the thing it makes
      legible. Re-hashed with walkdown hash --write.

      - Its steps now cover the failed / never-run / stale marks, and the last
      step says a rule that is not BUILT keeps its single lifecycle shape.

      - panel.rules.lifecycle-legible's first step amended to match: an unbuilt
      unsigned rule is still the empty square, a built rule shows the three tier
      marks in the glyph's place, where an unrun tier is the empty circle. Its
      statement was still true as written, so no re-hash there.


      Verified

      - The rule's browser check was extended to a third shape of row: a built
      rule with a tier that failed, never ran, or went stale. It asserts three
      marks in the order checks/agent/human, each state the ledger's own answer,
      each glyph the right shape, pass green, not-asked-for greyed, and a tier
      still owed neither of those. The unbuilt case replaces the old unverified
      one. Confirmed it FAILS against a build with the old row-on-verified-only
      condition (it picked panel.dock.toolbar and found no tier row) and passes
      now.

      - Full suite: node --test 93/93, WALKDOWN_RECORD=0 npm run checks:dev
      28/28, walkdown lint 0 errors 0 warnings.


      To reverse: put row.verdict === 'pass' back in listPane, put the two
