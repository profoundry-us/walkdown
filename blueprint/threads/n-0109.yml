  - author: agent
    created: 2026-08-27T05:16:13Z
    body: >-
      Built. A rule that used to show a single checkmark now shows three marks -
      checks, agent, human, in that order, always all three.


      What I built

      - Anchor `panel.rule-tiers` on each verified rule's row, carrying three
      marks plus a data-tiers attribute naming each tier and its state. Per
      tier: green check for passed, red cross for failed, grey middle dot for a
      tier the rule does not ask for. Each mark's tooltip names the tier and
      spells the state out.

      - The checks tier is per target in the ledger, so it is brought down to
      one mark worst-news-first, the same way the verdict itself aggregates.

      - The two in-between states you asked about keep marks of their own,
      distinct from both grey and green: a required tier that has never run is a
      warning-yellow open circle, and a pass whose statement has since moved is
      a warning-yellow tilde. Same vocabulary the rule detail's own evidence
      rows already use, so the panel says one thing in one language: shape
      carries what happened, colour carries whether it is still owed.

      - Rules showing any other lifecycle shape are untouched, and a verdict you
      gave in the current sitting still shows as the single mark it always did -
      that judgment is not in the ledger yet, so it has no tiers to report.


      One thing worth your call

      Today a rule only reaches 'verified' when EVERY tier it asks for holds a
      current pass - so on a verified rule the three marks can only ever be
      green or grey. Red, the open circle and the tilde are implemented and
      correct, but nothing can currently display them, because a rule with a
      failed, unrun or stale tier is not verified and so keeps its old single
      shape. If what you want is to see the missing tiers on the rules that are
      missing them, say the word and I will show the three marks on every built
      rule rather than only the verified ones - that is the change that makes
      the yellow and the red visible. I did not do it unasked because it goes
      past what this note says.


      Spec

      - New rule panel.rules.tiers-at-a-glance, origin thread:n-0109, with steps
      and a written hash. Anchor panel.rule-tiers declared on screen review. Its
      steps only claim what is observable today, for the reason above.


      Verified

      - New browser check '@rule:panel.rules.tiers-at-a-glance' in
      checks/panel.spec.js: it reads the ledger, then asserts on two shapes of
      verified rule - one resting on all three tiers, one that never asked for
      checks - that exactly three marks are drawn, in the order
      checks/agent/human, that each mark's state is the ledger's own answer for
      that tier, that a passed tier reads green and an inapplicable one greyed
      out, and that an unverified rule still shows its single lifecycle shape.
      Confirmed it FAILS against the build before this change and passes after.

      - Full suite: node --test 93/93, WALKDOWN_RECORD=0 npm run checks:dev
      28/28, walkdown lint 0 errors 0 warnings. Also read by eye in the panel at
      localhost:4705, and the mark slot widened so three marks never crowd the
      rule name.


      Nothing recorded to the ledger by me - a run of record is yours to take.
  - author: agent
