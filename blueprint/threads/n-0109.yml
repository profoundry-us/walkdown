body: "If a rule would currently show a checkmark (as opposed to one of the
  other shapes denoting a status) I want it to show a list of 3 check marks: one
  for checks, agent, and human. It should always show 3 checkmarks and grey out
  the ones that are not applicable. It should show a red X if that particular
  check failed; and it should show green checkmark if that particular check
  passed. I basically want an easy way to visually see how many of our rules
  have all three or are missing some."
