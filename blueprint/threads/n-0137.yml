anchor:
  rule: locations.default.one-home-per-blueprint
status: open
body: "Any bare 'node --test' claims real homes: the suites that build fixture
  blueprints (serve, judge-cli, cli-usage, roles-on-runs among them) serve or
  spawn the CLI against them without pinning WALKDOWN_HOME, so every unpinned
  invocation writes fixture entries into ~/.walkdown/blueprints/index.yml —
  thirteen accumulated on 2026-09-01 from one full run and two targeted ones.
  npm test pins, and runner.run_all/run_for_rule now pin the unit half too, but
  that guards the callers somebody wrote down, not the suites: the decision owed
  is whether each fixture-building suite pins its own scratch home the way
  locations.test.js already does, so no caller has to remember."
