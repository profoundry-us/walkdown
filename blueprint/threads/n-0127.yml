    body: "Shipped in c1820e0: transitionThread records verified_by alongside
      waived_by (lib/threads.js), the thread footer reads the record first and
      only falls back to the last reply's author for threads from before the
      field existed (src/panel/thread-pane.js), and both the CLI mutation report
      and the thread header name it. The 37 historical verified threads keep
      their inference — no retroactive schema requirement. Covered by
      test/thread-mutations.test.js."
