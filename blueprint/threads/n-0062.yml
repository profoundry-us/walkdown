id: n-0062
kind: note
author: topher
created: 2026-08-24T18:22:51Z
anchor:
  rule: panel.delivery.one-implementation
  screen: review
status: verified
body: Walked the headless rules and none showed the new no-screen notice - the
  unpacked extension was still running its cached vendored panel, and nothing
  said so. A stale copy of walkdown reviewing a moving spec silently undermines
  every verdict. The panel should detect that the extension copy is older than
  what the server ships and say so plainly.
replies:
  - author: agent
    created: 2026-08-24T18:24:33Z
    body: "Built the staleness detector. MV3 forbids the extension loading code from
      the server, so the vendored copy stays - but now the extension's boot
      hashes the panel it actually runs (crypto.subtle over the vendored bytes),
      the server reports the build it currently ships (panelHash in the
      blueprint payload, unit-checked), and on mismatch the panel shows a banner
      naming the fix: reload the extension, then the page. The docked delivery
      never shows it - a script tag always runs what the server ships. Specified
      as panel.delivery.stale-copy-says-so. Your immediate case was exactly
      this: the headless notice shipped correctly (probe-verified on the served
      panel and present in the vendored bytes) but your extension was running
      the pre-notice copy - reload it once and both the notice and the banner
      protection are live."
