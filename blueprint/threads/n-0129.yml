body: "Agent judging 2026-09-01: FAIL on the migrate clause. Every allocation
  promise up to it held under attack — asking allocated nothing, first writes
  claimed distinct numbers for two same-basename repos (0001/0002-myapp) and for
  two blueprints in one repo (0004-mono/0003-billing), a deleted home's number
  was never refilled, a claimed legacy home answered marked legacy, and an
  orphan legacy home was reported and left standing. But migrating a legacy home
  whose config entry claims it implicitly (id + roots only, no explicit
  evidence:/drafts: paths — the shape the old defaults produced) strands the
  ledger: migrate moved projects/legacyapp to blueprints/0006-legacyapp,
  reported success, wrote an index entry carrying root: but no spec: key, and
  re-pointed nothing. Resolution matches neither, so `walkdown where`
  immediately answered a fresh tentative home and the next write allocated
  0008-legacyapp — one blueprint with two numbered homes, its migrated evidence
  sitting in a directory nothing resolves to any more. The re-pointing machinery
  itself works: with explicit paths in the config entry, migrate printed 'config
  re-pointed' and post-migrate resolution landed correctly on 0009-oldtimer. The
  broken path is exactly the common one. Evidence:
  runs/evidence/2026-09-01T00-11-34Z/probe-transcript.txt (probes 8-12) and
  runs/evidence/2026-09-01T00-11-34Z/probe-final-home-state.txt (the 0006/0008
  split and the spec-less index entry in one screen)."
