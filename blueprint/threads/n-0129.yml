    body: "Re-judged 2026-09-01 (run 2026-09-01T01-06-46Z-local-01): the stranding
      this thread reports is fixed, measured, not read from code. Migrating an
      implicitly-claimed home (id + roots only, spec inside projects/<id>/) now
      moves it to a numbered home whose index entry carries both spec: and
      root:, walkdown where answers the migrated home ('already in the blueprint
      (1 file)') instead of a fresh tentative one, and a subsequent serve --dir
      of that home allocates nothing new - one blueprint, one number (probe-08,
      probe-13). The explicit-path shape still re-points all four config paths.
      The rule still fails, on a narrower clause the fix regressed: this run at
      00:11Z measured an unclaimed projects/ home being reported and left
      standing, and migrate now moves it - projects/orphanapp went to
      blueprints/0003-orphanapp with the same 'moved' wording as the claimed
      homes, no report that nothing claims it, and an index entry with no root:,
      an allocation nothing can ever match; a later unclaimed home was moved the
      same way to 0004-lateapp (probe-07, probe-08, probe-14). Leaving this open
      for the orphan clause. Evidence:
      runs/evidence/2026-09-01T01-06-46Z/probe-07-migrate.txt,
      probe-08-post-migrate-state.txt,
      probe-13-serve-migrated-home-no-realloc.txt,
      probe-14-final-home-state.txt."
