id: q-0070
kind: question
author: topher
created: 2026-08-25T16:40:00Z
anchor: {}
status: open
body: "Three things about the verify model, recorded together because they turn
  out to be one subject. (1) The checks tier is for browser checks. Almost
  everything walkdown specifies is a user scenario, so a rule about the panel or
  the embed should be attached to an integration test that drives a browser -
  that attachment is the whole point of the project. Unit tests over lib/ are
  separate work and do not belong in the ledger at all. (2) What does walking
  down a staging or a review app look like, and what are we capturing there? The
  loop I want is: see what passes and fails, fix, re-judge the failures; have an
  agent pre-screen everything before I look; and after a change, have an agent
  re-judge everything that passed the first time to be sure nothing broke. (3)
  The long-term goal is humans only occasionally in the process - as much of this
  as possible moves to agents."
replies:
  - author: agent
    created: 2026-08-25T16:40:00Z
    body: "Confirmed, and it is worse than a misfiling. Fourteen panel.* and
      embed.* rules currently PASS their checks tier, and every one of them is
      satisfied by test/serve.test.js or test/status.test.js - server and
      derivation tests, no browser. embed.pin.anchored-target is the clearest:
      the statement is about hovering to highlight an anchored element, placing a
      pin on it, and the pin drawing at the spot and following the element; the
      check POSTs {anchor: {element: home.cta}} to the API and asserts a YAML
      file appeared. It hands the server an answer already filled in and verifies
      the filing. None of the described behaviour is exercised. These are false
      greens on the cheapest and most-trusted tier. The origin is my own reply on
      q-0013: I read the missing browser harness as a fact to route around rather
      than a gap to fill, marked those rules verify: [human], and later sessions
      claimed checks on them anyway against the wrong tests. The governing
      principle should be stated once and enforced: A CHECK MUST EXERCISE THE
      SAME SURFACE THE RULE DESCRIBES."
  - author: agent
    created: 2026-08-25T16:40:01Z
    body: "One qualification on scope. Twelve of the 26 checks-verified rules are
      neither browser scenarios nor unit tests of internals -
      threads.lifecycle.claim-never-accept, status.derived.stale-never-passes,
      status.derived.latest-wins, ownership.drift.design-requests-required and
      their neighbours. These are the ledger's own laws: an agent may claim work
      but never accept it; a stale pass is not a pass. They are product behaviour,
      they are exactly what must not break silently, and no browser will ever
      reach them. So the split is three ways, not two: browser checks for what a
      person does, harness checks for what the ledger guarantees, and nothing
      tracked at all for lib/ internals. The twelve honour the principle above;
      the fourteen violate it."
  - author: agent
    created: 2026-08-25T16:40:02Z
    body: "Consequence for the staging and review-app question, which is why
      these are one subject: once UI rules are Playwright checks, walking down a
      review app is mostly not a walkdown. Point the harness at the URL and most
      rules judge themselves in a minute. The agent tier then stops being a cheap
      stand-in for automation we never wrote and becomes what it should be -
      judgment about what an assertion cannot express, does this look right, does
      this feel finished. The human sees only the residue. That is the path to
      humans-only-occasionally, and it runs entirely through the checks fix.
      Mapping the three scenarios: pass/fail then fix then re-judge is a checks
      run against that base_url; pre-screening is an agent walkdown scoped to
      rules Playwright cannot express; the regression sweep is the one that does
      not work today."
  - author: agent
    created: 2026-08-25T16:40:03Z
    body: "The structural gap behind the regression sweep: git_sha is written
      into every run record (lib/run-record.js) and never read by anything.
      Staleness keys on statement_hash alone, so rewording a rule expires its
      verdict but changing forty commits of code does not. 'Re-judge everything
      that passed the first time' therefore has nothing to select on - the ledger
      cannot say that a pass is about a build that no longer exists. Tolerable
      while a human reviews occasionally and remembers; fatal for agents running
      the loop unattended, where without it there is no regression sweep at all,
      only re-judging everything forever. A verdict is a claim about (rule,
      statement, code, address) and should expire when any of them moves."
  - author: agent
    created: 2026-08-25T16:40:04Z
    body: "Settles the multiple-URLs question from the same session. Targets stay
      what they are - the small stable set of environments a pass is demanded in
      (local, staging), each a real column every rule owes, since status.js
      passes a rule's checks only when every applicable target passes. A REVIEW
      APP IS AN ADDRESS, NOT A TARGET: a run against one records its environment
      class plus its actual base_url, which run records already carry. The
      ephemeral URL never becomes a standing obligation, the evidence outlives
      the branch, and the App control lists addresses - including ad-hoc ones the
      panel can hold without editing the blueprint. Two decisions still open for
      Topher: whether the fourteen false greens fail loudly until the harness
      covers them (agent recommends yes) or are quietly re-tiered to [agent,
      human] now; and whether a code-change expiry applies to human verdicts too,
      which risks burying him unless it is scoped to code that plausibly touches
      the rule - a harder problem than it sounds."
  - author: topher
    created: 2026-08-25T20:45:00Z
    body: "Settling the environments question, and deliberately smaller than
      where the discussion went. Rules are verified per environment - I want to
      read 'the walkdown worked on dev' and '34 of 36 rules on review app
      12345'. Old runs are never deleted, so we need to track that a run is
      valid for one URL. If the review app changes, force a fresh walkdown of
      all the rules. We considered letting a new address inherit part of an
      older one's results - features X, Y and Z carried from review-app-1 while
      only B, C and D are retested on review-app-2 - and we are NOT building
      that. In general there is one review app per blueprint; work different
      enough to need another gets its own blueprint. Keep it simple: invalidate
      previous runs when the URL changes."
  - author: agent
    created: 2026-08-25T20:50:00Z
    body: "Built, and it needed no schema change - docs/05-runs-ledger.md already
      promised this ('target + base_url: which system was verified ... what makes
      multiple verification runs against different URLs a first-class concept'),
      and every run header already carried base_url. Derivation was throwing it
      away. Two fixes in lib/status.js: cells are now filled only by runs made
      against the address their target currently points at, and walkdown verdicts
      are keyed by rule AND target instead of by rule alone. That second one was
      a real bug - a walkdown on staging silently overwrote the verdict from a
      walkdown on dev, so status.derived.latest-wins was claiming 'targets never
      bleed into each other' while they did. Recorded as two new rules,
      status.derived.verdict-belongs-to-a-place and
      status.derived.addressless-runs-count, both check-verified. Verified live:
      pointing the local target at a new URL turns 63 agent passes and 14 human
      passes into never, with no run file touched; pointing it back restores them
      exactly. A run with NO base_url is taken at face value - it cannot be shown
      to belong elsewhere, the same courtesy the ledger extends to a result with
      no statement_hash - which is what keeps unit-test runners working, since
      the node:test reporter records no address while the Playwright one does.
      Still open from earlier in this thread and untouched by this change: the
      fourteen false-green checks claims, and whether a code change (git_sha,
      written but still unread) should expire a verdict at an address that has
      not moved."
  - author: topher
    created: 2026-08-25T20:55:00Z
    body: "Decided on the false greens: fail them loudly. Do not quietly re-tier
      them to agent and human - leave the checks demand standing so the gap is
      visible until a browser harness covers it."
  - author: agent
    created: 2026-08-25T21:00:00Z
    body: "Done, judged rule by rule rather than stripped wholesale, against the
      test that a check may only claim a rule whose surface it actually
      exercises. Twelve tags removed, two kept. KEPT:
      panel.delivery.one-implementation, whose check compares lib/viewer against
      extension/vendor byte for byte - that IS the rule, and the surface is the
      repository; and panel.signoff.approved-recorded, whose substance is the
      shape of the record the ledger gains. The most instructive strip was
      embed.pin.right-project: the rule says a pin files against the project the
      page belongs to, and the check passed ?bp= explicitly, telling the server
      the answer. The resolution it claimed to verify does not exist anywhere -
      it is the same missing page-to-blueprint routing that makes the panel open
      the wrong blueprint on localhost:4310. A false green was standing in for an
      unbuilt feature. Removing the tags was not enough on its own: the ledger is
      append-only, so the old passes still won and status still read verified. I
      appended a checks run recording all twelve as blocked, each with the reason
      its former check was not evidence, which is what a checks run honestly
      finds today. They now read blocked with the reason beside the agent verdict
      rather than passing. walkdown lint independently reports all twelve under
      coverage. Recorded the governing principle as
      ownership.evidence.same-surface. Two things left undone and deliberately
      not smuggled in: the attention queue routes these to Topher as judge, when
      what they need is an agent writing the check - there is no agent-facing
      item for a rule that demands checks and has none; and the ledger cannot yet
      notice on its own that the check behind a pass is gone, though every result
      records the refs that would make that possible - embed.pin.anchored-target's
      old pass still cites test/serve.test.js:71, which no longer tags it. That
      staleness rule is the durable fix and would have made the blocked run
      unnecessary."
  - author: topher
    created: 2026-08-25T21:05:00Z
    body: "Fix all of those and do the browser harness."
  - author: agent
    created: 2026-08-25T21:30:00Z
    body: "All three gaps closed and the harness exists. (1) Coverage staleness:
      deriveStatus now takes the inventory of rule ids the check suite
      references, and a checks pass for a rule nothing references any more
      renders stale - matched on rule id, not the recorded refs, because those
      carry line numbers that move whenever anyone edits above them. Recorded as
      status.derived.unbacked-pass-goes-stale. (2) The attention queue gained a
      cover item, routed to the agent: a rule demanding checks that nothing
      checks is work for whoever writes checks, never for the person waiting to
      judge one. (3) The harness: Playwright at checks/, a fixture host page the
      panel docks into, and a global setup that copies the blueprint to
      .walkdown/checkspace so a check run cannot write threads or verdicts into
      the real ledger. runner.run_all now runs both suites and
      authoring.location takes a list, since the two suites answer different
      kinds of rule.

      Building it turned up something the spec had promised and the build never
      delivered: the panel shipped ZERO anchors. The storyboard registers 43 and
      the prototype mockups carry them, but lib/viewer/panel.js had none, so no
      check could be written the way this repo's own authoring rule demands -
      by anchor, never by CSS path. Added them across the bar, the sidebar, the
      detail pane, Settings, and the embed's pin form and markers.

      Six of the twelve now pass on real browser evidence: anchored-target,
      viewport-recorded, surface-coordinates, coordinate-fallback,
      identity.default-actor and walkdown.draft-on-disk. The anchored-target
      check clicks at three-quarters across a real element and asserts the embed
      worked out the element, the offset within it AND the spot, then that the
      marker draws within 14px of where the pointer was - the whole claim the
      old server test never touched.

      Six remain blocked and in the cover queue, honestly: right-project needs
      the page-to-blueprint routing that does not exist; both-surfaces,
      stale-copy-says-so, threads.claim-never-accept and
      walkdown.records-to-ledger are not written yet; and
      signoff.spec-pair-derived had a first attempt that drove the rule stepper
      and hung - shipping it would have put the rule back to green on evidence
      nobody trusts, which is the exact failure this work exists to undo.

      One incident worth recording: the first browser run recorded and then did
      NOT count, because the checks served walkdown on 4711 while the blueprint
      declares local as 4700. The address rule from earlier today rejected its
      own harness's evidence, correctly. The config was wrong, not the rule. The
      checks now run on the declared port and refuse to reuse an existing server
      there, since one already on 4700 is serving the real blueprint and these
      checks write."

