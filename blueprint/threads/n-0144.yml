body: |-
  The last THEN — "The shared config and the personal one are both consulted, and the report says which answered" — fails: the report affirmatively credits the file that did not answer.

  Fixture (evidence key runs/evidence/2026-09-01T11-48-09Z/declared-not-discovered-05-report-credits-wrong-config.txt): one git repo whose .walkdown/config.yml declares two blueprints, alpha and beta; a personal config under a scratch WALKDOWN_HOME that exists and lists beta and solo but has NO entry for alpha. Standing in alpha, `walkdown where` prints:

    config    <home>/config.yml
              names this project
              <repo>/.walkdown/config.yml
              this repository's, shared — the personal config above wins over it

  The personal config does not name alpha. Every path in that report — spec, runs, threads, code — came from the repository's committed config, yet each row's reason reads "this machine's config (alpha)", the phrase docs/08-locations.md reserves for the personal file. Controls in the same transcript: the label is correct for beta (personal really does have a beta entry), and correct with no personal config at all ("not present — every default applies"). --json carries no field that distinguishes either: config.matched is a single boolean beside config.repo.

  Cause: bin/commands/where.js:44-49 chooses the label from loc.config.matched, and resolveLocations computes matched = Boolean(project) against the MERGED config, so a repository declaration lights up the personal file's row. The alternative label 'present, no entry for this project' (where.js:49) is unreachable whenever a repository config claims the project. The comment at where.js:53-57 states the intent this misses — the two files are printed as separate rows because "which of these said so" is exactly the question the command exists to answer.

  The rule's other three THENs held under everything I could throw at them, recorded in runs/evidence/2026-09-01T11-48-09Z/declared-not-discovered-01-declared-vs-undeclared.txt and -02-named-outright.txt: an undeclared blueprint (complete walkdown.yml, features, threads) is not a project from inside it and is 404 'unknown project' to the panel; a decoy blueprint sitting nearer than the declared one never wins; --dir at a declared sibling brings that sibling's threads and runs and gives the same answer from inside the other project or from outside the repo entirely; and nothing written to the personal home by any of the asking.

  A fix would either give the personal and repository halves their own matched flags, or word the row for the file that actually supplied each path. Which of the two is right is a call for a person.
