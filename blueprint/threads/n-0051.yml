body: A fail with no why is work nobody can act on. Failing should be refused
  until the reviewer has written a note or pinned the problem on the page;
  failing also flips pin mode on.
replies:
  - author: agent
    created: 2026-08-24T14:55:07Z
    body: "Built and verified in the live panel. Choosing Fail with an empty box and
      no session pin on the rule is refused: nothing is recorded, the panel says
      'A fail needs a why - write it above, or pin it on the page', and pin mode
      is armed. With text (or a pin dropped since the session started - checked
      against thread created-timestamps, refreshed before refusing) the fail
      records, files the note, links it into the run result, and leaves pin mode
      on. Verified live: empty fail refused with pin mode armed and 0 judged;
      written fail recorded with its thread linked."
