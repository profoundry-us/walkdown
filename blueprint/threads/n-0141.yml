body: >-
  Two blueprints DO resolve to the same home, and one blueprint is given two.
  Probed with a fresh WALKDOWN_HOME and real fixtures (evidence
  runs/evidence/2026-09-01T11-48-09Z/).


  1) Same repository basename
  (runs/evidence/2026-09-01T11-48-09Z/one-home-B-same-basename-two-homes.txt):
  two git repos both basenamed 'app'. `walkdown init` in the first created its
  spec at <home>/blueprints/app/blueprint and listed it. `walkdown init` in the
  second reported every blueprint file '. up to date' — it adopted the FIRST
  repo's spec — and printed no '+ listed' line at all; the config still holds
  exactly one entry, rooted at repo a. `walkdown where` from repo b then reports
  'present, no entry for this project' and resolves spec/runs/threads to the
  first repo's. Confirmed live in one-home-C-shared-ledger-and-split-home.txt: a
  note filed while standing in repo a (n-0001, in the fixture ledger) is listed
  by `walkdown threads` while standing in repo b. Two blueprints, one home, one
  ledger.


  2) Two packs in one repository (one-home-D-two-blueprints-one-repo.txt):
  monorepo 'mono' with packs/one and packs/two. init in packs/one put the spec
  at <home>/blueprints/mono/blueprint (keyed on the git root's basename, not the
  pack); init in packs/two reused it verbatim and was never listed. This is
  exactly the n-0124 case the statement names.


  3) One blueprint, two homes (same two files): the single entry written for
  packs/one carries spec/runs/threads under <home>/blueprints/mono/... but
  evidence/drafts under <home>/blueprints/one/... . Same split in the two-repo
  probe: entry 'app' has spec at blueprints/app/blueprint and evidence/drafts at
  blueprints/app-2/. Cause is ordering — bin/commands/init.js takes specDir from
  resolveLocations() (derived home = blueprints/<slug(id)>) and scaffolds it
  BEFORE calling rememberProject, whose uniqueness loop in lib/locations.js
  bumps the name while existsSync(join(homes,name)) — so the directory init just
  created makes the entry skip to the -2 home for its records while its spec
  stays in the first.


  Root cause of (1) and (2): the derived home for an unlisted blueprint is
  name-keyed (lib/locations.js ~L457, join(home,'blueprints',slug(id))), and
  rememberProject's 'listed already?' test is by SPEC path — which two
  same-named projects share by construction, so the second returns 'kept'
  against the first's entry.


  What passes, judged the same way: asking allocates and writes nothing
  (one-home-A-asking-writes-nothing.txt — no config.yml, no directory, on
  repeated `walkdown where` with no config at all); an existing legacy
  projects/<id>/ home keeps answering and is labelled legacy
  (one-home-E-existing-ledger-and-migrate.txt); `walkdown migrate` moves nothing
  (every file's shasum unchanged across the run) and reports a home no entry
  claims as '? left ... no config entry claims it' rather than guessing
  (one-home-E, one-home-F-migrate-claimed-home.txt).


  Two smaller things seen in passing: `walkdown --help` still describes migrate
  as 'Renumber legacy name-keyed homes ... moving each directory once', which is
  the behaviour the command deliberately no longer has; and in one-home-F
  migrate matched two different homes to the same entry (index-recorded home by
  spec, legacy home by id), leaving that one blueprint with evidence in
  blueprints/0001-legacyproj and drafts in projects/legacyproj.
