# The viewer's own screens. The "app" is the running viewer itself
# (walkdown serve), so the side-by-side compares mockup against live tool.
screens:
  - id: board
    title: The board
    prototype: /screens/board.html
    app: { path: / }
    anchors:
      - board.project-switcher
      - board.counts
      - board.mode-switcher
      - board.rules
      - board.rail-toggle
      - board.surfaces
      - board.drawer
      - board.viewport-toggle
      - board.zoom

  - id: rule-detail
    title: Rule detail (state — select a rule on the board)
    prototype: /screens/rule-detail.html
    app: { path: / }
    anchors:
      - detail.rule-id
      - detail.statement
      - detail.evidence
      - detail.flow
      - detail.steps
      - detail.technical-disclosure
      - detail.threads
      - detail.drawer-toggle
      - detail.resize-handle

  - id: thread-panel
    title: Thread panel (state — open a pin or a thread)
    prototype: /screens/thread-panel.html
    app: { path: / }
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close
