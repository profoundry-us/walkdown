# walkdown's own screens. The page under review is whatever the panel rides
# beside, so these are prototype-only: the panel's design surface, letting
# rules about the panel anchor pins to the mockups.
screens:
  - id: review
    title: The review page
    prototype: /screens/review.html
    anchors:
      - panel.bar
      - panel.desk
      - panel.desk-tuner
      - panel.blueprint
      - panel.fade
      - panel.viewport-toggle
      - panel.pin-mode
      - panel.walk
      - panel.actor
      - panel.app-frame
      - panel.zoom
      - panel.tabs
      - panel.rules-list
      - panel.counts

  - id: rule-detail
    title: Rule detail (state — open a rule on the Rules tab)
    prototype: /screens/rule-detail.html
    anchors:
      - detail.back
      - detail.stepper
      - detail.rule-id
      - detail.statement
      - detail.verdict
      - detail.judged
      - detail.feedback
      - detail.evidence
      - detail.steps
      - detail.technical-disclosure
      - detail.verify
      - detail.threads

  - id: thread-panel
    title: Thread popover (state — open a pin)
    prototype: /screens/thread-panel.html
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close

  - id: start
    title: First run (state — no server connected)
    prototype: /screens/start.html
    anchors:
      - start.message
      - start.server
      - start.connect

  - id: choose-blueprint
    title: Choose a blueprint (state — folder holds several)
    prototype: /screens/choose-blueprint.html
    anchors:
      - start.folder
      - start.options

  - id: docked
    title: The docked layout (script-tag delivery)
    prototype: /screens/docked.html
    anchors:
      - docked.page

  - id: settings
    title: Settings (state — open the gear)
    prototype: /screens/settings.html
    anchors:
      - settings.panel
      - settings.actor
      - settings.dials
      - settings.hide
