# walkdown's own screens. The page under review is whatever the panel rides
# beside, so these are prototype-only: the panel's design surface, letting
# rules about the panel anchor pins to the mockups.
screens:
  - id: review
    title: The review page
    prototype: /screens/review.html
    anchors:
      - panel.bar
      - panel.desk
      - panel.desk-tuner
      - panel.blueprint
      - panel.fade
      - panel.viewport-toggle
      - panel.pin-mode
      - panel.walk
      - panel.actor
      - panel.app-frame
      - panel.zoom
      - panel.tabs
      - panel.rules-list
      - panel.counts

  - id: rule-detail
    title: Rule detail (state — open a rule on the Rules tab)
    prototype: /screens/rule-detail.html
    anchors:
      - detail.back
      - detail.stepper
      - detail.rule-id
      - detail.statement
      - detail.verdict
      - detail.judged
      - detail.feedback
      - detail.evidence
      - detail.steps
      - detail.technical-disclosure
      - detail.verify
      - detail.threads

  - id: thread-panel
    title: Thread popover (state — open a pin)
    prototype: /screens/thread-panel.html
    anchors:
      - thread.panel
      - thread.provenance
      - thread.body
      - thread.replies
      - thread.reply
      - thread.actions
      - thread.close
