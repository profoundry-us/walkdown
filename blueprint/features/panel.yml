feature: panel
title: The docked panel
source:
  prd: (design exploration, 2026-08-21; see docs/04-embed-and-anchors.md)
stories:
  - id: panel.dock
    title: The chrome around the page under review
    statement: As a reviewer, I get one set of controls around the application - the bar, the fade between design and build, pin mode - and they behave the same however walkdown arrived.
    # The id stays `panel.dock` because ids are assigned once and every run
    # record, thread and check keys off it. What it names changed on
    # 2026-08-26: the docked layout was withdrawn, and the four rules that were
    # actually about docking are marked retired. The rest were always about the
    # review screen and are untouched.
    rules:
      - id: panel.dock.no-framing
        retired: The docked delivery is withdrawn (2026-08-26). walkdown frames the page it reviews; there is no longer a layout that renders beside it.
        origin: walkdown
        statement: Docked into a page's own document, the panel renders beside what it reviews rather than framing it - a script tag cannot put its own page in a frame, so the docked delivery works within the application's document and pushes it aside instead of covering it.
        screens: [docked]
        steps:
          given:
            - A dev page loading panel.js
          when:
            - The page loads
          then:
            - The panel occupies the right edge and the document is inset by its width
            - No part of the application is hidden behind the panel
            - Undocking restores the page's own margin and leaves a tab to redock
            - What the application positions against the viewport is beyond this layout's reach, which is the reason the framed delivery exists
          statement_hash: sha256:45e629ff8e85

      - id: panel.dock.wraps-the-page
        retired: The docked delivery is withdrawn (2026-08-26). Nothing insets the host document any more - the page under review is a frame on walkdown’s own desk.
        origin: thread:n-0015
        statement: The page under review is presented as a sheet lying on walkdown's desk - inset on every side, with rounded corners and a shadow - so it reads as the thing being examined rather than as part of the tool.
        screens: [docked]
        steps:
          given:
            - A dev page loading panel.js
          when:
            - walkdown docks
          then:
            - The document is inset to leave the chrome its room and a margin of desk all round
            - The page carries rounded corners and a shadow against that desk
            - Page and panel share every edge - same top, same bottom, same margin - including on a page too short to fill the window
            - A page with no background of its own is still drawn as a page, not as a hole
            - Undocking restores every one of those styles to what the page had before
          statement_hash: sha256:3b454ec97134

      - id: panel.dock.toolbar
        origin: thread:n-0015
        statement: A bar across the top carries the controls that are about the session rather than the rule in hand - which screen, which surface, and pin mode - and it names the project all of them are about, without being where the project is chosen.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - walkdown framing a page, with sibling projects on the server
          when:
            - Read the bar
          then:
            - Anchor `panel.blueprint` names the project this session is against; it says which one, and is not a control - choosing a different one is the Blueprints tab's job, since n-0017 took the selector off the bar on purpose
            - Anchor `panel.screen-picker` says which screen this page is without being opened, and opens anchor `panel.screens-list` to pick a different one or to go back to detecting it
            - A screen picked by hand is marked as picked, because it outranks detection and the difference has to be readable from the bar
            - Detecting, the control reports the page rather than remembering an answer, so the label in the bar and the row the open list marks both follow the page when it moves
            - Prototype and App switch which of the two the page area shows
            - Pin mode can be turned on and off there
          statement_hash: sha256:aaf28fbb5e0a

      - id: panel.dock.surface-swap-is-instant
        origin: walkdown
        statement: Swapping between the design and the app costs no page load - the ghosted copy is kept between looks and only reloaded when what it should show has actually changed - because comparing two surfaces means going back and forth, and a reload on every crossing flashes the thing you are trying to compare.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with both surfaces, the ghost showing one of them
          when:
            - Swap to the other surface and back, several times
          then:
            - Only the first look loads the page; every crossing after it is instant, with nothing reloading
            - The hidden copy takes no clicks and cannot be pinned while it is hidden
            - Resizing the window re-measures the copy rather than reloading it
            - What does reload it - a different screen, a different surface, a viewport preset, the end of a sketch detour - reloads it, so what you compare is never the wrong page
            - The copy is as old as its last load, and reloading walkdown refreshes it
          statement_hash: sha256:c74a4c999299

      - id: panel.dock.controls-survive-use
        origin: thread:n-0022
        statement: A control in the bar survives being used - the fade slider can be grabbed and dragged the whole way, because nothing rebuilds the element the pointer is holding until the pointer lets go.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel docked on a screen that has a design on file
          when:
            - Grab the slider's handle and drag it across the track
          then:
            - The surfaces cross-fade continuously under the pointer, all the way
            - The drag is not dropped after the first movement
            - Clicking a spot on the track still jumps there, and the arrow keys still step
            - What the drag settles on is what the bar shows once it ends
          statement_hash: sha256:e55758ff63da

      - id: panel.dock.above-the-app
        retired: The docked delivery is withdrawn (2026-08-26). Framed, the application cannot paint outside its own frame, so nothing has to climb into the top layer to stay above it.
        origin: thread:n-0028
        statement: Nothing the application draws paints over walkdown's own chrome, because the tool has to stay readable exactly when the app is showing the state you came to judge - and a z-index cannot promise that, since a modal joins a layer painted above every z-index there is.
        screens: [docked]
        steps:
          given:
            - An application whose modal is promoted to the browser's top layer
          when:
            - It opens while walkdown is docked
          then:
            - The bar and the panel stay drawn above it, and undimmed by its backdrop
            - The ghosted design stays above it too, so a modal state can still be compared against its design - and the panel stays above the ghost
            - Closing and reopening the modal does not put it back on top
            - A browser without that layer falls back to the ordering it does have rather than failing
          statement_hash: sha256:a2640eb509a6

      - id: panel.dock.one-pin-mode
        origin: thread:n-0015
        statement: There is one control for pin mode - the bar's Pin mode button - and one state behind it, so whatever turns pin mode on or off, the whole review agrees about whether it is on.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A page with both the embed and the panel
          when:
            - Turn pin mode on from the bar, then press Escape
          then:
            - The bar's Pin mode button is lit while pin mode is on and plain while it is off
            - The page under review takes a crosshair cursor while pin mode is on, and drops it when pin mode ends
            - Escape ends pin mode, and the button and the cursor both follow
            - The bar's button is the only way to turn pin mode on, so there is no second control to fall out of step
          statement_hash: sha256:a66c41a78d23

      - id: panel.dock.no-pin-mid-fade
        origin: thread:n-0023
        statement: While the fade sits between the two surfaces, pinning is closed - both are on screen at once, so a pin has no honest answer to which one it is about.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A screen with a design on file, the panel docked
          when:
            - Move the fade off either end
          then:
            - Pin mode cannot be entered, and the control says why rather than simply refusing
            - Pin mode already running is turned off, not left armed over an ambiguous view
            - Landing fully on either end opens pinning again
          statement_hash: sha256:a25c933fc24f

      - id: panel.dock.own-skin
        origin: thread:n-0015
        statement: walkdown's chrome wears its own theme - drafting blue, pale ink, flat surfaces - so it is never mistaken for the application it is inspecting, whatever that application looks like.
        signoff: [eng, product]
        screens: [review, settings]
        steps:
          given:
            - The panel beside any application
          when:
            - Look at the chrome and the page together
          then:
            - The chrome is visibly a different surface from the app
            - The skin is a theme definition, so retuning it is one block and no component knows about it
            - Prototype screens keep their own wireframe skin, distinct from both
          statement_hash: sha256:93bfd901cfcd
      - id: panel.dock.host-isolation
        retired: The docked delivery is withdrawn (2026-08-26). The panel no longer runs inside anybody else’s document. The embed still does, and embed.pin.own-skin still governs that.
        origin: walkdown
        statement: The panel is injected into somebody else's application, so its styles never reach the host page and the host's styles never reach it.
        screens: [docked]
        steps:
          given:
            - A page that has its own stylesheet, loading panel.js
          when:
            - The panel renders
          then:
            - Everything the panel draws lives inside a shadow root
            - The host document gains no rule that paints anything
            - The host's own buttons, headings and form controls are unchanged
          statement_hash: sha256:116d1940d94f

      - id: panel.dock.chrome-not-a-pin-target
        origin: thread:n-0011
        statement: In pin mode, walkdown's own chrome - the bar, an open form, an existing pin, the docked panel - is never treated as a place to put a pin, and Escape leaves pin mode.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A page with the embed and the panel, pin mode on
          when:
            - Use a control in the bar, or click anywhere in the panel
          then:
            - No pin form opens; the click does what the control says
            - Controls stay usable in pin mode - the slider still drags, buttons still fire
            - Escape closes an open pin form, and leaves pin mode when none is open
          statement_hash: sha256:466c5e212ed7

  - id: panel.desk
    title: The desk the work lies on
    statement: As a reviewer, I can tune how the paper lies without any of it touching what gets verified.
    rules:
      - id: panel.desk.reads-as-paper
        origin: thread:n-0076
        statement: The desk under the page reads as drafting paper rather than as a spreadsheet - ruled faintly and lying at an angle, drawn with a real perspective rather than a flat skew.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel docked beside a page
          when:
            - Look at what lies under the page
          then:
            - The ruling is faint rather than a grid of hard lines
            - It lies at an angle, as paper on a desk does
            - The perspective is a real 3D transform, falling back to something flat only where that is unavailable
          statement_hash: sha256:60871d489f4d

      - id: panel.desk.tuner
        origin: thread:n-0076
        statement: How the paper lies is the reviewer's own taste - a gear in the bar tunes it live, the choice persists across sessions, and none of it changes what gets verified.
        signoff: [eng, product]
        screens: [settings]
        steps:
          given:
            - The panel docked, with the desk visible
          when:
            - Open the gear and move a dial
          then:
            - The desk changes as the dial moves, without a reload
            - Each dial's number can be typed directly, not only dragged to
            - The choice is still there in the next session
            - Nothing about it reaches the ledger - no verdict, no run, no thread
            - The tuner closes on Escape or on a click anywhere outside it, the gear excluded since its own click already toggles it
            - It sits clear of the app's corner rather than flush against it, by the same distance on both axes, so it reads as something on the desk rather than part of the app's layout
          statement_hash: sha256:09636342aada

      - id: panel.desk.peek
        origin: thread:n-0076
        statement: A checkbox dims everything lying on the desk to a peek rather than hiding it outright, so the ruling can be judged against everything that would otherwise sit on top of it - a way of looking, not a preference.
        signoff: [eng, product]
        screens: [settings]
        steps:
          given:
            - The tuner open, with an app and an aside on the desk
          when:
            - Tick the peek checkbox
          then:
            - The app, the aside, and any cover over them - the headless cover included - all dim together rather than disappearing
            - The bar stays at full strength throughout, its buttons and the gear still working
            - Adjusting a dial does not undo the peek
            - It always starts unchecked, and closing the tuner ends it
          statement_hash: sha256:9b19ad4a2f80

  - id: panel.delivery
    title: walkdown reaches the page, however the page was built
    statement: As a reviewer, I can walk down an application whether or not anyone can add a script tag to it.
    rules:
      - id: panel.delivery.one-implementation
        retired: How walkdown's own files are packaged is an implementation detail with no surface a reviewer can see (2026-08-26, thread n-0078); the byte-for-byte comparison stays as a node test.
        origin: thread:q-0016
        statement: The panel and the embed stay two files because they load into two documents - the embed into the application being reviewed, the panel only into walkdown's own page above it - and neither carries a copy of the other.
        verify: [checks]
        steps:
          given:
            - A page carrying the script tags, and a page carrying nothing
          when:
            - walkdown starts on each
          then:
            - Both run the same embed.js and panel.js
            - The tag supplies server, project and anchor attribute from its own attributes
            - The extension supplies the same answers before loading them, and nothing is forked
            - A page carrying both gets one panel and one badge, not two - the tag wins, because it runs first and its project is the app's own answer
          statement_hash: sha256:4477bced1c62

      - id: panel.delivery.absent-until-asked
        origin: thread:q-0016
        statement: The extension adds nothing to a page until you click its toolbar button, and clicking the button again ends the review and hands the page back exactly as it was.
        unverifiable:
          agent: The control is the browser's own toolbar button, which is browser chrome rather than part of the page - no tool an agent drives reaches it.
          checks: The same button, for the same reason - a test that drives a page cannot click something that is not in the page.
        signoff: [eng, product]
        steps:
          given:
            - The extension installed, on any page
          when:
            - Visit it, then click the toolbar button, then click it again
          then:
            - Before the click, nothing is added to the page at all
            - The click begins a review of that page, and the button says which of the two states it is in
            - Clicking again returns to the page itself, at the URL it had reached rather than the one the review started from
            - Nothing about the review outlives it - not the framing, not the headers it needed removed
          statement_hash: sha256:f7a1627079f4

      - id: panel.delivery.framed-isolation
        origin: thread:n-0030
        statement: The extension reviews an application by giving it a viewport of its own inside walkdown's page, so the application lays itself out against that viewport and nothing it draws can paint over walkdown's chrome.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - An application whose modal covers the window, and one that refuses to be framed at all
          when:
            - Review each of them through the extension
          then:
            - The app's modals, overlays and sticky chrome are laid out against the sheet rather than the whole window
            - Nothing the app draws paints over walkdown, and nothing it opens makes walkdown unusable
            - A page that refuses framing is reviewed anyway, by removing the header that refuses - for that tab only, and only while it is being reviewed
            - The panel keeps up with the application - navigating inside it moves the panel to the screen the app landed on, including when the app moves without a page load
          statement_hash: sha256:967abb13513f

      - id: panel.delivery.one-switch
        origin: thread:n-0018
        statement: The extension's only control is the toolbar button - on or off for this site - and it shows which of those it is. Everything else is asked in the panel, where there is room to explain it.
        unverifiable:
          agent: The control is the browser's own toolbar button, which is browser chrome rather than part of the page - no tool an agent drives reaches it, and its icon is not something an agent can see.
          checks: The same button, for the same reason - a test that drives a page cannot click something that is not in the page.
        signoff: [eng, product]
        steps:
          given:
            - The extension installed
          when:
            - Click its toolbar button on a site
          then:
            - Clicking starts it, clicking again stops it - there is no second place to look
            - The button wears the state as its own icon, colour for on and drained for off, rather than a badge pinned to it
            - Server and blueprint are chosen in the panel, not in browser chrome
          statement_hash: sha256:84bda3b30c1d

      - id: panel.delivery.stale-copy-says-so
        origin: thread:n-0062
        statement: The extension's vendored copy of walkdown only updates when the extension is reloaded - so the panel compares the copy it is running against what the server ships, and says plainly when it has gone stale, because an outdated walkdown reviewing a moving spec quietly undermines every verdict.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The extension reviewing a page after walkdown's panel changed on disk
          when:
            - The panel loads the blueprint
          then:
            - A banner states the extension is running an older walkdown and names the fix - reload the extension, then the page
            - A current copy shows nothing
            - The docked delivery never shows it, because a script tag always runs what the server ships
          statement_hash: sha256:124fa1fddaac

      - id: panel.delivery.anchors-still-required
        origin: thread:q-0016
        statement: A page that carries no anchors can still be reviewed - a pin dropped on it is recorded by where it sits on the screen rather than against an element, and pages that do carry anchors are unaffected.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A page walkdown reaches but which carries no anchor attributes
          when:
            - Place a pin
          then:
            - The pin is recorded against its coordinates and the thread is written
            - It renders as a positioned pin, not an anchored one
            - Anchored pins keep working wherever anchors do exist
          statement_hash: sha256:6cbc4017880c

  - id: panel.start
    title: A fresh install knows nothing, and says so
    statement: As a reviewer opening walkdown for the first time, I am asked what to open and which blueprint this site is - once - rather than shown an empty tool.
    rules:
      - id: panel.start.open-a-folder
        origin: thread:n-0017
        statement: With no walkdown server to read blueprints from, the panel says so plainly and tells you how to start one, rather than rendering an empty or broken review surface. Once it connects, it shows which folder that server is serving.
        signoff: [eng, product]
        screens: [start]
        steps:
          given:
            - The extension on for a site, and no server running
          when:
            - The panel starts
          then:
            - It says no blueprints are open and names the command that opens them
            - The address it looks at can be changed and retried without a reload
            - It is stated as a first step, not as an error
            - The box you type into is labelled as a server address, not as a folder
            - Once connected, the panel names the folder that server is serving
          statement_hash: sha256:2a5e9a0925a7

      - id: panel.start.choose-a-blueprint
        origin: thread:n-0017
        statement: When the folder holds more than one blueprint, the panel asks which one this site is, showing each by name and by a description the blueprint itself carries.
        signoff: [eng, product]
        screens: [choose-blueprint]
        steps:
          given:
            - A server whose folder holds several blueprints
          when:
            - The panel starts with no choice recorded for this origin
          then:
            - Every blueprint is listed with its name and its own description
            - Choosing one loads it and remembers the choice for that origin
            - A page that declares its blueprint is never asked
            - Test fixtures are not offered - a fixture is an input to the suite, not a project anyone reviews
            - The same list stays reachable later, so the folder or the blueprint can be changed without reinstalling anything
          statement_hash: sha256:9f0ded825795

  - id: panel.rules
    title: The rules are one tap away, and so is the way back
    statement: As a reviewer, I can see every rule, open one for detail, and move between them without losing my place.
    rules:
      - id: panel.rules.detail-slide
        origin: walkdown
        statement: Opening a rule slides the panel from the list to that rule's detail, and one control comes back - only one of the two panes is ever visible.
        signoff: [eng, product]
        screens: [review, rule-detail]
        steps:
          given:
            - The panel showing the rule list
          when:
            - Click a rule
          then:
            - The detail pane slides in and the list slides out
            - Exactly one pane occupies the panel's full width
            - "\"All rules\" slides back to the list"
            - The Blueprints / Rules / Threads tabs are sized to their labels and centred in the sidebar, not stretched to its full width
            - Each of the three tabs carries its own icon, from the same Phosphor set as the rest of the panel's chrome, sized and padded to read clearly at tab size rather than as an inline glyph shrunk to fit
          statement_hash: sha256:493a83d3f0bd

      - id: panel.rules.takes-you-there
        origin: thread:n-0031
        statement: Asking for something in the panel moves the surface to it - opening a rule goes to the screen that rule is about, picking a screen goes to that screen, and choosing a blueprint that says nothing about this page goes to one it does.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A blueprint whose screens have URLs on the app, the design, or both
          when:
            - Open a rule, pick a screen, change the blueprint
          then:
            - Each of those arrives at the screen asked for, and the panel then reports that screen as where you are
            - The trip stays on the surface you were on - asking for a screen while looking at the design shows the design of it - and crosses over only when that surface has no URL for it
            - A screen you are already on is not re-navigated to, because that would throw away the page's state for nothing
            - A blueprint that does cover the page you are on leaves you there; only one that does not moves you
            - A screen with no URL on either surface still does the one thing it can - record that this page is that screen
            - Where a move means a real page load rather than a frame, it stays something you ask for on the rule rather than something opening a rule does to you
            - Whether a trip that means a real page load is taken or merely offered depends on whether walkdown survives it - framed, walkdown owns the frame and goes; docked by the extension it also goes, because the extension re-injects itself into the next page; docked by a script tag it offers a link instead, because navigating would unload the very script drawing the panel and leave you on the other site with no walkdown at all
          statement_hash: sha256:bc2cef92cdd3

      - id: panel.rules.one-pane-per-tab
        origin: thread:n-0032
        statement: A rule's detail belongs to the tab that lists rules - switching to another tab shows that tab's own content.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A rule open in the detail pane
          when:
            - Switch to the Blueprints or Threads tab
          then:
            - That tab's own content is what shows
            - Returning to Rules shows the list, from which the rule can be opened again
            - A tab that opens something of its own opens it into the same seat the rule detail uses, so no tab slides past another tab's detail to reach its own
          statement_hash: sha256:7cbb341f16bd

      - id: panel.rules.step-between
        origin: walkdown
        statement: From a rule's detail I can step to the previous or next rule in list order without returning to the list, and each control says where it lands.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule open in the detail pane
          when:
            - Use the previous/next controls beside the back link
          then:
            - The detail pane shows the adjacent rule in the order the list shows them
            - Stepping to a rule is opening it, so it takes the surface to that rule's screen exactly as opening it from the list does
            - Each control's tooltip names the rule it will open
            - At either end the control is disabled and says there is nothing further
          statement_hash: sha256:56a26420e1f3

      - id: panel.rules.steps-not-an-appendix
        origin: thread:n-0007
        statement: A rule's given/when/then steps are visible without being asked for; only the recorded check source sits behind a collapsed disclosure.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule open in the detail pane on screen `rule-detail`
          when:
            - Reading anchor `detail.steps`
          then:
            - The steps are already expanded - they are the rule, not an appendix
            - The check source stays behind anchor `detail.technical-disclosure` until opened
            - Hovering an anchor a step names highlights that element on the surface under review, so a step points at what it is talking about
          statement_hash: sha256:0609e516526f

      - id: panel.rules.setup-says-how-to-arrive
        origin: thread:n-0093
        statement: When a rule's screen is a state rather than an address - it carries a setup - the panel says what to do on arrival, above the steps, because an address alone cannot always put the app into the state it names.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule whose screen declares a setup, open in the detail pane
          when:
            - Reading the detail above anchor `detail.steps`
          then:
            - Anchor `detail.setup` says how to get the app into that state
            - The block is labelled Setup, the storyboard's own word for the field
            - A rule whose screen has no setup shows nothing there - an empty instruction is worse than none
          statement_hash: sha256:e41b088d8143

      - id: panel.rules.evidence-visible
        origin: walkdown
        statement: A rule's detail shows the evidence behind its standing - the latest ledger result for each of its verify types - so the chain of trust is read where the rule is judged.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule with recorded runs, open in the detail pane
          when:
            - Reading anchor `detail.evidence` on screen `rule-detail`
          then:
            - Each verify type shows its latest result, who or what produced it, and staleness
            - Screenshots an agent's run attached hang under that run's row as `detail.screenshots`, not as a tier of their own
            - "Anchor `detail.screenshots` opens them to look at, in `detail.screenshots-modal`"
            - A rule with no runs says so rather than showing nothing
          statement_hash: sha256:65b84178c291

      - id: panel.rules.counts-legible
        origin: thread:n-0002
        statement: The counts say what they count and reconcile with the list - verified is a count of rules, the work owed to a person is named, each owed rule carries a mark so the total can be counted back, and the tab carries that total so it is legible from whichever tab is open.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A blueprint whose rules are partly verified, with work owed to a person
          when:
            - Reading anchor `panel.counts` on screen `review`, then the marks in anchor `panel.rules-list`, then the Rules tab in anchor `panel.tabs`
          then:
            - Every number states its unit, so a reader can tell rules from pending actions
            - The footer splits the owed work by kind - to sign and to walk - and each owed rule's badge says the same word
            - The badges owed sum to the footer's counts, kind for kind
            - The Rules tab carries how many rules a walkdown would take you through - the footer's two kinds together, counted the way the walkdown itself picks the next rule, so it empties as the sitting goes on
            - A tab holding nothing for you draws no badge at all, because a badge saying none is a claim on the eye about nothing
            - The Rules badge is the same warning colour the rule glyphs and their badges use, because it is the same claim they make - this is waiting on you - and it is the loudest thing in the strip, since walking the rules is the work the tool exists for. Other tabs count their own work in their own colour rather than a second yellow beside it
          statement_hash: sha256:669dfeb91eee

      - id: panel.rules.lifecycle-legible
        origin: thread:n-0054
        statement: A rule's lifecycle is read off the same marks every other rule wears, never off a shape of its own - designed, approved, built-but-unwalked, verified and failing are all legible from how much of the strip is filled - because a lifecycle drawn in its own vocabulary put a lone mark where every neighbouring row had three, and a rule whose only fault was not being built yet read as an alarm.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A blueprint holding rules in every lifecycle state, the Rules tab open
          when:
            - Reading anchor `panel.rules-list`
          then:
            - Every rule draws the marks of anchor `panel.rule-tiers`, built or not, in the same positions
            - An unbuilt rule's evidence tiers read as having nothing to judge yet, rather than as failing or as absent
            - An approved rule is legible from its signature marks alone, with no separate glyph for it
            - A rule waiting on the reviewer is warning-tinted and its badge names the work - sign or walk
            - Each row's tooltip spells the state out in words
          statement_hash: sha256:64336fe46850

      - id: panel.rules.search-the-list
        origin: thread:n-0108
        statement: The rule list carries a search box fixed above it, and typing in it filters the list as you type - a query naming a story keeps every rule in it, a query naming a screen keeps every rule judged on it, a query naming one rule keeps that rule alone, and both headings a surviving rule sits under are always drawn, so the hierarchy stays readable while the list is filtered.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The Rules tab open on a blueprint with several groups of rules
          when:
            - Type into anchor `panel.rules-search` on screen `review`
          then:
            - The box stays put at the top of anchor `panel.rules-list` however far the list is scrolled - it is not part of what scrolls
            - Filtering happens on each keystroke, in the browser, with nothing fetched
            - A query matching a group's name leaves every rule in that group standing
            - A query matching only a rule's own id or statement hides the other rules
            - A query naming a screen leaves standing every rule judged on that screen
            - Every rule still listed is drawn under both of its headings - the screen it is judged on and the story it belongs to
            - Emptying the box brings the whole list back
          statement_hash: sha256:f183d0a96302
      - id: panel.rules.tiers-at-a-glance
        origin: thread:n-0109
        statement: Every rule shows one mark per evidence tier - checks then agent - and beside them one dot per role that must sign, so which evidence a rule rests on, and whose signature it is still waiting for, can be read off the list rather than opened one rule at a time.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The Rules tab open on a blueprint holding built rules in several states - some verified, some with a tier that failed, never ran, or has gone stale
          when:
            - Reading anchor `panel.rule-tiers` on a built rule in anchor `panel.rules-list`
          then:
            - Two tier marks are drawn, always, in the order checks then agent
            - A tier that passed is a green check, and one that failed is a red cross
            - A tier the rule asks for that no run has touched, and a pass whose statement has since moved, each keep a shape of their own - so a missing tier is legible as missing rather than as absent
            - A tier the rule does not ask for, and a tier with nothing to judge because the rule is unbuilt, are the quietest mark on the strip - and the tooltip says which of the two it is
            - Beside the tiers, one slot per role the rule names, in a fixed order, filled to the extent that role has signed
            - One tooltip covers the whole strip and names every tier and every role in words
          statement_hash: sha256:cac7a0be0702
      - id: panel.rules.grouped-by-screen
        origin: walkdown
        statement: The rail is grouped by the screen a rule is judged on, in storyboard order, each screen named as the storyboard names it and wearing the same icon the bar's picker wears - and the story beneath keeps only what the screen has not already said. A screen's heading stays in view while its own rules are scrolled, because a group forty rules long outlives the heading that named it. Rules belonging to no screen are a group of their own at the end, because a blueprint can be a third ledger law and that is read rather than looked at.
        verify: [checks]
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A blueprint whose rules span several screens, some of them belonging to no screen at all
          when:
            - Reading anchor `panel.rules-list`
          then:
            - Each screen is a heading, in the storyboard's own order, carrying the storyboard's own name for it and the screen icon the bar uses
            - The stories under a screen are labelled by what the screen has not already said, and keep their whole id when two of them would otherwise read the same word
            - A rule the storyboard does not place is grouped with the others that have none, after every screen
            - The detail's stepper and the walk move in this order too, so the arrows and Continue follow what the list shows rather than what the file happens to hold
            - Scrolling deep into a screen's rules leaves that screen's heading at the top of the list, naming what is being read
          statement_hash: sha256:54d2a03fa8e6

      - id: panel.rules.headless-says-so
        origin: thread:n-0061
        statement: Opening a rule that has no screen clears the surface under review - an unmistakable cover in walkdown's own voice takes the sheet's place - because a lingering page reads as the rule's screen, and the reviewer cannot tell a right screen from a rule that has none.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A blueprint holding headless rules - checks-verified server or CLI behavior with no screens
          when:
            - Open one from the list while any page sits on the desk
          then:
            - The surface is covered where the page sheet was, stating that no screen belongs to this rule and that it is judged by checks and recorded behavior, not by looking
            - The cover says the page underneath is untouched - it covers, never navigates, so the application keeps its state
            - The detail pane carries the same note beside the statement
            - Opening a screened rule or returning to the list lifts the cover
          statement_hash: sha256:5bb6c7d6142a

      - id: panel.rules.legend-on-demand
        origin: walkdown
        statement: The rail's whole vocabulary is explained in one place, reachable from the list itself - every evidence mark, every signature shape, and what colour means - because a mark a reader cannot decode is worse than no mark, and six tooltips read one at a time never assemble into a picture of how the rail works.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The Rules tab open on any blueprint
          when:
            - Reaching for the legend beside the counts
          then:
            - Every state the evidence marks can take is listed with the mark that draws it
            - Every state a signature slot can take is listed with the shape that draws it
            - What warning colour means, and what the sign, walk and thread badges mean, are said in the same place
            - It is built from the same vocabulary the rail draws from, so it cannot describe marks the rail no longer uses
          statement_hash: sha256:58cbf78e318c

      - id: panel.rules.owed-apart-from-said
        origin: walkdown
        statement: What a rule owes you and how much is being said about it are two columns, never one string - a count of conversations is context and a badge naming work is a claim on your time, and run together in one colour they read as a single quantity.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A list holding rules that owe work, rules carrying threads, and rules with both
          when:
            - Reading down the right-hand edge of anchor `panel.rules-list`
          then:
            - The work badge and the thread count occupy their own columns, each aligned down the list
            - The thread count is drawn in plain ink rather than in the colour that means work is owed
            - A rule with only one of the two leaves the other column empty rather than shifting the row
          statement_hash: sha256:a59ee3d3b67c

      - id: panel.rules.marks-carry-over
        origin: walkdown
        statement: Opening a rule keeps the marks you opened it for - the detail leads with the same evidence and signature strip the list drew, in the same order - so the row and the page it opens never have to be compared from memory.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule in the list showing some mixture of tier marks and signature slots
          when:
            - Opening it
          then:
            - The detail draws the same strip, in the same order, saying the same thing
            - It is the list's own drawing rather than a second one, so the two cannot disagree
          statement_hash: sha256:53b22fd6a5a4

      - id: panel.rules.names-its-screen
        origin: walkdown
        statement: A rule's detail says which screen it is about, above its steps and in the storyboard's own words - because a rule pointed at the wrong screen is a quiet and common error, and it cannot be corrected by somebody who cannot see what was chosen.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - Rules naming one screen, naming a flow of several, and naming none
          when:
            - Opening each
          then:
            - A single screen is named by its title, with its id beside it
            - A flow is drawn as the chain it is, ending on the screen the rule is judged against
            - A rule naming no screen says so rather than leaving the section out
            - A screen id the storyboard does not know is marked as unknown rather than printed as though it resolved
          statement_hash: sha256:4a90d439391b

      - id: panel.rules.talk-without-a-sitting
        origin: walkdown
        statement: A conversation can be started on any rule at any time, not only during a walkdown - a rule read on an ordinary afternoon deserves the same record as one judged in a sitting - and the note is filed under the same name the panel already shows as you, never one it has not displayed.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule open with no walkdown in progress
          when:
            - Writing in the rule's own composer and starting a thread
          then:
            - A note is filed against that rule and appears in its conversations without a reload
            - It is attributed to whoever the panel is recording as, shown above the composer before it is used
            - An empty identity refuses the filing and offers the place to set one, rather than letting the server choose a name
            - Starting a thread records no verdict and begins no sitting
          statement_hash: sha256:d66e49c63ed9

  - id: panel.threads
    title: Feedback is answered where it is read
    statement: As a reviewer, I can reply to a thread and move its lifecycle on from the panel, without leaving the app I am reviewing.
    rules:
      - id: panel.threads.reply-in-place
        origin: thread:n-0009
        statement: A thread on a rule opens in the panel showing its replies, and I can add a reply and take the lifecycle actions its current state allows.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A rule with an open thread, shown in the panel's detail pane
          when:
            - Open the thread
          then:
            - Its replies are shown, oldest context first, with author and age
            - A reply can be written and posted, and appears without a page reload
            - Only the transitions legal for that kind and status are offered
          statement_hash: sha256:a0dd8bb2f5b9

      - id: panel.threads.claim-never-accept
        origin: walkdown
        statement: The panel obeys the same governance as everywhere else - it will not record verified or waived without a named person, and it asks for the reason the transition requires.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A thread the panel offers Verify or Waive on
          when:
            - Take that action with no name, or with the name agent
          then:
            - Nothing is recorded and the panel asks for a person's name
            - Waiving or reopening without a reason is refused until one is written
          statement_hash: sha256:7c4e1e2d1562

      - id: panel.threads.show-the-sketch
        origin: thread:n-0010
        statement: When a thread's screen has a proposal on file, the panel can show it over the running app, badged as a proposal so a sketch is never mistaken for the design.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A thread anchored to a screen whose storyboard entry has a proposal and no prototype
          when:
            - Choose to view the sketch from the thread
          then:
            - The proposal is drawn over the app the way a prototype ghost is
            - It is labelled as a proposal that did not come from design
            - Screens with a real prototype still ghost the prototype
            - Looking at it is a detour - which screen the panel thinks this page is does not change, and the picker still swaps screens
            - The detour is named while it lasts, and turning the ghost off ends it
          statement_hash: sha256:8244263349d7

      - id: panel.threads.own-view
        origin: thread:n-0094
        statement: Threads are a view of their own and not only something hanging off a rule - the panel lists every thread on the blueprint, filtered to what is live, what is waiting on me, or all of it, including the conversations that have ended.
        verify: [checks]
        signoff: [eng, product]
        screens: [review, thread-panel]
        steps:
          given:
            - A blueprint holding threads in every state, some of them ended
          when:
            - Open the Threads tab and read anchor `panel.threads-list`
          then:
            - Every thread is listed with what it is anchored to, including one anchored to no rule at all
            - Anchor `panel.thread-filter` asks the three questions the command line asks - active, awaiting you, all - and answers them the same way, because a second definition of "active" is a second thing to get wrong
            - The filter stays put at the top of the list however far the list is scrolled - it is a fixed head above what scrolls rather than the first thing to scroll away
            - Asking for all of them reaches a thread that has ended, which nothing else in the panel can do
            - Opening one shows the conversation beside the list, and the way back from it is the list of threads rather than a rule nobody opened
            - How many threads are waiting on a person is carried on the tab itself, so it is legible from whichever tab is open
          statement_hash: sha256:faade3b887d1

  - id: panel.walkdown
    title: A walkdown from the panel is a walkdown
    statement: As a reviewer, verdicts I give beside the running app land in the same ledger as verdicts given anywhere else.
    rules:
      - id: panel.walkdown.records-to-ledger
        origin: walkdown
        statement: Finishing a walkdown in the panel appends a run record under a named person; discarding one records nothing.
        verify: [checks]
        signoff: [eng, product]
        screens: [review, rule-detail]
        steps:
          given:
            - A walkdown session in the panel with at least one verdict
          when:
            - Finish it
          then:
            - A walkdown run record is appended with those verdicts and that actor
            - An unnamed or agent actor is refused before anything is written
            - Discarding instead of finishing writes nothing
          statement_hash: sha256:6cc28278f4a6

      - id: panel.walkdown.one-control-owns-the-sitting
        origin: walkdown
        statement: One control starts a sitting and ends it - the same button in the bar, because they are two halves of one act - while carrying on to the next rule sits beside the count of the rules already judged.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The panel with no sitting running, then one running
          when:
            - Read anchor `panel.walk` in the bar, and anchor `panel.continue` beside the tally in anchor `panel.actor`
          then:
            - With nothing running the bar's control begins a sitting; while one runs, the same control is how it is recorded, and it says so
            - Carrying on is a different question from ending - it is about the next rule rather than the sitting as a whole - so it sits with the count of the ones already judged rather than in the bar
            - Carrying on opens the next rule still owing a verdict, which is not always the next rule in the list
            - The tally beside it reads as a fraction - judged over judged plus still owed - so how far through the sitting is, and how much is left, are one glance rather than two
            - A pass or an approval carries you on by itself; a fail or a refine keeps you on the rule so the reason can be pinned, and this is the way onward from there
            - Both controls wear the panel's warning colour, the one it already uses for work owed to you, so the sitting reads as one thing from the tab's count through to the record - the ending filled and carrying on outlined, since two solid yellows would argue about which is the act
            - Beginning wears it too when rules are owed, so the blueprint says there is work before being asked; with nothing owed it drops back to the ordinary action colour, because a control that is always loud says nothing
            - Every one of these counts comes from a single list - the rules owing you a verdict, less the ones judged this sitting - so the tab's number, the footer's kinds, the tally's denominator and the rule Continue opens cannot drift apart
          statement_hash: sha256:c74a54acc395

      - id: panel.walkdown.session-survives-reload
        origin: thread:n-0066
        statement: An unfinished session is real judging work - it is saved from the first verdict and restored after a page or extension reload, and a refused or failed Finish hands the button back instead of silently bricking the session.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A session with verdicts recorded and not yet finished
          when:
            - Reload the page or the extension, then return
          then:
            - The session comes back - verdicts, judged count, and actor - exactly as left
            - Finishing then records once; a refused attempt, nameless or offline, can be retried after fixing the cause
            - Finishing or discarding clears the saved draft
          statement_hash: sha256:05503923167c

      - id: panel.walkdown.draft-on-disk
        origin: walkdown
        statement: Every verdict is written to the project as it is given - a draft session on disk, outside the runs ledger - so an unfinished sitting survives the browser and is visible to the tools, while the ledger still gains exactly one record, at Finish, that is never edited.
        verify: [checks]
        signoff: [eng, product]
        screens: [review, rule-detail]
        steps:
          given:
            - A walkdown session in the panel
          when:
            - Give a verdict, then look at the project without finishing
          then:
            - A draft session file holds the verdicts given so far, and is rewritten as more arrive
            - The draft is not a run - it carries no run id, sits outside runs/, and no rule counts as verified from it
            - walkdown status reports the sitting as in progress rather than as verdicts
            - Finishing appends the one run record and deletes the draft; discarding deletes it and writes nothing
            - A draft is never committed by accident - the directory ignores its own contents
          statement_hash: sha256:cfb0ee61cad3

      - id: panel.walkdown.verdicts-at-hand
        origin: walkdown
        statement: While a walkdown is running, pass and fail sit directly under the selected rule's statement - on screen without scrolling - beside a count of how many rules the session has judged.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running, a rule open in the detail pane
          when:
            - Reading anchor `detail.verdict` on screen `rule-detail`
          then:
            - Both verdict buttons are visible without scrolling any pane
            - Anchor `detail.judged` says how many rules this session has judged
            - The chosen verdict stays visibly chosen when the rule is revisited
          statement_hash: sha256:10b43c02479d

      - id: panel.walkdown.pass-advances
        origin: walkdown
        statement: A pass moves the session to the next rule owing a verdict; a fail stays put, so the reason can be given where the rule is - and no verdict switches a mode on by itself.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session with several rules owing a human verdict
          when:
            - Pass the open rule, then fail the next
          then:
            - The pass opens the next owed rule and the judged count rises
            - The fail keeps the rule open, and pin mode is left exactly as it was found
            - Judging the last owed rule returns to the list rather than a dead end
            - Carrying on from a rule you stayed on is asked for rather than done to you - the sitting's own next step sits beside the tally
          statement_hash: sha256:017026c31543

      - id: panel.walkdown.note-with-any-verdict
        origin: thread:n-0050
        statement: A feedback box rides above the verdict buttons - write first, then judge - and anything written is filed as a note thread on the rule and linked into the run result; an empty box files nothing.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running, a rule open in the detail pane
          when:
            - Write in anchor `detail.feedback`, then choose either verdict
          then:
            - A note thread anchored to the rule is filed with the text, under the session's actor
            - The finished run's result for the rule carries the thread id
            - Judging with the box empty files no thread
            - The box sits above anchor `detail.verdict`, so the why is asked for before the verdict
          statement_hash: sha256:f9043305838b

      - id: panel.walkdown.fail-requires-why
        origin: thread:n-0051
        statement: A fail is refused until it has a why - feedback text or a pin dropped on the rule during the session - because a fail with no why is work nobody can act on.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running, a rule open with the feedback box empty and nothing pinned
          when:
            - Choose Fail
          then:
            - No verdict is recorded, and the panel names both ways to give a why - write it, or pin it - without turning either on
            - Writing feedback or dropping a pin on the rule, then failing again, records it
          statement_hash: sha256:9644c16756d8

  - id: panel.identity.retired
    title: The viewer already knew who you are
    statement: As a reviewer, I should not have to type my name to do attributed work - the tool knows it from the machine I am working on.
    rules:
      # Recovered from dabe094, where the dual-pane viewer was retired by
      # deleting its rules. Two run records still name this id, and until it was
      # restored `walkdown lint` reported them as verdicts against a rule
      # nobody could look up. The behaviour itself lives on as
      # panel.identity.default-actor.
      - id: viewer.identity.default-actor
        retired: The dual-pane viewer was withdrawn (2026-08-24). The same behaviour is specified for the panel as panel.identity.default-actor.
        origin: thread:n-0008
        statement: The actor field arrives filled in from the repository's git identity, falling back to the operating system username; it stays editable and an edit is remembered.
        verify: [checks]

  - id: panel.identity
    title: The panel already knows who you are
    statement: As a reviewer, I should not have to type my name to do attributed work - the tool knows it from the machine I am working on.
    rules:
      - id: panel.identity.default-actor
        origin: thread:n-0008
        statement: The identity arrives filled in from the repository's git identity - a username to record under, and the full name to show wherever git knows one - falling back to the operating system username; both stay editable, including by someone whose git knows neither.
        verify: [checks]
        signoff: [eng, product]
        screens: [review, settings]
        steps:
          given:
            - A walkdown session started in a git repository
          when:
            - Reading anchor `panel.actor` on screen `review`, then opening Settings from the gear
          then:
            - The session strip already shows the full name where git knows one, with the username it records under beside it in anchor `panel.actor-handle`; no attributed action prompts for either
            - Settings shows both - anchor `settings.actor` for the username records carry, anchor `settings.display-name` for the name the panel shows - and both are editable, from empty if git knows neither
            - An edit applies to the running session and is remembered across reloads; emptying a field is an answer too - no full name leaves the username standing alone, and no username makes the panel refuse attributed work
          statement_hash: sha256:6cf5b560bdde

      - id: panel.identity.attribution-visible
        origin: thread:n-0008
        statement: A defaulted identity is always visible before it is used - a walkdown verdict or a thread action shows the name it will be recorded under, so nobody is attributed silently.
        signoff: [eng, product]
        screens: [review, rule-detail]
        steps:
          given:
            - An actor defaulted from git identity
          when:
            - Starting a walkdown, or taking a thread action from a rule's detail
          then:
            - The name being recorded is on screen at the moment of the action - the username itself, beside the full name shown for it
            - Correcting it before acting records the corrected name
          statement_hash: sha256:1b6a789fde73

  - id: panel.viewport
    title: The frame renders at real device sizes
    statement: As a reviewer, I judge what the user will actually see - a desktop layout at desktop width, a mobile layout at phone width - and the ghost always agrees with the frame about which.
    rules:
      - id: panel.viewport.device-presets
        origin: thread:n-0005
        statement: Framed, a bar control sizes the app's frame like a real device - desktop or mobile - and the ghost renders at the same viewport, so the comparison stays honest.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - The framed layout open on screen `review`
          when:
            - Choose mobile from anchor `panel.viewport-toggle`
          then:
            - The control reads as devices, not as numbers - an icon each, with the layout width in the tooltip, because a width printed on the button reads as a promise about the pixels on screen and the frame is usually scaled to fit
            - The frame re-renders narrow and a responsive app shows its mobile layout
            - The ghost renders at that same viewport; the two never disagree
            - Switching back to desktop restores both
          statement_hash: sha256:2ded288a785a

      - id: panel.viewport.zoom-to-fit
        origin: thread:n-0005
        statement: A viewport wider than the space the frame has scales down whole to fit, so a desktop layout is seen as a desktop layout rather than reflowed to a narrow column - and the current scale is visible.
        signoff: [eng, product]
        screens: [review]
        steps:
          given:
            - A desktop viewport chosen while the frame's space is narrower than it
          when:
            - Reading the frame and anchor `panel.zoom` on screen `review`
          then:
            - The app lays out at the chosen width and is scaled down whole - no reflow
            - The current scale is shown in anchor `panel.zoom`
          statement_hash: sha256:8beb5dbadbe0

  - id: panel.signoff
    title: Unbuilt rules are signed off, not judged
    statement: As a reviewer walking rules that are not built yet, I approve the spec or send it back for rework - Pass and Fail belong to builds, and recording them against nothing poisons the ledger.
    rules:
      - id: panel.signoff.spec-pair-derived
        origin: thread:n-0052
        statement: Which verdict pair a rule shows is derived from the ledger - a rule with no build evidence (no pass or fail from checks or judgment) offers Approve and Refine, and sign-off records, skips and blocks never count as build evidence.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running
          when:
            - Open a rule the ledger holds no pass or fail for, then one it does
          then:
            - The first shows Approve and Refine, labelled as signing off the rule rather than judging a build
            - The second shows Pass and Fail
            - Approving a rule does not flip it to the Pass/Fail pair - only build evidence does
          statement_hash: sha256:d195df6ea5d8

      - id: panel.signoff.refine-requires-feedback
        origin: thread:n-0052
        statement: Refine is the feedback - it is refused until the box says what should change, and the text is filed as a note thread on the rule while the session stays put.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running, an unbuilt rule open
          when:
            - Choose Refine with the box empty, then with feedback written
          then:
            - The empty refine is refused with the reason; nothing is recorded
            - The written refine files the note, records a refining result, and stays on the rule
            - The refine and its note arrive linked in the finished run record
          statement_hash: sha256:cc9c4f5148e1

      - id: panel.signoff.approved-recorded
        origin: thread:n-0052
        statement: Approve appends an `approved` result to the ledger, hash-stamped like a pass so it goes stale when the statement moves - and it never stands in for a role's signature, because approving a spec is not judging a build.
        verify: [checks]
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A walkdown session running, an unbuilt rule open
          when:
            - Approve it and finish the session
          then:
            - The run record carries an approved result with the statement hash as it was signed off
            - The rule still shows as pending and still owes a human verdict once built
            - Rewording the statement renders the approval as stale, asking for a fresh sign-off
            - Approving moves the session on to the next rule owing a verdict
          statement_hash: sha256:9dc2fa81ced5
