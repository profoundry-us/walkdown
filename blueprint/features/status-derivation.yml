feature: status-derivation
title: Verification status is derived, never stored
source:
  prd: docs/05-runs-ledger.md
stories:
  - id: status.derived
    title: Status is a query over the append-only runs ledger
    statement: As a team, we read verification state that is always derived from run history, never a field someone forgot to update.
    rules:
      - id: status.derived.latest-wins
        origin: prd
        statement: A rule's status per target is its latest relevant run result; later runs supersede earlier ones and targets never bleed into each other.
        verify: [checks]

      - id: status.derived.stale-never-passes
        origin: prd
        statement: A pass recorded against an older wording of the rule renders as stale, never as passing.
        verify: [checks]

      - id: status.derived.verdict-belongs-to-a-place
        origin: thread:q-0070
        statement: A verdict counts only for the address it was made against - every run records the base_url of the system it verified, and a target fills its cells only from runs made against where that target currently points, so aiming a target at a new system empties its evidence and asks for the walkdown again rather than inheriting a pass earned somewhere that no longer exists. The address is the deployment under review as the run declares it, never the port a harness happened to bind to stand one up.
        verify: [checks]
        steps:
          given:
            - A ledger holding passes recorded against the address https://pr-1.review.app
          when:
            - The target is pointed at https://pr-2.review.app instead
          then:
            - Every rule verified only at the old address reads as never verified, not as passing
            - No run file is edited or deleted - the ledger stays append-only
            - Pointing the target back restores the earlier evidence unchanged
          statement_hash: sha256:da085af63ed8

      - id: status.derived.addressless-runs-count
        origin: thread:q-0070
        statement: A run that recorded no base_url is taken at face value, because it cannot be shown to belong to a system other than this one - the same courtesy already extended to a result carrying no statement_hash.
        verify: [checks]
        steps:
          given:
            - A run record carrying no address, such as a unit-test runner's
          when:
            - Status is derived for a target that has an address configured
          then:
            - That run still fills its cells rather than being discarded
          statement_hash: sha256:f14146c27ed9

      - id: status.derived.unbacked-pass-goes-stale
        origin: thread:q-0070
        statement: A checks pass survives only while a check still claims the rule - if the suite no longer references it, whether the check was deleted, renamed, or untagged because it never exercised the rule it claimed, the pass renders as stale rather than passing, because an append-only ledger otherwise keeps reporting green long after anything tests it.
        verify: [checks]
        steps:
          given:
            - A ledger holding a checks pass for a rule
          when:
            - The check suite no longer references that rule id
          then:
            - The cell reads stale, not passing
            - Matching is by rule id, so a check moving down its file changes nothing
            - A caller that supplies no inventory of checks sees the older behaviour, since silence is not proof the suite is empty
          statement_hash: sha256:ed0482e00322

      - id: status.derived.human-tier-distinct
        origin: prd
        statement: An agent verdict never satisfies a human verify requirement; only a human walkdown does.
        verify: [checks]

  - id: status.attention
    title: The board says who is blocking what
    statement: As a team, we each see the queue of items waiting on us specifically.
    rules:
      - id: status.attention.blocked-queues
        origin: prd
        statement: Attention items are split by who is blocked - humans get judge, verify and answer items; agents get address, incorporate and cover items, cover being a rule that demands checks while no check claims it, which is an agent's work to write and never a person's to judge.
        verify: [checks]
