feature: status-derivation
title: Verification status is derived, never stored
source:
  prd: docs/05-runs-ledger.md
stories:
  - id: status.derived
    title: Status is a query over the append-only runs ledger
    statement: As a team, we read verification state that is always derived from run history, never a field someone forgot to update.
    rules:
      - id: status.derived.latest-wins
        origin: prd
        statement: A rule's status per target is its latest relevant run result; later runs supersede earlier ones and targets never bleed into each other.
        verify: [checks]

      - id: status.derived.stale-never-passes
        origin: prd
        statement: A pass recorded against an older wording of the rule renders as stale, never as passing.
        verify: [checks]

      - id: status.derived.verdict-belongs-to-a-place
        origin: thread:q-0070
        statement: A verdict counts only for the address it was made against - every run records the base_url of the system it verified, and a target fills its cells only from runs made against where that target currently points, so aiming a target at a new system empties its evidence and asks for the walkdown again rather than inheriting a pass earned somewhere that no longer exists. The address is the deployment under review as the run declares it, never the port a harness happened to bind to stand one up.
        verify: [checks]
        steps:
          given:
            - A ledger holding passes recorded against the address https://pr-1.review.app
          when:
            - The target is pointed at https://pr-2.review.app instead
          then:
            - Every rule verified only at the old address reads as never verified, not as passing
            - No run file is edited or deleted - the ledger stays append-only
            - Pointing the target back restores the earlier evidence unchanged
          statement_hash: sha256:da085af63ed8

      - id: status.derived.addressless-runs-count
        origin: thread:q-0070
        statement: A run that recorded no base_url is taken at face value, because it cannot be shown to belong to a system other than this one - the same courtesy already extended to a result carrying no statement_hash.
        verify: [checks]
        steps:
          given:
            - A run record carrying no address, such as a unit-test runner's
          when:
            - Status is derived for a target that has an address configured
          then:
            - That run still fills its cells rather than being discarded
          statement_hash: sha256:f14146c27ed9

      - id: status.derived.unbacked-pass-goes-stale
        origin: thread:q-0070
        statement: A checks pass survives only while a check still claims the rule - if the suite no longer references it, whether the check was deleted, renamed, or untagged because it never exercised the rule it claimed, the pass renders as stale rather than passing, because an append-only ledger otherwise keeps reporting green long after anything tests it.
        verify: [checks]
        steps:
          given:
            - A ledger holding a checks pass for a rule
          when:
            - The check suite no longer references that rule id
          then:
            - The cell reads stale, not passing
            - Matching is by rule id, so a check moving down its file changes nothing
            - A caller that supplies no inventory of checks sees the older behaviour, since silence is not proof the suite is empty
          statement_hash: sha256:ed0482e00322

      - id: status.derived.human-tier-distinct
        origin: prd
        statement: An agent's verdict is evidence, never acceptance - a role's signature can only be given by a person signing for that role, and no amount of green from the checks or the agent tier supplies it.
        verify: [checks]

  - id: status.evidence
    title: Every tier is assumed, and skipping one is a written decision
    statement: As a team, we get the cheapest honest evidence on every rule by default, and when a rule cannot have it we get a sentence saying why instead of a silence.
    rules:
      - id: status.evidence.agent-assumed
        origin: walkdown
        statement: The agent tier is assumed on every rule rather than declared - a rule is judged by the agent unless it carries an excuse saying why it cannot be - because a tier that must be authored is opt-in while a tier that costs only a run is an obligation, and skipping the walkdown that earns a person's attention should be a decision somebody wrote down rather than a line somebody forgot to type.
        verify: [checks]
        steps:
          given:
            - A rule declaring nothing at all about verification
          when:
            - Its evidence tiers are derived
          then:
            - The agent tier is required of it
            - The checks tier is not, because a check must be authored
            - An excuse filed against the agent tier removes it, and nothing else does
          statement_hash: sha256:21038677e83f
      - id: status.evidence.excuse-says-why
        origin: walkdown
        statement: An excused tier shows its reason where its verdict would have been, in every report - never as an empty cell - because a tier nobody asked for and a tier somebody decided against look identical otherwise, and only one of them is a decision anyone can argue with.
        verify: [checks]
        steps:
          given:
            - A rule excusing a tier, with a reason
          when:
            - The rule is read from the CLI or opened in the panel
          then:
            - The reason stands in the row that tier's evidence would have filled
            - It is legible as a decision, not as an absence
          statement_hash: sha256:6023a6db07cd
      - id: status.evidence.excuse-must-argue
        origin: walkdown
        statement: An excuse is refused as thin when it is a shrug - lint warns on a reason shorter than a sentence, on one filed against something that is not a tier, and on a rule that excuses both tiers at once, the last being legitimate but never accidental.
        verify: [checks]

  - id: status.acceptance
    title: Acceptance is a set of people, not a kind of evidence
    statement: As a team, we can see which roles have accepted a rule and which have not, so "somebody should look at this" becomes "product should look at this".
    rules:
      - id: status.acceptance.signoff-defaults-to-eng
        origin: walkdown
        statement: A rule's sign-off list defaults to engineering and always contains it - somebody has to own that the thing was built right, and a rule nobody accepts is a rule nobody owns - so a list that omits eng is corrected in the report and flagged by lint as a file saying something the report will not do.
        verify: [checks]
      - id: status.acceptance.role-comes-from-the-run
        origin: walkdown
        statement: Acceptance is derived per role from the roles the run was recorded under, never from whoever the signer is today - people change teams and a signature does not stop meaning what it meant - and a run recorded before roles existed reads as engineering's, because the person signing a walkdown was historically the developer who built it.
        verify: [checks]
        steps:
          given:
            - A ledger holding a walkdown recorded under one role and another recorded before roles existed
          when:
            - Acceptance is derived
          then:
            - The first counts only for the role it named
            - The second counts for engineering
            - Changing the signer's roles today moves neither
          statement_hash: sha256:4841808f1a8b
      - id: status.acceptance.approval-covers-only-the-unbuilt
        origin: walkdown
        statement: A role's approval of the wording discharges its queue while the rule is unbuilt, and stops covering it the moment the ledger holds a build to judge - approving a spec is not judging a build.
        verify: [checks]
      - id: status.acceptance.sent-back-is-a-fail
        origin: walkdown
        statement: A signer who looked and said not yet fails the rule's verdict rather than leaving it pending, and is not queued back to themselves - what the rule owes them is a fix, not another look.
        verify: [checks]
      - id: status.acceptance.verdict-needs-every-role
        origin: walkdown
        statement: A rule passes only when every evidence tier it asks for holds a current pass and every role it names has signed - one role's signature never speaks for another's, and the human walkdown is not counted a second time as a tier.
        verify: [checks]
        steps:
          given:
            - A rule naming two roles, with every evidence tier passing
          when:
            - Only one of the two has signed
          then:
            - The verdict is pending, not pass
            - It turns pass when the second signs, and nothing else supplies that signature
          statement_hash: sha256:1a9be6432a5b
      - id: status.acceptance.roles-recorded-on-the-run
        origin: walkdown
        statement: A recorded walkdown carries the roles its signer was acting in; a role outside the vocabulary is refused rather than filed, because a role nothing recognises is a signature that satisfies nothing while looking exactly like one - and an emptied list is recorded as none stated rather than as a distinction the ledger does not honour.
        verify: [checks]
        steps:
          given:
            - A walkdown being recorded by somebody signing in a role
          when:
            - The run is written
          then:
            - The run carries the roles, not the signer's current profile
            - A role the vocabulary does not know is refused
            - An empty list is recorded as stated, not dropped
          statement_hash: sha256:e0e862978414

  - id: status.sweep
    title: Asking for the whole thing to be judged again
    statement: >
      As a reviewer, after something large has changed I can ask for every verdict to be earned again, and see which rules I have not got to yet.
    rules:
      - id: status.sweep.declares-a-floor
        origin: walkdown
        statement: A sweep is a dated marker in the ledger saying that from here the tiers it names must earn their verdicts again - every verdict recorded before it reads as stale, so a rule nobody has got back to is legible as unfinished rather than as passing, and the runs it supersedes are neither edited nor deleted.
        verify: [checks]
        steps:
          given:
            - A ledger where every rule's agent tier passes, from runs recorded last week
          when:
            - A sweep is declared over the agent tier
          then:
            - Every one of those passes now reads stale, not passing and not never
            - A rule judged again after the sweep reads pass once more
            - The superseded run files are untouched - the ledger stays append-only
            - Tiers the sweep does not name are unaffected
          statement_hash: sha256:b0073c10a38b

      - id: status.sweep.deliberate
        origin: walkdown
        statement: A sweep is never a side effect - it is written only when somebody asks for one outright and says why, because it puts work back on the queue for every rule at once and that is a decision, not a consequence of running the suite.
        verify: [checks]
        steps:
          given:
            - A project with a sweep command available
          when:
            - Checks are run, a walkdown is recorded, or the blueprint is edited
          then:
            - No sweep is written by any of them
            - Declaring one requires the command, and the command requires a reason
            - The reason is kept with the marker, so a later reader knows what prompted it
          statement_hash: sha256:5b9d65fba614

      - id: status.sweep.says-what-is-left
        origin: walkdown
        statement: While a sweep is open the report says how much of it is done - how many rules in each named tier have been judged since it was declared and how many have not - so the question "did we miss any?" is answered by reading, never by remembering.
        verify: [checks]
        steps:
          given:
            - An open sweep over the agent tier, partly worked
          when:
            - Status is read
          then:
            - The report names the sweep, when it was declared and why
            - It gives the count judged since, and the count still owed
            - The owed rules are listed as work, not merely counted
          statement_hash: sha256:108b3015acc9

  - id: status.attention
    title: The board says who is blocking what
    statement: As a team, we each see the queue of items waiting on us specifically.
    rules:
      - id: status.attention.blocked-queues
        origin: prd
        statement: Attention items are split by who is blocked - people get judge items, one for each role a rule is still waiting on a signature from, plus verify and answer items; agents get address, incorporate and cover items, cover being a rule that demands checks while no check claims it, which is an agent's work to write and never a person's to judge.
        verify: [checks]

      - id: status.attention.names-the-role
        origin: walkdown
        statement: A judge item says which role a rule is waiting on rather than merely that it waits on a person - a queue two people both scroll past is a queue nobody works.
        verify: [checks]

  - id: status.attribution
    title: A record says whose judgment it was, and keeps saying so
    statement: As a team, we can always tell whose judgment a verdict was - including verdicts recorded before we changed our minds about what a name is.
    rules:
      - id: status.attribution.username-is-the-record
        origin: thread:n-0104
        statement: A record is written under the actor's username, never the display name shown for it - and every handle a person's machine has signed with resolves to that one person, so records made before identity and display name were told apart stay attributed without being rewritten.
        verify: [checks]
        steps:
          given:
            - A machine whose personal config, or failing that git, knows a username and, perhaps, a full name
          when:
            - A verdict, a reply or a transition is recorded, and older records are read back beside it
          then:
            - What is written down is the username; the full name is shown and never stored
            - The identity offered names every handle that machine has signed with - the username, the operating system name, and the full name
            - A record already written under a full name is still attributed to that person, and is never edited to match the newer shape
          statement_hash: sha256:14fb4e39b993
