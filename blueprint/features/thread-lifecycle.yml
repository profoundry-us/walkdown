feature: thread-lifecycle
title: Thread lifecycle governance
source:
  prd: docs/02-blueprint-schema.md (Threads section)
stories:
  - id: threads.lifecycle
    title: Feedback and questions move through validated, attributable states
    statement: As a team, we can trust a thread's status because every transition is validated and attributed.
    rules:
      - id: threads.lifecycle.validated-transitions
        origin: prd
        statement: A thread status change outside its kind's lifecycle is rejected.
        verify: [checks]
        steps:
          given:
            - A note (open > addressed > verified | reopen | waived) or a question (open > answered > incorporated | reopen | waived)
          when:
            - A transition not in that flow is attempted (e.g. open straight to verified)
          then:
            - The mutation is rejected with the illegal transition named, and the file is unchanged
          statement_hash: sha256:102a0b235d5a

      - id: threads.lifecycle.claim-never-accept
        origin: prd
        statement: Setting a thread to verified or waived requires a person who has said who they are - a name this machine merely guessed at, an actor called "agent" in any spelling, and any mutation a machine says it typed are all rejected.
        verify: [checks]
        steps:
          given:
            - A thread in a state from which verified or waived is legal
          when:
            - The transition is attempted where nobody has written down who is sitting here, or under an actor named "agent", or marked as typed by a machine
          then:
            - Each is rejected and the thread is unchanged - work can be claimed on somebody's behalf, and accepted only by them
            - The refusal says where to say who you are, and never fills the gap with a login name
          statement_hash: sha256:482531dc241f

      - id: threads.lifecycle.acts-for-a-person
        origin: thread:n-0139
        created_at: 2026-09-01
        statement: An agent working on a person's behalf records under that person's name, because the instruction was theirs - and says beside it that a machine typed the words. Who a write is recorded under is never something a caller can pass in.
        verify: [checks]
        steps:
          given:
            - A machine whose personal config says who is sitting at it
          when:
            - An agent opens a thread, replies, or moves one, saying that it is the one acting
          then:
            - The record carries that person as the author, and the agent as the provenance beside it
            - The report names both, so a reader can tell a sentence a person wrote from one a machine did
            - No argument and no environment variable can name somebody else
          statement_hash: sha256:6790e9b3474c

      - id: threads.lifecycle.reasoned-endings
        origin: prd
        statement: Waiving records who waived and why, and reopening requires a reason; both reasons land as replies.
        verify: [checks]
        unverifiable:
          agent: The passing case needs a completed waive, and waiving is a human-only transition an agent may never perform (blueprint/AGENTS.md). The reopen half could be walked; the waive half cannot, so the tier cannot honestly hold.
        steps:
          given:
            - A thread being waived, or an addressed/answered thread being reopened
          when:
            - The transition is attempted without a reason
          then:
            - It is rejected; with a reason, the reason is appended as a reply and waived_by records the person
          statement_hash: sha256:24591753abaa

      - id: threads.lifecycle.says-what-it-did
        origin: walkdown
        statement: A command that changes a thread reports the change - the status it left, the status it reached, who it was recorded under, and how many replies landed - rather than printing the thread back, because output that looks the same whether or not anything happened is output nobody can act on.
        verify: [checks]
        steps:
          given:
            - A thread, and a command that will reply to it, transition it, or both
          when:
            - The command is run
          then:
            - One line names the thread and both ends of the move, and waiving names the person it was recorded under
            - A reply with no transition says the status did not move, rather than staying silent and letting a reader assume it did
            - Reading a thread with no flags still prints the whole conversation - reading is a different ask from changing
            - A refused change says why on the error stream and exits non-zero, so a loop over several threads can stop on the first one rather than plunging on
          statement_hash: sha256:224b3a652a3a

  - id: threads.conversation
    title: A thread reads as a conversation
    statement: As a reviewer, reading and answering feedback feels like talking - I can see who said what and when, catch up on what is new, and reply without leaving the page under review.
    rules:
      - id: threads.conversation.one-stream
        origin: walkdown
        statement: A thread is one stream of messages - the opening note is simply the first, by a person, at a time - and consecutive messages from one author collapse under a single name, so a long exchange reads as talking rather than as filing.
        signoff: [eng, product]
        screens: [thread-panel, rule-detail]
        steps:
          given:
            - A thread with an opening note and several replies
          when:
            - Open it in the panel, and beside its pin
          then:
            - Collapsed, a thread is that first message - face, name, time, what was said - with the people in it, the number of replies and when it was last touched underneath
            - The threads on a rule share one surface, divided by hairlines rather than boxed into cards or tinted with coloured rails - what waits on you is said in words, in the status and the unread count
            - Every message carries the same shape - who, when, what - and the opening note is not treated as a different kind of thing
            - A second message from the same author minutes later drops the repeated name and tile, and its time appears on hover
            - Line breaks written into a message survive, and a day boundary is drawn between messages
            - The two deliveries render a thread the same way, from one shared implementation rather than two lookalikes
            - Thread and rule ids written inside a message are links to the thing they name
          statement_hash: sha256:e58134b3796f
      - id: threads.conversation.composer-stays
        origin: walkdown
        statement: The reply box stands at the bottom of an open thread and never moves - Enter sends and Shift-Enter breaks the line, the message appears before the server answers, and the reply is attributed to whoever you are recording as rather than to a name typed again.
        signoff: [eng, product]
        screens: [thread-panel, rule-detail]
        steps:
          given:
            - An open thread and a name set in Settings
          when:
            - Type a reply and press Enter
          then:
            - The message is on screen immediately, marked as sending, and settles when the server confirms it
            - A refused reply is marked as not sent and the text comes back, so nothing written is lost
            - The box asks for no name - it says who you are recording as, and that link leads to Settings
            - Typing survives a repaint - the caret is where it was
          statement_hash: sha256:fc8772c1687a
      - id: threads.conversation.new-since-you-looked
        origin: walkdown
        statement: A thread remembers where your reading stopped, marking what arrived since as new, so returning to a conversation the agent has added to shows what to read rather than asking you to find it.
        signoff: [eng, product]
        screens: [rule-detail]
        steps:
          given:
            - A thread you have read, which has since gained replies
          when:
            - Look at the rule, then open the thread
          then:
            - The collapsed thread says how many messages are new
            - Opening it draws a line above the first message you have not seen, and the line stays put while you read
            - Your own reply is never marked new to you
            - The mark is remembered per blueprint, and survives a reload
          statement_hash: sha256:e3e890cf2091
      - id: threads.conversation.append-only
        origin: walkdown
        statement: A conversation is append-only - messages cannot be edited or deleted, there are no reactions standing in for a verdict, and a thread that reached a terminal state offers no way back - because a thread is the record of what was said, and the ledger is where judgment is recorded.
        signoff: [eng, product]
        screens: [thread-panel]
        steps:
          given:
            - A thread with replies, and one that has been verified or waived
          when:
            - Look for a way to change what was said
          then:
            - No message offers editing or deletion
            - Nothing offers a reaction that would mean addressed or approved without recording it
            - The ended thread shows how it ended and by whom, and offers no reopen, because the lifecycle has none
            - Replying to an ended thread is still possible - the record continues, the state does not
          statement_hash: sha256:06a879b1032c

      - id: threads.conversation.thread-is-a-screen
        origin: walkdown
        statement: Opening a thread slides to a screen of its own, one step to the right of the rule it belongs to, and the way back names where it goes - because a conversation deserves the width, and reading one should never cost you your place.
        signoff: [eng, product]
        screens: [rule-detail, thread-panel]
        steps:
          given:
            - A rule with threads on it
          when:
            - Click the reply count under a thread
          then:
            - The panel slides one screen to the right, and the thread has the whole column - stream, and a composer pinned at the foot
            - Back slides the same way it came and names its destination - the rule, or the rules list for a pin attached to none
            - Ending a thread from its screen - verifying, waiving, incorporating - slides back to the rule and says what happened, rather than emptying the screen and stranding the reader on a blank one
            - The screen is never a dead end - a thread that is gone still leaves the way back
            - The surface under review does not move - reading a conversation is not a walkdown step
            - A pin clicked on the page opens the same screen, wherever you were
          statement_hash: sha256:9971d7aaef65
