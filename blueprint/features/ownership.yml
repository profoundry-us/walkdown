feature: ownership
title: Surface ownership boundaries
source:
  prd: docs/02-blueprint-schema.md (Headless rules, ownership)
stories:
  - id: ownership.drift
    title: Spec ahead of its sources is routed, never silent
    statement: As a design team, we get a request in our queue whenever the spec needs something we haven't drawn.
    rules:
      - id: ownership.drift.design-requests-required
        origin: prd
        statement: An undesigned screen with no open design-request thread is flagged by lint; filing the request clears it.
        verify: [checks]

  - id: ownership.writes
    title: The server writes specification, never implementation
    statement: As a team, we can let a browser talk to the review server because the only things a request can create are the things review is FOR - feedback, sittings, verdicts - and never the product itself.
    rules:
      - id: ownership.writes.spec-never-implementation
        origin: thread:q-0019
        statement: Through the review server a browser can write specification and only specification - a thread, a draft, a run record - and every such write passes through one module that is the complete list of them. No request can create or modify features, prototypes, source or checks, because the browser captures intent and the agent structures it; a write that lands anywhere but the resolved threads, drafts and runs directories is a breach, not a bug.
        verify: [checks]
        signoff: [eng, product]
        steps:
          given:
            - A running review server, and a browser that can reach it
          when:
            - Every write the API offers is performed - a thread opened, a reply, a transition, a draft saved and discarded, a walkdown sealed
          then:
            - Everything that changed on disk is under the resolved threads, drafts or runs directories
            - Nothing under features, the storyboard, the prototype root, source or checks moved by a byte
            - The one module every write passes through names the author policy once, so a new writer cannot re-invent it
          statement_hash: sha256:a966a60dc9bc

  - id: ownership.evidence
    title: A check is evidence only for what it actually exercises
    statement: As a team, we trust the checks column because a green cell means the described behaviour was exercised, not that something adjacent to it was.
    rules:
      - id: ownership.evidence.same-surface
        retired: The ledger tracks behaviour a person can see, and this is a rule about how the test suite is written (2026-08-26, thread n-0074) - it lives in blueprint/AGENTS.md, and its mechanical half is already carried by status.derived.unbacked-pass-goes-stale.
        origin: thread:q-0070
        statement: A check may only claim a rule whose behaviour it actually exercises - a rule describing what the panel or the embed does is not verified by a test that drives the server they talk to, because such a test passes in full while the described surface is broken, which makes the cheapest and most-trusted tier the one most able to lie.
        steps:
          given:
            - A rule whose statement describes something a person sees or does
          when:
            - A check is written and tagged with that rule id
          then:
            - The check drives the surface the statement describes, not a layer beneath it
            - If it cannot, the rule keeps demanding checks and reads as unverified rather than borrowing a neighbour's pass
          statement_hash: sha256:a77756271587
