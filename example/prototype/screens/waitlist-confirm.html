<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — You're on the list</title>
<style>
  :root { --ink: #1a1d23; --muted: #6b7280; --brand: #2563eb; --bg: #f4f5f7; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; display: grid; place-items: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
          padding: 40px; width: 400px; text-align: center; }
  .check { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 14px; }
  .email { display: inline-block; margin-top: 16px; padding: 8px 14px; background: var(--bg);
           border-radius: 8px; font-weight: 600; font-size: 14px; }
</style>
</head>
<body>
  <main class="card">
    <div class="check">✅</div>
    <h1>You're on the list!</h1>
    <p class="sub">We'll email you the moment we launch.</p>
    <span class="email" data-testid="waitlist.confirmed-email">you@example.com</span>
  </main>
  <script src="http://localhost:4700/embed.js" data-walkdown></script>
</body>
</html>
