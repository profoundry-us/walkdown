<!doctype html>
<html lang="en" data-theme="wireframe">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype — Join the waitlist</title>
<link rel="stylesheet" href="http://localhost:4700/walkdown.css">
</head>
<body class="grid min-h-screen place-items-center bg-base-200">
  <main class="card w-100 wire shadow-sm">
    <div class="card-body">
      <h1 class="card-title text-2xl">Join the waitlist</h1>
      <p class="text-sm opacity-60">Be the first to know when we launch.</p>
      <fieldset class="fieldset mt-4">
        <label class="fieldset-label" for="email">Email address</label>
        <input id="email" type="email" class="input input-bordered w-full" placeholder="you@example.com" data-testid="waitlist.email">
        <p class="min-h-5 text-sm text-error" data-testid="waitlist.email-error"><!-- shows: Please enter a valid email address. --></p>
      </fieldset>
      <button class="btn btn-neutral btn-block" data-testid="waitlist.submit">Join the waitlist</button>
    </div>
  </main>
  <script src="http://localhost:4700/embed.js" data-walkdown data-bp="example/blueprint"></script>
</body>
</html>
