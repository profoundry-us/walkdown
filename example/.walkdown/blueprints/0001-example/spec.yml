blueprint: walkdown-example
description: A waitlist app and its admin — the schema demo, and the fixture the integration tests run against.
runner:
  run_all: "npx playwright test"
  run_for_rule: "npx playwright test --grep '@rule:{id}'"
  results: native   # walkdown/reporter in playwright.config.ts emits run records
  targets:
    local:
      base_url: http://localhost:4310
      env: { APP_HOST: "http://localhost:4310" }
design:
  root: designs/       # storyboard `design:` paths resolve against this
embed:
  anchor_attribute: data-testid
authoring:
  location: checks/
  style: >
    Playwright TS. Tag each test with @rule:<id>. Select elements by anchor
    (getByTestId), never by CSS path. One rule per test.
