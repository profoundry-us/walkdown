# Where a surface goes when nothing else says. A blueprint is about a product,
# and a product has a front door — so crossing between the design and the build
# is possible from anywhere, not only from a page walkdown already recognises.
default_screen: waitlist-join

screens:
  - id: waitlist-join
    title: Join the waitlist
    prototype: /screens/waitlist-join.html
    app: { path: /index.html }
    anchors:
      - waitlist.email
      - waitlist.email-error
      - waitlist.submit

  - id: waitlist-confirm
    title: Confirmation
    prototype: /screens/waitlist-confirm.html
    app: { path: /confirm.html?email=you@example.com }
    anchors:
      - waitlist.confirmed-email

  - id: waitlist-already
    title: Already on the list
    prototype: /screens/waitlist-already.html   # spec-born (q-0001); design adopted the sketch, q-0002
    app:
      path: /confirm.html?email=you@example.com&already=1
      # A state, not an address: the query is not identity, so this shares the
      # confirmation page's address and the walk lands one step short of it.
      setup: Join with an email already on the list — the same page comes back saying so.
    anchors:
      - waitlist.already-message
      - waitlist.confirmed-email

  - id: waitlist-admin
    title: Waitlist admin
    prototype: /screens/waitlist-admin.html
    app: { path: /admin.html }
    anchors:
      - waitlist.heading
      - waitlist.count
      - waitlist.export
      - waitlist.invite-batch
      - waitlist.table

  # Undesigned on purpose, and it is the only screen here that is. This one
  # exists so a slow page can be watched arriving: it takes about three seconds
  # to finish loading, which is long enough to read walkdown's own loading veil
  # and watch it lift. Design has never drawn it — the request is n-0004.
  - id: waitlist-export
    title: Waitlist export (slow on purpose)
    prototype: null
    app: { path: /export.html }
    anchors:
      - waitlist.export-note
      - waitlist.export-report

  # The open dialog is a screen, not a footnote on the one behind it: it is
  # reachable by URL, so it can be deep-linked, pinned and walked down like
  # anything else. A screen is origin + path + fragment (docs/06 s2), and the
  # storyboard writes that the way a URL is written.
  - id: waitlist-invite-batch
    title: Confirm a batch invite
    prototype: /screens/waitlist-admin.html#invite-batch
    app: { path: /admin.html#invite-batch }
    anchors:
      - waitlist.confirm-batch
