<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the waitlist</title>
<style>
  :root { --ink: #1a1d23; --muted: #6b7280; --brand: #2563eb; --error: #dc2626; --bg: #f4f5f7; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink);
         min-height: 100vh; display: grid; place-items: center; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,.08);
          padding: 40px; width: 400px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .sub { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #d1d5db;
          border-radius: 8px; margin-bottom: 8px; }
  .error { color: var(--error); font-size: 13px; margin-bottom: 8px; min-height: 18px; }
  button { width: 100%; padding: 12px; font-size: 15px; font-weight: 600; color: #fff;
           background: var(--brand); border: 0; border-radius: 8px; cursor: pointer; margin-top: 8px; }
</style>
</head>
<body>
  <main class="card">
    <h1>Join the waitlist</h1>
    <p class="sub">Be the first to know when we launch.</p>
    <form id="join-form" novalidate>
      <label for="email">Email address</label>
      <input id="email" type="email" placeholder="you@example.com" data-testid="waitlist.email">
      <div class="error" data-testid="waitlist.email-error"></div>
      <button type="submit" data-testid="waitlist.submit">Join the waitlist</button>
    </form>
  </main>
  <script>
    document.getElementById('join-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const error = document.querySelector('[data-testid="waitlist.email-error"]');
      if (!email || !email.includes('@')) {
        error.textContent = 'Please enter a valid email address.';
        return;
      }
      error.textContent = '';
      location.href = 'confirm.html?email=' + encodeURIComponent(email);
    });
  </script>
  <script src="http://localhost:4700/embed.js" data-walkdown></script>
</body>
</html>
