<!doctype html>
<!-- Green on purpose: walkdown's chrome is blue, and a demo app must
     never be mistaken for the tool docked around it. -->
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Join the waitlist</title>
<!-- The example app carries its own build, the way a real app would. -->
<link rel="stylesheet" href="walkdown.css">
</head>
<body class="grid min-h-screen place-items-center bg-base-200">
  <main class="card w-100 bg-base-100 shadow-lg">
    <div class="card-body">
      <h1 class="card-title text-2xl">Join the waitlist</h1>
      <p class="text-sm opacity-60">Be the first to know when we launch.</p>
      <form id="join-form" novalidate>
        <fieldset class="fieldset mt-4">
          <label class="fieldset-label" for="email">Email address</label>
          <input id="email" type="email" class="input input-bordered w-full" placeholder="you@example.com" data-testid="waitlist.email">
          <p class="min-h-5 text-sm text-error" data-testid="waitlist.email-error"></p>
        </fieldset>
        <button type="submit" class="btn btn-primary btn-block" data-testid="waitlist.submit">Join the waitlist</button>
      </form>
    </div>
  </main>
  <script>
    document.getElementById('join-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const error = document.querySelector('[data-testid="waitlist.email-error"]');
      if (!email || !email.includes('@')) {
        error.textContent = 'Please enter a valid email address.';
        return;
      }
      error.textContent = '';
      const button = document.querySelector('[data-testid="waitlist.submit"]');
      button.disabled = true;
      button.textContent = 'Joining…';
      const joined = JSON.parse(localStorage.getItem('waitlist-joined') ?? '[]');
      const already = joined.includes(email);
      if (!already) {
        joined.push(email);
        localStorage.setItem('waitlist-joined', JSON.stringify(joined));
      }
      setTimeout(() => {
        location.href = 'confirm.html?email=' + encodeURIComponent(email) + (already ? '&already=1' : '');
      }, 400);
    });
  </script>
  <!-- walkdown, docked beside this page. Dev only. data-bp names the project
       so pins file against this blueprint and not the server's default. -->
  <!-- No walkdown tags on purpose: this app is reviewed through the browser
       extension, the way an app nobody can edit would be. -->
</body>
</html>
