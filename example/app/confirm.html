<!doctype html>
<!-- Green on purpose: walkdown's chrome is blue, and a demo app must
     never be mistaken for the tool docked around it. -->
<html lang="en" data-theme="emerald">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're on the list</title>
<!-- The example app carries its own build, the way a real app would. -->
<link rel="stylesheet" href="walkdown.css">
</head>
<body class="grid min-h-screen place-items-center bg-base-200">
  <main class="card w-100 bg-base-100 text-center shadow-lg">
    <div class="card-body items-center">
      <div class="text-4xl" id="icon">✅</div>
      <h1 class="card-title text-2xl" id="heading">You're on the list!</h1>
      <p class="text-sm opacity-60" id="sub">We'll email you the moment we launch.</p>
      <span class="badge badge-lg mt-3 font-semibold" data-testid="waitlist.confirmed-email"></span>
    </div>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const email = params.get('email');
    if (!email) {
      location.replace('index.html');
    } else {
      document.querySelector('[data-testid="waitlist.confirmed-email"]').textContent = email;
      if (params.get('already')) {
        document.getElementById('icon').textContent = '👋';
        const heading = document.getElementById('heading');
        heading.textContent = "You're already on the list!";
        heading.setAttribute('data-testid', 'waitlist.already-message');
        document.getElementById('sub').textContent = 'We saved your spot the first time.';
      }
    }
  </script>
  <!-- walkdown, docked beside this page. Dev only. data-bp names the project
       so pins file against this blueprint and not the server's default. -->
  <!-- No walkdown tags on purpose: this app is reviewed through the browser
       extension, the way an app nobody can edit would be. -->
</body>
</html>
