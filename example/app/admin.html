<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waitlist admin</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  body { font: 14px/1.45 -apple-system, "Segoe UI", sans-serif; color: #16181d; background: #fff; }
  header { display: flex; align-items: center; gap: 14px; padding: 14px 34px; border-bottom: 1px solid #e5e7eb; }
  header .brand { font-weight: 700; letter-spacing: -0.01em; }
  header nav { display: flex; gap: 18px; font-size: 13px; color: #6b7280; }
  main { padding: 26px 34px; }
  .title { display: flex; align-items: baseline; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 22px; letter-spacing: -0.01em; }
  .count { font-size: 13px; color: #6b7280; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  button { font: inherit; padding: 6px 13px; border: 1px solid #e5e7eb; border-radius: 7px;
           background: #fff; color: #374151; cursor: pointer; }
  button.primary { background: #2563eb; border-color: #2563eb; color: #fff; font-weight: 500; }
  table { width: 100%; border-collapse: collapse; border: 1px solid #e5e7eb; border-radius: 10px; overflow: hidden; }
  th { text-align: left; padding: 9px 14px; background: #fafbfc; border-bottom: 1px solid #e5e7eb;
       font-size: 11.5px; font-weight: 600; color: #6b7280; text-transform: uppercase; letter-spacing: .04em; }
  td { padding: 11px 14px; font-size: 13px; border-bottom: 1px solid #f1f2f4; }
  tr:last-child td { border-bottom: 0; }
  tr.sel td { background: #f5f9ff; }
  .invited { color: #16a34a; }
  .waiting { color: #6b7280; }
  dialog { border: 1px solid #d3d6db; border-radius: 12px; padding: 20px; box-shadow: 0 14px 44px rgba(20,25,40,.24); }
  dialog p { margin: 8px 0 16px; }
  .row { display: flex; gap: 8px; justify-content: flex-end; }
</style>
</head>
<body>
  <header>
    <span class="brand">Acme</span>
    <nav><span>Overview</span><span>Waitlist</span><span>Settings</span></nav>
  </header>
  <main>
    <div class="title">
      <h1 data-testid="waitlist.heading">Waitlist</h1>
      <span class="count" data-testid="waitlist.count">1,284 signups</span>
      <span class="actions">
        <button data-testid="waitlist.export">Export</button>
        <button class="primary" data-testid="waitlist.invite-batch">Invite batch</button>
      </span>
    </div>
    <table data-testid="waitlist.table">
      <thead><tr><th>Email</th><th>Joined</th><th>Source</th><th>Status</th></tr></thead>
      <tbody>
        <tr><td>rowan@example.com</td><td class="waiting">2h ago</td><td class="waiting">landing</td><td class="invited">invited</td></tr>
        <tr class="sel"><td>imani@example.com</td><td class="waiting">5h ago</td><td class="waiting">referral</td><td class="waiting">waiting</td></tr>
        <tr><td>sam@example.com</td><td class="waiting">1d ago</td><td class="waiting">landing</td><td class="waiting">waiting</td></tr>
        <tr><td>alex@example.com</td><td class="waiting">1d ago</td><td class="waiting">landing</td><td class="waiting">waiting</td></tr>
      </tbody>
    </table>
  </main>

  <dialog data-testid="waitlist.confirm-batch">
    <b>Invite 4 people?</b>
    <p>They will each get an email within a few minutes.</p>
    <div class="row">
      <button onclick="this.closest('dialog').close()">Cancel</button>
      <button class="primary" onclick="this.closest('dialog').close()">Send invites</button>
    </div>
  </dialog>

  <script>
    document.querySelector('[data-testid="waitlist.invite-batch"]')
      .addEventListener('click', () => document.querySelector('dialog').showModal());
  </script>
  <!-- Walkdown, docked beside this page. Dev only. -->
  <script src="http://localhost:4700/embed.js" data-walkdown></script>
  <script src="http://localhost:4700/panel.js" data-bp="example/blueprint"></script>
</body>
</html>
