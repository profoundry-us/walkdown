<!doctype html>
<!-- nord, not walkdown's own light: the demo app should never be
     mistaken for the reviewing chrome docked beside it. -->
<html lang="en" data-theme="nord">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Waitlist admin</title>
<!-- The example app carries its own build, the way a real app would. -->
<link rel="stylesheet" href="walkdown.css">
</head>
<body class="bg-base-100">
  <header class="flex items-center gap-4 border-b border-base-300 px-8 py-3">
    <span class="font-bold tracking-tight">Acme</span>
    <nav class="flex gap-4 text-sm opacity-60"><span>Overview</span><span>Waitlist</span><span>Settings</span></nav>
  </header>
  <main class="px-8 py-6">
    <div class="mb-5 flex items-baseline gap-3">
      <h1 class="text-xl font-semibold tracking-tight" data-testid="waitlist.heading">Waitlist</h1>
      <span class="text-sm opacity-60" data-testid="waitlist.count">1,284 signups</span>
      <span class="ml-auto flex gap-2">
        <button class="btn btn-sm" data-testid="waitlist.export">Export</button>
        <button class="btn btn-sm btn-primary" data-testid="waitlist.invite-batch">Invite batch</button>
      </span>
    </div>
    <div class="overflow-hidden rounded-box border border-base-300">
      <table class="table" data-testid="waitlist.table">
        <thead><tr><th>Email</th><th>Joined</th><th>Source</th><th>Status</th></tr></thead>
        <tbody>
          <tr><td>rowan@example.com</td><td class="opacity-60">2h ago</td><td class="opacity-60">landing</td><td class="text-success">invited</td></tr>
          <tr class="bg-base-200"><td>imani@example.com</td><td class="opacity-60">5h ago</td><td class="opacity-60">referral</td><td class="opacity-60">waiting</td></tr>
          <tr><td>sam@example.com</td><td class="opacity-60">1d ago</td><td class="opacity-60">landing</td><td class="opacity-60">waiting</td></tr>
          <tr><td>alex@example.com</td><td class="opacity-60">1d ago</td><td class="opacity-60">landing</td><td class="opacity-60">waiting</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <dialog class="modal" data-testid="waitlist.confirm-batch">
    <div class="modal-box">
      <h3 class="text-lg font-bold">Invite 4 people?</h3>
      <p class="py-3">They will each get an email within a few minutes.</p>
      <div class="modal-action">
        <button class="btn" onclick="this.closest('dialog').close()">Cancel</button>
        <button class="btn btn-primary" onclick="this.closest('dialog').close()">Send invites</button>
      </div>
    </div>
  </dialog>

  <script>
    document.querySelector('[data-testid="waitlist.invite-batch"]')
      .addEventListener('click', () => document.querySelector('dialog').showModal());
  </script>
  <!-- walkdown, docked beside this page. Dev only. -->
  <script src="http://localhost:4700/embed.js" data-walkdown></script>
  <script src="http://localhost:4700/panel.js" data-bp="example/blueprint"></script>
</body>
</html>
