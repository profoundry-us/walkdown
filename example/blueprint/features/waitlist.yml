feature: waitlist
title: Launch waitlist signup
source:
  prd: (hand-written for milestone — no PRD)
  prototype: example/prototype
stories:
  - id: waitlist.join
    title: Visitor joins the waitlist
    statement: As a visitor, I can join the launch waitlist with my email.
    rules:
      - id: waitlist.join.email-required
        origin: prototype
        statement: A visitor must provide a valid email address before joining the waitlist.
        verify: [checks]
        screens: [waitlist-join]
        steps:
          statement_hash: "sha256:2fd5ce31a84c"
          given:
            - A visitor on screen `waitlist-join`
          when:
            - Leave anchor `waitlist.email` blank (or enter text without "@")
            - Click anchor `waitlist.submit`
          then:
            - An error is visible at anchor `waitlist.email-error`
            - The visitor remains on screen `waitlist-join`

      - id: waitlist.join.confirmation
        origin: prototype
        statement: After submitting a valid email, the visitor sees a confirmation showing the email they joined with.
        verify: [checks]
        screens: [waitlist-join, waitlist-confirm]
        steps:
          statement_hash: "sha256:8f7e3fe03fdf"
          given:
            - A visitor on screen `waitlist-join`
          when:
            - Enter a valid email into anchor `waitlist.email`
            - Click anchor `waitlist.submit`
          then:
            - The visitor is on screen `waitlist-confirm`
            - Anchor `waitlist.confirmed-email` shows the submitted email

      - id: waitlist.join.already-joined
        origin: thread:q-0001
        statement: Submitting an email that is already on the waitlist shows a distinct "you're already on the list" message instead of the standard confirmation.
        verify: [checks]
        screens: [waitlist-already, waitlist-join]
        steps:
          given:
            - A visitor who has already joined with a given email
          when:
            - Visit screen `waitlist-join`
            - Enter the same email into anchor `waitlist.email`
            - Click anchor `waitlist.submit`
          then:
            - The visitor is on screen `waitlist-already`
            - Anchor `waitlist.already-message` reads "you're already on the list"
            - Anchor `waitlist.confirmed-email` shows the submitted email
          statement_hash: sha256:1857ab02c7c3

      - id: waitlist.join.confirm-requires-email
        origin: thread:n-0003
        statement: Opening the confirmation screen without having submitted an email redirects the visitor to the join screen.
        verify: [checks]
        screens: [waitlist-confirm, waitlist-join]
        steps:
          given:
            - A visitor who has not submitted an email
          when:
            - Navigate directly to screen `waitlist-confirm` without an email
          then:
            - The visitor is redirected to screen `waitlist-join`
          statement_hash: sha256:09cacb110a8f

      - id: waitlist.join.visual-match
        origin: prototype
        statement: The join and confirmation screens match the prototype's layout, hierarchy, and copy.
        signoff: [eng, product]
        unverifiable:
          checks: Whether one screen resembles another is a judgment about how it looks. A check can assert that every element is present and still pass on a page nobody would call a match, so the cheapest tier here is the one most able to lie. The agent looks, and a person signs.
        screens: [waitlist-join, waitlist-confirm]
        steps:
          statement_hash: "sha256:837d34b83fb1"
          given:
            - The app on screens `waitlist-join` and `waitlist-confirm`, with the prototype ghost faded over each
          when:
            - Compare card layout, heading hierarchy, field/button placement, and copy
          then:
            - Structure, hierarchy, and copy correspond; minor rendering differences are acceptable

  - id: waitlist.export
    title: An operator exports the waitlist
    statement: As an operator, I can export the whole waitlist, and the wait while it is assembled never looks like a page that has broken.
    rules:
      - id: waitlist.export.says-why-it-waits
        origin: walkdown
        statement: The export screen takes seconds to finish loading, and it says so on arrival rather than after the wait, so a slow page reads as one still on its way.
        verify: [checks]
        screens: [waitlist-admin, waitlist-export]
        steps:
          given:
            - An operator on screen `waitlist-admin`
          when:
            - Click anchor `waitlist.export`
          then:
            - The operator is on screen `waitlist-export`
            - Anchor `waitlist.export-note` is readable immediately, saying what the screen is and that the wait is deliberate
            - The page's own browser load event is what waits - seconds, not milliseconds - so anything watching the frame sees the wait, walkdown's loading veil included
            - Anchor `waitlist.export-report` arrives with that load event, not before it
          statement_hash: sha256:cc8894566f6f
