screens:
  - id: waitlist-join
    title: Join the waitlist
    prototype: /screens/waitlist-join.html
    app: { path: /index.html }
    anchors:
      - waitlist.email
      - waitlist.email-error
      - waitlist.submit

  - id: waitlist-confirm
    title: Confirmation
    prototype: /screens/waitlist-confirm.html
    app: { path: /confirm.html?email=you@example.com }
    anchors:
      - waitlist.confirmed-email

  - id: waitlist-already
    title: Already on the list
    prototype: /screens/waitlist-already.html   # spec-born (q-0001); design adopted the sketch, q-0002
    app: { path: /confirm.html?email=you@example.com&already=1 }
    anchors:
      - waitlist.already-message
      - waitlist.confirmed-email

  - id: waitlist-admin
    title: Waitlist admin
    prototype: /screens/waitlist-admin.html
    app: { path: /admin.html }
    anchors:
      - waitlist.heading
      - waitlist.count
      - waitlist.export
      - waitlist.invite-batch
      - waitlist.table

  # The open dialog is a screen, not a footnote on the one behind it: it is
  # reachable by URL, so it can be deep-linked, pinned and walked down like
  # anything else. A screen is origin + path + fragment (docs/06 s2), and the
  # storyboard writes that the way a URL is written.
  - id: waitlist-invite-batch
    title: Confirm a batch invite
    prototype: /screens/waitlist-admin.html#invite-batch
    app: { path: /admin.html#invite-batch }
    anchors:
      - waitlist.confirm-batch
