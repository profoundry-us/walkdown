# A command that writes, with two blueprints standing here and none named.
screen: writes-refused-among-several
title: A write refused until --blueprint names one
rule: locations.several.writes-name-one
fixture: two-blueprints
command: [sweep, --why, every check again]
exit: 2
expect:
  - 'Several blueprints are registered'
  - '0001-sp-checkout, 0002-sp-search'
  - '^Choose one with `--blueprint <id>` \(e\.g\. `--blueprint checkout`\)\.$'
anchors:
  - { id: cli.refusal, match: '^(Several blueprints|Choose one)' }
