# A second, different checkout also called shop: the name is another project's.
screen: blueprints-new-label-taken
title: A project name already taken is refused, with a command that works
rule: locations.registry.projects-are-labels
fixture: second-shop
cwd: work/shop
command: [blueprints, new, search]
exit: 2
expect:
  - '^✗ This machine already has a project called `shop`, at ~/shop\. ~/work/shop is another checkout, so its project needs a name of its own\. Nothing was made\.$'
  - '^  Name it with `--project <label>`, e\.g\. `walkdown blueprints new search --project work-shop --code ws`\.$'
anchors:
  - { id: cli.label.refused, match: '^✗ This machine already has' }
  - { id: cli.label.choose, match: '^  Name it with' }
