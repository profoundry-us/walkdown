# `walkdown threads set` asking for a change the lifecycle refuses, with a reply.
screen: threads-set-refused
title: A refused status change lands no reply either
rule: commands.threads.one-verb-per-change
fixture: a-note
command: [threads, set, n-0001, --status, verified, --as-agent, --reply, fixed in 1a2b3c, --blueprint, checkout]
exit: 2
expect:
  - 'open → verified'
  - '^Nothing was changed, and the reply did not land\.$'
anchors:
  - { id: cli.refusal, match: '(illegal transition|agents may|never)' }
  - { id: cli.unchanged, match: '^Nothing was changed' }
