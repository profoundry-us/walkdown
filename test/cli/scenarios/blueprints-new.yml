# `walkdown blueprints new` in a project with no blueprint yet.
screen: blueprints-new
title: blueprints new makes a project's first blueprint
rule: commands.blueprints.new-makes-one
command: [blueprints, new]
exit: 0
expect:
  - '^  \+ created  ~/\.walkdown/projects/shop/blueprints/202610-shop/spec\.yml$'
  - '^  \+ listed   ~/\.walkdown/registry\.yml  as `0001-sp-shop`$'
  - '^  \+ project  `shop`, a new project on this machine, code `sp`$'
  - 'Nothing was added to this repository'
  - '`walkdown blueprints commit spec` moves the home into the repository'
anchors:
  - { id: cli.new.created, match: '^  \+ (created|listed|project)' }
  - { id: cli.new.spec, match: '^  spec:' }
  - { id: cli.new.where, match: '^  (In ~/\.walkdown|Prefer it committed)' }
  - { id: cli.new.next, match: '^(Next:|first feature|`walkdown where`)' }
