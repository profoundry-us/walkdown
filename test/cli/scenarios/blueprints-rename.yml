# `walkdown blueprints rename`: the name an ID ends with, put right without
# starting over. The folder is left alone unless `--folder` is given.
screen: blueprints-rename
title: blueprints rename changes the name in an ID and nothing it holds
rule: commands.blueprints.rename
fixture: two-blueprints
command: [blueprints, rename, search, find]
exit: 0
expect:
  - '^  ~ registry  ~/\.walkdown/registry\.yml  `0002-sp-search` is `0002-sp-find`$'
  - '^✓ `0002-sp-search` is now `0002-sp-find`\. Its rules, threads and runs are as they were\.$'
  - '^  `--blueprint find` names it inside its project, `--blueprint 0002-sp-find` anywhere\.$'
anchors:
  - { id: cli.rename.changes, match: '^  ~ ' }
  - { id: cli.rename.done, match: '^(✓ |  `--blueprint)' }
