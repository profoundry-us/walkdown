# `walkdown blueprints new <id>` giving a project that has a blueprint a second one.
screen: init-another
title: blueprints new gives the project another blueprint
rule: locations.several.new-makes-another
fixture: one-blueprint
command: [blueprints, new, search]
exit: 0
expect:
  - '\+ created\s+~/\.walkdown/blueprints/0002-search/blueprint/walkdown\.yml'
  - '\+ another\s+`search` is another blueprint for this project, beside `checkout`'
anchors:
  - { id: cli.init.created, match: '^\s+\+ created' }
  - { id: cli.init.another, match: '^\s+\+ another' }
  - { id: cli.init.spec, match: '^\s+spec:' }
