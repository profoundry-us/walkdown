# `walkdown blueprints commit spec`: the whole home moves into the repository.
screen: blueprints-commit
title: blueprints commit moves the whole home in, keeping its ID
rule: commands.blueprints.commit-moves-the-home
fixture: [git-repo, two-blueprints]
command: [blueprints, commit, spec, --blueprint, search]
exit: 0
expect:
  - '^  → moved    ~/\.walkdown/projects/shop/blueprints/search$'
  - '^ +to ~/shop/\.walkdown/blueprints/search — the whole home, no record edited, the ID kept$'
  - '^  \+ written  ~/shop/\.walkdown/blueprints/search/\.gitignore$'
anchors:
  - { id: cli.commit.moved, match: '^  → moved|^ +to ~/shop' }
  - { id: cli.commit.gitignore, match: '\.gitignore$' }
