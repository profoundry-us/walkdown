# `shop` was moved to ~/shop-moved; importing it there keeps the ID.
screen: import-moved-checkout
title: A moved checkout keeps its blueprint's ID
rule: locations.registry.ids-stay-here
fixture: moved-checkout
cwd: shop-moved
command: [blueprints, import, ., --all]
exit: 0
expect:
  - '^  ~ moved    ~/shop-moved/\.walkdown/blueprints/checkout  keeps its ID `0001-sp-checkout`: it was at ~/shop, which no longer exists$'
  - '^  1 blueprint on this machine now · `walkdown blueprints` lists them$'
anchors:
  - { id: cli.moved.row, match: '^  ~ moved' }
  - { id: cli.moved.done, match: 'on this machine now' }
