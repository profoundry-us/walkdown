# `walkdown where` for a home outside the repository that keeps its own design: the designs row, and no proposals row.
screen: where-prototype-beside
title: The designs are found beside the spec before the code
rule: locations.default.prototype-beside-the-spec
fixture: g1-prototype-beside
command: [where]
exit: 0
expect:
  - '^  designs   ~/\.walkdown/projects/shop/blueprints/checkout/designs$'
  - '^            \[`design\.root: designs/`, beside the spec\]$'
  # The row after the designs row is git's: no proposals row, since no `proposals/` folder is left.
  - '^            \[`design\.root: designs/`, beside the spec\]\n  tracked '
anchors:
  - { id: cli.where.prototype, match: '^  designs |^            \[`design\.root' }
