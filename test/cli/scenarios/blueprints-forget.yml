# `walkdown blueprints forget`: off this machine's list, and every file kept.
screen: blueprints-forget
title: blueprints forget takes a blueprint off the list and keeps its files
rule: commands.blueprints.forget-keeps-the-files
fixture: two-blueprints
command: [blueprints, forget, search]
exit: 0
expect:
  - '^  - forgotten `0002-sp-search`  ~/\.walkdown/registry\.yml$'
  - '^ +Its files are untouched — only the registration is gone\.$'
  - '`rm -rf ~/\.walkdown/projects/shop/blueprints/search` deletes it\.$'
anchors:
  - { id: cli.forget.row, match: '^  - forgotten' }
  - { id: cli.forget.files, match: '^ +(Its files|~/\.walkdown/projects)' }
