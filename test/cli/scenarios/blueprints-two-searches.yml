# Two projects on one machine, each with a blueprint called search: each has an ID of its own.
screen: blueprints-two-searches
title: Each blueprint has an ID this machine gave it
rule: locations.registry.ids-stay-here
fixture: two-searches
command: [blueprints]
exit: 0
expect:
  - '0001-sp-search'
  - '0002-am-search'
anchors:
  - { id: cli.ids.list, match: '^  ' }
